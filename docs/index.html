<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    AUF2026 — Documentation
  </title>


  <!-- =========================================================
       MARKDOWN RENDERER
       ========================================================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
  ></script>


  <style>

    /* =========================================================
       THEME
       ========================================================= */

    :root {

      --bg:
        #0b0f14;

      --panel:
        #111821;

      --panel-2:
        #151e28;

      --border:
        #263241;

      --text:
        #e8edf3;

      --muted:
        #8d9aaa;

      --accent:
        #7dd3fc;

      --accent-strong:
        #38bdf8;

      --danger:
        #f87171;

      --code-bg:
        #0a0e13;

    }


    html[data-theme="light"] {

      --bg:
        #f5f7fa;

      --panel:
        #ffffff;

      --panel-2:
        #eef2f6;

      --border:
        #d6dde6;

      --text:
        #17202b;

      --muted:
        #5f6b78;

      --accent:
        #0369a1;

      --accent-strong:
        #0284c7;

      --danger:
        #dc2626;

      --code-bg:
        #eef2f6;

    }


    /* =========================================================
       GLOBAL
       ========================================================= */

    * {
      box-sizing:
        border-box;
    }


    html,
    body {

      margin:
        0;

      padding:
        0;

      min-height:
        100%;

      background:
        var(--bg);

      color:
        var(--text);

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      transition:
        background-color .2s ease,
        color .2s ease;

    }


    body {

      padding:
        28px 20px 60px;

    }


    a {

      color:
        var(--accent);

    }


    code,
    pre {

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

    }


    /* =========================================================
       LAYOUT
       ========================================================= */

    .archive-shell {

      width:
        min(1180px, 100%);

      margin:
        0 auto;

    }


    /* =========================================================
       HEADER
       ========================================================= */

    .archive-header {

      display:
        flex;

      align-items:
        flex-start;

      justify-content:
        space-between;

      gap:
        20px;

      margin-bottom:
        24px;

    }


    .archive-heading {

      min-width:
        0;

    }


    .archive-kicker {

      margin-bottom:
        8px;

      color:
        var(--accent);

      font-size:
        11px;

      font-weight:
        800;

      letter-spacing:
        .16em;

      text-transform:
        uppercase;

    }


    h1 {

      margin:
        0;

      font-size:
        clamp(28px, 5vw, 44px);

      line-height:
        1.05;

    }


    .archive-description {

      max-width:
        800px;

      margin-top:
        12px;

      color:
        var(--muted);

      line-height:
        1.6;

    }


    /* =========================================================
       THEME CONTROL
       ========================================================= */

    .theme-controls {

      flex-shrink:
        0;

    }


    #theme-toggle {

      display:
        inline-flex;

      align-items:
        center;

      gap:
        8px;

      min-height:
        38px;

      padding:
        0 13px;

      border:
        1px solid var(--border);

      border-radius:
        8px;

      background:
        var(--panel);

      color:
        var(--text);

      cursor:
        pointer;

      font-size:
        12px;

      font-weight:
        700;

    }


    #theme-toggle:hover {

      border-color:
        var(--accent-strong);

      color:
        var(--accent);

    }


    #theme-icon {

      font-size:
        16px;

      line-height:
        1;

    }


    /* =========================================================
       STATUS
       ========================================================= */

    .pages-status {

      margin:
        0 0 20px;

      padding:
        12px 14px;

      border:
        1px solid var(--border);

      border-radius:
        8px;

      background:
        var(--panel);

      color:
        var(--muted);

      font-size:
        13px;

    }


    .pages-status[data-state="ok"] {

      color:
        var(--accent);

    }


    .pages-status[data-state="error"] {

      color:
        var(--danger);

    }


    /* =========================================================
       REPOSITORY LIST
       ========================================================= */

    .pages-directory {

      margin:
        28px 0 10px;

      color:
        var(--accent);

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

      font-size:
        12px;

      font-weight:
        800;

      letter-spacing:
        .04em;

    }


    .pages-file {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        20px;

      margin:
        8px 0;

      padding:
        17px 18px;

      border:
        1px solid var(--border);

      border-radius:
        10px;

      background:
        var(--panel);

    }


    .pages-file-info {

      min-width:
        0;

    }


    .pages-file-name {

      margin:
        0;

      color:
        var(--text);

      font-size:
        16px;

      line-height:
        1.4;

      word-break:
        break-word;

    }


    .pages-file-type {

      display:
        inline-block;

      margin-right:
        8px;

      color:
        var(--accent);

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

      font-size:
        10px;

      font-weight:
        800;

      letter-spacing:
        .08em;

    }


    .pages-file-path {

      margin-top:
        6px;

      color:
        var(--muted);

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

      font-size:
        11px;

      word-break:
        break-all;

    }


    .pages-file-actions {

      display:
        flex;

      align-items:
        center;

      gap:
        8px;

      flex-shrink:
        0;

    }


    .pages-file-button,
    .pages-file-github {

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      min-height:
        36px;

      padding:
        0 13px;

      border:
        1px solid var(--border);

      border-radius:
        7px;

      background:
        var(--panel-2);

      color:
        var(--text);

      cursor:
        pointer;

      font-size:
        11px;

      font-weight:
        800;

      text-decoration:
        none;

    }


    .pages-file-button:hover,
    .pages-file-github:hover {

      border-color:
        var(--accent-strong);

      color:
        var(--accent);

    }


    /* =========================================================
       VIEWER
       ========================================================= */

    .archive-viewer {

      display:
        none;

      margin-top:
        36px;

      border:
        1px solid var(--border);

      border-radius:
        12px;

      background:
        var(--panel);

      overflow:
        hidden;

    }


    .archive-viewer.is-open {

      display:
        block;

    }


    .archive-viewer-header {

      display:
        flex;

      align-items:
        flex-start;

      justify-content:
        space-between;

      gap:
        18px;

      padding:
        18px 20px;

      border-bottom:
        1px solid var(--border);

      background:
        var(--panel-2);

    }


    .archive-viewer-title {

      min-width:
        0;

    }


    .archive-viewer-title h2 {

      margin:
        0;

      font-size:
        20px;

      line-height:
        1.3;

      word-break:
        break-word;

    }


    .archive-viewer-source {

      margin-top:
        5px;

      color:
        var(--muted);

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

      font-size:
        11px;

      word-break:
        break-all;

    }


    .archive-viewer-actions {

      display:
        flex;

      gap:
        8px;

      flex-shrink:
        0;

    }


    .archive-viewer-button {

      min-height:
        34px;

      padding:
        0 12px;

      border:
        1px solid var(--border);

      border-radius:
        7px;

      background:
        var(--panel);

      color:
        var(--text);

      cursor:
        pointer;

      font-size:
        11px;

      font-weight:
        800;

    }


    .archive-viewer-button:hover {

      border-color:

      color:
        var(--accent);

    }


    .archive-document {

      padding:
        clamp(20px, 4vw, 42px);

      line-height:
        1.7;

      overflow-x:
        auto;

    }


    /* =========================================================
       MARKDOWN
       ========================================================= */

    .archive-document h1,
    .archive-document h2,
    .archive-document h3,
    .archive-document h4,
    .archive-document h5,
    .archive-document h6 {

      margin-top:
        1.7em;

      margin-bottom:
        .6em;

      line-height:
        1.25;

    }


    .archive-document h1 {

      font-size:
        32px;

    }


    .archive-document h2 {

      font-size:
        26px;

    }


    .archive-document h3 {

      font-size:
        21px;

    }


    .archive-document p {

      margin:
        0 0 1em;

    }


    .archive-document img {

      max-width:
        100%;

      height:
        auto;

    }


    .archive-document blockquote {

      margin:
        1.2em 0;

      padding:
        8px 18px;

      border-left:
        3px solid var(--accent);

      background:
        var(--panel-2);

      color:
        var(--muted);

    }


    .archive-document pre {

      overflow-x:
        auto;

      padding:
        16px;

      border:
        1px solid var(--border);

      border-radius:
        8px;

      background:
        var(--code-bg);

    }


    .archive-document code {

      color:
        var(--accent);

    }


    .archive-document table {

      width:
        100%;

      border-collapse:

      margin:
        1.4em 0;

      font-size:
        14px;

    }


    .archive-document th,
    .archive-document td {

      padding:
        9px 11px;

      border:
        1px solid var(--border);

      text-align:
        left;

      vertical-align:
        top;

    }


    .archive-document th {

      background:
        var(--panel-2);

    }


    .archive-document ul,
    .archive-document ol {

      padding-left:
        28px;

    }


    .archive-document hr {

      border:
        0;

      border-top:
        1px solid var(--border);

      margin:
        2em 0;

    }


    /* =========================================================
       ERROR / EMPTY
       ========================================================= */

    .pages-empty,
    .archive-error {

      padding:
        30px;

      border:
        1px dashed var(--border);

      border-radius:
        10px;

        var(--panel);

      color:
        var(--muted);

        var(--danger);

    @media (

          column;

      }


      .theme-controls {

        width:
          100%;

      }


      #theme-toggle {

        width:
          100%;

      }


      .pages-file {

        align-items:
          flex-start;

        flex-direction:
          column;

      }


      .pages-file-actions {

        width:
          100%;

      }


      .pages-file-button,
      .pages-file-github {

        flex:
          1;

      }


      .archive-viewer-header {

        flex-direction:
          column;

      }


      .archive-viewer-actions {

        width:
          100%;

      }


      .archive-viewer-button {

        flex:
          1;

      }

    }

  </style>

<body>

<main class="archive-shell">


  <!-- =========================================================
       HEADER
       ========================================================= -->

  <header class="archive-header">

    <div class="archive-heading">

      <div class="archive-kicker">
        AUF2026 RESEARCH ARCHIVE
      </div>

      <h1>
        Documentation
      </h1>

      <div class="archive-description">

        Repository resources discovered automatically
        under <code>/docs/</code>.

        Markdown files are rendered directly in this page.

      </div>

    </div>


    <div class="theme-controls">

      <button
        id="theme-toggle"
        type="button"
        aria-pressed="false"
        aria-label="Switch to light theme"
      >

        <span id="theme-icon">
          ☾
        </span>

        <span id="theme-label">
          Dark
        </span>

      </button>

    </div>

  </header>


  <!-- =========================================================
       STATUS
       ========================================================= -->

  <div
    id="pagesStatus"
    class="pages-status"
  >
    Scanning repository tree…
  </div>


  <!-- =========================================================
       FILE LIST
       ========================================================= -->

  <section
    id="pagesFiles"
    aria-live="polite"
  ></section>


  <!-- =========================================================
       INTERNAL DOCUMENT VIEWER
       ========================================================= -->

  <section
    id="archiveViewer"
    class="archive-viewer"
  >

    <div class="archive-viewer-header">

      <div class="archive-viewer-title">

        <h2 id="document-title">
          Document
        </h2>

        <div
          id="document-source"
          class="archive-viewer-source"
        ></div>

      </div>


      <div class="archive-viewer-actions">

        <button
          id="close-viewer"
          class="archive-viewer-button"
          type="button"
        >
          CLOSE
        </button>

        <button
          id="top-button"
          class="archive-viewer-button"
          type="button"
        >
          TOP
        </button>

      </div>

    </div>


    <article
      id="document"
      class="archive-document"
    ></article>

  </section>

</main>


<script>

/* =========================================================
   THEME
   ========================================================= */

const THEME_STORAGE_KEY =
  "auf2026-theme";


function getCurrentTheme() {

  return (
    document.documentElement.getAttribute(
      "data-theme"
    ) || "dark"
  );

}


function updateThemeControls(
  theme
) {

  const isLight =
    theme === "light";


  const toggle =
    document.getElementById(
      "theme-toggle"
    );


  const icon =
    document.getElementById(
      "theme-icon"
    );


  const label =
    document.getElementById(
      "theme-label"
    );


  if (toggle) {

    toggle.setAttribute(
      "aria-pressed",
      String(!isLight)
    );


    toggle.setAttribute(
      "aria-label",
      isLight
        ? "Switch to dark theme"
        : "Switch to light theme"
    );

  }


  if (icon) {

    icon.textContent =
      isLight
        ? "☀"
        : "☾";

  }


  if (label) {

    label.textContent =
      isLight
        ? "Light"
        : "Dark";

  }

}


function applyTheme(
  theme
) {

  if (
    theme !== "dark" &&
    theme !== "light"
  ) {

    theme =
      "dark";

  }


  document.documentElement.setAttribute(
    "data-theme",
    theme
  );


  localStorage.setItem(
    THEME_STORAGE_KEY,
    theme
  );


  updateThemeControls(
    theme
  );

}


/*
 * Restore the repository-wide theme.
 */

const savedTheme =
  localStorage.getItem(
    THEME_STORAGE_KEY
  );


applyTheme(
  savedTheme === "light"
    ? "light"
    : "dark"
);


document
  .getElementById(
    "theme-toggle"
  )
  .addEventListener(
    "click",
    function () {

      const current =
        getCurrentTheme();


      applyTheme(
        current === "light"
          ? "dark"
          : "light"
      );

    }
  );


/* =========================================================
   GITHUB CONFIGURATION
   ========================================================= */

const GITHUB_OWNER =
  "AUF2026";


const GITHUB_REPOSITORY =
  "AUF2026.github.io";


const GITHUB_BRANCH =
  "main";


const GITHUB_SECTION =
  "docs";


const GITHUB_TREE_URL =
  "https://api.github.com/repos/" +
  GITHUB_OWNER +
  "/" +
  GITHUB_REPOSITORY +
  "/git/trees/" +
  GITHUB_BRANCH +
  "?recursive=1";


const GITHUB_BLOB_BASE =
  "https://github.com/" +
  GITHUB_OWNER +
  "/" +
  GITHUB_REPOSITORY +
  "/blob/" +
  GITHUB_BRANCH +
  "/";


/* =========================================================
   DOM
   ========================================================= */

const repositoryStatus =
  document.getElementById(
    "pagesStatus"
  );


const repositoryFiles =
  document.getElementById(
    "pagesFiles"
  );


const archiveViewer =
  document.getElementById(
    "archiveViewer"
  );


const documentElement =
  document.getElementById(
    "document"
  );


const titleElement =
  document.getElementById(
    "document-title"
  );


const sourceElement =
  document.getElementById(
    "document-source"
  );


/* =========================================================
   INITIALIZE
   ========================================================= */

loadRepository();


/* =========================================================
   LOAD REPOSITORY TREE
   ========================================================= */

async function loadRepository() {

  try {

    setStatus(
      "Scanning repository tree…"
    );


    const response =
      await fetch(
        GITHUB_TREE_URL,
        {
          cache:
            "no-store",

          headers: {
            "Accept":
              "application/vnd.github+json"
          }
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "GitHub API HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if (
      !data ||
      !Array.isArray(
        data.tree
      )
    ) {

      throw new Error(
        "Invalid GitHub repository tree."
      );

    }


    const discovered =
      discoverSectionFiles(
        data.tree
      );


    renderFiles(
      discovered
    );


    setStatus(
      discovered.length +
      " resource" +
      (
        discovered.length === 1
          ? ""
          : "s"
      ) +
      " found under /" +
      GITHUB_SECTION +
      "/",
      "ok"
    );


  } catch (
    error
  ) {

    console.error(
      "AUF2026 repository parser:",
      error
    );


    setStatus(
      "Repository scan failed: " +
      error.message,
      "error"
    );


    repositoryFiles.innerHTML =
      `
        <div class="pages-empty">

          Unable to read
          <code>/${escapeHTML(
            GITHUB_SECTION
          )}/</code>
          from the AUF2026 repository.

        </div>
      `;

  }

}


/* =========================================================
   DISCOVER SECTION FILES
   ========================================================= */

function discoverSectionFiles(
  tree
) {

  const prefix =
    GITHUB_SECTION +
    "/";


  return tree

    .filter(
      item => {

        return (
          item &&
          item.type === "blob" &&
          typeof item.path === "string" &&
          item.path.startsWith(
            prefix
          )
        );

      }
    )

    /*
     * Do not display this parser itself.
     */

    .filter(
      item => {

        return (
          item.path !==
          GITHUB_SECTION +
          "/index.html"
        );

      }
    )

    .sort(
      (a, b) => {

        return a.path.localeCompare(
          b.path,
          undefined,
          {
            numeric:
              true,

            sensitivity:
              "base"
          }
        );

      }
    );

}


/* =========================================================
   RENDER FILE LIST
   ========================================================= */

function renderFiles(
  items
) {

  repositoryFiles.innerHTML =
    "";


  if (
    items.length === 0
  ) {

    repositoryFiles.innerHTML =
      `
        <div class="pages-empty">

          No resources were found under
          <code>/${escapeHTML(
            GITHUB_SECTION
          )}/</code>.

        </div>
      `;

    return;

  }


  let currentDirectory =
    null;


  for (
    const item of items
  ) {

    const relativePath =
      item.path.slice(
        GITHUB_SECTION.length + 1
      );


    const parts =
      relativePath.split("/");


    const directory =
      parts.length > 1
        ? parts
            .slice(0, -1)
            .join("/")
        : "";


    if (
      directory !==
      currentDirectory
    ) {

      currentDirectory =
        directory;


      const directoryElement =
        document.createElement(
          "div"
        );


      directoryElement.className =
        "pages-directory";


      directoryElement.textContent =
        directory
          ? "/" +
            GITHUB_SECTION +
            "/" +
            directory +
            "/"
          : "/" +
            GITHUB_SECTION +
            "/";


      repositoryFiles.appendChild(
        directoryElement
      );

    }


    repositoryFiles.appendChild(
      createFileElement(
        item
      )
    );

  }

}


/* =========================================================
   CREATE FILE ELEMENT
   ========================================================= */

function createFileElement(
  item
) {

  const article =
    document.createElement(
      "article"
    );


  article.className =
    "pages-file";


  const filename =
    item.path
      .split("/")
      .pop();


  const extension =
    getExtension(
      filename
    );


  const type =
    getFileType(
      extension
    );


  article.innerHTML =
    `
      <div class="pages-file-info">

        <h2 class="pages-file-name">

          <span class="pages-file-type">
            ${escapeHTML(type)}
          </span>

          ${escapeHTML(filename)}

        </h2>

        <div class="pages-file-path">
          ${escapeHTML(item.path)}
        </div>

      </div>

      <div class="pages-file-actions">

        <button
          class="pages-file-button"
          type="button"
          data-open
        >
          VIEW
        </button>

        <a
          class="pages-file-github"
          href="${githubURL(
            item.path
          )}"
          target="_blank"
          rel="noopener noreferrer"
        >
          GITHUB
        </a>

      </div>
    `;


  article
    .querySelector(
      "[data-open]"
    )
    .addEventListener(
      "click",
      function () {

        openRepositoryResource(
          item
        );

      }
    );


  return article;

}


/* =========================================================
   OPEN RESOURCE
   ========================================================= */

async function openRepositoryResource(
  item
) {

  const filename =
    item.path
      .split("/")
      .filter(Boolean)
      .pop();


  const extension =
    getExtension(
      filename
    );


  /*
   * Markdown is rendered directly inside
   * this page.
   */

  if (
    extension === ".md" ||
    extension === ".markdown"
  ) {

    await openMarkdown(
      item.path,
      filename
    );

    return;

  }


  /*
   * HTML is displayed in the same page
   * through an iframe.
   */

  if (
    extension === ".html" ||
    extension === ".htm"
  ) {

    openHTML(
      item.path,
      filename
    );

    return;

  }


  /*
   * Images.
   */

  if (
    [
      ".png",
      ".jpg",
      ".jpeg",
      ".gif",
      ".webp",
      ".avif",
      ".bmp",
      ".svg",
      ".ico"
    ].includes(extension)
  ) {

    openImage(
      item.path,
      filename
    );

    return;

  }


  /*
   * PDF.
   */

  if (
    extension === ".pdf"
  ) {

    openPDF(
      item.path,
      filename
    );

    return;

  }


  /*
   * Audio/video and text resources.
   */

  if (
    [
      ".mp3",
      ".wav",
      ".ogg",
      ".oga",
      ".m4a",
      ".aac",
      ".flac",
      ".mp4",
      ".webm",
      ".ogv",
      ".mov"
    ].includes(extension)
  ) {

    openMedia(
      item.path,
      filename,
      extension
    );

    return;

  }


  if (
    [
      ".txt",
      ".json",
      ".xml",
      ".yaml",
      ".yml",
      ".log",
      ".csv"
    ].includes(extension)
  ) {

    await openText(
      item.path,
      filename,
      extension
    );

    return;

  }


  /*
   * Unknown resource:
   * open it through the browser.
   */

  window.open(
    relativeResourceURL(
      item.path
    ),
    "_blank",
    "noopener"
  );

}

/* =========================================================
   MARKDOWN LINKS
   ========================================================= */

function normalizeMarkdownLinks(
  sourcePath
) {

  documentElement
    .querySelectorAll("a")
    .forEach(link => {

      const rawHref =
        link.getAttribute(
          "href"
        );


      if (!rawHref) {

        return;

      }


      const href =
        rawHref.trim();


      if (

        href.startsWith(
          "http://"
        ) ||

        href.startsWith(
          "https://"
        ) ||

        href.startsWith(
          "mailto:"
        ) ||

        href.startsWith(
          "tel:"
        ) ||

        href.startsWith(
          "#"
        )

      ) {

        return;

      }


      /*
       * Markdown links to another .md file
       * are opened in this same internal viewer.
       */

      const hashIndex =
        href.indexOf("#");


      const queryIndex =
        href.indexOf("?");


      let splitIndex =
        -1;


      if (
        hashIndex >= 0 &&
        queryIndex >= 0
      ) {

        splitIndex =
          Math.min(
            hashIndex,
            queryIndex
          );

      } else if (
        hashIndex >= 0
      ) {

        splitIndex =
          hashIndex;

      } else if (
        queryIndex >= 0
      ) {

        splitIndex =
          queryIndex;

      }


      const relative =
        splitIndex >= 0
          ? href.slice(
              0,
              splitIndex
            )
          : href;


      const suffix =
        splitIndex >= 0
          ? href.slice(
              splitIndex
            )
          : "";


      if (
        !relative
          .toLowerCase()
          .endsWith(".md")
      ) {

        return;

      }


      /*
       * Resolve the Markdown link relative
       * to the current Markdown document.
       */

      const resolved =
        resolveRelativePath(
          sourcePath,
          relative
        );


      if (!resolved) {

                return;

      }


      /*
       * Only intercept Markdown files that actually
       * exist inside this section.
       */

      if (
        !sectionFiles.some(
          item =>
            item.path === resolved
        )
      ) {

        return;

      }


      link.href =
        "#";


      link.dataset.mdPath =
        resolved;


      link.dataset.mdSuffix =
        suffix;


      link.addEventListener(
        "click",
        function (event) {

          event.preventDefault();


          openMarkdown(
            resolved,
            suffix
          );

        }
      );

    });

}


/* =========================================================
   RESOLVE RELATIVE PATH
   ========================================================= */

function resolveRelativePath(
  sourcePath,
  relativePath
) {

  if (
    !relativePath
  ) {

    return null;

  }


  const cleanRelative =
    relativePath
      .replace(
        /^\/+/,
        ""
      )
      .replace(
        /\\/g,
        "/"
      );


  /*
   * Absolute repository-relative path.
   */

  if (
    cleanRelative.startsWith(
      GITHUB_SECTION + "/"
    )
  ) {

    return cleanRelative;

  }


  /*
   * Build the path relative to the
   * current Markdown document.
   */

  const sourceParts =
    sourcePath
      .split("/")
      .filter(Boolean);


  sourceParts.pop();


  const relativeParts =
    cleanRelative
      .split("/")
      .filter(
        part =>
          part !== ""
      );


  const combined =
    sourceParts.concat(
      relativeParts
    );


  const normalized = [];


  for (
    const part of combined
  ) {

    if (
      part === "."
    ) {

      continue;

    }


    if (
      part === ".."
    ) {

      if (
        normalized.length
      ) {

        normalized.pop();

      }

      continue;

    }


    normalized.push(
      part
    );

  }


  const resolved =
    normalized.join("/");


  /*
   * Do not allow links to escape
   * the current repository section.
   */

  if (
    !resolved.startsWith(
      GITHUB_SECTION + "/"
    )
  ) {

    return null;

  }


  return resolved;

}


/* =========================================================
   MARKDOWN VIEWER
   ========================================================= */

async function openMarkdown(
  path,
  suffix
) {

  if (
    !path
  ) {

    return;

  }


  if (
    !sectionFiles.some(
      item =>
        item.path === path
    )
  ) {

    renderError(
      new Error(
        "Markdown document not found: " +
        path
      )
    );

    return;

  }


  const filename =
    path
      .split("/")
      .filter(Boolean)
      .pop();


  const previousPath =
    currentMarkdownPath;


  currentMarkdownPath =
    path;


  setViewerLoading(
    true
  );


  try {

    const response =
      await fetch(
        rawURL(
          path
        ),
        {
          cache:
            "no-cache"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const markdown =
      await response.text();


    marked.setOptions({

      gfm:
        true,

      breaks:
        true

    });


    documentElement.innerHTML =
      marked.parse(
        markdown
      );


    normalizeMarkdownLinks(
      path
    );


    improveTables();


    titleElement.textContent =
      humanTitle(
        filename
      );


    sourceElement.textContent =
      path;


    document.title =
      "AUF2026 — " +
      humanTitle(
        filename
      );


    showViewer();


    /*
     * Preserve a requested anchor.
     */

    if (
      suffix &&
      suffix.startsWith("#")
    ) {

      const anchor =
        decodeURIComponent(
          suffix.slice(1)
        );


      requestAnimationFrame(
        function () {

          const target =
            document.getElementById(
              anchor
            );


          if (
            target
          ) {

            target.scrollIntoView({
              behavior:
                "smooth",
              block:
                "start"
            });

          }

        }
      );

    }


  } catch (
    error
  ) {

    console.error(
      "AUF2026 section Markdown viewer:",
      error
    );


    currentMarkdownPath =
      previousPath;


    renderError(
      error
    );


    showViewer();

  } finally {

    setViewerLoading(
      false
    );

  }

}


/* =========================================================
   RAW URL
   ========================================================= */

function rawURL(
  path
) {

  return (
    GITHUB_RAW_BASE +
    path
      .split("/")
      .map(
        encodeURIComponent
      )
      .join("/")
  );

}


/* =========================================================
   HUMAN TITLE
   ========================================================= */

function humanTitle(
  filename
) {

  return filename

    .replace(
      /\.(md|markdown|html?|pdf|csv|svg|txt|json|xml)$/i,
      ""
    )

    .replace(
      /[-_]+/g,
      " "
    )

    .replace(
      /\b\w/g,
      character =>
        character.toUpperCase()
    );

}

   ========================================================= */

function improveTables() {

  documentElement
    .querySelectorAll("table")
    .forEach(
      table => {

        if (

          table.parentElement.classList.contains(
            "archive-table-wrap"
          )
        ) {

          return;

        }


        const wrapper =
          document.createElement(
            "div"
          );


        wrapper.className =
          "archive-table-wrap";


        table.parentNode.insertBefore(
          wrapper,
          table
        );


        wrapper.appendChild(
          table
        );

      }
    );

/* =========================================================

function renderError(

) {

  documentElement.innerHTML = `

    <div class="archive-error">

      <strong>
        Unable to load resource.
      </strong>

      <p>
        ${escapeHTML(
          error && error.message

        )}
      </p>

  titleElement.textContent =
    "Error";


  sourceElement.textContent =
    "error";

/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

          ) ||

          ) ||

          )

        ) {

          return;

        }


        const hashIndex =
          href.indexOf("#");


        const queryIndex =
          href.indexOf("?");


        let splitIndex =
          -1;


        if (
          hashIndex >= 0 &&
          queryIndex >= 0
        ) {

          splitIndex =
            Math.min(
              hashIndex,
              queryIndex

        } else if (

        const relative =

            ? href.slice(

        if (

        const resolved =

/* =========================================================
   RESOLVE RELATIVE MARKDOWN PATH
   ========================================================= */

function resolveRelativePath(
  sourcePath,
  relativePath
) {

  if (
    !relativePath
  ) {

    return null;

  }


  const cleanRelative =
    relativePath
      .replace(
        /^\/+/,
        ""
      )
      .replace(
        /\\/g,
        "/"
      );


  if (
    !cleanRelative
  ) {

    return null;

  }


  const sourceParts =
    sourcePath
      .split("/")
      .filter(Boolean);


  sourceParts.pop();


  const relativeParts =
    cleanRelative
      .split("/")
      .filter(Boolean);


  const combined =
    sourceParts.concat(
      relativeParts
    );


  const normalized =
    [];


  for (
    const part of combined
  ) {

    if (
      part === "."
    ) {

      continue;

    }


    if (
      part === ".."
    ) {

      if (
        normalized.length
      ) {

        normalized.pop();

      }

      continue;

    }


    normalized.push(
      part
    );

  }


  const resolved =
    normalized.join("/");


  if (
    !resolved
  ) {

    return null;

  }


  /*
   * A Markdown link must remain inside the
   * repository section handled by this parser.
   */

  const sectionPrefix =
    GITHUB_SECTION +
    "/";


  if (
    !resolved.startsWith(
      sectionPrefix
    )
  ) {

    return null;

  }


  if (
    !resolved
      .toLowerCase()
      .endsWith(".md")
  ) {

    return null;

  }


  return resolved;

}


/* =========================================================
   OPEN REPOSITORY RESOURCE
   ========================================================= */

function openRepositoryResource(
  path
) {

  if (
    !path
  ) {

    return;

  }


  const cleanPath =
    path
      .replace(
        /^\/+/,
        ""
      )
      .replace(
        /\\/g,
        "/"
      );


  if (
    !isSafeLocalPath(
      cleanPath
    )
  ) {

    renderError(
      new Error(
        "Invalid repository resource path."
      )
    );

    return;

  }


  const extension =
    getExtension(
      cleanPath
    );


  const filename =
    cleanPath
      .split("/")
      .filter(Boolean)
      .pop();


  if (
    !filename
  ) {

    renderError(
      new Error(
        "Invalid repository resource."
      )
    );

    return;

  }


  if (
    extension === ".md" ||
    extension === ".markdown"
  ) {

    loadMarkdown(
      cleanPath
    );

    return;

  }


  /*
   * Other resources are opened in the same
   * viewer area instead of a new browser page.
   */

  showViewer();


  setViewerLoading(
    true
  );


  titleElement.textContent =
    humanTitle(
      filename
    );


  sourceElement.textContent =
    cleanPath;


  const resource =
    document.createElement(
      "div"
    );


  resource.className =
    "archive-resource";


  if (
    [
      ".html",
      ".htm"
    ].includes(
      extension
    )
  ) {

    const iframe =
      document.createElement(
        "iframe"
      );


    iframe.className =
      "archive-page-frame";


    iframe.src =
      rawURL(
        cleanPath
      );


    iframe.title =
      humanTitle(
        filename
      );


    iframe.loading =
      "eager";


    iframe.allow =
      "accelerometer; autoplay; camera; encrypted-media; fullscreen; gyroscope; microphone; picture-in-picture; web-share";


    iframe.allowFullscreen =
      true;


    resource.appendChild(
      iframe
    );

  } else if (
    [
      ".png",
      ".jpg",
      ".jpeg",
      ".gif",
      ".webp",
      ".avif",
      ".bmp",
      ".svg"
    ].includes(
      extension
    )
  ) {

    const image =
      document.createElement(
        "img"
      );


    image.src =
      rawURL(
        cleanPath
      );


    image.alt =
      filename;


    resource.appendChild(
      image
    );

  } else if (
    extension === ".pdf"
  ) {

    const frame =
      document.createElement(
        "iframe"
      );


    frame.className =
      "archive-page-frame";


    frame.src =
      rawURL(
        cleanPath
      );


    frame.title =
      filename;


    resource.appendChild(
      frame
    );

  } else {

    const link =
      document.createElement(
        "a"
      );


    link.href =
      rawURL(
        cleanPath
      );


    link.target =
      "_blank";


    link.rel =
      "noopener noreferrer";


    link.textContent =
      "Open resource";


    resource.appendChild(
      link
    );

  }


  documentElement.replaceChildren(
    resource
  );


  setViewerLoading(
    false
  );

}
