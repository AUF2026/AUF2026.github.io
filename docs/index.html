  <style>

    /* =========================================================
       THEME
       ========================================================= */

    :root {

      --bg:
        #0b0f14;

      --panel:
        #111821;

      --panel-2:

        #f87171;

        #0a0e13;

    }


    html[data-theme="light"] {

      --bg:
        #f5f7fa;

      --panel:
        #ffffff;

      --panel-2:
        #eef2f6;

      --border:
        #d6dde6;

        #17202b;

      --muted:
        #5f6b78;

       ========================================================= */

    }

        0;

        0;

      color:
        var(--text);

        color .2s ease;

    }


    body {

      padding:
        28px 20px 60px;

    }


    a {

      color:
        var(--accent);

    }


    code,
    pre {

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

    }


    /* =========================================================
       LAYOUT
       ========================================================= */

    .archive-shell {

      width:
        min(1180px, 100%);

      margin:
        0 auto;

    }


    /* =========================================================
       HEADER
       ========================================================= */

    .archive-header {

      display:
        flex;

      align-items:

      justify-content:
        space-between;

      margin-bottom:

    }

      margin-top:
        12px;

    }


    /* =========================================================
       THEME CONTROL
       ========================================================= */

    .theme-controls {

      flex-shrink:
        0;

    }


    #theme-toggle {

      display:

      align-items:
        center;

      gap:

    /* =========================================================
       STATUS
       ========================================================= */

.section-navigation {

<script>

/* =========================================================
   THEME
   ========================================================= */

const THEME_STORAGE_KEY =
  "auf2026-theme";


function getCurrentTheme() {

  return (
    document.documentElement.getAttribute(
      "data-theme"
    ) || "dark"
  );

}


function updateThemeControls(
  theme
) {

  const isLight =
    theme === "light";


  const toggle =
    document.getElementById(
      "theme-toggle"
    );


  const icon =
    document.getElementById(
      "theme-icon"
    );


  const label =
    document.getElementById(
      "theme-label"
    );


  if (toggle) {

    toggle.setAttribute(
      "aria-pressed",
      String(!isLight)
    );


    toggle.setAttribute(
      "aria-label",
      isLight
        ? "Switch to dark theme"
        : "Switch to light theme"
    );

  }


  if (icon) {

    icon.textContent =
      isLight
        ? "☀"
        : "☾";

  }


  if (label) {

    label.textContent =
      isLight
        ? "Light"
        : "Dark";

  }

}


function applyTheme(
  theme
) {

  if (
    theme !== "dark" &&
    theme !== "light"
  ) {

    theme =
      "dark";

  }


  document.documentElement.setAttribute(
    "data-theme",
    theme
  );


  localStorage.setItem(
    THEME_STORAGE_KEY,
    theme
  );


  updateThemeControls(
    theme
  );

}


/*
 * Restore the repository-wide theme.
 */

const savedTheme =
  localStorage.getItem(
    THEME_STORAGE_KEY
  );


applyTheme(
  savedTheme === "light"
    ? "light"
    : "dark"
);


document
  .getElementById(
    "theme-toggle"
  )
  .addEventListener(
    "click",
    function () {

      const current =
        getCurrentTheme();


      applyTheme(
        current === "light"
          ? "dark"
          : "light"
      );

    }
  );


/* =========================================================
   GITHUB CONFIGURATION
   ========================================================= */

const GITHUB_OWNER =
  "AUF2026";


const GITHUB_REPOSITORY =
  "AUF2026.github.io";


const GITHUB_BRANCH =
  "main";


const GITHUB_SECTION =
  "docs";


const GITHUB_TREE_URL =
  "https://api.github.com/repos/" +
  GITHUB_OWNER +
  "/" +
  GITHUB_REPOSITORY +
  "/git/trees/" +
  GITHUB_BRANCH +
  "?recursive=1";


const GITHUB_BLOB_BASE =
  "https://github.com/" +
  GITHUB_OWNER +
  "/" +
  GITHUB_REPOSITORY +
  "/blob/" +
  GITHUB_BRANCH +
  "/";


/* =========================================================
   DOM
   ========================================================= */

const repositoryStatus =
  document.getElementById(
    "pagesStatus"
  );


const repositoryFiles =
  document.getElementById(
    "pagesFiles"
  );


const archiveViewer =
  document.getElementById(
    "archiveViewer"
  );


const documentElement =
  document.getElementById(
    "document"
  );


const titleElement =
  document.getElementById(
    "document-title"
  );


const sourceElement =
  document.getElementById(
    "document-source"
  );


/* =========================================================
   INITIALIZE
   ========================================================= */

loadRepository();


/* =========================================================
   LOAD REPOSITORY TREE
   ========================================================= */

async function loadRepository() {

  try {

    setStatus(
      "Scanning repository tree…"
    );


    const response =
      await fetch(
        GITHUB_TREE_URL,
        {
          cache:
            "no-store",

          headers: {
            "Accept":
              "application/vnd.github+json"
          }
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "GitHub API HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if (
      !data ||
      !Array.isArray(
        data.tree
      )
    ) {

      throw new Error(
        "Invalid GitHub repository tree."
      );

    }


    const discovered =
  discoverSectionFiles(
    data.tree
  );


initializeSectionMenu(
  discovered
);


renderFiles(
  discovered
);


    setStatus(
      discovered.length +
      " resource" +
      (
        discovered.length === 1
          ? ""
          : "s"
      ) +
      " found under /" +
      GITHUB_SECTION +
      "/",
      "ok"
    );


  } catch (
    error
  ) {

    console.error(
      "AUF2026 repository parser:",
      error
    );


    setStatus(
      "Repository scan failed: " +
      error.message,
      "error"
    );


    repositoryFiles.innerHTML =
      `
        <div class="pages-empty">

          Unable to read
          <code>/${escapeHTML(
            GITHUB_SECTION
          )}/</code>
          from the AUF2026 repository.

        </div>
      `;

  }

}


/* =========================================================
   DISCOVER SECTION FILES
   ========================================================= */

function discoverSectionFiles(
  tree
) {

  const prefix =
    GITHUB_SECTION +
    "/";


  return tree

    .filter(
      item => {

        return (
          item &&
          item.type === "blob" &&
          typeof item.path === "string" &&
          item.path.startsWith(
            prefix
          )
        );

      }
    )

    /*
     * Do not display this parser itself.
     */

    .filter(
      item => {

        return (
          item.path !==
          GITHUB_SECTION +
          "/index.html"
        );

      }
    )

    .sort(
      (a, b) => {

        return a.path.localeCompare(
          b.path,
          undefined,
          {
            numeric:
              true,

            sensitivity:
              "base"
          }
        );

      }
    );

}

/* =========================================================
   PARTE 5 — FILE VIEWER NAVIGATION
   ========================================================= */

/*
 * Apre una risorsa del repository nello stesso viewer.
 *
 * Markdown:
 *   archive.html?doc=docs/example.md
 *
 * HTML:
 *   archive.html?file=pages/example.html
 *
 * Altri file:
 *   archive.html?file=pdf/example.pdf
 *
 * Il browser resta sulla stessa pagina del parser.
 */

function openRepositoryResource(
  repositoryPath
) {

  if (
    !repositoryPath ||
    typeof repositoryPath !== "string"
  ) {

    return;

  }


  const cleanPath =
    repositoryPath
      .replace(/^\/+/, "")
      .replace(/\\/g, "/");


  if (
    cleanPath.includes("..")
  ) {

    return;

  }


  const filename =
    cleanPath
      .split("/")
      .filter(Boolean)
      .pop();


  if (!filename) {

    return;

  }


  const extension =
    getExtension(
      filename
    );


  /*
   * Markdown → parametro doc
   */

  if (
    extension === ".md" ||
    extension === ".markdown"
  ) {

    const url =
      "archive.html?doc=" +
      encodeURIComponent(
        cleanPath
      );


    loadViewerURL(
      url
    );


    return;

  }


  /*
   * Tutti gli altri file → parametro file.
   *
   * Questo comprende:
   *
   * HTML
   * PDF
   * immagini
   * audio
   * video
   * txt
   * json
   * xml
   * yaml
   * ecc.
   */

  const url =
    "archive.html?file=" +
    encodeURIComponent(
      cleanPath
    );


  loadViewerURL(
    url

  );

}

/* =========================================================
   BUILD SECTION MENU
   ========================================================= */

function buildSectionMenu(
  items
) {

  /*
   * Cerca eventuali select già presenti.
   */

  let menus =
    document.querySelectorAll(
      "[data-file-menu]"
    );


  /*
   * Se non esiste ancora un menu,
   * lo crea automaticamente.
   */

  if (
    menus.length === 0
  ) {

    const container =
      getRepositoryMenuContainer();


    if (
      !container
    ) {

      return;

    }


    const select =
      document.createElement(
        "select"
      );


    select.className =
      "repository-file-menu";


    select.setAttribute(
      "data-file-menu",
      ""
    );


    container.appendChild(
      select
    );


    menus =
      document.querySelectorAll(
        "[data-file-menu]"
      );

  }


  menus.forEach(
    menu => {

      menu.innerHTML =
        "";


      const placeholder =
        document.createElement(
          "option"
        );


      placeholder.value =
        "";


      placeholder.textContent =
        SECTION_TITLE.toUpperCase();


      placeholder.selected =
        true;


      placeholder.disabled =
        false;


      menu.appendChild(
        placeholder
      );


      /*
       * Organizza i file per directory.
       */

      const groups =
        new Map();


      items.forEach(
        item => {

          const path =
            item.path;


          const relative =
            path.slice(
              GITHUB_SECTION.length + 1
            );


          const parts =
            relative.split("/");


          const directory =
            parts.length > 1
              ? parts
                  .slice(0, -1)
                  .join("/")
              : "";


          if (
            !groups.has(
              directory
            )
          ) {

            groups.set(
              directory,
              []
            );

          }


          groups
            .get(directory)
            .push(item);

        }
      );


      groups.forEach(
        (
          groupItems,
          directory
        ) => {

          /*
           * Le sottocartelle diventano optgroup.
           */

          let target =
            menu;


          if (
            directory
          ) {

            const optgroup =
              document.createElement(
                "optgroup"
              );


            optgroup.label =
              "/" +
              GITHUB_SECTION +
              "/" +
              directory +
              "/";


            menu.appendChild(
              optgroup
            );


            target =
              optgroup;

          }


          groupItems.forEach(
            item => {

              const option =
                document.createElement(
                  "option"
                );


              option.value =
                item.path;


              option.textContent =
                item.path
                  .split("/")
                  .pop();


              target.appendChild(
                option
              );

            }
          );

        }
      );

    }
  );

}

          : "s"

      GITHUB_SECTION +
      "/",
      "ok"
    );

/* =========================================================
   SAME-PAGE VIEWER
   ========================================================= */

function loadViewerURL(
  url
) {

  /*
   * Il parser principale può essere caricato:
   *
   * 1. direttamente nella pagina
   * 2. dentro il contenitore viewer
   * 3. tramite iframe
   *
   * Se esiste il viewer dedicato,
   * usiamo quello.
   */

  if (
    repositoryViewer
  ) {

    showViewer();


    /*
     * Se il viewer è un iframe,
     * carichiamo archive.html al suo interno.
     */

    const iframe =
      repositoryViewer.querySelector(
        "iframe"
      );


    if (iframe) {

      iframe.src =
        url;


      return;

    }

  }


  /*
   * Se non esiste un iframe,
   * il parser corrente può semplicemente
   * navigare alla propria pagina archive.html.
   */

  window.location.href =
    url;

}

/* =========================================================
   OPEN RESOURCE
   ========================================================= */

async function openRepositoryResource(
  item
) {

  const filename =
    item.path
      .split("/")
      .filter(Boolean)
      .pop();


  const extension =
    getExtension(
      filename
    );


  /*
   * Markdown is rendered directly inside
   * this page.
   */

  if (
    extension === ".md" ||
    extension === ".markdown"
  ) {

    await openMarkdown(
      item.path,
      filename
    );

    return;

  }


  /*
   * HTML is displayed in the same page
   * through an iframe.
   */

  if (
    extension === ".html" ||
    extension === ".htm"
  ) {

    openHTML(
      item.path,
      filename
    );

    return;

  }


  /*
   * Images.
   */

  if (
    [
      ".png",
      ".jpg",
      ".jpeg",
      ".gif",
      ".webp",
      ".avif",
      ".bmp",
      ".svg",
      ".ico"
    ].includes(extension)
  ) {

    openImage(
      item.path,
      filename
    );

    return;

  }


  /*
   * PDF.
   */

  if (
    extension === ".pdf"
  ) {

    openPDF(
      item.path,
      filename
    );

    return;

  }


  /*
   * Audio/video and text resources.
   */

  if (
    [
      ".mp3",
      ".wav",
      ".ogg",
      ".oga",
      ".m4a",
      ".aac",
      ".flac",
      ".mp4",
      ".webm",
      ".ogv",
      ".mov"
    ].includes(extension)
  ) {

    openMedia(
      item.path,
      filename,
      extension
    );

    return;

  }


  if (
    [
      ".txt",
      ".json",
      ".xml",
      ".yaml",
      ".yml",
      ".log",
      ".csv"
    ].includes(extension)
  ) {

    await openText(
      item.path,
      filename,
      extension
    );

    return;

  }


  /*
   * Unknown resource:
   * open it through the browser.
   */

  window.open(
    relativeResourceURL(
      item.path
    ),
    "_blank",
    "noopener"
  );

}

/* =========================================================
   MARKDOWN LINKS
   ========================================================= */

function normalizeMarkdownLinks(
  sourcePath
) {

  documentElement
    .querySelectorAll("a")
    .forEach(link => {

      const rawHref =
        link.getAttribute(
          "href"
        );


      if (!rawHref) {

        return;

      }


      const href =
        rawHref.trim();


      if (

        href.startsWith(
          "http://"
        ) ||

        href.startsWith(
          "https://"
        ) ||

        href.startsWith(
          "mailto:"
        ) ||

        href.startsWith(
          "tel:"
        ) ||

        href.startsWith(
          "#"
        )

      ) {

        return;

      }


      /*
       * Markdown links to another .md file
       * are opened in this same internal viewer.
       */

      const hashIndex =
        href.indexOf("#");


      const queryIndex =
        href.indexOf("?");


      let splitIndex =
        -1;


      if (
        hashIndex >= 0 &&
        queryIndex >= 0
      ) {

        splitIndex =
          Math.min(
            hashIndex,
            queryIndex
          );

      } else if (
        hashIndex >= 0
      ) {

        splitIndex =
          hashIndex;

      } else if (
        queryIndex >= 0
      ) {

        splitIndex =
          queryIndex;

      }


      const relative =
        splitIndex >= 0
          ? href.slice(
              0,
              splitIndex
            )
          : href;


      const suffix =
        splitIndex >= 0
          ? href.slice(
              splitIndex
            )
          : "";


      if (
        !relative
          .toLowerCase()
          .endsWith(".md")
      ) {

        return;

      }


      /*
       * Resolve the Markdown link relative
       * to the current Markdown document.
       */

      const resolved =
        resolveRelativePath(
          sourcePath,
          relative
        );


      if (!resolved) {

                return;

      }


      /*
       * Only intercept Markdown files that actually
       * exist inside this section.
       */

      if (
        !sectionFiles.some(
          item =>
            item.path === resolved
        )
      ) {

        return;

      }


      link.href =
        "#";


      link.dataset.mdPath =
        resolved;


      link.dataset.mdSuffix =
        suffix;


      link.addEventListener(
        "click",
        function (event) {

          event.preventDefault();


          openMarkdown(
            resolved,
            suffix
          );

        }
      );

    });

}


/* =========================================================
   RESOLVE RELATIVE PATH
   ========================================================= */

function resolveRelativePath(
  sourcePath,
  relativePath
) {

  if (
    !relativePath
  ) {

    return null;

  }


  const cleanRelative =
    relativePath
      .replace(
        /^\/+/,
        ""
      )
      .replace(
        /\\/g,
        "/"
      );


  /*
   * Absolute repository-relative path.
   */

  if (
    cleanRelative.startsWith(
      GITHUB_SECTION + "/"
    )
  ) {

    return cleanRelative;

  }


  /*
   * Build the path relative to the
   * current Markdown document.
   */

  const sourceParts =
    sourcePath
      .split("/")
      .filter(Boolean);


  sourceParts.pop();


  const relativeParts =
    cleanRelative
      .split("/")
      .filter(
        part =>
          part !== ""
      );


  const combined =
    sourceParts.concat(
      relativeParts
    );


  const normalized = [];


  for (
    const part of combined
  ) {

    if (
      part === "."
    ) {

      continue;

    }


    if (
      part === ".."
    ) {

      if (
        normalized.length
      ) {

        normalized.pop();

      }

      continue;

    }


    normalized.push(
      part
    );

  }


  const resolved =
    normalized.join("/");


  /*
   * Do not allow links to escape
   * the current repository section.
   */

  if (
    !resolved.startsWith(
      GITHUB_SECTION + "/"
    )
  ) {

    return null;

  }


  return resolved;

}


/* =========================================================
   MARKDOWN VIEWER
   ========================================================= */

async function openMarkdown(
  path,
  suffix
) {

  if (
    !path
  ) {

    return;

  }


  if (
    !sectionFiles.some(
      item =>
        item.path === path
    )
  ) {

    renderError(
      new Error(
        "Markdown document not found: " +
        path
      )
    );

    return;

  }


  const filename =
    path
      .split("/")
      .filter(Boolean)
      .pop();


  const previousPath =
    currentMarkdownPath;


  currentMarkdownPath =
    path;


  setViewerLoading(
    true
  );


  try {

    const response =
      await fetch(
        rawURL(
          path
        ),
        {
          cache:
            "no-cache"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const markdown =
      await response.text();


    marked.setOptions({

      gfm:
        true,

      breaks:
        true

    });


    documentElement.innerHTML =
      marked.parse(
        markdown
      );


    normalizeMarkdownLinks(
      path
    );


    improveTables();


    titleElement.textContent =
      humanTitle(
        filename
      );


    sourceElement.textContent =
      path;


    document.title =
      "AUF2026 — " +
      humanTitle(
        filename
      );


    showViewer();


    /*
     * Preserve a requested anchor.
     */

    if (
      suffix &&
      suffix.startsWith("#")
    ) {

      const anchor =
        decodeURIComponent(
          suffix.slice(1)
        );


      requestAnimationFrame(
        function () {

          const target =
            document.getElementById(
              anchor
            );


          if (
            target
          ) {

            target.scrollIntoView({
              behavior:
                "smooth",
              block:
                "start"
            });

          }

        }
      );

    }


  } catch (
    error
  ) {

    console.error(
      "AUF2026 section Markdown viewer:",
      error
    );


    currentMarkdownPath =
      previousPath;


    renderError(
      error
    );


    showViewer();

  } finally {

    setViewerLoading(
      false
    );

  }

}


/* =========================================================
   RAW URL
   ========================================================= */

function rawURL(
  path
) {

  return (
    GITHUB_RAW_BASE +
    path
      .split("/")
      .map(
        encodeURIComponent
      )
      .join("/")
  );

}


/* =========================================================
   HUMAN TITLE
   ========================================================= */

function humanTitle(
  filename
) {

  return filename

    .replace(
      /\.(md|markdown|html?|pdf|csv|svg|txt|json|xml)$/i,
      ""
    )

    .replace(
      /[-_]+/g,
      " "
    )

    .replace(
      /\b\w/g,
      character =>
        character.toUpperCase()
    );

}

/* =========================================================
   TABLE WRAPPER
   ========================================================= */

function improveTables() {

  documentElement
    .querySelectorAll("table")
    .forEach(
      table => {

        if (
          table.parentElement &&
          table.parentElement.classList.contains(
            "archive-table-wrap"
          )
        ) {

          return;

        }


        const wrapper =
          document.createElement(
            "div"
          );


        wrapper.className =
          "archive-table-wrap";


        table.parentNode.insertBefore(
          wrapper,
          table
        );


        wrapper.appendChild(
          table
        );

      }
    );

}


/* =========================================================
   ERROR
   ========================================================= */

function renderError(
  error
) {

  documentElement.innerHTML = `

    <div class="archive-error">

      <strong>
        Unable to load resource.
      </strong>

      <p>
        ${escapeHTML(
          error && error.message
            ? error.message
            : "Unknown error."
        )}
      </p>

    </div>

  `;


  titleElement.textContent =
    "Error";


  sourceElement.textContent =
    "error";


  setViewerLoading(
    false
  );

}


/* =========================================================
   BACK TO FILE LIST

function backToFiles() {

  if (

    repositoryFiles.scrollIntoView({

    });

/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

/* =========================================================
   RESOLVE RELATIVE MARKDOWN PATH
   ========================================================= */

function resolveRelativePath(
  sourcePath,
  relativePath
) {

  if (
    !relativePath
  ) {

    return null;

  }


  const cleanRelative =
    relativePath
      .replace(
        /^\/+/,
        ""
      )
      .replace(
        /\\/g,
        "/"
      );


  if (
    !cleanRelative
  ) {

    return null;

  }


  const sourceParts =
    sourcePath
      .split("/")
      .filter(Boolean);


  sourceParts.pop();


  const relativeParts =
    cleanRelative
      .split("/")
      .filter(Boolean);


  const combined =
    sourceParts.concat(
      relativeParts
    );


  const normalized =
    [];


  for (
    const part of combined
  ) {

    if (
      part === "."
    ) {

      continue;

    }


    if (
      part === ".."
    ) {

      if (
        normalized.length
      ) {

        normalized.pop();

      }

      continue;

    }


    normalized.push(
      part
    );

  }


  const resolved =
    normalized.join("/");


  if (
    !resolved
  ) {

    return null;

  }


  const sectionPrefix =
    GITHUB_SECTION +
    "/";


  if (
    !resolved.startsWith(
      sectionPrefix
    )
  ) {

    return null;

  }


  if (
    !resolved
      .toLowerCase()
      .endsWith(".md")
  ) {

    return null;

  }


  return resolved;

}


/* =========================================================
   OPEN REPOSITORY RESOURCE
   ========================================================= */

function openRepositoryResource(
  path
) {

  if (
    !path
  ) {

    return;

  }


  const cleanPath =
    path
      .replace(
        /^\/+/,
        ""
      )
      .replace(
        /\\/g,
        "/"
      );


  if (
    !isSafeLocalPath(
      cleanPath
    )
  ) {

    renderError(
      new Error(
        "Invalid repository resource path."
      )
    );

    return;

  }


  const extension =
    getExtension(
      cleanPath
    );


  const filename =
    cleanPath
      .split("/")
      .filter(Boolean)
      .pop();


  if (
    !filename
  ) {

    renderError(
      new Error(
        "Invalid repository resource."
      )
    );

    return;

  }


  /*
   * Markdown viene renderizzato
   * direttamente nel viewer.
   */

  if (
    extension === ".md" ||
    extension === ".markdown"
  ) {

    loadMarkdown(
      cleanPath
    );

    return;

  }


  showViewer();


  setViewerLoading(
    true
  );


  titleElement.textContent =
    humanTitle(
      filename
    );


  sourceElement.textContent =
    cleanPath;


  const resource =
    document.createElement(
      "div"
    );


  resource.className =
    "archive-resource";


  /*
   * HTML
   */

  if (
    [
      ".html",
      ".htm"
    ].includes(
      extension
    )
  ) {

    const iframe =
      document.createElement(
        "iframe"
      );


    iframe.className =
      "archive-page-frame";


    iframe.src =
      rawURL(
        cleanPath
      );


    iframe.title =
      humanTitle(
        filename
      );


    iframe.loading =
      "eager";


    iframe.allow =
      "accelerometer; autoplay; camera; encrypted-media; fullscreen; gyroscope; microphone; picture-in-picture; web-share";


    iframe.allowFullscreen =
      true;


    resource.appendChild(
      iframe
    );

  }


  /*
   * Immagini
   */

  else if (
    [
      ".png",
      ".jpg",
      ".jpeg",
      ".gif",
      ".webp",
      ".avif",
      ".bmp",
      ".svg",
      ".ico"
    ].includes(
      extension
    )
  ) {

    const image =
      document.createElement(
        "img"
      );


    image.src =
      rawURL(
        cleanPath
      );


    image.alt =
      filename;


    resource.appendChild(
      image
    );

  }


  /*
   * PDF
   */

  else if (
    extension === ".pdf"
  ) {

    const frame =
      document.createElement(
        "iframe"
      );


    frame.className =
      "archive-page-frame";


    frame.src =
      rawURL(
        cleanPath
      );


    frame.title =
      humanTitle(
        filename
      );


    frame.loading =
      "eager";


    resource.appendChild(
      frame
    );

  }


  /*
   * Tutte le altre risorse:
   * collegamento diretto.
   */

  else {

    const link =
      document.createElement(
        "a"
      );


    link.href =
      rawURL(
        cleanPath
      );


    link.target =
      "_blank";


    link.rel =
      "noopener noreferrer";


    link.textContent =
      "Open resource";


    resource.appendChild(
      link
    );

  }


  documentElement.replaceChildren(
    resource
  );


  document.title =
    "AUF2026 — " +
    humanTitle(
      filename
    );


  setViewerLoading(
    false
  );

}
