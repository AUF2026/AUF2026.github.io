<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>AUF2026 · Faure Structural Architecture</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Scientific Typography -->
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;400;600&family=STIX+Two+Text:wght@400;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0b0f14;
    --panel: #11161f;
    --fg: #e6eef6;
    --fg-soft: #9aa6b2;
    --border: #222a35;
    --accent: #3fb5c7;
    --accent-soft: #4fc0d2;
    --mono: "JetBrains Mono", "SF Mono", Menlo, monospace;
    --serif: "Crimson Pro", "STIX Two Text", serif;
  }

  body {
    margin: 0;
    padding: 40px;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--serif);
    line-height: 1.55;
  }

  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    max-width: 1400px;
    margin: 0 auto;
    min-height: 100vh;
    gap: 40px;
  }

  /* Sidebar */
  .sidebar {
    border-right: 1px solid rgba(255,255,255,0.08);
    padding: 32px 24px;
  }

  .title {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
  }

  #titleAUF {
    color: var(--accent);
    transition: color 0.2s linear;
  }

  #title2026 {
    color: #ffffff;
  }

  .subtitle {
    font-size: 0.9rem;
    color: var(--fg-soft);
    margin-bottom: 24px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .section-list {
    margin-top: 24px;
    padding: 0;
    list-style: none;
    font-size: 0.95rem;
  }

  .section-item {
    padding: 8px 4px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    color: var(--fg-soft);
  }

  .section-item:hover {
    color: var(--fg);
    background: #151b24;
  }

  .section-item.active {
    background: #151b24;
    font-weight: 600;
    color: var(--accent);
  }

  /* Main */
  .main {
    padding: 32px;
  }

  .section-header {
    margin-bottom: 24px;
  }

  .section-header h2 {
    font-size: 1.6rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: flex;
    gap: 8px;
  }

  #heroAUF {
    color: var(--accent);
    transition: color 0.2s linear;
  }

  #hero2026 {
    color: #ffffff;
  }

  .section-header p {
    margin: 6px 0 0;
    color: var(--fg-soft);
    font-size: 0.9rem;
  }

  /* File list */
  .file-list {
    border-top: 1px solid var(--border);
    padding-top: 16px;
    margin-bottom: 32px;
  }

  .file-item {
    padding: 6px 4px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    font-size: 0.92rem;
    color: var(--fg-soft);
  }

  .file-item:hover {
    background: #151b24;
    color: var(--fg);
  }

  .file-item.active {
    background: #151b24;
    font-weight: 600;
    color: var(--accent);
  }

  /* Viewer */
  .viewer {
    border-top: 1px solid var(--border);
    padding-top: 24px;
  }

  .viewer-title {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 12px;
    color: var(--accent);
  }

  .viewer-body {
    border: 1px solid var(--border);
    padding: 16px;
    background: var(--panel);
    border-radius: 8px;
    min-height: 300px;
    max-height: 600px;
    overflow: auto;
    font-size: 0.95rem;
    line-height: 1.6;
  }

  pre, code {
    font-family: var(--mono);
    font-size: 0.85rem;
    background: #000;
    color: #e6eef6;
    padding: 12px;
    border-radius: 6px;
  }

  iframe {
    width: 100%;
    height: 600px;
    border: none;
    border-radius: 8px;
    background: #000;
  }

  a {
    color: var(--accent);
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  @media (max-width: 900px) {
    body { padding: 20px; }
    .layout {
      grid-template-columns: 1fr;
      gap: 24px;
    }
    .sidebar {
      border-right: none;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
  }
</style>

<!-- Markdown -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- MathJax -->
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>

</head>
<body>

<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="title">
      <span id="titleAUF">AUF</span>
      <span id="title2026">2026</span>
    </div>
    <div class="subtitle">Faure Structural Architecture</div>

    <ul class="section-list" id="sectionList"></ul>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="section-header">
      <h2>
        <span id="heroAUF">AUF</span>
        <span id="hero2026">2026</span>
      </h2>
      <p id="sectionDesc">Select a section to explore its scientific artifacts.</p>
    </div>

    <div class="file-list" id="fileList"></div>

    <div class="viewer">
      <div class="viewer-title" id="viewerTitle">Viewer</div>
      <div class="viewer-body" id="viewerBody">
        Select a file to render.
      </div>
    </div>
  </main>

</div>

<script>
const REPO = "AUF2026/AUF2026.github.io";
const API = "https://api.github.com/repos/" + REPO + "/contents";

const SECTIONS = [
  { name: "papers", label: "Papers" },
  { name: "proofs", label: "Proofs" },
  { name: "docs", label: "Documentation" },
  { name: "pages", label: "Pages" },
  { name: "pdf", label: "PDF Manuscripts" },
  { name: "datasets", label: "Datasets" },
  { name: "code", label: "Code" },
  { name: "validation", label: "Validation" },
  { name: "bibliography", label: "Bibliography" }
];

const sectionList = document.getElementById("sectionList");
const fileList = document.getElementById("fileList");
const viewerBody = document.getElementById("viewerBody");
const viewerTitle = document.getElementById("viewerTitle");
const sectionDesc = document.getElementById("sectionDesc");
const titleAUF = document.getElementById("titleAUF");
const heroAUF = document.getElementById("heroAUF");

SECTIONS.forEach(sec => {
  const li = document.createElement("li");
  li.className = "section-item";
  li.textContent = sec.label;
  li.onclick = (e) => loadSection(sec, e.currentTarget);
  sectionList.appendChild(li);
});

function colorFor(name){
  let h=0;
  for(let i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0;
  return `hsl(${h%360} 60% 55%)`;
}

function setAccent(name){
  const c = colorFor(name);
  document.documentElement.style.setProperty("--accent", c);
  titleAUF.style.color = c;
  heroAUF.style.color = c;
}

async function loadSection(sec, el) {
  document.querySelectorAll(".section-item").forEach(x => x.classList.remove("active"));
  el.classList.add("active");

  setAccent(sec.label);

  sectionDesc.textContent = "Scientific artifacts in " + sec.label + ".";

  const res = await fetch(API + "/" + sec.name);
  const data = await res.json();

  fileList.innerHTML = "";
  viewerBody.innerHTML = "Select a file to render.";
  viewerTitle.textContent = "Viewer";

  data.forEach(file => {
    if (file.type !== "file") return;

    const item = document.createElement("div");
    item.className = "file-item";
    item.textContent = file.name;
    item.onclick = (e) => loadFile(file, e.currentTarget);
    fileList.appendChild(item);
  });
}

async function loadFile(file, el) {
  document.querySelectorAll(".file-item").forEach(x => x.classList.remove("active"));
  el.classList.add("active");

  viewerTitle.textContent = file.name;

  const ext = file.name.split(".").pop().toLowerCase();

  if (ext === "pdf") {
    viewerBody.innerHTML = `
      <iframe src="https://mozilla.github.io/pdf.js/web/viewer.html?file=${encodeURIComponent(file.download_url)}"></iframe>
    `;
    return;
  }

  const res = await fetch(file.download_url);
  const text = await res.text();

  if (ext === "md") {
    viewerBody.innerHTML = marked.parse(text);
    if (window.MathJax && MathJax.typesetPromise) {
      MathJax.typesetPromise([viewerBody]);
    }
    return;
  }

  if (ext === "html") {
    viewerBody.innerHTML = `
      <iframe sandbox="allow-scripts allow-same-origin"></iframe>
    `;
    const iframe = viewerBody.querySelector("iframe");
    const doc = iframe.contentDocument;
    doc.open();
    doc.write(text);
    doc.close();
    return;
  }

  viewerBody.innerHTML = `<pre>${escapeHtml(text)}</pre>`;
}

function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

// optional: auto-load first section
if (SECTIONS.length) {
  const firstLi = sectionList.querySelector(".section-item");
  if (firstLi) loadSection(SECTIONS[0], firstLi);
}
</script>

</body>
</html>
