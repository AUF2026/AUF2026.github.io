<script>

/* =========================================================
   AUF2026 — UNIVERSAL SECTION PARSER
   ========================================================= */

const SECTION_PATH =
  window.location.pathname
    .replace(/\/index\.html?$/i, "")
    .replace(/^\//, "")
    .replace(/\/+$/, "");


/* =========================================================
   REPOSITORY CONFIGURATION
   ========================================================= */

const OWNER =
  "AUF2026";

const REPOSITORY =
  "AUF2026.github.io";

const BRANCH =
  "main";


const API_BASE =
  "https://api.github.com/repos/" +
  OWNER +
  "/" +
  REPOSITORY;


const TREE_URL =
  API_BASE +
  "/git/trees/" +
  BRANCH +
  "?recursive=1";


/* =========================================================
   DOM
   ========================================================= */

const sectionTitle =
  document.getElementById(
    "sectionTitle"
  );

const sectionDescription =
  document.getElementById(
    "sectionDescription"
  );

const sectionFiles =
  document.getElementById(
    "sectionFiles"
  );

const sectionStatus =
  document.getElementById(
    "sectionStatus"
  );


/* =========================================================
   FILE TYPE CLASSIFICATION
   ========================================================= */

const TEXT_EXTENSIONS = new Set([

  "txt",
  "text",
  "log",
  "csv",
  "tsv",
  "json",
  "xml",
  "yaml",
  "yml",
  "toml",
  "ini",
  "cfg",
  "conf",

  "tex",
  "latex",
  "bib",
  "sty",
  "cls",

  "lean",
  "h",
  "hpp",
  "c",
  "cc",
  "cpp",
  "cxx",
  "cs",
  "java",
  "kt",
  "kts",
  "swift",
  "go",
  "rs",
  "rb",
  "php",
  "pl",
  "r",
  "m",
  "mm",

  "py",
  "js",
  "jsx",
  "ts",
  "tsx",
  "sh",
  "bash",
  "zsh",
  "fish",
  "ps1",

  "sql",
  "graphql",

  "css",
  "scss",
  "sass",
  "less",

  "html",
  "htm",
  "svg"

]);


const MARKDOWN_EXTENSIONS = new Set([

  "md",
  "markdown",
  "mdown",
  "mkdn"

]);


const IMAGE_EXTENSIONS = new Set([

  "png",
  "jpg",
  "jpeg",
  "gif",
  "webp",
  "avif",
  "bmp",
  "ico",
  "tif",
  "tiff"

]);


const AUDIO_EXTENSIONS = new Set([

  "mp3",
  "wav",
  "ogg",
  "oga",
  "m4a",
  "aac",
  "flac"

]);


const VIDEO_EXTENSIONS = new Set([

  "mp4",
  "webm",
  "ogv",
  "mov",
  "m4v"

]);


const PDF_EXTENSIONS = new Set([

  "pdf"

]);


const ARCHIVE_EXTENSIONS = new Set([

  "zip",
  "tar",
  "gz",
  "tgz",
  "bz2",
  "xz",
  "7z",
  "rar"

]);


/* =========================================================
   FILE HELPERS
   ========================================================= */

function getFilename(
  path
) {

  return path
    .split("/")
    .filter(Boolean)
    .pop() || "";

}


function getExtension(
  filename
) {

  const match =
    filename.match(
      /\.([^.]+)$/
    );


  return match
    ? match[1].toLowerCase()
    : "";

}


function humanizeFilename(
  filename
) {

  return filename
    .replace(
      /\.[^.]+$/,
      ""
    )
    .replace(
      /[-_]+/g,
      " "
    )
    .replace(
      /\b\w/g,
      char =>
        char.toUpperCase()
    );

}


function getFileType(
  path
) {

  const extension =
    getExtension(
      getFilename(
        path
      )
    );


  if (
    MARKDOWN_EXTENSIONS.has(
      extension
    )
  ) {

    return "markdown";

  }


  if (
    IMAGE_EXTENSIONS.has(
      extension
    )
  ) {

    return "image";

  }


  if (
    AUDIO_EXTENSIONS.has(
      extension
    )
  ) {

    return "audio";

  }


  if (
    VIDEO_EXTENSIONS.has(
      extension
    )
  ) {

    return "video";

  }


  if (
    PDF_EXTENSIONS.has(
      extension
    )
  ) {

    return "pdf";

  }


  if (
    ARCHIVE_EXTENSIONS.has(
      extension
    )
  ) {

    return "archive";

  }


  if (
    TEXT_EXTENSIONS.has(
      extension
    )
  ) {

    return "text";

  }


  return "binary";

}


/* =========================================================
   GITHUB RAW URL
   ========================================================= */

function getRawURL(
  path
) {

  return (
    "https://raw.githubusercontent.com/" +
    OWNER +
    "/" +
    REPOSITORY +
    "/" +
    BRANCH +
    "/" +
    path
  );

}


/* =========================================================
   GITHUB BLOB URL
   ========================================================= */

function getGitHubURL(
  path
) {

  return (
    "https://github.com/" +
    OWNER +
    "/" +
    REPOSITORY +
    "/blob/" +
    BRANCH +
    "/" +
    path
  );

}


/* =========================================================
   LOAD REPOSITORY TREE
   ========================================================= */

async function loadRepositoryTree() {

  const response =
    await fetch(
      TREE_URL,
      {
        cache:
          "no-cache",

        headers: {
          "Accept":
            "application/vnd.github+json"
        }
      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      "GitHub API HTTP " +
      response.status
    );

  }


  const data =
    await response.json();


  if (
    !data ||
    !Array.isArray(
      data.tree
    )
  ) {

    throw new Error(
      "Invalid repository tree."
    );

  }


  return data.tree;

}


/* =========================================================
   GET FILES BELONGING TO THIS SECTION
   ========================================================= */

function getSectionFiles(
  tree
) {

  const prefix =
    SECTION_PATH
      ? SECTION_PATH + "/"
      : "";


  return tree
    .filter(
      item => {

        if (
          item.type !== "blob"
        ) {

          return false;

        }


        if (
          !item.path.startsWith(
            prefix
          )
        ) {

          return false;

        }


        return true;

      }
    )
    .sort(
      (a, b) =>
        a.path.localeCompare(
          b.path,
          undefined,
          {
            numeric:
              true,
            sensitivity:
              "base"
          }
        )
    );

}


/* =========================================================
   GET RELATIVE PATH
   ========================================================= */

function getRelativePath(
  fullPath
) {

  const prefix =
    SECTION_PATH
      ? SECTION_PATH + "/"
      : "";


  return fullPath.startsWith(
    prefix
  )
    ? fullPath.slice(
        prefix.length
      )
    : fullPath;

}


/* =========================================================
   DIRECTORY FROM PATH
   ========================================================= */

function getDirectory(
  relativePath
) {

  const parts =
    relativePath
      .split("/")
      .filter(Boolean);


  if (
    parts.length <= 1
  ) {

    return "";

  }


  return parts
    .slice(
      0,
      -1
    )
    .join("/");

}


/* =========================================================
   FETCH RAW TEXT
   ========================================================= */

async function fetchText(
  path
) {

  const response =
    await fetch(
      getRawURL(
        path
      ),
      {
        cache:
          "no-cache"
      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      "Unable to load " +
      path +
      " (" +
      response.status +
      ")"
    );

  }


  return response.text();

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(
  value
) {

  return String(
    value
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   SIMPLE MARKDOWN RENDERER
   ========================================================= */

function renderMarkdown(
  source
) {

  let html =
    escapeHTML(
      source
    );


  /*
   * Fenced code blocks.
   */

  html =
    html.replace(
      /```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g,
      (
        match,
        language,
        code
      ) => {

        return (
          '<pre class="code-block">' +
            '<code class="language-' +
              escapeHTML(
                language ||
                ""
              ) +
            '">' +
              code.trim() +
            "</code>" +
          "</pre>"
        );

      }
    );


  /*
   * Headings.
   */

  html =
    html.replace(
      /^###### (.+)$/gm,
      "<h6>$1</h6>"
    );

  html =
    html.replace(
      /^##### (.+)$/gm,
      "<h5>$1</h5>"
    );

  html =
    html.replace(
      /^#### (.+)$/gm,
      "<h4>$1</h4>"
    );

  html =
    html.replace(
      /^### (.+)$/gm,
      "<h3>$1</h3>"
    );

  html =
    html.replace(
      /^## (.+)$/gm,
      "<h2>$1</h2>"
    );

  html =
    html.replace(
      /^# (.+)$/gm,
      "<h1>$1</h1>"
    );


  /*
   * Horizontal rules.
   */

  html =
    html.replace(
      /^---$/gm,
      "<hr>"
    );


  /*
   * Bold / italic / inline code.
   */

  html =
    html.replace(
      /\*\*(.+?)\*\*/g,
      "<strong>$1</strong>"
    );

  html =
    html.replace(
      /\*(.+?)\*/g,
      "<em>$1</em>"
    );

  html =
    html.replace(
      /`([^`\n]+)`/g,
      "<code>$1</code>"
    );


  /*
   * Links.
   */

  html =
    html.replace(
      /\[([^\]]+)\]\(([^)\s]+)\)/g,
      (
        match,
        label,
        url
      ) => {

        return (
          '<a href="' +
          escapeHTML(
            url
          ) +
          '" target="_blank" rel="noopener">' +
          label +
          "</a>"
        );

      }
    );


  /*
   * Blockquotes.
   */

  html =
    html.replace(
      /^&gt; (.+)$/gm,
      "<blockquote>$1</blockquote>"
    );


  /*
   * Unordered lists.
   */

  html =
    html.replace(
      /^(?:-|\*) (.+)$/gm,
      "<li>$1</li>"
    );


  html =
    html.replace(
      /(<li>[\s\S]*?<\/li>)/g,
      match =>
        "<ul>" +
        match +
        "</ul>"
    );


  /*
   * Paragraphs.
   */

  const lines =
    html.split(
      /\n{2,}/
    );


  html =
    lines
      .map(
        block => {

          const trimmed =
            block.trim();


          if (
            !trimmed
          ) {

            return "";

          }


          if (
            /^<(h[1-6]|ul|pre|blockquote|hr)/i
              .test(
                trimmed
              )
          ) {

            return trimmed;

          }


          return (
            "<p>" +
            trimmed.replace(
              /\n/g,
              "<br>"
            ) +
            "</p>"
          );

        }
      )
      .join(
        "\n"
      );


  return html;

}


/* =========================================================
   CREATE FILE CARD
   ========================================================= */

function createFileCard(
  item
) {

  const relativePath =
    getRelativePath(
      item.path
    );


  const filename =
    getFilename(
      item.path
    );


  const type =
    getFileType(
      item.path
    );


  const card =
    document.createElement(
      "article"
    );


  card.className =
    "file-card";


  card.dataset.type =
    type;


  const header =
    document.createElement(
      "div"
    );


  header.className =
    "file-card-header";


  const name =
    document.createElement(
      "h3"
    );


  name.className =
    "file-name";


  name.textContent =
    filename;


  const typeLabel =
    document.createElement(
      "span"
    );


  typeLabel.className =
    "file-type";


  typeLabel.textContent =
    type.toUpperCase();


  header.appendChild(
    name
  );


  header.appendChild(
    typeLabel
  );


  const path =
    document.createElement(
      "div"
    );


  path.className =
    "file-path";


  path.textContent =
    relativePath;


  const actions =
    document.createElement(
      "div"
    );


  actions.className =
    "file-actions";


  const open =
    document.createElement(
      "button"
    );


  open.type =
    "button";


  open.className =
    "file-open";


  open.textContent =
    "OPEN";


  open.addEventListener(
    "click",
    () => {

      openFile(
        item
      );

    }
  );


  const github =
    document.createElement(
      "a"
    );


  github.className =
    "file-github";


  github.href =
    getGitHubURL(
      item.path
    );


  github.target =
    "_blank";


  github.rel =
    "noopener";


  github.textContent =
    "GITHUB";


  actions.appendChild(
    open
  );


  actions.appendChild(
    github
  );


  card.appendChild(
    header
  );


  card.appendChild(
    path
  );


  card.appendChild(
    actions
  );


  return card;

}


/* =========================================================
   RENDER FILE LIST
   ========================================================= */

function renderFileList(
  files
) {

  sectionFiles.innerHTML =
    "";


  if (
    !files.length
  ) {

    sectionFiles.innerHTML =
      `
        <div class="parser-empty">
          No files found in this section.
        </div>
      `;

    return;

  }


  let currentDirectory =
    null;


  files.forEach(
    item => {

      const relativePath =
        getRelativePath(
          item.path
        );


      const directory =
        getDirectory(
          relativePath
        );


      if (
        directory !==
        currentDirectory
      ) {

        currentDirectory =
          directory;


        const heading =
          document.createElement(
            "div"
          );


        heading.className =
          "parser-directory";


        heading.textContent =
          directory
            ? "/" +
              directory
            : "/";


        sectionFiles.appendChild(
          heading
        );

      }


      sectionFiles.appendChild(
        createFileCard(
          item
        )
      );

    }
  );

}


/* =========================================================
   FILE VIEWER
   ========================================================= */

async function openFile(
  item
) {

  const type =
    getFileType(
      item.path
    );


  const viewer =
    document.getElementById(
      "fileViewer"
    );


  if (
    !viewer
  ) {

    return;

  }


  viewer.hidden =
    false;


  viewer.innerHTML =
    `
      <div class="viewer-loading">
        Loading ${escapeHTML(
          getFilename(
            item.path
          )
        )}…
      </div>
    `;


  viewer.scrollIntoView({
    behavior:
      "smooth",
    block:
      "start"
  });


  try {

    if (
      type === "markdown"
    ) {

      await renderMarkdownFile(
        item,
        viewer
      );

      return;

    }


    if (
      type === "text"
    ) {

      await renderTextFile(
        item,
        viewer
      );

      return;

    }


    if (
      type === "image"
    ) {

      renderImageFile(
        item,
        viewer
      );

      return;

    }


    if (
      type === "audio"
    ) {

      renderAudioFile(
        item,
        viewer
      );

      return;

    }


    if (
      type === "video"
    ) {

      renderVideoFile(
        item,
        viewer
      );

      return;

    }


    if (
      type === "pdf"
    ) {

      renderPDFFile(
        item,
        viewer
      );

      return;

    }


    renderBinaryFile(
      item,
      viewer
    );

  } catch (
    error
  ) {

    viewer.innerHTML =
      `
        <div class="viewer-error">

          <strong>
            Unable to render resource
          </strong>

          <p>
            ${escapeHTML(
              error.message
            )}
          </p>

          <a
            href="${escapeHTML(
              getGitHubURL(
                item.path
              )
            )}"
            target="_blank"
            rel="noopener"
          >
            OPEN ON GITHUB
          </a>

        </div>
      `;

  }

}


/* =========================================================
   MARKDOWN VIEWER
   ========================================================= */

async function renderMarkdownFile(
  item,
  viewer
) {

  const source =
    await fetchText(
      item.path
    );


  viewer.innerHTML =
    `
      <div class="viewer-document markdown-document">

        <div class="viewer-header">

          <span>
            MARKDOWN
          </span>

          <strong>
            ${escapeHTML(
              getFilename(
                item.path
              )
            )}
          </strong>

        </div>

        <div class="markdown-content">
          ${renderMarkdown(
            source
          )}
        </div>

      </div>
    `;

}


/* =========================================================
   TEXT / SOURCE VIEWER
   ========================================================= */

async function renderTextFile(
  item,

) {

/* =========================================================
   PDF VIEWER
   ========================================================= */

function renderPDFFile(
  item,
  viewer
) {

  const url =
    getRawURL(
      item.path
    );


  viewer.innerHTML =

      <div class="viewer-document">

        <div class="viewer-header">

/* =========================================================
   BINARY / UNKNOWN RESOURCE
   ========================================================= */

function renderBinaryFile(
  item,
  viewer
) {

  const filename =
    getFilename(
      item.path
    );


  const raw =
    getRawURL(
      item.path
    );


  viewer.innerHTML =
    `
      <div class="viewer-document viewer-binary">

        <div class="viewer-header">

          <span>
            RESOURCE
          </span>

          <strong>
            ${escapeHTML(
              filename
            )}
          </strong>

        </div>

        <p>
          This file cannot be rendered directly by the
          browser. The original repository resource remains
          available.
        </p>

        <div class="viewer-actions">

          <a
            href="${escapeHTML(
              raw
            )}"
            target="_blank"
            rel="noopener"
          >
            RAW FILE
          </a>

          <a
            href="${escapeHTML(
              getGitHubURL(
                item.path
              )
            )}"
            target="_blank"
            rel="noopener"
          >
            GITHUB
          </a>

        </div>

      </div>
    `;

}


/* =========================================================
   SECTION INFORMATION
   ========================================================= */

function initializeSectionHeader(
  files
) {

  const name =
    SECTION_PATH
      .split("/")
      .filter(Boolean)
      .pop() ||
    "AUF2026";


  const title =
    humanizeFilename(
      name
    );


  document.title =
    "AUF2026 — " +
    title;


  if (
    sectionTitle
  ) {

    sectionTitle.textContent =
      title;

  }


  if (
    sectionDescription
  ) {

    sectionDescription.textContent =
      "Research section /" +
      SECTION_PATH +
      " · " +
      files.length +
      " repository file" +
      (
        files.length === 1
          ? ""
          : "s"
      ) +
      " discovered recursively.";

  }

}


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(
  message
) {

  if (
    sectionStatus
  ) {

    sectionStatus.textContent =
      message;

  }

}


/* =========================================================
   INITIALIZATION
   ========================================================= */

async function initializeParser() {

  if (
    !SECTION_PATH
  ) {

    setStatus(
      "Invalid section path."
    );

    return;

  }


  try {

    setStatus(
      "Scanning repository…"
    );


    const tree =
      await loadRepositoryTree();


    const files =
      getSectionFiles(
        tree
      );


    initializeSectionHeader(
      files
    );


    renderFileList(
      files
    );


    setStatus(
      files.length +
      " file" +
      (
        files.length === 1
          ? ""
          : "s"
      ) +
      " discovered."
    );

  } catch (
    error
  ) {

    console.error(
      "AUF2026 section parser:",
      error
    );


    setStatus(
      "Repository scan failed."
    );


    if (
      sectionFiles
    ) {

      sectionFiles.innerHTML =
        `
          <div class="parser-error">

            <strong>
              Repository unavailable
            </strong>

            <p>
              ${escapeHTML(
                error.message
              )}
            </p>

          </div>
        `;

    }

  }

}


/* =========================================================
   START
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  initializeParser
);

</script>
