<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AUF2026 — Pdf</title>

  <style>

    :root {

      --bg:
        #070a0f;

      --panel:
        #0e141d;

      --panel-2:
        #131c27;

      --text:
        #eef3f8;

      --muted:
        #8d9aaa;

      --auf:
        #63e6be;

      --blue:
        #6ea8ff;

      --gold:
        #e6c76a;

      --red:
        #ff7373;

      --border:
        rgba(255,255,255,.10);

      --shadow:
        0 24px 70px rgba(0,0,0,.38);

    }


    * {

      box-sizing:
        border-box;

    }


    html,
    body {

      margin:
        0;

      min-height:
        100%;

      background:
        var(--bg);

      color:
        var(--text);

    }


    body {

      min-height:
        100vh;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:

        radial-gradient(
          circle at 80% 0%,
          rgba(110,168,255,.10),
          transparent 32%
        ),

        radial-gradient(
          circle at 0% 30%,
          rgba(99,230,190,.07),
          transparent 30%
        ),

        var(--bg);

    }


    button,
    input {

      font:
        inherit;

    }


    a {

      color:
        inherit;

    }


    /* =========================================================
       PAGE
       ========================================================= */

    .pages-page {

      width:
        min(
          1100px,
          calc(100% - 32px)
        );

      margin:
        0 auto;

      padding:
        32px 0 90px;

    }


    /* =========================================================
       TOP BAR
       ========================================================= */

    .pages-topbar {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        16px;

      margin-bottom:
        42px;

    }


    .pages-back {

      display:
        inline-flex;

      align-items:
        center;

      gap:
        8px;

      padding:
        9px 14px;

      border:
        1px solid
        var(--border);

      border-radius:
        9px;

      background:
        rgba(255,255,255,.03);

      color:
        var(--text);

      text-decoration:
        none;

      font-size:
        .72rem;

      font-weight:
        700;

      letter-spacing:
        .08em;

      text-transform:
        uppercase;

      transition:
        .2s ease;

    }


    .pages-back:hover {

      border-color:
        var(--auf);

      color:
        var(--auf);

      transform:
        translateX(-2px);

    }


    .pages-brand {

      color:
        var(--muted);

      font-size:
        .7rem;

      letter-spacing:
        .15em;

      text-transform:
        uppercase;

    }


    /* =========================================================
       HEADER
       ========================================================= */

    .pages-kicker {

      margin-bottom:
        10px;

      color:
        var(--auf);

      font-size:
        .72rem;

      font-weight:
        700;

      letter-spacing:
        .18em;

      text-transform:
        uppercase;

    }


    .pages-header h1 {

      margin:
        0 0 13px;

      color:
        var(--text);

      font-size:
        clamp(
          2rem,
          5vw,
          3.6rem
        );

      line-height:
        1.05;

      letter-spacing:
        -.04em;

    }


    .pages-subtitle {

      max-width:
        780px;

      margin:
        0;

      color:
        var(--muted);

      font-size:
        .95rem;

      line-height:
        1.75;

    }


    /* =========================================================
       STATUS
       ========================================================= */

    .pages-status {

      margin:
        28px 0 20px;

      padding:
        11px 14px;

      border:
        1px solid
        var(--border);

      border-radius:
        9px;

      background:
        rgba(255,255,255,.025);

      color:
        var(--muted);

      font-size:
        .73rem;

    }


    .pages-status[data-state="ok"] {

      border-color:
        rgba(99,230,190,.24);

    }


    .pages-status[data-state="error"] {

      border-color:
        rgba(255,115,115,.30);

      color:
        var(--red);

    }


    /* =========================================================
       DIRECTORY
       ========================================================= */

    .pages-directory {

      margin:
        30px 0 10px;

      color:
        var(--gold);

      font-family:
        ui-monospace,
        SFMono-Regular,
        Consolas,
        monospace;

      font-size:
        .72rem;

      letter-spacing:
        .08em;

    }


    /* =========================================================
       FILE LIST
       ========================================================= */

    .pages-files {

      display:
        grid;

      gap:
        8px;

    }


    .pages-empty {

      padding:
        30px;

      border:
        1px solid
        var(--border);

      border-radius:
        12px;

      color:
        var(--muted);

      background:
        var(--panel);

    }


    .pages-file {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        18px;

      padding:
        15px 17px;

      border:
        1px solid
        var(--border);

      border-radius:
        11px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.035),
          rgba(255,255,255,.015)
        );

      transition:
        border-color .18s ease,
        transform .18s ease,
        background .18s ease;

    }


    .pages-file:hover {

      transform:
        translateY(-1px);

      border-color:
        rgba(99,230,190,.30);

      background:
        rgba(99,230,190,.035);

    }


    .pages-file-info {

      min-width:
        0;

    }


    .pages-file-name {

      margin:
        0 0 5px;

      color:
        var(--text);

      font-size:
        .92rem;

      font-weight:
        650;

      overflow-wrap:
        anywhere;

    }


    .pages-file-type {

      display:
        inline-block;

      margin-right:
        8px;

      color:
        var(--auf);

      font-size:
        .62rem;

      font-weight:
        750;

      letter-spacing:
        .08em;

    }


    .pages-file-path {

      color:
        var(--muted);

      font-family:
        ui-monospace,
        SFMono-Regular,
        Consolas,
        monospace;

      font-size:
        .7rem;

      overflow-wrap:
        anywhere;

    }


    .pages-file-actions {

      display:
        flex;

      flex-shrink:
        0;

      gap:
        7px;

    }


    .pages-file-button,
    .pages-file-github {

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      min-height:
        34px;

      padding:
        7px 11px;

      border:
        1px solid
        var(--border);

      border-radius:
        7px;

      background:
        var(--panel-2);

      color:
        var(--text);

      font-size:
        .64rem;

      font-weight:
        700;

      letter-spacing:
        .07em;

      text-decoration:
        none;

      cursor:
        pointer;

      transition:
        .18s ease;

    }


    .pages-file-button:hover {

      border-color:
        var(--auf);

      color:
        var(--auf);

    }


    .pages-file-github:hover {

      border-color:
        var(--blue);

      color:
        var(--blue);

    }


    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (
      max-width: 700px
    ) {

      .pages-page {

        width:
          calc(100% - 20px);

        padding-top:
          20px;

      }


      .pages-file {

        align-items:
          flex-start;

        flex-direction:
          column;

      }


      .pages-file-actions {

        width:
          100%;

      }


      .pages-file-button,
      .pages-file-github {

        flex:
          1;

      }

    }

    .resource-viewer {

  margin-top:
    42px;

  border:
    1px solid
    var(--border);

  border-radius:
    15px;

  overflow:
    hidden;

  background:
    var(--panel);

  box-shadow:
    var(--shadow);

}


.resource-viewer[hidden] {

  display:
    none;

}


.resource-viewer-header {

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  gap:
    15px;

  padding:
    13px 17px;

  border-bottom:
    1px solid
    var(--border);

  background:
    var(--panel-2);

}


.resource-viewer-title {

  min-width:
    0;

  color:
    var(--text);

  font-family:
    ui-monospace,
    SFMono-Regular,
    Consolas,
    monospace;

  font-size:
    .72rem;

  overflow-wrap:
    anywhere;

}


.resource-viewer-close {

  flex-shrink:
    0;

  appearance:
    none;

  padding:
    7px 10px;

  border:
    1px solid
    var(--border);

  border-radius:
    7px;

  background:
    transparent;

  color:
    var(--muted);

  font-size:
    .64rem;

  font-weight:
    700;

  letter-spacing:
    .08em;

  cursor:
    pointer;

}


.resource-viewer-close:hover {

  border-color:
    var(--red);

  color:
    var(--red);

}


.resource-viewer-body {

  min-height:
    300px;

  padding:
    30px;

  overflow:
    auto;

}


.resource-loading {

  padding:
    40px 0;

  text-align:
    center;

  color:
    var(--muted);

}


.resource-note {

  display:
    flex;

  align-items:
    center;

  gap:
    10px;

  margin-bottom:
    18px;

  padding:
    10px 13px;

  border:
    1px solid
    var(--border);

  border-radius:
    8px;

  background:
    rgba(255,255,255,.025);

  color:
    var(--muted);

  font-size:
    .72rem;

}


.resource-note strong {

  color:
    var(--auf);

  letter-spacing:
    .08em;

}


.resource-markdown {

  max-width:
    860px;

  margin:
    0 auto;

  color:
    var(--text);

  line-height:
    1.78;

}


.resource-markdown h1,
.resource-markdown h2,
.resource-markdown h3,
.resource-markdown h4,
.resource-markdown h5,
.resource-markdown h6 {

  color:
    var(--text);

  line-height:
    1.25;

}


.resource-markdown h1 {

  font-size:
    2rem;

}


.resource-markdown h2 {

  margin-top:
    2.5em;

  padding-bottom:
    .55em;

  border-bottom:
    1px solid
    var(--border);

}


.resource-markdown h3 {

  margin-top:
    2em;

}


.resource-markdown a {

  color:
    var(--auf);

}


.resource-markdown code {

  color:
    var(--auf);

  background:
    rgba(99,230,190,.06);

  border-radius:
    4px;

  padding:
    .15em .35em;

}


.resource-markdown pre {

  overflow:
    auto;

  padding:
    18px;

  border:
    1px solid
    var(--border);

  border-radius:
    9px;

  background:
    #05070a;

}


.resource-markdown pre code {

  padding:
    0;

  background:
    transparent;

}


.resource-markdown img {

  display:
    block;

  max-width:
    100%;

  height:
    auto;

  margin:
    20px auto;

}


.resource-markdown table {

  width:
    100%;

  border-collapse:
    collapse;

  overflow:
    auto;

}


.resource-markdown th,
.resource-markdown td {

  padding:
    8px 10px;

  border:
    1px solid

    left;

.resource-markdown th {

  background:
    var(--panel-2);

}


.resource-html-frame,
.resource-pdf {

  display:
    block;

    80vh;

    0;

    white;

}


.resource-pdf {

  border-radius:
    8px;

}


.resource-image-wrap {

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  min-height:
    300px;

}


.resource-image {

  display:
    block;

  max-width:
    100%;

  max-height:
    80vh;

  object-fit:
    contain;

}


.resource-audio {

  display:
    block;

  width:
    100%;

}


.resource-video {

  display:
    block;

  width:
    100%;

  max-height:
    80vh;

  background:
    #000;

  border-radius:
    8px;

}


.resource-source {

  margin:
    0;

  padding:
    20px;

  overflow:
    auto;

  border:
    1px solid
    var(--border);

  border-radius:
    9px;

  background:
    #05070a;

  color:
    #dce7f2;

  font-family:
    ui-monospace,
    SFMono-Regular,
    Consolas,
    monospace;

  font-size:
    .82rem;

  line-height:
    1.65;

  white-space:
    pre-wrap;

  overflow-wrap:
    anywhere;

}


.resource-source code {

  font:
    inherit;

}


.resource-error {

  padding:
    24px;

  border:
    1px solid
    rgba(255,115,115,.30);

  border-radius:
    10px;

  background:
    rgba(255,115,115,.04);

  color:
    var(--muted);

  line-height:
    1.7;

}


.resource-error strong {

  color:
    var(--red);

}


.resource-error a {

  color:
    var(--auf);

}


@media (
  max-width: 700px
) {

  .resource-viewer-body {

    padding:
      18px;

  }


  .resource-html-frame,
  .resource-pdf {

    min-height:
      600px;

    height:
      75vh;

  }

    /* =========================================================
   AUF2026 REPOSITORY PARSER
   SCIENTIFIC / RESEARCH INTERFACE
   ========================================================= */

:root {

  --auf:
    #63e6be;

  --auf-blue:
    #6ea8ff;

  --auf-gold:
    #e6c76a;

  --auf-red:
    #ff7b7b;

  --text:
    #f2f6fb;

  --muted:
    #9ba8b7;

  --panel:
    #121923;

  --panel-2:
    #18212d;

  --border:
    rgba(255,255,255,.10);

  --shadow:
    0 24px 70px
    rgba(0,0,0,.35);

}


html[data-theme="light"] {

  --auf:
    #087f65;

  --auf-blue:
    #2868c7;

  --auf-gold:
    #9a7610;

  --auf-red:
    #c43f3f;

  --text:
    #111820;

  --muted:
    #5f6b78;

  --panel:
    #ffffff;

  --panel-2:
    #f1f4f7;

  --border:
    rgba(17,24,32,.12);

  --shadow:
    0 24px 70px
    rgba(15,23,42,.10);

}


/* =========================================================
   MENU MOUNT
   ========================================================= */

.auf-repository-menu-mount {

  width:
    100%;

  margin:
    0 0 34px;

}


/* =========================================================
   MENU
   ========================================================= */

.auf-repository-menu {

  display:
    grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(
        280px,
        1fr
      )
    );

  gap:
    12px;

  width:
    100%;

}


/* =========================================================
   SECTION
   ========================================================= */

.auf-menu-section {

  position:
    relative;

  min-width:
    0;

  border:
    1px solid
    var(--border);

  border-radius:
    13px;

  overflow:
    hidden;

  background:
    linear-gradient(
      145deg,
      var(--panel),
      var(--panel-2)
    );

  box-shadow:
    0 10px 35px
    rgba(0,0,0,.12);

  transition:
    border-color .25s ease,
    box-shadow .25s ease,
    transform .25s ease;

}


.auf-menu-section:hover {

  border-color:
    color-mix(
      in srgb,
      var(--auf) 24%,
      var(--border)
    );

  box-shadow:
    0 15px 45px
    rgba(0,0,0,.20);

}


.auf-menu-section.is-open {

  border-color:
    color-mix(
      in srgb,
      var(--auf) 38%,
      var(--border)
    );

}


/* =========================================================
   SECTION HEADER
   ========================================================= */

.auf-menu-section-header {

  position:
    relative;

  display:
    grid;

  grid-template-columns:
    30px
    minmax(0,1fr)
    auto
    20px;

  align-items:
    center;

  width:
    100%;

  min-height:
    66px;

  padding:
    11px 13px;

  appearance:
    none;

  border:
    0;

  background:
    transparent;

  color:
    var(--text);

  font:
    inherit;

  text-align:
    left;

  cursor:
    pointer;

}


/* =========================================================
   SECTION ACCENT LINE
   ========================================================= */

.auf-menu-section-header::before {

  content:
    "";

  position:
    absolute;

  left:
    0;

  top:
    0;

  bottom:
    0;

  width:
    2px;

  background:
    var(--auf);

  opacity:
    .30;

  transition:
    opacity .25s ease,
    width .25s ease;

}


.auf-menu-section:hover
.auf-menu-section-header::before {

  opacity:
    .70;

}


.auf-menu-section.is-open
.auf-menu-section-header::before {

  width:
    3px;

  opacity:
    1;

}


/* =========================================================
   SECTION ICON
   ========================================================= */

.auf-menu-section-icon {

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  width:
    25px;

  height:
    25px;

  border:
    1px solid
    color-mix(
      in srgb,
      var(--auf) 35%,
      var(--border)
    );

  border-radius:
    7px;

  color:
    var(--auf);

  background:
    color-mix(
      in srgb,
      var(--auf) 7%,
      transparent
    );

  font-family:
    ui-monospace,
    monospace;

  font-size:
    .82rem;

  font-weight:
    700;

}


/* =========================================================
   SECTION TITLE
   ========================================================= */

.auf-menu-section-title {

  min-width:
    0;

  overflow:
    hidden;

  color:
    var(--text);

  font-size:
    .86rem;

  font-weight:
    700;

  letter-spacing:
    .04em;

  text-transform:
    uppercase;

  white-space:
    nowrap;

  text-overflow:
    ellipsis;

}


/* =========================================================
   SECTION PATH
   ========================================================= */

.auf-menu-section-path {

  max-width:
    150px;

  overflow:
    hidden;

  color:
    var(--muted);

  font-family:
    ui-monospace,
    SFMono-Regular,
    Consolas,
    monospace;

  font-size:
    .62rem;

  white-space:
    nowrap;

  text-overflow:
    ellipsis;

  opacity:
    .55;

}


/* =========================================================
   SECTION ARROW
   ========================================================= */

.auf-menu-section-arrow {

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  color:
    var(--muted);

  font-size:
    1.1rem;

  transition:
    transform .25s ease,
    color .25s ease;

}


.auf-menu-section.is-open
.auf-menu-section-arrow {

  color:
    var(--auf);

  transform:
    rotate(90deg);

}


/* =========================================================
   FILE LIST
   ========================================================= */

.auf-menu-file-list {

  display:
    none;

  padding:
    0 8px 9px;

  border-top:
    1px solid
    var(--border);

}


.auf-menu-section.is-open
.auf-menu-file-list {

  display:
    block;

}


/* =========================================================
   FILE BUTTON
   ========================================================= */

.auf-menu-file {

  position:
    relative;

  display:
    grid;

  grid-template-columns:
    32px
    minmax(0,1fr)
    auto;

  align-items:
    center;

  width:
    100%;

  min-height:
    52px;

  margin:
    4px 0;

  padding:
    7px 9px;

  appearance:
    none;

  border:
    1px solid
    transparent;

  border-radius:
    8px;

  background:
    transparent;

  color:
    var(--text);

  font:
    inherit;

  text-align:
    left;

  cursor:
    pointer;

  transition:
    background .18s ease,
    border-color .18s ease,
    transform .18s ease;

}


.auf-menu-file:hover {

  background:
    color-mix(
      in srgb,
      var(--auf) 5%,
      transparent
    );

  border-color:
    color-mix(
      in srgb,
      var(--auf) 18%,
      transparent
    );

  transform:
    translateX(2px);

}


.auf-menu-file.is-active {

  background:
    color-mix(
      in srgb,
      var(--auf) 9%,
      transparent
    );

  border-color:
    color-mix(
      in srgb,
      var(--auf) 32%,
      var(--border)
    );

}


.auf-menu-file.is-active::before {

  content:
    "";

  position:
    absolute;

  left:
    -1px;

  top:
    8px;

  bottom:
    8px;

  width:
    2px;

  border-radius:
    2px;

  background:
    var(--auf);

}


/* =========================================================
   FILE ICON
   ========================================================= */

.auf-menu-file-icon {

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  width:
    26px;

  height:
    26px;

  border:
    1px solid
    var(--border);

  border-radius:
    6px;

  background:
    var(--panel-2);

  color:
    var(--auf);

  font-family:
    ui-monospace,
    SFMono-Regular,
    Consolas,
    monospace;

  font-size:
    .58rem;

  font-weight:
    800;

}

  display:

  flex-direction:
    column;

  gap:
    2px;

  overflow:
    hidden;

  color:
    var(--text);

  font-size:
    .76rem;

  font-weight:
    600;

  white-space:
    nowrap;

  text-overflow:
    ellipsis;

}


.auf-menu-file-path {

  overflow:
    hidden;

  color:
    var(--muted);

  font-family:
    ui-monospace,
    SFMono-Regular,
    Consolas,
    monospace;

  font-size:
    .57rem;

  white-space:
    nowrap;

  text-overflow:

    .65;

    8px;

  padding:
    3px 5px;

  border:
    1px solid
    var(--border);

  border-radius:
    4px;

  color:
    var(--muted);

  font-family:
    ui-monospace,
    monospace;

  font-size:
    .52rem;

  letter-spacing:
    .04em;

/* =========================================================

    1 / -1;

  flex-direction:

    color-mix(

    .76rem;

/* =========================================================
   RESOURCE VIEWER — SAME VISUAL LANGUAGE

   RESPONSIVE
   ========================================================= */

  max-width: 760px
) {

  .auf-repository-menu {

      1fr;

    gap:

  }

<body>

  <main class="pages-page">


    <nav class="pages-topbar">

      <a
        class="pages-back"
        href="../index.html"
      >
        ← Back
      </a>

      <div class="pages-brand">
        AUF2026
      </div>

    </nav>


    <header class="pages-header">

      <div class="pages-kicker">
        AUF2026 · Repository Section
      </div>

      <h1>
        Pages
      </h1>

      <p class="pages-subtitle">
        Repository resources contained in
        <code>/pages/</code>, including
        nested directories.
      </p>

    </header>


    <div
      id="pagesStatus"
      class="pages-status"
    >
      Connecting to AUF2026 repository…
    </div>


    <section
      id="pagesFiles"
      class="pages-files"
    ></section>


  </main>


  <script>
(function () {

  const SECTION = "pdf";

  const OWNER = "AUF2026";
  const REPOSITORY = "AUF2026.github.io";
  const BRANCH = "main";

  const TREE_URL =
    "https://api.github.com/repos/" +
    OWNER + "/" +
    REPOSITORY +
    "/git/trees/" +
    BRANCH +
    "?recursive=1";

  const BLOB_BASE =
    "https://github.com/" +
    OWNER + "/" +
    REPOSITORY +
    "/blob/" +
    BRANCH + "/";

  const status =
    document.getElementById("pdfStatus");

  const files =
    document.getElementById("pdfFiles");


  load();


  async function load() {

    try {

      setStatus("Scanning repository tree…");


      const response =
        await fetch(
          TREE_URL,
          {
            cache: "no-store",
            headers: {
              "Accept":
                "application/vnd.github+json"
            }
          }
        );


      if (!response.ok) {

        throw new Error(
          "GitHub API HTTP " +
          response.status
        );

      }


      const data =
        await response.json();


      const discovered =
        data.tree
          .filter(
            item =>
              item &&
              item.type === "blob" &&
              typeof item.path === "string" &&
              item.path.startsWith(
                SECTION + "/"
              ) &&
              item.path !==
                SECTION + "/index.html"
          )
          .sort(
            (a, b) =>
              a.path.localeCompare(
                b.path,
                undefined,
                {
                  numeric: true,
                  sensitivity: "base"
                }
              )
          );


      render(discovered);


      setStatus(
        discovered.length +
        " resource" +
        (
          discovered.length === 1
            ? ""
            : "s"
        ) +
        " found under /pdf/",
        "ok"
      );


    } catch (error) {

      console.error(
        "AUF2026 PDF parser:",
        error
      );


      setStatus(
        "Repository scan failed: " +
        error.message,
        "error"
      );


      if (files) {

        files.innerHTML =
          `
            <div class="pdf-empty">
              Unable to read
              <code>/pdf/</code>.
            </div>
          `;

      }

    }

  }


  function render(items) {

    files.innerHTML = "";


    if (!items.length) {

      files.innerHTML =
        `
          <div class="pdf-empty">
            No resources were found
            under <code>/pdf/</code>.
          </div>
        `;

      return;

    }


    let currentDirectory = null;


    items.forEach(item => {

      const relative =
        item.path.slice(
          SECTION.length + 1
        );


      const parts =
        relative.split("/");


      const directory =
        parts.length > 1
          ? parts.slice(0, -1).join("/")
          : "";


      if (
        directory !==
        currentDirectory
      ) {

        currentDirectory =
          directory;


        const heading =
          document.createElement("div");


        heading.className =
          "pdf-directory";


        heading.textContent =
          directory
            ? "/pdf/" + directory + "/"
            : "/pdf/";


        files.appendChild(
          heading
        );

      }


      const article =
        document.createElement("article");


      article.className =
        "pdf-file";


      const filename =
        item.path.split("/").pop();


      article.innerHTML =
        `
          <div class="pdf-file-info">

            <h2 class="pdf-file-name">
              ${escapeHTML(filename)}
            </h2>

            <div class="pdf-file-path">
              ${escapeHTML(item.path)}
            </div>

          </div>

          <div class="pdf-file-actions">

            <button
              type="button"
              class="pdf-file-button"
              data-open
            >
              VIEW
            </button>

            <a
              class="pdf-file-github"
              href="${BLOB_BASE + encodeURI(item.path)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              GITHUB
            </a>

          </div>
        `;


      article
        .querySelector("[data-open]")
        .addEventListener(
          "click",
          () => openResource(item.path)
        );


      files.appendChild(article);

    });

  }


  function openResource(path) {

    if (
      typeof window.openResource ===
      "function"
    ) {

      window.openResource(path);

      return;

    }


    window.location.href =
      "https://auf2026.github.io/" +
      path
        .split("/")
        .map(
          encodeURIComponent
        )
        .join("/");

  }


  function setStatus(message, state) {

    if (!status) return;

    status.textContent =
      message;

    if (state) {

      status.dataset.state =
        state;

    }

  }


  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  window.AUF2026Pdf = {

    section: SECTION,

    refresh: load,

    open: openResource

  };

})();
</script>
