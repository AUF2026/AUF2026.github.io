<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AUF2026 — Research Archive</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script>
    /*
     * Apply the saved theme before the page is painted.
     * This prevents a white/light flash when dark mode is saved.
     */

    (function () {

      const key = "auf2026-theme";

      let theme =
        localStorage.getItem(key);

      if (
        theme !== "dark" &&
        theme !== "light"
      ) {

        theme =
          window.matchMedia &&
          window.matchMedia(
            "(prefers-color-scheme: light)"
          ).matches
            ? "light"
            : "dark";

      }

      document.documentElement.setAttribute(
        "data-theme",
        theme
      );

    })();
  </script>


  <style>

    /* =========================================================
   AUF2026 — UNIVERSAL RESEARCH PARSER
   ========================================================= */

:root {

  --archive-bg:
    #05070a;

  --archive-bg2:
    #080d13;

  --archive-panel:
    #0b1118;

  --archive-panel2:
    #101923;

  --archive-panel3:
    #141f2b;

  --archive-text:
    #edf4f8;

  --archive-muted:
    #8798a7;

  --archive-dim:
    #526270;

  /*
   * Active AUF section colour.
   * JavaScript may overwrite this variable.
   */
  --archive-accent:
    #55dfff;

  --archive-accent-soft:
    color-mix(
      in srgb,
      var(--archive-accent) 12%,
      transparent
    );

  --archive-accent-border:
    color-mix(
      in srgb,
      var(--archive-accent) 32%,
      transparent
    );

  --archive-accent-glow:
    color-mix(
      in srgb,
      var(--archive-accent) 20%,
      transparent
    );

  --archive-green:
    #63e6be;

  --archive-blue:
    #6ea8ff;

  --archive-gold:
    #e6c76a;

  --archive-red:
    #ff7070;

  --archive-border:
    rgba(255,255,255,.095);

  --archive-border-soft:
    rgba(255,255,255,.055);

  --archive-shadow:
    0 24px 80px
    rgba(0,0,0,.42);

  --archive-radius:
    12px;

  --archive-code:
    #05080c;

  --archive-content-width:
    1080px;

}


/* =========================================================
   LIGHT THEME
   ========================================================= */

html[data-theme="light"] {

  --archive-bg:
    #f1f4f7;

  --archive-bg2:
    #e8edf2;

  --archive-panel:
    #ffffff;

  --archive-panel2:
    #f5f7f9;

  --archive-panel3:
    #e9eef3;

  --archive-text:
    #101820;

  --archive-muted:
    #60707d;

  --archive-dim:
    #8a98a4;

  --archive-border:
    rgba(16,24,32,.12);

  --archive-border-soft:
    rgba(16,24,32,.075);

  --archive-shadow:
    0 24px 70px
    rgba(20,35,50,.10);

  --archive-code:
    #e9edf1;

}


/* =========================================================
   RESET
   ========================================================= */

*,
*::before,
*::after {

  box-sizing:
    border-box;

}


html {

  margin:
    0;

  padding:
    0;

  min-height:
    100%;

  color-scheme:
    dark;

  scroll-behavior:
    smooth;

  background:
    var(--archive-bg);

  color:
    var(--archive-text);

}


html[data-theme="light"] {

  color-scheme:
    light;

}


body {

  margin:
    0;

  padding:
    0;

  min-height:
    100vh;

  overflow-x:
    hidden;

  background:

    radial-gradient(
      900px 500px at
      90% -10%,
      var(--archive-accent-soft),
      transparent 65%
    ),

    radial-gradient(
      700px 500px at
      -10% 30%,
      color-mix(
        in srgb,
        var(--archive-blue) 5%,
        transparent
      ),
      transparent 70%
    ),

    linear-gradient(
      180deg,
      var(--archive-bg2),
      var(--archive-bg)
    );

  color:
    var(--archive-text);

  font:
    inherit;

  transition:
    background .35s ease,
    color .25s ease;

}


/* =========================================================
   SCIENTIFIC BACKGROUND
   ========================================================= */

body::before {

  content:
    "";

  position:
    fixed;

  inset:
    0;

  z-index:
    -2;

  pointer-events:
    none;

  opacity:
    .38;

  background-image:

    linear-gradient(
      rgba(255,255,255,.025) 1px,
      transparent 1px
    ),

    linear-gradient(
      90deg,
      rgba(255,255,255,.025) 1px,
      transparent 1px
    );

  background-size:
    48px 48px;

  mask-image:
    linear-gradient(
      to bottom,
      black,
      transparent 80%
    );

  -webkit-mask-image:
    linear-gradient(
      to bottom,
      black,
      transparent 80%
    );

}


body::after {

  content:
    "";

  position:
    fixed;

  inset:
    0;

  z-index:
    -1;

  pointer-events:
    none;

  opacity:
    .025;

  background:

    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.8) 0,
      rgba(255,255,255,.8) 1px,
      transparent 1px,
      transparent 5px
    );

  mix-blend-mode:
    screen;

}


/* =========================================================
   PAGE
   ========================================================= */

.archive-page {

  width:
    min(
      var(--archive-content-width),
      calc(100% - 40px)
    );

  margin:
    0 auto;

  padding:
    30px 0 100px;

}


/* =========================================================
   TOP BAR
   ========================================================= */

.archive-topbar {

  position:
    relative;

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  gap:
    20px;

  min-height:
    42px;

  margin-bottom:
    55px;

}


.archive-topbar::after {

  content:
    "";

  position:
    absolute;

  left:
    0;

  right:
    0;

  bottom:
    -25px;

  height:
    1px;

  background:
    linear-gradient(
      90deg,
      var(--archive-accent-border),
      var(--archive-border-soft),
      transparent
    );

}


.archive-top-actions {

  display:
    flex;

  align-items:
    center;

  gap:
    8px;

}


/* =========================================================
   BUTTONS
   ========================================================= */

.archive-back,
.archive-theme-toggle,
.archive-back-bottom {

  appearance:
    none;

  display:
    inline-flex;

  align-items:
    center;

  justify-content:
    center;

  gap:
    8px;

  border:
    1px solid
    var(--archive-border);

  border-radius:
    7px;

  background:
    color-mix(
      in srgb,
      var(--archive-panel) 92%,
      transparent
    );

  color:
    var(--archive-muted);

  font:
    inherit;

  font-size:
    .68rem;

  font-weight:
    650;

  letter-spacing:
    .12em;

  line-height:
    1;

  text-transform:
    uppercase;

  cursor:
    pointer;

  transition:

    color .2s ease,

    border-color .2s ease,

    background .2s ease,

    box-shadow .2s ease,

    transform .2s ease;

}


.archive-back {

  min-height:
    34px;

  padding:
    0 12px;

}


.archive-theme-toggle {

  width:
    36px;

  height:
    34px;

  padding:
    0;

}


.archive-back:hover,
.archive-theme-toggle:hover,
.archive-back-bottom:hover {

  color:
    var(--archive-text);

  border-color:
    var(--archive-accent-border);

  background:
    var(--archive-accent-soft);

  box-shadow:
    0 0 24px
    var(--archive-accent-glow);

}


.archive-back:hover {

  transform:
    translateX(-2px);

}


.archive-theme-toggle:hover {

  transform:
    translateY(-1px);

}


.archive-back:active,
.archive-theme-toggle:active,
.archive-back-bottom:active {

  transform:
    scale(.98);

}


.archive-back-arrow {

  color:
    var(--archive-accent);

  font-size:
    .95rem;

}


.archive-theme-icon {

  width:
    15px;

  height:
    15px;

  display:
    grid;

  place-items:
    center;

  font-size:
    .8rem;

}


.archive-theme-label {

  display:
    none;

}


/* =========================================================
   TOP LABEL
   ========================================================= */

.archive-top-label {

  margin-left:
    auto;

  color:
    var(--archive-dim);

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    monospace;

  font-size:
    .62rem;

  letter-spacing:
    .16em;

  text-transform:
    uppercase;

}


/* =========================================================
   HEADER
   ========================================================= */

.archive-header {

  position:
    relative;

  margin-bottom:
    34px;

}


.archive-kicker {

  display:
    flex;

  align-items:
    center;

  gap:
    10px;

  margin-bottom:
    13px;

  color:
    var(--archive-accent);

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    monospace;

  font-size:
    .66rem;

  font-weight:
    700;

  letter-spacing:
    .18em;

  text-transform:
    uppercase;

}


.archive-kicker::before {

  content:
    "";

  width:
    26px;

  height:
    1px;

  background:
    var(--archive-accent);

  box-shadow:
    0 0 10px
    var(--archive-accent);

}


.archive-header h1 {

  max-width:
    900px;

  margin:
    0 0 15px;

  color:
    var(--archive-text);

  font-size:
    clamp(
      2rem,
      5vw,
      3.6rem
    );

  font-weight:
    650;

  line-height:
    1.03;

  letter-spacing:
    -.045em;

}


.archive-subtitle {

  max-width:
    760px;

  margin:
    0;

  color:
    var(--archive-muted);

  font-size:
    .92rem;

  line-height:
    1.8;

}


/* =========================================================
   STATUS
   ========================================================= */

.archive-status {

  position:
    relative;

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  gap:
    18px;

  margin-bottom:
    12px;

  padding:
    9px 12px;

  border:
    1px solid
    var(--archive-border-soft);

  border-left:
    2px solid
    var(--archive-accent-border);

  border-radius:
    6px;

  background:
    color-mix(
      in srgb,
      var(--archive-panel) 75%,
      transparent
    );

  color:
    var(--archive-muted);

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    monospace;

  font-size:
    .65rem;

  line-height:
    1.5;

}


.archive-status strong {

  color:
    var(--archive-accent);

  font-weight:
    700;

}


/* =========================================================
   DOCUMENT
   ========================================================= */

.archive-document {

  position:
    relative;

  padding:
    48px 54px;

  border:
    1px solid
    var(--archive-border-soft);

  border-radius:
    var(--archive-radius);

  background:

    linear-gradient(
      145deg,
      color-mix(
        in srgb,
        var(--archive-panel) 97%,
        transparent
      ),
      color-mix(
        in srgb,
        var(--archive-panel2) 88%,
        transparent
      )
    );

  box-shadow:
    var(--archive-shadow);

  overflow:
    hidden;

  overflow-wrap:
    anywhere;

  transition:
    border-color .3s ease,
    box-shadow .3s ease;

}


.archive-document::before {

  content:
    "";

  position:
    absolute;

  top:
    0;

  left:
    0;

  width:
    100%;

  height:
    1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--archive-accent-border),
      transparent
    );

}


.archive-document:hover {

  border-color:
    color-mix(
      in srgb,
      var(--archive-accent) 18%,
      var(--archive-border-soft)
    );

}


/* =========================================================
   MARKDOWN HEADINGS
   ========================================================= */

.archive-document h1,
.archive-document h2,
.archive-document h3,
.archive-document h4,
.archive-document h5,
.archive-document h6 {

  color:
    var(--archive-text);

  line-height:
    1.22;

  letter-spacing:
    -.018em;

}


.archive-document h1 {

  margin:
    0 0 1.4rem;

  font-size:
    2rem;

}


.archive-document h2 {

  position:
    relative;

  margin:
    3.2rem 0 1.1rem;

  padding:
    0 0 .7rem;

  border-bottom:
    1px solid
    var(--archive-border);

  font-size:
    1.42rem;

}


.archive-document h2::before {

  content:
    "";

  display:
    inline-block;

  width:
    4px;

  height:
    1em;

  margin-right:
    10px;

  vertical-align:
    -.12em;

  background:
    var(--archive-accent);

  box-shadow:
    0 0 12px
    var(--archive-accent-glow);

}


.archive-document h3 {

  margin:
    2.2rem 0 .8rem;

  font-size:
    1.1rem;

}


.archive-document h4 {

  margin:
    1.7rem 0 .7rem;

  font-size:
    .98rem;

}


.archive-document h5,
.archive-document h6 {

  margin:
    1.5rem 0 .6rem;

  font-size:
    .88rem;

}


/* =========================================================
   TEXT
   ========================================================= */

.archive-document p {

  margin:
    0 0 1.15rem;

  color:
    var(--archive-text);

  font-size:
    .92rem;

  line-height:
    1.85;

}


.archive-document ul,
.archive-document ol {

  margin:
    0 0 1.25rem;

  padding-left:
    1.45rem;

}


.archive-document li {

  margin-bottom:
    .45rem;

  color:
    var(--archive-text);

  font-size:
    .9rem;

  line-height:
    1.75;

}


.archive-document li::marker {

  color:
    var(--archive-accent);

}


.archive-document strong {

  color:
    var(--archive-text);

  font-weight:
    700;

}


.archive-document em {

  color:
    var(--archive-muted);

}


/* =========================================================
   LINKS
   ========================================================= */

.archive-document a {

  color:
    var(--archive-accent);

  text-decoration:
    none;

  text-decoration-thickness:
    1px;

  text-underline-offset:
    4px;

  border-bottom:
    1px solid
    color-mix(
      in srgb,
      var(--archive-accent) 25%,
      transparent
    );

  transition:
    color .18s ease,
    border-color .18s ease,
    text-shadow .18s ease;

}


.archive-document a:hover {

  color:
    var(--archive-text);

  border-color:
    var(--archive-accent);

  text-shadow:
    0 0 14px
    var(--archive-accent-glow);

}


/* =========================================================
   TABLES
   ========================================================= */

.archive-table-wrap {

  width:
    100%;

  margin:
    1.7rem 0;

  overflow-x:
    auto;

  border:
    1px solid
    var(--archive-border-soft);

  border-radius:
    8px;

  background:
    var(--archive-panel);

}


.archive-document table {

  width:
    100%;

  min-width:
    620px;

  border-collapse:
    collapse;

}


.archive-document th,
.archive-document td {

  padding:
    .7rem .8rem;

  border:
    1px solid
    var(--archive-border-soft);

  text-align:
    left;

  vertical-align:
    top;

  line-height:
    1.55;

}


.archive-document th {

  color:
    var(--archive-accent);

  background:
    var(--archive-accent-soft);

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    monospace;

  font-size:
    .72rem;

  font-weight:
    700;

  letter-spacing:
    .04em;

}


.archive-document td {

  color:
    var(--archive-text);

  font-size:
    .85rem;

}


.archive-document tr:nth-child(even) td {

  background:
    rgba(255,255,255,.012);

}


/* =========================================================
   INLINE CODE
   ========================================================= */

.archive-document code {

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    "Liberation Mono",
    monospace;

  font-size:
    .84em;

  color:
    var(--archive-accent);

}


.archive-document :not(pre) > code {

  padding:
    .15em .4em;

  border:
    1px solid
    var(--archive-border-soft);

  border-radius:
    4px;

  background:
    var(--archive-code);

}


/* =========================================================
   CODE BLOCKS
   ========================================================= */

.archive-document pre {

  position:
    relative;

  margin:
    1.7rem 0;

  padding:
    1.25rem 1.3rem;

  overflow:
    auto;

  border:
    1px solid
    var(--archive-border-soft);

  border-left:
    2px solid
    var(--archive-accent-border);

  border-radius:
    7px;

  background:
    var(--archive-code);

  box-shadow:
    inset 0 1px 0
    rgba(255,255,255,.025);

  line-height:
    1.65;

}


.archive-document pre::before {

  content:
    "CODE";

  position:
    absolute;

  top:
    8px;

  right:
    10px;

  color:
    var(--archive-dim);

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    monospace;

  font-size:
    .52rem;

  letter-spacing:
    .15em;

}


.archive-document pre code {

  color:
    var(--archive-text);

  font-size:
    .8rem;

}


/* =========================================================
   BLOCKQUOTE
   ========================================================= */

.archive-document blockquote {

  margin:
    1.7rem 0;

  padding:
    1rem 1.2rem;

  border-left:
    2px solid
    var(--archive-accent);

  border-radius:
    0 7px 7px 0;

  background:
    var(--archive-accent-soft);

  color:
    var(--archive-muted);

}


.archive-document blockquote p {

  color:
    inherit;

}


.archive-document blockquote p:last-child {

  margin-bottom:
    0;

}


/* =========================================================
   HR
   ========================================================= */

.archive-document hr {

  height:
    1px;

  margin:
    2.5rem 0;

  border:
    0;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--archive-border),
      transparent
    );

}


/* =========================================================
   IMAGES
   ========================================================= */

.archive-document img {

  display:
    block;

  max-width:
    100%;

  height:
    auto;

  margin:
    1.7rem auto;

  border:
    1px solid
    var(--archive-border-soft);

  border-radius:
    8px;

  background:
    var(--archive-panel);

  box-shadow:
    0 18px 50px
    rgba(0,0,0,.2);

}


/* =========================================================
   CHECKBOXES
   ========================================================= */

.archive-document input[type="checkbox"] {

  margin-right:
    .45rem;

  accent-color:
    var(--archive-accent);

}


/* =========================================================
   UNIVERSAL RESOURCE VIEWER
   ========================================================= */

.archive-page-viewer {

  width:
    100%;

  min-height:
    400px;

  overflow:
    hidden;

  border:
    1px solid
    var(--archive-border-soft);

  border-radius:
    8px;

  background:
    var(--archive-panel);

}


.archive-page-frame {

  display:
    block;

  width:
    100%;

  height:
    85vh;

  min-height:
    700px;

  border:
    0;

  background:
    #fff;

}


.archive-resource {

  width:
    100%;

  min-height:
    400px;

  padding:
    12px;

}


.archive-resource iframe,
.archive-resource object {

  display:
    block;

  width:
    100%;

  height:
    80vh;

  min-height:
    650px;

  border:
    0;

  border-radius:
    6px;

  background:
    #fff;

}


.archive-resource img {

  display:
    block;

  max-width:
    100%;

  max-height:
    80vh;

  margin:
    0 auto;

  object-fit:
    contain;

}


.archive-resource audio {

  display:
    block;

  width:
    100%;

  margin:
    20px 0;

}


.archive-resource video {

  display:
    block;

  width:
    100%;

  max-height:
    80vh;

  margin:
    0 auto;

  border-radius:
    7px;

  background:
    #000;

}


.archive-resource pre {

  margin:
    0;

  padding:
    20px;

  overflow:
    auto;

  white-space:
    pre-wrap;

  word-break:
    break-word;

  border-radius:
    7px;

  background:
    var(--archive-code);

  color:
    var(--archive-text);

  line-height:
    1.65;

}


/* =========================================================
   RESOURCE TABLE
   ========================================================= */

.archive-resource-table {

  width:
    100%;

  overflow-x:
    auto;

}


.archive-resource-table table {

  width:
    100%;

  min-width:
    600px;

  border-collapse:
    collapse;

}


.archive-resource-table th,
.archive-resource-table td {

  padding:
    9px 11px;

  border:
    1px solid
    var(--archive-border-soft);

  text-align:
    left;

  vertical-align:
    top;

}


.archive-resource-table th {

  color:
    var(--archive-accent);

  background:
    var(--archive-accent-soft);

}


.archive-resource-table td {

  color:
    var(--archive-text);

}


/* =========================================================
   RESOURCE NOTE
   ========================================================= */

.archive-resource-note {

  margin-bottom:
    14px;

  padding:
    10px 13px;

  border:

  /* =========================================================

  /* =========================================================

    /* =========================================================
     ALLOWED MARKDOWN DOCUMENTS
     ========================================================= */

  /*
   * Static fallback / known documents.
   *
   * These remain available immediately even if the GitHub API
   * is temporarily unavailable.
   *
   * The static entries intentionally keep their historical
   * short form because existing links use:
   *
   * archive.html?doc=ARCHIVE-MAP.md
   *
   * GitHub discovery below adds the complete repository path
   * for every Markdown file found recursively.
   */
  const allowedDocuments = [

    "ARCHIVE-MAP.md",
    "AUTHOR-IDENTITY.md",
    "BIBLIOGRAPHIC-NOVELTY-MATRIX.md",
    "CLAIMS.md",
    "CONFIGURATION-MATRIX.md",
    "CORE-GENEALOGY.md",
    "CORPUS-INDEX.md",
    "EXTRACTION-STATUS.md",
    "FAURE-THEOREM-CANDIDATES.md",
    "FAURE-THEOREM-NO-GOD.md",
    "LOCAL-CORPUS-MAP.md",
    "LOCAL-CORPUS-ROOTS.md",
    "NEXT-SESSION.md",
    "OBJECT-REGISTRY.md",
    "PROOF-INGESTION-PROTOCOL.md",
    "PROOF-REGISTRY.md",
    "README.md",
    "REPOSITORY-MAP.md",
    "RESEARCH-REGISTER.md",
    "SOURCE-INVENTORY.md",
    "SOURCE-MANIFEST.md",
    "THEOREM-ORIGINALITY-MATRIX.md"

  ];


  /* =========================================================
   GITHUB API DOCUMENT DISCOVERY
   ========================================================= */

  const GITHUB_OWNER =
    "AUF2026";


  const GITHUB_REPOSITORY =
    "AUF2026.github.io";


  const GITHUB_BRANCH =
    "main";


  async function discoverMarkdownDocuments() {

    const apiURL =
      "https://api.github.com/repos/" +
      GITHUB_OWNER +
      "/" +
      GITHUB_REPOSITORY +
      "/git/trees/" +
      GITHUB_BRANCH +
      "?recursive=1";


    try {

      const response =
        await fetch(
          apiURL,
          {
            cache: "no-cache",
            headers: {
              "Accept":
                "application/vnd.github+json"
            }
          }
        );


      if (!response.ok) {

        throw new Error(
          "GitHub API HTTP " +
          response.status
        );

      }


      const data =
        await response.json();


      if (
        !data ||
        !Array.isArray(data.tree)
      ) {

        throw new Error(
          "Invalid GitHub API tree response."
        );

      }


      /*
       * Discover EVERY Markdown file in EVERY directory.
       *
       * No directory is hardcoded.
       *
       * Examples:
       *
       *   bibliography/example.md
       *   code/example.md
       *   datasets/example.md
       *   docs/ARCHIVE-MAP.md
       *   pages/example.md
       *   papers/example.md
       *   pdf/example.md
       *   proofs/example.md
       *   validation/example.md
       *   some-new-folder/example.md
       *   future-folder/subfolder/file.md
       *
       * All of them are discovered automatically.
       */
      data.tree
        .filter(item => {

          return (
            item.type === "blob" &&
            typeof item.path === "string" &&
            item.path
              .toLowerCase()
              .endsWith(".md")
          );

        })
        .forEach(item => {

          const path =
            item.path
              .replace(/^\/+/, "")
              .replace(/\\/g, "/");


          if (
            path &&
            !allowedDocuments.includes(
              path
            )
          ) {

            allowedDocuments.push(
              path
            );

          }

        });


      /*
       * Keep the array deterministic.
       */
      allowedDocuments.sort(
        (a, b) =>
          a.localeCompare(
            b,
            undefined,
            {
              sensitivity: "base"
            }
          )
      );


      return true;


    } catch (error) {

      /*
       * GitHub discovery is additive.
       *
       * If the API is unavailable, the existing static
       * documents continue to work exactly as before.
       */
      console.warn(
        "AUF2026 Markdown discovery:",
        error
      );


      return false;

    }

  }


  /* =========================================================
     MARKDOWN PATH RESOLUTION
     ========================================================= */

  function resolveMarkdownPath(
    requestedDocument
  ) {

    if (
      !requestedDocument
    ) {

      return null;

    }


    const cleanPath =
      requestedDocument
        .replace(/^\/+/, "")
        .replace(/\\/g, "/");


    /*
     * If the URL already contains a repository path,
     * use it directly.
     *
     * Example:
     *
     * archive.html?doc=docs/FAURE-THEOREM-NO-GOD.md
     *
     * This also works for every other repository directory:
     *
     * archive.html?doc=papers/example.md
     * archive.html?doc=proofs/example.md
     * archive.html?doc=validation/example.md
     */
    if (
      cleanPath.includes("/")
    ) {

      if (
        allowedDocuments.includes(
          cleanPath
        )
      ) {

        return cleanPath;

      }


      return null;

    }


    /*
     * Historical compatibility:
     *
     * Existing navigation uses:
     *
     * archive.html?doc=ARCHIVE-MAP.md
     *
     * These documents live in /docs/.
     *
     * Keep this behaviour unchanged.
     */
    const docsPath =
      "docs/" +
      cleanPath;


    if (
      allowedDocuments.includes(
        docsPath
      )
    ) {

      return docsPath;

    }


    /*
     * Static / repository compatibility.
     *
     * If the requested document itself is already a valid
     * repository path, use it directly.
     *
     * This allows documents outside /docs/ to resolve too.
     */
    if (
      allowedDocuments.includes(
        cleanPath
      )
    ) {

      return cleanPath;

    }


    /*
     * Finally, look for a discovered repository path
     * whose filename matches the requested short name.
     *
     * This allows:
     *
     * archive.html?doc=FAURE-THEOREM-NO-GOD.md
     *
     * to resolve automatically regardless of which
     * repository directory contains the document.
     *
     * Examples:
     *
     *   bibliography/FILE.md
     *   code/FILE.md
     *   datasets/FILE.md
     *   docs/FILE.md
     *   pages/FILE.md
     *   papers/FILE.md
     *   pdf/FILE.md
     *   proofs/FILE.md
     *   validation/FILE.md
     */
    const matches =
      allowedDocuments.filter(
        path => {

          return (
            path
              .split("/")
              .filter(Boolean)
              .pop()
              ?.toLowerCase() ===
            cleanPath.toLowerCase()
          );

        }
      );


    if (
      matches.length === 1
    ) {

      return matches[0];

    }


    return null;

  }

  /* =========================================================
     PAGE / RESOURCE VALIDATION
     ========================================================= */

  const allowedPageExtensions = [

    ".html",
    ".htm"

  ];


  const allowedResourceExtensions = [

    ".pdf",
    ".csv",
    ".svg",
    ".png",
    ".jpg",
    ".jpeg",
    ".gif",
    ".webp",
    ".avif",
    ".bmp",

    ".txt",

  ];


  /* =========================================================
     HUMAN TITLE
     ========================================================= */

  function humanTitle(filename) {

    return filename

      .replace(
        /\.(md|html?|pdf|csv|svg|txt|json|xml)$/i,
        ""
      )

      .replace(
        /[-_]+/g,
        " "
      )

      .replace(
        /\b\w/g,
        character =>
          character.toUpperCase()
      );

  }


  /* =========================================================
     SAFE LOCAL PATH
     ========================================================= */

  function isSafeLocalPath(path) {

    if (!path) {

      return false;

    }


    if (
      path.includes("..")
    ) {

      return false;

    }


    if (
      path.startsWith("/")
    ) {

      return false;

    }


    if (
      path.includes("\\")
    ) {

      return false;

    }


    return true;

  }


  /* =========================================================
     EXTENSION
     ========================================================= */

  function getExtension(path) {

    const clean =
      path
        .split("?")[0]
        .split("#")[0]
        .toLowerCase();


    const index =
      clean.lastIndexOf(".");


    if (
      index < 0
    ) {

      return "";

    }


    return clean.slice(
      index
    );

  }


  /* =========================================================
     BACK NAVIGATION
     ========================================================= */

  function goBack() {

    if (

      window.history.back();

    /* =========================================================
     MARKDOWN LINK NORMALIZATION
     ========================================================= */

  function normalizeMarkdownLinks() {

    documentElement
      .querySelectorAll("a")
      .forEach(link => {

        const rawHref =
          link.getAttribute("href");


        if (!rawHref) {

          return;

        }


        const href =
          rawHref.trim();


        if (

          href.startsWith("http://") ||

          href.startsWith("https://") ||

          href.startsWith("mailto:") ||

          href.startsWith("tel:") ||

          href.startsWith("#")

        ) {

          return;

        }


        const hashIndex =
          href.indexOf("#");


        const queryIndex =
          href.indexOf("?");


        let splitIndex = -1;


        if (
          hashIndex >= 0 &&
          queryIndex >= 0
        ) {

          splitIndex =
            Math.min(
              hashIndex,
              queryIndex
            );

        } else if (
          hashIndex >= 0
        ) {

          splitIndex =
            hashIndex;

        } else if (
          queryIndex >= 0
        ) {

          splitIndex =
            queryIndex;

        }


        const path =
          splitIndex >= 0
            ? href.slice(0, splitIndex)
            : href;


        const suffix =
          splitIndex >= 0
            ? href.slice(splitIndex)
            : "";


        if (
          !path
            .toLowerCase()
            .endsWith(".md")
        ) {

          return;

        }


        const normalizedPath =
          path
            .replace(/^\/+/, "")
            .replace(/\\/g, "/");


        /*
         * Direct repository path.
         */
        if (
          allowedDocuments.includes(
            normalizedPath
          )
        ) {

          link.href =
            "archive.html?doc=" +
            encodeURIComponent(
              normalizedPath
            ) +
            suffix;

          return;

        }


        /*
         * Historical /docs/ Markdown link.
         */
        const filename =
          normalizedPath
            .split("/")
            .filter(Boolean)
            .pop();


        if (
          !filename
        ) {

          return;

        }


        const resolvedPath =
          resolveMarkdownPath(
            filename
          );


        if (
          !resolvedPath
        ) {

          return;

        }


        link.href =
          "archive.html?doc=" +
          encodeURIComponent(
            resolvedPath
          ) +
          suffix;

      });

  }


  /* =========================================================
     TABLE WRAPPER
     ========================================================= */

  function improveTables() {

    documentElement
      .querySelectorAll("table")
      .forEach(table => {

        if (
          table.parentElement &&
          table.parentElement.classList.contains(
            "archive-table-wrap"
          )
        ) {

          return;

        }


        const wrapper =
          document.createElement("div");


        wrapper.className =
          "archive-table-wrap";


        table.parentNode.insertBefore(
          wrapper,
          table
        );


        wrapper.appendChild(
          table
        );

      });

  }


  /* =========================================================
     CSV PARSER
     ========================================================= */

  function parseCSV(text) {

    const rows = [];

    let row = [];

    let cell = "";

    let insideQuotes = false;


    for (
      let i = 0;
      i < text.length;
      i++
    ) {

      const char =
        text[i];


      const next =
        text[i + 1];


      if (
        char === '"' &&
        insideQuotes &&
        next === '"'
      ) {

        cell += '"';

        i++;

        continue;

      }


      if (
        char === '"'
      ) {

        insideQuotes =
          !insideQuotes;

        continue;

      }


      if (
        char === "," &&
        !insideQuotes
      ) {

        row.push(cell);

        cell = "";

        continue;

      }


      if (
        (char === "\n" ||
         char === "\r") &&
        !insideQuotes
      ) {

        if (
          char === "\r" &&
          next === "\n"
        ) {

          i++;

        }


        row.push(cell);

        rows.push(row);

        row = [];

        cell = "";

        continue;

      }


      cell += char;

    }


    if (
      cell.length ||
      row.length
    ) {

      row.push(cell);

      rows.push(row);

    }


    return rows;

  }


  /* =========================================================
     CSV RENDERER
     ========================================================= */

  function renderCSV(text, filename) {

    const rows =
      parseCSV(text);


    const wrapper =
      document.createElement("div");


    wrapper.className =
      "archive-resource-table";


    const table =
      document.createElement("table");


    rows.forEach((row, index) => {

      const tr =
        document.createElement("tr");


      row.forEach(value => {

        const cell =
          document.createElement(
            index === 0
              ? "th"
              : "td"
          );


        cell.textContent =
          value;


        tr.appendChild(
          cell
        );

      });


      table.appendChild(
        tr
      );

    });


    wrapper.appendChild(
      table
    );


    documentElement.replaceChildren(
      wrapper
    );


    titleElement.textContent =
      humanTitle(filename);

  }


  /* =========================================================
     TEXT RESOURCE
     ========================================================= */

  function renderText(
    text,
    filename
  ) {

    const resource =
      document.createElement("div");


    resource.className =
      "archive-resource";


    const pre =
      document.createElement("pre");


    pre.textContent =
      text;


    resource.appendChild(
      pre
    );


    documentElement.replaceChildren(
      resource
    );


    titleElement.textContent =
      humanTitle(filename);

  }


  /* =========================================================
     MEDIA RESOURCE
     ========================================================= */

  function renderMedia(
    path,
    filename
  ) {

    const ext =
      getExtension(path);


    const resource =
      document.createElement("div");


    resource.className =
      "archive-resource";


    let element;


    const audioExtensions = [

      ".mp3",
      ".wav",
      ".ogg",
      ".oga",
      ".m4a",
      ".aac",
      ".flac"

    ];


    const videoExtensions = [

      ".mp4",
      ".webm",
      ".ogv",
      ".mov"

    ];


    if (
      audioExtensions.includes(ext)
    ) {

      element =
        document.createElement(
          "audio"
        );

      element.controls = true;

    }


    if (
      videoExtensions.includes(ext)
    ) {

      element =
        document.createElement(
          "video"
        );

      element.controls = true;

      element.playsInline = true;

    }


    if (!element) {

      return;

    }


    element.src =
      path;


    element.preload =
      "metadata";


    resource.appendChild(
      element
    );


    documentElement.replaceChildren(
      resource
    );


    titleElement.textContent =
      humanTitle(filename);

  }


  /* =========================================================
     IMAGE / SVG RESOURCE
     ========================================================= */

  function renderImage(
    path,
    filename
  ) {

    const resource =
      document.createElement("div");


    resource.className =
      "archive-resource";


    const image =
      document.createElement("img");


    image.src =
      path;


    image.alt =
      filename;


    resource.appendChild(
      image
    );


    documentElement.replaceChildren(
      resource
    );


    titleElement.textContent =
      humanTitle(filename);

  }


  /* =========================================================
     PDF RESOURCE
     ========================================================= */

  function renderPDF(
    path,
    filename
  ) {

    const resource =
      document.createElement("div");


    resource.className =
      "archive-resource";


    const object =
      document.createElement("object");


    object.data =
      path;


    object.type =
      "application/pdf";


    const fallback =
      document.createElement("p");


    fallback.textContent =
      "Your browser cannot display this PDF directly.";


    const link =
      document.createElement("a");


    link.href =
      path;


    link.target =
      "_blank";


    link.rel =
      "noopener noreferrer";


    link.textContent =
      "Open PDF";


    fallback.appendChild(
      document.createTextNode(" ")
    );


    fallback.appendChild(
      link
    );


    object.appendChild(
      fallback
    );


    resource.appendChild(
      object
    );


    documentElement.replaceChildren(
      resource
    );


    titleElement.textContent =
      humanTitle(filename);

  }


  /* =========================================================
     EXTERNAL VIDEO EMBEDS
     ========================================================= */

  function renderEmbed(
    url,
    title
  ) {

    const resource =
      document.createElement("div");


    resource.className =
      "archive-resource";


    const iframe =
      document.createElement("iframe");


    iframe.src =
      url;


    iframe.title =
      title;


    iframe.loading =
      "lazy";


    iframe.allow =
      "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";


    iframe.allowFullscreen =
      true;


    resource.appendChild(
      iframe
    );


    documentElement.replaceChildren(
      resource
    );


    titleElement.textContent =
      title;

  }


  /* =========================================================
     HTML PAGE
     ========================================================= */

  function renderHTMLPage(
    path,
    filename
  ) {

    const resource =
      document.createElement("div");


    resource.className =
      "archive-page-viewer";


    const frame =
      document.createElement("iframe");


    frame.className =
      "archive-page-frame";


    frame.src =
      path;


    frame.title =
      humanTitle(filename);


    /*
     * The page is loaded as a real document inside the iframe.
     *
     * Therefore:
     *
     * - its own CSS works
     * - its own JavaScript works
     * - canvas works
     * - SVG works
     * - animations work
     * - audio works
     * - video works
     * - YouTube embeds work
     * - Vimeo embeds work
     * - WebGL / Three.js pages can work
     *
     * without having to inject foreign HTML into archive.html.
     */

    frame.loading =
      "eager";


    frame.allow =
      "accelerometer; autoplay; camera; encrypted-media; fullscreen; gyroscope; microphone; picture-in-picture; web-share";


    frame.allowFullscreen =
      true;


    resource.appendChild(
      frame
    );


    documentElement.replaceChildren(
      resource
    );


    titleElement.textContent =
      humanTitle(filename);

  }


  /* =========================================================
     RESOURCE ROUTER
     ========================================================= */

  async function loadResource(
    path,
    filename
  ) {

    const ext =
      getExtension(path);


    sourceElement.textContent =
      path;


    if (
      ext === ".html" ||
      ext === ".htm"
    ) {

      renderHTMLPage(
        path,
        filename
      );

      return;

    }


    if (
      ext === ".pdf"
    ) {

      renderPDF(
        path,
        filename
      );

      return;

    }


    if (
      ext === ".svg" ||
      ext === ".png" ||
      ext === ".jpg" ||
      ext === ".jpeg" ||
      ext === ".gif" ||
      ext === ".webp" ||
      ext === ".avif" ||
      ext === ".bmp" ||
      ext === ".ico"
    ) {

      renderImage(
        path,
        filename
      );

      return;

    }


    if (
      [
        ".mp3",
        ".wav",
        ".ogg",
        ".oga",
        ".m4a",
        ".aac",
        ".flac",
        ".mp4",
        ".webm",
        ".ogv",
        ".mov"
      ].includes(ext)
    ) {

      renderMedia(
        path,
        filename
      );

      return;

    }


    if (
      ext === ".csv"
    ) {

      try {

        const response =
          await fetch(
            path,
            {
              cache: "no-cache"
            }
          );


        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }


        const text =
          await response.text();


        renderCSV(
          text,
          filename
        );


      } catch (error) {

        renderError(
          error
        );

      }


      return;

    }


    if (
      [
        ".txt",
        ".json",
        ".xml",
        ".yaml",
        ".yml",
        ".log"
      ].includes(ext)
    ) {

      try {

        const response =
          await fetch(
            path,
            {
              cache: "no-cache"
            }
          );


        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }


        const text =
          await response.text();


        renderText(
          text,
          filename
        );


      } catch (error) {

        renderError(
          error
        );

      }


      return;

    }


    /*
     * Unknown but local resource:
     * let the browser handle it.
     */

    const resource =
      document.createElement("div");


    resource.className =
      "archive-resource";


    const note =
      document.createElement("div");


    note.className =
      "archive-resource-note";


    note.innerHTML =
      "<strong>Resource:</strong> " +
      filename;


    const link =
      document.createElement("a");


    link.className =
      "archive-resource-download";


    link.href =
      path;


    link.target =
      "_blank";


    link.rel =
      "noopener noreferrer";


    link.textContent =
      "Open resource";


    resource.appendChild(
      note
    );


    resource.appendChild(
      link
    );


    documentElement.replaceChildren(
      resource
    );


    titleElement.textContent =
      humanTitle(filename);

  }


  /* =========================================================
     ERROR
     ========================================================= */

  function renderError(error) {

    documentElement.innerHTML = `

      <div class="archive-error">

        <strong>
          Unable to load resource.
        </strong>

        <p>
          ${error.message}
        </p>

      </div>

    `;

  }


  /* =========================================================
     LOAD MARKDOWN DOCUMENT
     ========================================================= */

  async function loadMarkdownDocument() {

    if (
      !requestedDocument
    ) {

      renderError(
        new Error(
          "Document not specified."
        )
      );

      return;

    }


    /*
     * Resolve the requested document against the
     * complete list discovered from GitHub.
     *
     * This supports all of these forms:
     *
     *   ARCHIVE-MAP.md
     *   docs/ARCHIVE-MAP.md
     *   folder/example.md
     *   folder/subfolder/example.md
     */
    const sourcePath =
      resolveMarkdownPath(
        requestedDocument
      );


    if (
      !sourcePath
    ) {

      renderError(
        new Error(
          "Markdown document not found: " +
          requestedDocument
        )
      );

      return;

    }


    const filename =
      sourcePath
        .split("/")
        .filter(Boolean)
        .pop();


    titleElement.textContent =
      humanTitle(
        filename
      );


    sourceElement.textContent =
      sourcePath;


    try {

      const response =
        await fetch(
          sourcePath,
          {
            cache: "no-cache"
          }
        );


      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      const markdown =
        await response.text();


      marked.setOptions({

        gfm: true,

        breaks: true

      });


      documentElement.innerHTML =
        marked.parse(
          markdown
        );


      normalizeMarkdownLinks();

      improveTables();


      document.title =
        "AUF2026 — " +
        humanTitle(
          filename
        );


    } catch (error) {

      console.error(
        "AUF2026 Archive:",
        error
      );


      renderError(
        error
      );

    }

  }


  /* =========================================================
     LOAD /pages/*.html
     ========================================================= */

  function loadPage() {

    if (
      !requestedPage
    ) {

      return;

    }


    if (
      !isSafeLocalPath(
        requestedPage
      )
    ) {

      renderError(
        new Error(
          "Invalid page path."
        )
      );

      return;

    }


    const filename =
      requestedPage
        .split("/")
        .filter(Boolean)
        .pop();


    if (
      !filename
    ) {

      renderError(
        new Error(
          "Invalid page."
        )
      );

      return;

    }


    const ext =
      getExtension(
        filename
      );


    if (
      !allowedPageExtensions.includes(
        ext
      )
    ) {

      renderError(
        new Error(
          "Only HTML pages are allowed in /pages/."
        )
      );

      return;

    }


    const path =
      "pages/" +
      requestedPage;


    loadResource(
      path,
      filename
    );


    document.title =
      "AUF2026 — " +
      humanTitle(
        filename
      );

  }


  /* =========================================================
     LOAD GENERIC RESOURCE
     ========================================================= */

  function loadGenericResource() {

    if (
      !requestedResource
    ) {

      return;

    }


    if (
      !isSafeLocalPath(
        requestedResource
      )
    ) {

      renderError(
        new Error(
          "Invalid resource path."
        )
      );

      return;

    }


    const filename =
      requestedResource
        .split("/")
        .filter(Boolean)
        .pop();


    if (
      !filename
    ) {

      renderError(
        new Error(
          "Invalid resource."
        )
      );

      return;

    }


    const ext =
      getExtension(
        filename
      );


    if (
      !allowedResourceExtensions.includes(
        ext
      )
    ) {

      renderError(
        new Error(
          "Resource type not allowed."
        )
      );

      return;

    }


    loadResource(
      requestedResource,
      filename
    );


    document.title =
      "AUF2026 — " +
      humanTitle(
        filename
      );

  }


  /* =========================================================
     YOUTUBE / VIMEO URL SUPPORT
     ========================================================= */

  function loadExternalEmbed() {

    const url =
      params.get("embed");


    if (
      !url
    ) {

      return false;

    }


    try {

      const parsed =
        new URL(
          url
        );


      const allowedHosts = [

        "www.youtube.com",
        "youtube.com",
        "youtu.be",
        "www.youtube-nocookie.com",
        "player.vimeo.com",
        "vimeo.com"

      ];


      if (
        !allowedHosts.includes(
          parsed.hostname
        )
      ) {

        renderError(
          new Error(
            "External embed host not allowed."
          )
        );

        return true;

      }


      renderEmbed(
        parsed.href,
        "External media"
      );


      sourceElement.textContent =
        parsed.href;


      document.title =
        "AUF2026 — External Media";


      return true;

    } catch {

      renderError(
        new Error(
          "Invalid external media URL."
        )
      );


      return true;

    }

  }


  /* =========================================================
     START
     ========================================================= */

  async function startArchive() {

    /*
     * Discover the current repository tree first.
     *
     * This is intentionally awaited so that newly created
     * Markdown files are available before URL routing begins.
     */
    await discoverMarkdownDocuments();


    if (
      loadExternalEmbed()
    ) {

      /* External embed loaded. */

    } else if (
      requestedPage
    ) {

      loadPage();

    } else if (
      requestedResource
    ) {

      loadGenericResource();

    } else if (
      requestedDocument
    ) {

      loadMarkdownDocument();

    } else {

      documentElement.innerHTML = `

        <div class="archive-error">

          <strong>
            Resource not specified.
          </strong>

          <p>
            Select a document, page or resource
            from the AUF2026 research archive.
          </p>

        </div>

      `;


      sourceElement.textContent =
        "not specified";


      document.title =
        "AUF2026 — Research Archive";

    }

  }


  startArchive();

</script>
