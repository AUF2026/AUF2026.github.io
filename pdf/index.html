<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AUF2026 — Pages</title>

  <style>

    :root {

      --bg:
        #070a0f;

      --panel:
        #0e141d;

      --panel-2:
        #131c27;

      --text:
        #eef3f8;

      --muted:
        #8d9aaa;

      --auf:
        #63e6be;

      --blue:
        #6ea8ff;

      --gold:
        #e6c76a;

      --red:
        #ff7373;

      --border:
        rgba(255,255,255,.10);

      --shadow:
        0 24px 70px rgba(0,0,0,.38);

    }


    * {

      box-sizing:
        border-box;

    }


    html,
    body {

      margin:
        0;

      min-height:
        100%;

      background:
        var(--bg);

      color:
        var(--text);

    }


    body {

      min-height:
        100vh;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:

        radial-gradient(
          circle at 80% 0%,
          rgba(110,168,255,.10),
          transparent 32%
        ),

        radial-gradient(
          circle at 0% 30%,
          rgba(99,230,190,.07),
          transparent 30%
        ),

        var(--bg);

    }


    button,
    input {

      font:
        inherit;

    }


    a {

      color:
        inherit;

    }


    /* =========================================================
       PAGE
       ========================================================= */

    .pages-page {

      width:
        min(
          1100px,
          calc(100% - 32px)
        );

      margin:
        0 auto;

      padding:
        32px 0 90px;

    }


    /* =========================================================
       TOP BAR
       ========================================================= */

    .pages-topbar {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        16px;

      margin-bottom:
        42px;

    }


    .pages-back {

      display:
        inline-flex;

      align-items:
        center;

      gap:
        8px;

      padding:
        9px 14px;

      border:
        1px solid
        var(--border);

      border-radius:
        9px;

      background:
        rgba(255,255,255,.03);

      color:
        var(--text);

      text-decoration:
        none;

      font-size:
        .72rem;

      font-weight:
        700;

      letter-spacing:
        .08em;

      text-transform:
        uppercase;

      transition:
        .2s ease;

    }


    .pages-back:hover {

      border-color:
        var(--auf);

      color:
        var(--auf);

      transform:
        translateX(-2px);

    }


    .pages-brand {

      color:
        var(--muted);

      font-size:
        .7rem;

      letter-spacing:
        .15em;

      text-transform:
        uppercase;

    }


    /* =========================================================
       HEADER
       ========================================================= */

    .pages-kicker {

      margin-bottom:
        10px;

      color:
        var(--auf);

      font-size:
        .72rem;

      font-weight:
        700;

      letter-spacing:
        .18em;

      text-transform:
        uppercase;

    }


    .pages-header h1 {

      margin:
        0 0 13px;

      color:
        var(--text);

      font-size:
        clamp(
          2rem,
          5vw,
          3.6rem
        );

      line-height:
        1.05;

      letter-spacing:
        -.04em;

    }


    .pages-subtitle {

      max-width:
        780px;

      margin:
        0;

      color:
        var(--muted);

      font-size:
        .95rem;

      line-height:
        1.75;

    }


    /* =========================================================
       STATUS
       ========================================================= */

    .pages-status {

      margin:
        28px 0 20px;

      padding:
        11px 14px;

      border:
        1px solid
        var(--border);

      border-radius:
        9px;

      background:
        rgba(255,255,255,.025);

      color:
        var(--muted);

      font-size:
        .73rem;

    }


    .pages-status[data-state="ok"] {

      border-color:
        rgba(99,230,190,.24);

    }


    .pages-status[data-state="error"] {

      border-color:
        rgba(255,115,115,.30);

      color:
        var(--red);

    }


    /* =========================================================
       DIRECTORY
       ========================================================= */

    .pages-directory {

      margin:
        30px 0 10px;

      color:
        var(--gold);

      font-family:
        ui-monospace,
        SFMono-Regular,
        Consolas,
        monospace;

      font-size:
        .72rem;

      letter-spacing:
        .08em;

    }


    /* =========================================================
       FILE LIST
       ========================================================= */

    .pages-files {

      display:
        grid;

      gap:
        8px;

    }


    .pages-empty {

      padding:
        30px;

      border:
        1px solid
        var(--border);

      border-radius:
        12px;

      color:
        var(--muted);

      background:
        var(--panel);

    }


    .pages-file {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        18px;

      padding:
        15px 17px;

      border:
        1px solid
        var(--border);

      border-radius:
        11px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.035),
          rgba(255,255,255,.015)
        );

      transition:
        border-color .18s ease,
        transform .18s ease,
        background .18s ease;

    }


    .pages-file:hover {

      transform:
        translateY(-1px);

      border-color:
        rgba(99,230,190,.30);

      background:
        rgba(99,230,190,.035);

    }


    .pages-file-info {

      min-width:
        0;

    }


    .pages-file-name {

      margin:
        0 0 5px;

      color:
        var(--text);

      font-size:
        .92rem;

      font-weight:
        650;

      overflow-wrap:
        anywhere;

    }


    .pages-file-type {

      display:
        inline-block;

      margin-right:
        8px;

      color:
        var(--auf);

      font-size:
        .62rem;

      font-weight:
        750;

      letter-spacing:
        .08em;

    }


    .pages-file-path {

      color:
        var(--muted);

      font-family:
        ui-monospace,
        SFMono-Regular,
        Consolas,
        monospace;

      font-size:
        .7rem;

      overflow-wrap:
        anywhere;

    }


    .pages-file-actions {

      display:
        flex;

      flex-shrink:
        0;

      gap:
        7px;

    }


    .pages-file-button,
    .pages-file-github {

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      min-height:
        34px;

      padding:
        7px 11px;

      border:
        1px solid
        var(--border);

      border-radius:
        7px;

      background:
        var(--panel-2);

      color:
        var(--text);

      font-size:
        .64rem;

      font-weight:
        700;

      letter-spacing:
        .07em;

      text-decoration:
        none;

      cursor:
        pointer;

      transition:
        .18s ease;

    }


    .pages-file-button:hover {

      border-color:
        var(--auf);

      color:
        var(--auf);

    }


    .pages-file-github:hover {

      border-color:
        var(--blue);

      color:
        var(--blue);

    }


    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (
      max-width: 700px
    ) {

      .pages-page {

        width:
          calc(100% - 20px);

        padding-top:
          20px;

      }


      .pages-file {

        align-items:
          flex-start;

        flex-direction:
          column;

      }


      .pages-file-actions {

        width:
          100%;

      }


      .pages-file-button,
      .pages-file-github {

        flex:
          1;

      }

    }

    .resource-viewer {

  margin-top:
    42px;

  border:
    1px solid
    var(--border);

  border-radius:
    15px;

  overflow:
    hidden;

  background:
    var(--panel);

  box-shadow:
    var(--shadow);

}


.resource-viewer[hidden] {

  display:
    none;

}


.resource-viewer-header {

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  gap:
    15px;

  padding:
    13px 17px;

  border-bottom:
    1px solid
    var(--border);

  background:
    var(--panel-2);

}


.resource-viewer-title {

  min-width:
    0;

  color:
    var(--text);

  font-family:
    ui-monospace,
    SFMono-Regular,
    Consolas,
    monospace;

  font-size:
    .72rem;

  overflow-wrap:
    anywhere;

}


.resource-viewer-close {

  flex-shrink:
    0;

  appearance:
    none;

  padding:
    7px 10px;

  border:
    1px solid
    var(--border);

  border-radius:
    7px;

  background:
    transparent;

  color:
    var(--muted);

  font-size:
    .64rem;

  font-weight:
    700;

  letter-spacing:
    .08em;

  cursor:
    pointer;

}


.resource-viewer-close:hover {

  border-color:
    var(--red);

  color:
    var(--red);

}


.resource-viewer-body {

  min-height:
    300px;

  padding:
    30px;

  overflow:
    auto;

}


.resource-loading {

  padding:
    40px 0;

  text-align:
    center;

  color:
    var(--muted);

}


.resource-note {

  display:
    flex;

  align-items:
    center;

  gap:
    10px;

  margin-bottom:
    18px;

  padding:
    10px 13px;

  border:
    1px solid
    var(--border);

  border-radius:
    8px;

  background:
    rgba(255,255,255,.025);

  color:
    var(--muted);

  font-size:
    .72rem;

}


.resource-note strong {

  color:
    var(--auf);

  letter-spacing:
    .08em;

}


.resource-markdown {

  max-width:
    860px;

  margin:
    0 auto;

  color:
    var(--text);

  line-height:
    1.78;

}


.resource-markdown h1,
.resource-markdown h2,
.resource-markdown h3,
.resource-markdown h4,
.resource-markdown h5,
.resource-markdown h6 {

  color:
    var(--text);

  line-height:
    1.25;

}


.resource-markdown h1 {

  font-size:
    2rem;

}


.resource-markdown h2 {

  margin-top:
    2.5em;

  padding-bottom:
    .55em;

  border-bottom:
    1px solid
    var(--border);

}


.resource-markdown h3 {

  margin-top:
    2em;

}


.resource-markdown a {

  color:
    var(--auf);

}


.resource-markdown code {

  color:
    var(--auf);

  background:
    rgba(99,230,190,.06);

  border-radius:
    4px;

  padding:
    .15em .35em;

}


.resource-markdown pre {

  overflow:
    auto;

  padding:
    18px;

  border:
    1px solid
    var(--border);

  border-radius:
    9px;

  background:
    #05070a;

}


.resource-markdown pre code {

  padding:
    0;

  background:
    transparent;

}


.resource-markdown img {

  display:
    block;

  max-width:
    100%;

  height:
    auto;

  margin:
    20px auto;

}


.resource-markdown table {

  width:
    100%;

  border-collapse:
    collapse;

  overflow:
    auto;

}


.resource-markdown th,
.resource-markdown td {

  padding:
    8px 10px;

  border:
    1px solid
    var(--border);

  text-align:
    left;

}


.resource-markdown th {

  background:
    var(--panel-2);

}


.resource-html-frame,
.resource-pdf {

  display:
    block;

  width:
    100%;

  min-height:
    700px;

  height:
    80vh;

  border:
    0;

  background:
    white;

}


.resource-pdf {

  border-radius:
    8px;

}


.resource-image-wrap {

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  min-height:
    300px;

}


.resource-image {

  display:
    block;

  max-width:
    100%;

  max-height:
    80vh;

  object-fit:
    contain;

}


.resource-audio {

  display:
    block;

  width:
    100%;

}


.resource-video {

  display:
    block;

  width:
    100%;

  max-height:
    80vh;

  background:
    #000;

  border-radius:
    8px;

}


.resource-source {

  margin:
    0;

  padding:
    20px;

  overflow:
    auto;

  border:
    1px solid
    var(--border);

  border-radius:
    9px;

  background:
    #05070a;

  color:
    #dce7f2;

  font-family:
    ui-monospace,
    SFMono-Regular,
    Consolas,
    monospace;

  font-size:
    .82rem;

  line-height:
    1.65;

  white-space:
    pre-wrap;

  overflow-wrap:
    anywhere;

}


.resource-source code {

  font:
    inherit;

}


.resource-error {

  padding:
    24px;

  border:
    1px solid
    rgba(255,115,115,.30);

  border-radius:
    10px;

  background:
    rgba(255,115,115,.04);

  color:
    var(--muted);

  line-height:
    1.7;

}


.resource-error strong {

  color:
    var(--red);

}


.resource-error a {

  color:
    var(--auf);

}


@media (
  max-width: 700px
) {

  .resource-viewer-body {

    padding:
      18px;

  }


  .resource-html-frame,
  .resource-pdf {

    min-height:
      600px;

    height:
      75vh;

  }

}

    /* =========================================================
   AUF2026 REPOSITORY PARSER
   SCIENTIFIC / RESEARCH INTERFACE
   ========================================================= */

:root {

  --auf:
    #63e6be;

  --auf-blue:
    #6ea8ff;

  --auf-gold:
    #e6c76a;

  --auf-red:
    #ff7b7b;

  --text:
    #f2f6fb;

  --muted:
    #9ba8b7;

  --panel:
    #121923;

  --panel-2:
    #18212d;

  --border:
    rgba(255,255,255,.10);

  --shadow:
    0 24px 70px
    rgba(0,0,0,.35);

}


html[data-theme="light"] {

  --auf:
    #087f65;

  --auf-blue:
    #2868c7;

  --auf-gold:
    #9a7610;

  --auf-red:
    #c43f3f;

  --text:
    #111820;

  --muted:
    #5f6b78;

  --panel:
    #ffffff;

  --panel-2:
    #f1f4f7;

  --border:
    rgba(17,24,32,.12);

  --shadow:
    0 24px 70px
    rgba(15,23,42,.10);

}


/* =========================================================
   MENU MOUNT
   ========================================================= */

.auf-repository-menu-mount {

  width:
    100%;

  margin:
    0 0 34px;

}


/* =========================================================
   MENU
   ========================================================= */

.auf-repository-menu {

  display:
    grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(
        280px,
        1fr
      )
    );

  gap:
    12px;

  width:
    100%;

}


/* =========================================================
   SECTION
   ========================================================= */

.auf-menu-section {

  position:
    relative;

  min-width:
    0;

  border:
    1px solid
    var(--border);

  border-radius:
    13px;

  overflow:
    hidden;

  background:
    linear-gradient(
      145deg,
      var(--panel),
      var(--panel-2)
    );

  box-shadow:
    0 10px 35px
    rgba(0,0,0,.12);

  transition:
    border-color .25s ease,
    box-shadow .25s ease,
    transform .25s ease;

}


.auf-menu-section:hover {

  border-color:
    color-mix(
      in srgb,
      var(--auf) 24%,
      var(--border)
    );

  box-shadow:
    0 15px 45px
    rgba(0,0,0,.20);

}


.auf-menu-section.is-open {

  border-color:
    color-mix(
      in srgb,
      var(--auf) 38%,
      var(--border)
    );

}


/* =========================================================
   SECTION HEADER
   ========================================================= */

.auf-menu-section-header {

  position:
    relative;

  display:
    grid;

  grid-template-columns:
    30px
    minmax(0,1fr)
    auto
    20px;

  align-items:
    center;

  width:
    100%;

  min-height:
    66px;

  padding:
    11px 13px;

  appearance:
    none;

  border:
    0;

  background:
    transparent;

  color:
    var(--text);

  font:
    inherit;

  text-align:
    left;

  cursor:
    pointer;

}


/* =========================================================
   SECTION ACCENT LINE
   ========================================================= */

.auf-menu-section-header::before {

  content:
    "";

  position:
    absolute;

  left:
    0;

  top:
    0;

  bottom:
    0;

  width:
    2px;

  background:
    var(--auf);

  opacity:
    .30;

  transition:
    opacity .25s ease,
    width .25s ease;

}


.auf-menu-section:hover
.auf-menu-section-header::before {

  opacity:
    .70;

}


.auf-menu-section.is-open
.auf-menu-section-header::before {

  width:
    3px;

  opacity:
    1;

}


/* =========================================================
   SECTION ICON
   ========================================================= */

.auf-menu-section-icon {

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  width:
    25px;

  height:
    25px;

  border:
    1px solid
    color-mix(
      in srgb,
      var(--auf) 35%,
      var(--border)
    );

  border-radius:
    7px;

  color:
    var(--auf);

  background:
    color-mix(
      in srgb,
      var(--auf) 7%,
      transparent
    );

  font-family:
    ui-monospace,
    monospace;

  font-size:
    .82rem;

  font-weight:
    700;

}


/* =========================================================
   SECTION TITLE
   ========================================================= */

.auf-menu-section-title {

  min-width:
    0;

  overflow:
    hidden;

  color:
    var(--text);

  font-size:
    .86rem;

  font-weight:
    700;

  letter-spacing:
    .04em;

  text-transform:
    uppercase;

  white-space:
    nowrap;

  text-overflow:
    ellipsis;

}


/* =========================================================
   SECTION PATH
   ========================================================= */

.auf-menu-section-path {

  max-width:
    150px;

  overflow:
    hidden;

  color:
    var(--muted);

  font-family:
    ui-monospace,
    SFMono-Regular,
    Consolas,
    monospace;

  font-size:
    .62rem;

  white-space:
    nowrap;

  text-overflow:
    ellipsis;

  opacity:
    .55;

}


/* =========================================================
   SECTION ARROW
   ========================================================= */

.auf-menu-section-arrow {

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  color:
    var(--muted);

  font-size:
    1.1rem;

  transition:
    transform .25s ease,
    color .25s ease;

}


.auf-menu-section.is-open
.auf-menu-section-arrow {

  color:
    var(--auf);

  transform:
    rotate(90deg);

}


/* =========================================================
   FILE LIST
   ========================================================= */

.auf-menu-file-list {

  display:
    none;

  padding:
    0 8px 9px;

  border-top:
    1px solid
    var(--border);

}


.auf-menu-section.is-open
.auf-menu-file-list {

  display:
    block;

}


/* =========================================================
   FILE BUTTON
   ========================================================= */

.auf-menu-file {

  position:
    relative;

  display:
    grid;

  grid-template-columns:
    32px
    minmax(0,1fr)
    auto;

  align-items:
    center;

  width:
    100%;

  min-height:
    52px;

  margin:
    4px 0;

  padding:
    7px 9px;

  appearance:
    none;

  border:
    1px solid
    transparent;

  border-radius:
    8px;

  background:
    transparent;

  color:
    var(--text);

  font:
    inherit;

  text-align:
    left;

  cursor:
    pointer;

  transition:
    background .18s ease,
    border-color .18s ease,
    transform .18s ease;

}


.auf-menu-file:hover {

  background:
    color-mix(
      in srgb,
      var(--auf) 5%,
      transparent
    );

  border-color:
    color-mix(
      in srgb,
      var(--auf) 18%,
      transparent
    );

  transform:
    translateX(2px);

}


.auf-menu-file.is-active {

  background:
    color-mix(
      in srgb,
      var(--auf) 9%,
      transparent
    );

  border-color:
    color-mix(
      in srgb,
      var(--auf) 32%,
      var(--border)
    );

}


.auf-menu-file.is-active::before {

  content:
    "";

  position:
    absolute;

  left:
    -1px;

  top:
    8px;

  bottom:
    8px;

  width:
    2px;

  border-radius:
    2px;

  background:
    var(--auf);

}


/* =========================================================
   FILE ICON
   ========================================================= */

.auf-menu-file-icon {

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  width:
    26px;

  height:
    26px;

  border:
    1px solid
    var(--border);

  border-radius:
    6px;

  background:
    var(--panel-2);

  color:
    var(--auf);

  font-family:
    ui-monospace,
    SFMono-Regular,
    Consolas,
    monospace;

  font-size:
    .58rem;

  font-weight:
    800;

}


/* =========================================================
   FILE MAIN
   ========================================================= */

.auf-menu-file-main {

  min-width:
    0;

  display:
    flex;

  flex-direction:
    column;

  gap:
    2px;

}


.auf-menu-file-name {

  overflow:
    hidden;

  color:
    var(--text);

  font-size:
    .76rem;

  font-weight:
    600;

  white-space:
    nowrap;

  text-overflow:
    ellipsis;

}


.auf-menu-file-path {

  overflow:
    hidden;

  color:
    var(--muted);

  font-family:
    ui-monospace,
    SFMono-Regular,
    Consolas,
    monospace;

  font-size:
    .57rem;

  white-space:
    nowrap;

  text-overflow:
    ellipsis;

  opacity:
    .65;

}


/* =========================================================
   EXTENSION
   ========================================================= */

.auf-menu-file-extension {

  margin-left:
    8px;

  padding:
    3px 5px;

  border:
    1px solid
    var(--border);

  border-radius:
    4px;

  color:
    var(--muted);

  font-family:
    ui-monospace,
    monospace;

  font-size:
    .52rem;

  letter-spacing:
    .04em;

  opacity:
    .65;

}


/* =========================================================
   ROOT FILES
   ========================================================= */

.auf-menu-section-root-files {

  grid-column:
    1 / -1;

}


/* =========================================================
   ERROR
   ========================================================= */

.auf-menu-error {

  display:
    flex;

  flex-direction:
    column;

  gap:
    6px;

  padding:
    16px;

  border:
    1px solid
    color-mix(
      in srgb,
      var(--auf-red) 35%,
      var(--border)
    );

  border-radius:
    10px;

  background:
    color-mix(
      in srgb,
      var(--auf-red) 5%,
      var(--panel)
    );

  color:
    var(--muted);

  font-size:
    .76rem;

}


.auf-menu-error strong {

  color:
    var(--auf-red);

}


/* =========================================================
   RESOURCE VIEWER — SAME VISUAL LANGUAGE
   ========================================================= */

.resource-viewer {

  position:
    relative;

  border-color:
    color-mix(
      in srgb,
      var(--auf) 20%,
      var(--border)
    );

}


.resource-viewer::before {

  content:
    "";

  position:
    absolute;

  left:
    0;

  right:
    0;

  top:
    0;

  height:
    1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--auf),
      var(--auf-blue),
      transparent
    );

  opacity:
    .65;

}


.resource-viewer-header {

  background:
    linear-gradient(
      90deg,
      color-mix(
        in srgb,
        var(--auf) 5%,
        var(--panel-2)
      ),
      var(--panel-2)
    );

}


.resource-viewer-title {

  color:
    var(--auf);

}


.resource-viewer-body {

  background:
    radial-gradient(
      circle at 85% 10%,
      color-mix(
        in srgb,
        var(--auf-blue) 4%,
        transparent
      ),
      transparent 30%
    );

}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (
  max-width: 760px
) {

  .auf-repository-menu {

    grid-template-columns:
      1fr;

    gap:
      9px;

  }


  .auf-menu-section-path {

    display:
      none;

  }


  .auf-menu-section-header {

    grid-template-columns:
      30px
      minmax(0,1fr)
      20px;

  }


  .auf-menu-section-arrow {

    grid-column:
      3;

  }


  .auf-menu-file {

    grid-template-columns:
      30px
      minmax(0,1fr)
      auto;

  }


  .auf-menu-file-extension {

    display:
      none;

  }


  .resource-viewer-body {

    padding:
      18px;

  }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (
  prefers-reduced-motion: reduce
) {

  .auf-menu-section,
  .auf-menu-file,
  .auf-menu-section-arrow {

    transition:
      none;

  }

}

  </style>

</head>


<body>

  <main class="pages-page">


    <nav class="pages-topbar">

      <a
        class="pages-back"
        href="../index.html"
      >
        ← Back
      </a>

      <div class="pages-brand">
        AUF2026
      </div>

    </nav>


    <header class="pages-header">

      <div class="pages-kicker">
        AUF2026 · Repository Section
      </div>

      <h1>
        Pages
      </h1>

      <p class="pages-subtitle">
        Repository resources contained in
        <code>/pages/</code>, including
        nested directories.
      </p>

    </header>


    <div
      id="pagesStatus"
      class="pages-status"
    >
      Connecting to AUF2026 repository…
    </div>


    <section
      id="pagesFiles"
      class="pages-files"
    ></section>


  </main>


  <script>

/* =========================================================
   AUF2026 PDF REPOSITORY NAVIGATION
   =========================================================
   DIRECT GITHUB PAGES ONLY

   NO GitHub API
   NO raw.githubusercontent.com
   NO external repository requests

   Architecture:

   /index.html
       |
       +-- /pdf/

   The pdf section is a normal GitHub Pages directory.

   Files are opened directly from:

   https://auf2026.github.io/pdf/

   ========================================================= */


/* =========================================================
   CONFIGURATION
   ========================================================= */

const AUF2026_CONFIG = {

  origin:
    "https://auf2026.github.io",

  section:
    "pdf"

};


/* =========================================================
   STATE
   ========================================================= */

const state = {

  directory:
    "pdf",

  files: [],

  initialized: false

};


/* =========================================================
   PATH NORMALISATION
   ========================================================= */

function normalizePath(path) {

  return String(path || "")

    .replace(
      /\\/g,
      "/"
    )

    .replace(
      /^\/+/,
      ""
    )

    .replace(
      /\/+/g,
      "/"
    )

    .replace(
      /\/$/,
      ""
    );

}


/* =========================================================
   GITHUB PAGES URL
   ========================================================= */

function repositoryResourceURL(path) {

  const clean =
    normalizePath(path);


  if (!clean) {

    return null;

  }


  return (

    AUF2026_CONFIG.origin +

    "/" +

    clean
      .split("/")
      .map(
        encodeURIComponent
      )
      .join("/")

  );

}


/* =========================================================
   SECTION URL
   ========================================================= */

function repositorySectionURL() {

  return (

    AUF2026_CONFIG.origin +
    "/pdf/"

  );

}


/* =========================================================
   DIRECTORY NAME
   ========================================================= */

function directoryName(path) {

  const clean =
    normalizePath(path);


  if (!clean) {

    return "Repository";

  }


  const parts =
    clean
      .split("/")
      .filter(Boolean);


  return (
    parts[parts.length - 1] ||
    clean
  );

}


/* =========================================================
   FILE EXTENSION
   ========================================================= */

function getFileExtension(path) {

  const clean =
    normalizePath(path);


  const filename =
    clean
      .split("/")
      .filter(Boolean)
      .pop() || "";


  const dot =
    filename.lastIndexOf(".");


  if (
    dot <= 0
  ) {

    return "";

  }


  return filename
    .slice(dot + 1)
    .toLowerCase();

}


/* =========================================================
   FILE ICON
   ========================================================= */

function fileIcon(extension) {

  const icons = {

    md:
      "M",

    markdown:
      "M",

    html:
      "H",

    htm:
      "H",

    pdf:
      "P",

    tex:
      "T",

    latex:
      "T",

    lean:
      "λ",

    json:
      "{}",

    csv:
      "≡",

    txt:
      "T",

    js:
      "JS",

    mjs:
      "JS",

    cjs:
      "JS",

    css:
      "#",

    xml:
      "XML",

    yaml:
      "Y",

    yml:
      "Y",

    toml:
      "T",

    png:
      "IMG",

    jpg:
      "IMG",

    jpeg:
      "IMG",

    gif:
      "IMG",

    webp:
      "IMG",

    svg:
      "IMG",

    bmp:
      "IMG",

    mp3:
      "♫",

    wav:
      "♫",

    ogg:
      "♫",

    flac:
      "♫",

    mp4:
      "▶",

    webm:
      "▶",

    mov:
      "▶",

    avi:
      "▶"

  };


  return (
    icons[extension] ||
    "·"
  );

}


/* =========================================================
   SORT
   ========================================================= */

function naturalPathCompare(a, b) {

  return String(a || "")
    .localeCompare(
      String(b || ""),
      undefined,
      {
        numeric:
          true,

        sensitivity:
          "base"
      }
    );

}


/* =========================================================
   REQUESTED RESOURCE
   ========================================================= */

function getRequestedResource() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  return normalizePath(

    params.get("resource") ||

    params.get("file") ||

    params.get("doc") ||

    ""

  );

}


/* =========================================================
   URL UPDATE
   ========================================================= */

function updateURL(path) {

  const clean =
    normalizePath(path);


  if (!clean) {

    return;

  }


  const url =
    new URL(
      window.location.href
    );


  url.searchParams.delete(
    "file"
  );


  url.searchParams.delete(
    "doc"
  );


  url.searchParams.set(
    "resource",
    clean
  );


  history.replaceState(
    null,
    "",
    url
  );

}


/* =========================================================
   MENU MOUNT
   ========================================================= */

function findMenuMount() {

  const selectors = [

    "#repository-menu",

    "#repo-menu",

    "#auf-menu",

    "#archive-menu",

    ".repository-menu",

    ".auf-menu",

    ".archive-menu"

  ];


  for (
    const selector of selectors
  ) {

    const element =
      document.querySelector(
        selector
      );


    if (element) {

      return element;

    }

  }


  const viewer =
    document.querySelector(
      ".resource-viewer"
    );


  const mount =
    document.createElement(
      "div"
    );


  mount.id =
    "repository-menu";


  mount.className =
    "auf-repository-menu-mount";


  if (
    viewer &&
    viewer.parentNode
  ) {

    viewer.parentNode.insertBefore(
      mount,
      viewer
    );

  } else {

    document.body.appendChild(
      mount
    );

  }


  return mount;

}


/* =========================================================
   DISCOVER PDF
   =========================================================
   IMPORTANT:

   GitHub Pages has no directory listing API.

   Therefore /pdf/ is treated as the single
   repository section.

   No GitHub API is used.
   No raw.githubusercontent.com is used.
   No external repository request is made.

   Files are registered explicitly through:

   window.AUF2026Repository.registerFiles(
     "pdf",
     [
       "pdf/index.html",
       "pdf/example.pdf"
     ]
   );

   ========================================================= */

async function discoverRepository() {

  state.directory =
    "pdf";


  state.files =
    [];


  return true;

}


/* =========================================================
   BUILD REPOSITORY MENU
   ========================================================= */

function buildRepositoryMenu() {

  const mount =
    findMenuMount();


  if (!mount) {

    return;

  }


  mount.innerHTML = "";


  const navigation =
    document.createElement(
      "nav"
    );


  navigation.className =
    "auf-repository-menu";


  navigation.appendChild(

    createDirectorySection(
      "pdf"
    )

  );


  mount.appendChild(
    navigation
  );

}


/* =========================================================
   DIRECTORY SECTION
   ========================================================= */

function createDirectorySection(
  directory
) {

  const shell =
    createSectionShell(

      directoryName(
        directory
      ),

      directory,

      "directory"

    );


  /*
   * The pdf section itself is the real
   * GitHub Pages directory.
   *
   * No API request is made.
   */

  const openButton =
    document.createElement(
      "a"
    );


  openButton.className =
    "auf-menu-directory-link";


  openButton.href =
    repositorySectionURL();


  openButton.textContent =
    "Open section";


  openButton.setAttribute(
    "aria-label",
    "Open " +
    directoryName(
      directory
    )
  );


  shell.list.appendChild(
    openButton
  );


  return shell.root;

}


/* =========================================================
   SECTION SHELL
   ========================================================= */

function createSectionShell(
  title,
  path,
  type
) {

  const root =
    document.createElement(
      "section"
    );


  root.className =
    "auf-menu-section " +
    "auf-menu-section-" +
    type;


  root.dataset.path =
    normalizePath(
      path
    );


  const header =
    document.createElement(
      "button"
    );


  header.type =
    "button";


  header.className =
    "auf-menu-section-header";


  header.setAttribute(
    "aria-expanded",
    "false"
  );


  const icon =
    document.createElement(
      "span"
    );


  icon.className =
    "auf-menu-section-icon";


  icon.setAttribute(
    "aria-hidden",
    "true"
  );


  icon.textContent =
    type === "directory"
      ? "§"
      : "R";


  const titleElement =
    document.createElement(
      "span"
    );


  titleElement.className =
    "auf-menu-section-title";


  titleElement.textContent =
    title;


  const pathElement =
    document.createElement(
      "span"
    );


  pathElement.className =
    "auf-menu-section-path";


  pathElement.textContent =
    path;


  const arrow =
    document.createElement(
      "span"
    );


  arrow.className =
    "auf-menu-section-arrow";


  arrow.setAttribute(
    "aria-hidden",
    "true"
  );


  arrow.textContent =
    "›";


  header.appendChild(
    icon
  );


  header.appendChild(
    titleElement
  );


  header.appendChild(
    pathElement
  );


  header.appendChild(
    arrow
  );


  const list =
    document.createElement(
      "div"
    );


  list.className =
    "auf-menu-file-list";


  header.addEventListener(
    "click",
    function () {

      const open =
        root.classList.toggle(
          "is-open"
        );


      header.setAttribute(
        "aria-expanded",
        String(open)
      );

    }
  );


  root.appendChild(
    header
  );


  root.appendChild(
    list
  );


  return {

    root:
      root,

    header:
      header,

    list:
      list

  };

}


/* =========================================================
   OPEN RESOURCE
   ========================================================= */

function openResource(path) {

  const clean =
    normalizePath(path);


  if (!clean) {

    return;

  }


  /*
   * Prefer the parser already installed by the page.
   */

  if (
    typeof window.loadRepositoryResource ===
    "function"
  ) {

    window.loadRepositoryResource(
      clean
    );

    updateURL(
      clean
    );

    setActiveFile(
      clean
    );

    return;

  }


  if (
    typeof window.loadResource ===
    "function"
  ) {

    window.loadResource(
      clean
    );

    updateURL(
      clean
    );

    setActiveFile(
      clean
    );

    return;

  }


  /*
   * Absolute fallback:
   * direct GitHub Pages resource.
   */

  const url =
    repositoryResourceURL(
      clean
    );


  if (url) {

    window.location.href =
      url;

  }

}


/* =========================================================
   OPEN SECTION
   ========================================================= */

function openSection() {

  const url =
    repositorySectionURL();


  if (url) {

    window.location.href =
      url;

  }

}


/* =========================================================
   FILE ITEM
   ========================================================= */

function createFileItem(
  file,
  parentDirectory
) {

  const button =
    document.createElement(
      "button"
    );


  button.type =
    "button";


  button.className =
    "auf-menu-file";


  button.dataset.path =
    file;


  const filename =
    normalizePath(file)
      .split("/")
      .filter(Boolean)
      .pop() ||
    file;


  const relative =
    parentDirectory

      ? normalizePath(file)
          .slice(
            normalizePath(
              parentDirectory
            ).length + 1
          )

      : normalizePath(file);


  const extension =
    getFileExtension(
      filename
    );


  const icon =
    document.createElement(
      "span"
    );


  icon.className =
    "auf-menu-file-icon";


  icon.textContent =
    fileIcon(
      extension
    );


  icon.setAttribute(
    "aria-hidden",
    "true"
  );


  const main =
    document.createElement(
      "span"
    );


  main.className =
    "auf-menu-file-main";


  const name =
    document.createElement(
      "span"
    );


  name.className =
    "auf-menu-file-name";


  name.textContent =
    filename;


  const pathElement =
    document.createElement(
      "span"
    );


  pathElement.className =
    "auf-menu-file-path";


  pathElement.textContent =
    relative;


  main.appendChild(
    name
  );


  main.appendChild(
    pathElement
  );


  const extensionElement =
    document.createElement(
      "span"
    );


  extensionElement.className =
    "auf-menu-file-extension";


  extensionElement.textContent =
    extension
      ? "." + extension
      : "FILE";


  button.appendChild(
    icon
  );


  button.appendChild(
    main
  );


  button.appendChild(
    extensionElement
  );


  button.addEventListener(
    "click",
    function () {

      openResource(
        file
      );

    }
  );


  if (
    getRequestedResource() ===
    normalizePath(file)
  ) {

    button.classList.add(
      "is-active"
    );

  }


  return button;

}


/* =========================================================
   ACTIVE FILE
   ========================================================= */

function setActiveFile(
  file
) {

  const clean =
    normalizePath(
      file
    );


  document
    .querySelectorAll(
      ".auf-menu-file.is-active"
    )
    .forEach(
      item => {

        item.classList.remove(
          "is-active"
        );

      }
    );


  document
    .querySelectorAll(
      ".auf-menu-file"
    )
    .forEach(
      item => {

        if (
          normalizePath(
            item.dataset.path
          ) === clean
        ) {

          item.classList.add(
            "is-active"
          );

        }

      }
    );

}


/* =========================================================
   REGISTER PDF FILES
   =========================================================
   This is the interface used by /pdf/.

   Example:

   window.AUF2026Repository.registerFiles(
     "pdf",
     [
       "pdf/index.html",
       "pdf/paper-01.pdf",
       "pdf/paper-02.pdf"
     ]
   );

   Only files belonging to pdf/ are accepted.
   No external server is contacted.
   ========================================================= */

function registerSectionFiles(
  directory,
  files
) {

  const root =
    normalizePath(
      directory
    );


  if (
    root !==
    "pdf"
  ) {

    return;

  }


  if (
    !Array.isArray(files)
  ) {

    return;

  }


  files
    .map(
      normalizePath
    )
    .filter(
      file =>
        file === "pdf" ||
        file.startsWith(
          "pdf/"
        )
    )
    .filter(Boolean)
    .forEach(
      file => {

        if (
          !state.files.includes(
            file
          )
        ) {

          state.files.push(
            file
          );

        }

      }
    );


  state.files =
    Array.from(
      new Set(
        state.files
      )
    )
    .sort(
      naturalPathCompare
    );


  rebuildSectionFiles(
    "pdf"
  );

}


/* =========================================================
   REBUILD PDF FILES
   ========================================================= */

function rebuildSectionFiles(
  directory
) {

  const root =
    normalizePath(
      directory
    );


  if (
    root !==
    "pdf"
  ) {

    return;

  }


  const section =
    document.querySelector(
      ".auf-menu-section[data-path=\"" +
      CSS.escape(root) +
      "\"]"
    );


  if (!section) {

    return;

  }


  const list =
    section.querySelector(
      ".auf-menu-file-list"
    );


  if (!list) {

    return;

  }


  list.innerHTML = "";


  const files =
    state.files
      .filter(
        file =>
          file === root ||
          file.startsWith(
            root + "/"
          )
      )
      .sort(
        naturalPathCompare
      );


  files.forEach(
    file => {

      list.appendChild(

        createFileItem(
          file,
          root
        )

      );

    }
  );


  if (!files.length) {

    const link =
      document.createElement(
        "a"
      );


    link.className =
      "auf-menu-directory-link";


    link.href =
      repositorySectionURL();


    link.textContent =
      "Open section";


    list.appendChild(
      link
    );

  }

}


/* =========================================================
   ERROR
   ========================================================= */

function renderRepositoryError(
  error
) {

  const mount =
    findMenuMount();


  if (!mount) {

    return;

  }


  mount.innerHTML = "";


  const box =
    document.createElement(
      "div"
    );


  box.className =
    "auf-menu-error";


  const strong =
    document.createElement(
      "strong"
    );


  strong.textContent =
    "PDF navigation error";


  const message =
    document.createElement(
      "span"
    );


  message.textContent =
    error &&
    error.message

      ? error.message

      : "Unable to initialise pdf navigation.";


  box.appendChild(
    strong
  );


  box.appendChild(
    message
  );


  mount.appendChild(
    box
  );

}


/* =========================================================
   INITIALISE
   ========================================================= */

async function initialiseRepository() {

  try {

    await discoverRepository();


    buildRepositoryMenu();


    state.initialized =
      true;


    const requested =
      getRequestedResource();


    if (
      requested
    ) {

      openResource(
        requested
      );

    }

  } catch (
    error
  ) {

    console.error(
      "AUF2026 pdf navigation:",
      error
    );


    renderRepositoryError(
      error
    );

  }

}


/* =========================================================
   PUBLIC API
   ========================================================= */

window.AUF2026Repository = {

  state:
    state,

  files:
    function () {

      return [
        ...state.files
      ];

    },

  directory:
    function () {

      return "pdf";

    },

  url:
    repositoryResourceURL,

  section:
    repositorySectionURL,

  open:
    openResource,

  registerFiles:
    registerSectionFiles,

  refresh:
    initialiseRepository

};


/* =========================================================
   START
   ========================================================= */

if (
  document.readyState ===
  "loading"
) {

  document.addEventListener(
    "DOMContentLoaded",
    initialiseRepository,
    {
      once:
        true
    }
  );

} else {

  initialiseRepository();

}

</script>
