<script>

/* =========================================================
   AUF2026 — SECTION INDEX / UNIVERSAL RESOURCE PARSER
   ========================================================= */

const GITHUB_OWNER =
  "AUF2026";

const GITHUB_REPOSITORY =
  "AUF2026.github.io";

const GITHUB_BRANCH =
  "main";


/* =========================================================
   DETECT CURRENT SECTION
   ========================================================= */

function detectSection() {

  const pathname =
    window.location.pathname
      .replace(/\\/g, "/");


  const match =
    pathname.match(
      /\/([^/]+)\/index\.html?$/i
    );


  if (
    match &&
    match[1]
  ) {

    return decodeURIComponent(
      match[1]
    );

  }


  /*
   * Fallback for GitHub Pages paths.
   */

  const parts =
    pathname
      .split("/")
      .filter(Boolean);


  if (
    parts.length >= 2 &&
    /\.html?$/i.test(
      parts[parts.length - 1]
    )
  ) {

    return parts[
      parts.length - 2
    ];

  }


  return "";

}


const SECTION =
  detectSection();


/* =========================================================
   API
   ========================================================= */

const TREE_URL =
  "https://api.github.com/repos/" +
  GITHUB_OWNER +
  "/" +
  GITHUB_REPOSITORY +
  "/git/trees/" +
  GITHUB_BRANCH +
  "?recursive=1";


/* =========================================================
   RAW FILE
   ========================================================= */

function rawURL(
  path
) {

  return (
    "https://raw.githubusercontent.com/" +
    GITHUB_OWNER +
    "/" +
    GITHUB_REPOSITORY +
    "/" +
    GITHUB_BRANCH +
    "/" +
    path
  );

}


/* =========================================================
   GITHUB FILE
   ========================================================= */

function githubURL(
  path
) {

  return (
    "https://github.com/" +
    GITHUB_OWNER +
    "/" +
    GITHUB_REPOSITORY +
    "/blob/" +
    GITHUB_BRANCH +
    "/" +
    path
  );

}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHTML(
  value
) {

  return String(
    value
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   FILE NAME
   ========================================================= */

function fileName(
  path
) {

  return path
    .split("/")
    .filter(Boolean)
    .pop() || "";

}


/* =========================================================
   FILE EXTENSION
   ========================================================= */

function extension(
  path
) {

  const name =
    fileName(
      path
    );


  const index =
    name.lastIndexOf(
      "."
    );


  if (
    index < 0
  ) {

    return "";

  }


  return name
    .slice(
      index + 1
    )
    .toLowerCase();

}


/* =========================================================
   RELATIVE PATH
   ========================================================= */

function relativePath(
  path
) {

  const prefix =
    SECTION +
    "/";


  if (
    path.startsWith(
      prefix
    )
  ) {

    return path.slice(
      prefix.length
    );

  }


  return path;

}


/* =========================================================
   HUMAN TITLE
   ========================================================= */

function humanTitle(
  value
) {

  return value
    .replace(
      /\.[^.]+$/,
      ""
    )
    .replace(
      /[-_]+/g,
      " "
    )
    .replace(
      /\b\w/g,
      char =>
        char.toUpperCase()
    );

}


/* =========================================================
   TYPE
   ========================================================= */

function resourceType(
  path
) {

  const ext =
    extension(
      path
    );


  if (
    [
      "md",
      "markdown",
      "mdown",
      "mkd"
    ].includes(
      ext
    )
  ) {

    return "markdown";

  }


  if (
    [
      "html",
      "htm"
    ].includes(
      ext
    )
  ) {

    return "html";

  }


  if (
    [
      "pdf"
    ].includes(
      ext
    )
  ) {

    return "pdf";

  }


  if (
    [
      "png",
      "jpg",
      "jpeg",
      "gif",
      "webp",
      "svg",
      "bmp",
      "ico",
      "avif"
    ].includes(
      ext
    )
  ) {

    return "image";

  }


  if (
    [
      "mp3",
      "wav",
      "ogg",
      "oga",
      "m4a",
      "flac"
    ].includes(
      ext
    )
  ) {

    return "audio";

  }


  if (
    [
      "mp4",
      "webm",
      "ogv",
      "mov",
      "m4v"
    ].includes(
      ext
    )
  ) {

    return "video";

  }


  if (
    [
      "tex",
      "latex",
      "lean",
      "txt",
      "json",
      "xml",
      "csv",
      "tsv",
      "yaml",
      "yml",
      "bib",
      "py",
      "js",
      "ts",
      "jsx",
      "tsx",
      "c",
      "h",
      "cpp",
      "hpp",
      "java",
      "rs",
      "go",
      "r",
      "sh",
      "bash",
      "sql",
      "css",
      "scss"
    ].includes(
      ext
    )
  ) {

    return "source";

  }


  return "resource";

}


/* =========================================================
   GET REPOSITORY TREE
   ========================================================= */

async function getRepositoryTree() {

  const response =
    await fetch(
      TREE_URL,
      {
        cache:
          "no-cache",

        headers: {
          Accept:
            "application/vnd.github+json"
        }
      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      "GitHub API HTTP " +
      response.status
    );

  }


  const data =
    await response.json();


  if (
    !data ||
    !Array.isArray(
      data.tree
    )
  ) {

    throw new Error(
      "GitHub repository tree is invalid."
    );

  }


  return data.tree;

}


/* =========================================================
   FIND ALL FILES IN THIS SECTION
   ========================================================= */

function findSectionFiles(
  tree
) {

  const prefix =
    SECTION +
    "/";


  return tree
    .filter(
      item => {

        if (
          item.type !== "blob"
        ) {

          return false;

        }


        if (
          !item.path
        ) {

          return false;

        }


        /*
         * THIS IS THE IMPORTANT PART:
         *
         * Every file below the section is accepted.
         *
         * No extension filtering.
         *
         * No depth limitation.
         */

        return item.path.startsWith(
          prefix
        );

      }
    )
    .sort(
      (a, b) =>
        a.path.localeCompare(
          b.path,
          undefined,
          {
            numeric:
              true,
            sensitivity:
              "base"
          }
        )
    );

}


/* =========================================================
   BUILD FILE LIST
   ========================================================= */

function renderFiles(
  files
) {

  const container =
    document.getElementById(
      "repositoryFiles"
    );


  if (
    !container
  ) {

    console.error(
      "Missing #repositoryFiles"
    );

    return;

  }


  container.innerHTML =
    "";


  if (
    !files.length
  ) {

    container.innerHTML =
      `
        <div class="parser-empty">

          <strong>
            No resources found
          </strong>

          <p>
            Section:
            /${escapeHTML(
              SECTION
            )}/
          </p>

        </div>
      `;

    return;

  }


  /*
   * Group files by directory.
   */

  let currentDirectory =
    null;


  files.forEach(
    file => {

      const relative =
        relativePath(
          file.path
        );


      const parts =
        relative
          .split("/")
          .filter(Boolean);


      const directory =
        parts.length > 1
          ? parts
              .slice(
                0,
                -1
              )
              .join("/")
          : "";


      if (
        directory !==
        currentDirectory
      ) {

        currentDirectory =
          directory;


        const directoryElement =
          document.createElement(
            "div"
          );


        directoryElement.className =
          "parser-directory";


        directoryElement.textContent =
          directory
            ? "/" +
              directory
            : "/";


        container.appendChild(
          directoryElement
        );

      }


      container.appendChild(
        createFileElement(
          file
        )
      );

    }
  );

}


/* =========================================================
   FILE ELEMENT
   ========================================================= */

function createFileElement(
  file
) {

  const relative =
    relativePath(
      file.path
    );


  const name =
    fileName(
      file.path
    );


  const type =
    resourceType(
      file.path
    );


  const element =
    document.createElement(
      "article"
    );


  element.className =
    "repository-file";


  element.dataset.type =
    type;


  element.innerHTML =
    `
      <div class="repository-file-main">

        <div class="repository-file-type">
          ${escapeHTML(
            type
              .toUpperCase()
          )}
        </div>

        <div>

          <h3 class="repository-file-name">
            ${escapeHTML(
              humanTitle(
                name
              )
            )}
          </h3>

          <div class="repository-file-path">
            ${escapeHTML(
              relative
            )}
          </div>

        </div>

      </div>

      <div class="repository-file-actions">

        <button
          type="button"
          class="repository-open"
        >
          VIEW
        </button>

        <a
          href="${escapeHTML(
            githubURL(
              file.path
            )
          )}"
          target="_blank"
          rel="noopener"
        >
          GITHUB
        </a>

      </div>
    `;


  const button =
    element.querySelector(
      ".repository-open"
    );


  button.addEventListener(
    "click",
    () => {

      openResource(
        file
      );

    }
  );


  return element;

}


/* =========================================================
   RESOURCE VIEWER
   ========================================================= */

async function openResource(
  file
) {

  const viewer =
    document.getElementById(
      "resourceViewer"
    );


  if (
    !viewer
  ) {

    return;

  }


  viewer.hidden =
    false;


  viewer.innerHTML =
    `
      <div class="resource-loading">
        Loading
        ${escapeHTML(
          fileName(
            file.path
          )
        )}
        …
      </div>
    `;


  viewer.scrollIntoView({
    behavior:
      "smooth",
    block:
      "start"
  });


  const type =
    resourceType(
      file.path
    );


  try {

    if (
      type === "markdown"
    ) {

      await openMarkdown(
        file,
        viewer
      );

      return;

    }


    if (
      type === "source"
    ) {

      await openSource(
        file,
        viewer
      );

      return;

    }


    if (
      type === "html"
    ) {

      openHTML(
        file,
        viewer
      );

      return;

    }


    if (
      type === "pdf"
    ) {

      openPDF(
        file,
        viewer
      );

      return;

    }


    if (
      type === "image"
    ) {

      openImage(
        file,
        viewer
      );

      return;

    }


    if (
      type === "audio"
    ) {

      openAudio(
        file,
        viewer
      );

      return;

    }


    if (
      type === "video"
    ) {

      openVideo(
        file,
        viewer
      );

      return;

    }


    openUnknown(
      file,
      viewer
    );

  } catch (
    error
  ) {

    viewer.innerHTML =
      `
        <div class="parser-error">

          <strong>
            Resource error
          </strong>

          <p>
            ${escapeHTML(
              error.message
            )}
          </p>

          <a
            href="${escapeHTML(
              githubURL(
                file.path
              )
            )}"
            target="_blank"
            rel="noopener"
          >
            OPEN ON GITHUB
          </a>

        </div>
      `;

  }

}


/* =========================================================
   MARKDOWN
   ========================================================= */

async function openMarkdown(
  file,
  viewer
) {

  const response =
    await fetch(
      rawURL(
        file.path
      ),
      {
        cache:
          "no-cache"
      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      "Unable to retrieve Markdown."
    );

  }


  const markdown =
    await response.text();


  /*
   * If marked.js is present in the page,
   * use the real Markdown parser.
   */

  let html;


  if (
    window.marked &&
    typeof window.marked.parse ===
      "function"
  ) {

    html =
      window.marked.parse(
        markdown
      );

  } else {

    html =
      basicMarkdown(
        markdown
      );

  }


  viewer.innerHTML =
    `
      <article class="resource-document">

        <header class="resource-header">

          <span>
            MARKDOWN
          </span>

          <strong>
            ${escapeHTML(
              fileName(
                file.path
              )
            )}
          </strong>

        </header>

        <div class="markdown-rendered">
          ${html}
        </div>

      </article>
    `;

}


/* =========================================================
   BASIC MARKDOWN FALLBACK
   ========================================================= */

function basicMarkdown(
  text
) {

  let html =
    escapeHTML(
      text
    );


  html =
    html.replace(
      /^###### (.+)$/gm,
      "<h6>$1</h6>"
    );

  html =
    html.replace(
      /^##### (.+)$/gm,
      "<h5>$1</h5>"
    );

  html =
    html.replace(
      /^#### (.+)$/gm,
      "<h4>$1</h4>"
    );

  html =
    html.replace(
      /^### (.+)$/gm,
      "<h3>$1</h3>"
    );

  html =
    html.replace(
      /^## (.+)$/gm,
      "<h2>$1</h2>"
    );

  html =
    html.replace(
      /^# (.+)$/gm,
      "<h1>$1</h1>"
    );


  html =
    html.replace(
      /\*\*(.+?)\*\*/g,
      "<strong>$1</strong>"
    );


  html =
    html.replace(
      /\*(.+?)\*/g,
      "<em>$1</em>"
    );


  html =
    html.replace(
      /`([^`]+)`/g,
      "<code>$1</code>"
    );


  html =
    html.replace(
      /\[([^\]]+)\]\(([^)]+)\)/g,
      '<a href="$2">$1</a>'
    );


  return html
    .split(
      /\n{2,}/
    )
    .map(
      block => {

        const value =
          block.trim();


        if (
          !value
        ) {

          return "";

        }


        if (
          /^<(h[1-6]|ul|ol|pre|blockquote|hr)/i
            .test(
              value
            )
        ) {

          return value;

        }


        return (
          "<p>" +
          value.replace(
            /\n/g,
            "<br>"
          ) +
          "</p>"
        );

      }
    )
    .join(
      "\n"
    );

}


/* =========================================================
   SOURCE
   ========================================================= */

async function openSource(
  file,
  viewer
) {

  const response =
    await fetch(
      rawURL(
        file.path
      ),
      {
        cache:
          "no-cache"
      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      "Unable to retrieve source."
    );

  }


  const source =
    await response.text();


  viewer.innerHTML =
    `
      <article class="resource-document">

        <header class="resource-header">

          <span>
            ${escapeHTML(
              extension(
                file.path
              ).toUpperCase()
            )}
          </span>

          <strong>
            ${escapeHTML(
              fileName(
                file.path
              )
            )}
          </strong>

        </header>

        <pre class="resource-code"><code>${escapeHTML(
          source
        )}</code></pre>

      </article>
    `;

}


/* =========================================================
   HTML
   ========================================================= */

function openHTML(
  file,
  viewer
) {

  viewer.innerHTML =
    `
      <article class="resource-document">

        <header class="resource-header">

          <span>
            HTML
          </span>

          <strong>
            ${escapeHTML(
              fileName(
                file.path
              )
            )}
          </strong>

        </header>

        <iframe
          class="resource-frame"
          src="${escapeHTML(
            rawURL(
              file.path
            )
          )}"
          title="${escapeHTML(
            fileName(
              file.path
            )
          )}"
        ></iframe>

      </article>
    `;

}

   PDF

          )}"
        ></iframe>

    `;

}

function openImage(

/* =========================================================
   AUDIO
   ========================================================= */

function openAudio(
  file,
  viewer
) {

  viewer.innerHTML =
    `
      <article class="resource-document">

        <header class="resource-header">

          <span>

          </span>

          <strong>
            ${escapeHTML(
              fileName(
                file.path
              )
            )}
          </strong>

        </header>

/* =========================================================
   VIDEO
   ========================================================= */

function openVideo(

) {

      <article class="resource-document">

        <header class="resource-header">

          <span>

          </span>

          <strong>
            ${escapeHTML(

/* =========================================================
   UNKNOWN RESOURCE
   ========================================================= */

function openUnknown(
  file,
  viewer
) {

  viewer.innerHTML =
    `
      <article class="resource-document">

        <header class="resource-header">

          <span>
            RESOURCE
          </span>

          <strong>
            ${escapeHTML(
              fileName(
                file.path
              )
            )}
          </strong>

        </header>

        <p>
          This resource is present in the repository but
          cannot be natively rendered by the browser.
        </p>

        <div class="resource-actions">

          <a
            href="${escapeHTML(
              rawURL(
                file.path
              )
            )}"
            target="_blank"
            rel="noopener"
          >
            RAW FILE
          </a>

          <a
            href="${escapeHTML(
              githubURL(
                file.path
              )
            )}"
            target="_blank"
            rel="noopener"
          >
            GITHUB
          </a>

}


/* =========================================================
   START
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  async () => {

    const title =
      document.getElementById(
        "sectionTitle"
      );


    const description =
      document.getElementById(
        "sectionDescription"
      );


    const status =
      document.getElementById(
        "sectionStatus"
      );


    if (
      title
    ) {

      title.textContent =
        humanTitle(
          SECTION
        );

    }


    if (
      description
    ) {

      description.textContent =
        "AUF2026 / " +
        SECTION +
        " — repository resources";

    }


    try {

      if (
        status
      ) {

        status.textContent =
          "Scanning repository…";

      }


      const tree =
        await getRepositoryTree();


      const files =
        findSectionFiles(
          tree
        );


      renderFiles(
        files
      );


      if (
        status
      ) {

        status.textContent =
          files.length +
          " resource" +
          (
            files.length === 1
              ? ""
              : "s"
          ) +
          " found";

      }

    } catch (
      error
    ) {

      console.error(
        error
      );


      if (
        status
      ) {

        status.textContent =
          "Repository scan failed";

      }


      const container =
        document.getElementById(
          "repositoryFiles"
        );


      if (
        container
      ) {

        container.innerHTML =
          `
            <div class="parser-error">

              <strong>
                GitHub repository could not be read.
              </strong>

              <p>
                ${escapeHTML(
                  error.message
                )}
              </p>

            </div>
          `;

      }

    }

  }
);

</script>
