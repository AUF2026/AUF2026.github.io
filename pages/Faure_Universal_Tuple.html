<script>(() => {
  "use strict";

  const SVG_NS = "http://www.w3.org/2000/svg";
  const STYLE_ID = "auf2026-interactive-style";
  const PANEL_ID = "auf2026-info-panel";

  const state = {
    playing: true,
    speed: 1,
    progress: 0,
    selected: null,
    reducedMotion: window.matchMedia("(prefers-reduced-motion: reduce)").matches
  };

  const original = document.querySelector("svg");
  if (!original) {
    console.error("AUF2026: SVG non trovato.");
    return;
  }

  const svg = original;
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "AUF2026 — diagramma matematico interattivo");
  svg.style.overflow = "visible";

  const info = [
    {
      title: "M — Algebra discreta",
      body: "Tipo discreto con atomi interi, operazioni algebriche e proprietà della negazione.",
      formula: "(-x)^2 = x^2",
      color: "#38e6df"
    },
    {
      title: "G — Certificato del determinante",
      body: "La componente geometrica codifica una matrice tetraedrica e certifica il determinante dichiarato nel manoscritto.",
      formula: "det(G) = 2",
      color: "#38e6df"
    },
    {
      title: "A — Struttura algebrica",
      body: "Operazioni e relazioni definite sul tipo discreto. Le proprietà effettive dipendono dalle definizioni formalizzate.",
      formula: "A : struttura operativa",
      color: "#38e6df"
    },
    {
      title: "Ψ — Identità quadratica",
      body: "Una condizione polinomiale quadratica implica l'identità di quadrato unitario descritta nel manoscritto.",
      formula: "Ψ(x) = 0 ⇒ q(x)² = 1",
      color: "#c084fc"
    },
    {
      title: "Λ — Simmetria di segno",
      body: "Il vincolo quadratico di tipo Friedmann è dichiarato invariante sotto inversione del segno.",
      formula: "Λ(H) = Λ(−H)",
      color: "#c084fc"
    },
    {
      title: "Π — Teoria dell'ordine",
      body: "La discesa stretta da ogni punto è incompatibile con un minimo globale.",
      formula: "∀x ∃y : f(y) < f(x)",
      color: "#f6c96b"
    },
    {
      title: "Discesa stretta",
      body: "Da ogni elemento del dominio esiste un altro elemento con valore strettamente minore.",
      formula: "∀x ∈ X, ∃y ∈ X : f(y) < f(x)",
      color: "#38e6df"
    },
    {
      title: "Incompatibilità d'ordine",
      body: "Se ogni punto ammette una discesa stretta, la funzione non può possedere un minimo globale.",
      formula: "¬∃x*, ∀x : f(x*) ≤ f(x)",
      color: "#38e6df"
    },
    {
      title: "Corrispondenza cosmologica",
      body: "La struttura descritta associa un istante designato a un valore nullo e impone un minimo globale. Questa condizione è incompatibile con la discesa stretta.",
      formula: "a(t*) = 0 ∧ ∀t, a(t*) ≤ a(t)",
      color: "#f6c96b"
    },
    {
      title: "Contraddizione formale",
      body: "Le ipotesi di discesa stretta e di minimo globale non possono valere simultaneamente per la stessa funzione sullo stesso dominio.",
      formula: "P ∧ ¬P ⇒ False",
      color: "#fb7185"
    },
    {
      title: "Predecessore temporale",
      body: "Se la relazione temporale è dimostrata equivalente alla relazione di discesa, ogni istante possiede un predecessore.",
      formula: "∀t ∈ T, ∃s ∈ T : s ≺ t",
      color: "#c084fc"
    },
    {
      title: "Assenza di un primo elemento",
      body: "La proprietà di predecessore esclude un primo elemento nell'ordine formalizzato. L'interpretazione fisica richiede che quell'ordine rappresenti la storia cosmologica.",
      formula: "¬∃t₀, ∀s : ¬(s ≺ t₀)",
      color: "#38e6df"
    }
  ];

  const css = `
    #auf2026-interactive-style {}
    svg .auf-node {
      cursor: pointer;
      transform-box: fill-box;
      transform-origin: center;
      transition: filter .25s ease, opacity .25s ease;
    }
    svg .auf-node:hover {
      filter: brightness(1.35) drop-shadow(0 0 9px currentColor);
    }
    svg .auf-node.auf-selected {
      filter: brightness(1.35) drop-shadow(0 0 12px currentColor);
    }
    svg .auf-dimmed { opacity: .2 !important; }
    svg .auf-flow {
      stroke-dasharray: 12 9;
      animation: auf-dash 2.5s linear infinite;
    }
    svg .auf-pulse {
      transform-box: fill-box;
      transform-origin: center;
      animation: auf-pulse 2.4s ease-in-out infinite;
    }
    svg .auf-glow {
      animation: auf-glow 2.8s ease-in-out infinite alternate;
    }
    #auf2026-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 12px;
      color: #e6edff;
      background: #0b1426;
      border: 1px solid #354968;
      border-radius: 12px;
      font: 14px system-ui, sans-serif;
      margin: 8px 0;
    }
    #auf2026-controls button,
    #auf2026-controls select {
      color: #e6edff;
      background: #172640;
      border: 1px solid #435a7d;
      border-radius: 8px;
      padding: 8px 11px;
      cursor: pointer;
    }
    #auf2026-controls button:hover,
    #auf2026-controls select:hover {
      background: #243b5e;
    }
    #auf2026-controls input { accent-color: #38e6df; }
    #auf2026-controls .auf-status {
      color: #9eb3d7;
      margin-left: auto;
    }
    #auf2026-info-panel {
      display: none;
      padding: 16px;
      margin: 8px 0;
      color: #e6edff;
      background: #101d32;
      border: 1px solid #38e6df;
      border-radius: 12px;
      font: 14px/1.6 system-ui, sans-serif;
    }
    #auf2026-info-panel.open { display: block; }
    #auf2026-info-panel h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }
    #auf2026-info-panel .formula {
      display: block;
      padding: 10px;
      margin-top: 10px;
      background: #07111f;
      border-radius: 8px;
      font: 16px ui-monospace, monospace;
      overflow-wrap: anywhere;
    }
    @keyframes auf-dash {
      to { stroke-dashoffset: -42; }
    }
    @keyframes auf-pulse {
      0%,100% { opacity: .75; }
      50% { opacity: 1; }
    }
    @keyframes auf-glow {
      from { filter: drop-shadow(0 0 1px #38e6df); }
      to { filter: drop-shadow(0 0 7px #38e6df); }
    }
    @media (prefers-reduced-motion: reduce) {
      svg *, #auf2026-controls *, #auf2026-info-panel * {
        animation-duration: .001ms !important;
        transition-duration: .001ms !important;
      }
    }
  `;

  if (!document.getElementById(STYLE_ID)) {
    const style = document.createElement("style");
    style.id = STYLE_ID;
    style.textContent = css;
    document.head.appendChild(style);
  }

  const controls = document.createElement("div");
  controls.id = "auf2026-controls";
  controls.innerHTML = `
    <button type="button" data-action="play">Ⅱ Pausa</button>
    <button type="button" data-action="restart">↺ Ricomincia</button>
    <button type="button" data-action="step">→ Passaggio</button>
    <label>Velocità
      <select data-action="speed" aria-label="Velocità animazione">
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="3">3×</option>
      </select>
    </label>
    <label>Avanzamento
      <input data-action="progress" type="range" min="0" max="100" value="0" aria-label="Avanzamento della sequenza">
    </label>
    <button type="button" data-action="focus">Evidenzia catena</button>
    <button type="button" data-action="reset">Reset vista</button>
    <span class="auf-status" aria-live="polite">AUF2026 · Pronto</span>
  `;

  svg.parentNode.insertBefore(controls, svg);

  let panel = document.getElementById(PANEL_ID);
  if (!panel) {
    panel = document.createElement("section");
    panel.id = PANEL_ID;
    panel.setAttribute("aria-live", "polite");
    svg.parentNode.insertBefore(panel, svg.nextSibling);
  }

  const status = controls.querySelector(".auf-status");
  const progressInput = controls.querySelector('[data-action="progress"]');
  const playButton = controls.querySelector('[data-action="play"]');

  const groups = Array.from(svg.querySelectorAll("rect"));
  const texts = Array.from(svg.querySelectorAll("text"));

  const makeAccessible = (el, index, datum) => {
    el.classList.add("auf-node");
    el.style.color = datum.color;
    el.setAttribute("tabindex", "0");
    el.setAttribute("role", "button");
    el.setAttribute("aria-label", datum.title);
    el.dataset.aufIndex = String(index);
    el.addEventListener("click", () => select(index));
    el.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        select(index);
      }
    });
  };

  const candidates = [];

  texts.forEach(textEl => {
    const label = (textEl.textContent || "").trim();
    let index = -1;

    if (/^M$/.test(label)) index = 0;
    else if (/^G$/.test(label)) index = 1;
    else if (/^A$/.test(label)) index = 2;
    else if (/^Ψ$/.test(label)) index = 3;
    else if (/^Λ$/.test(label)) index = 4;
    else if (/^Π$/.test(label)) index = 5;
    else if (/Discesa stretta/.test(label)) index = 6;
    else if (/Nessun minimo globale/.test(label)) index = 7;
    else if (/Minimo globale imposto/.test(label)) index = 8;
    else if (/INCOMPATIBILITÀ LOGICA/.test(label)) index = 9;
    else if (/NESSUN PRIMO ELEMENTO/.test(label)) index = 11;
    else if (/Ogni istante rappresentato/.test(label)) index = 10;

    if (index >= 0) {
      const parent = textEl.parentElement;
      candidates.push({ el: parent && parent.tagName.toLowerCase() === "g" ? parent : textEl, index });
    }
  });

  const unique = new Set();
  candidates.forEach(({ el, index }) => {
    if (unique.has(el)) return;
    unique.add(el);
    makeAccessible(el, index, info[index]);
  });

  const drawProgress = value => {
    state.progress = Math.max(0, Math.min(100, value));
    progressInput.value = String(state.progress);

    const activeCount = Math.ceil((state.progress / 100) * info.length);
    const activeIndices = new Set(
      Array.from({ length: activeCount }, (_, i) => i)
    );

    svg.querySelectorAll(".auf-node").forEach(node => {
      const i = Number(node.dataset.aufIndex);
      node.classList.toggle("auf-pulse", activeIndices.has(i));
      node.classList.toggle("auf-dimmed", !activeIndices.has(i));
    });

    status.textContent = `Sequenza · ${Math.round(state.progress)}%`;
  };

  function select(index) {
    const datum = info[index];
    if (!datum) return;

    state.selected = index;

    svg.querySelectorAll(".auf-node").forEach(node => {
      const selected = Number(node.dataset.aufIndex) === index;
      node.classList.toggle("auf-selected", selected);
      node.setAttribute("aria-pressed", String(selected));
    });

    panel.classList.add("open");
    panel.style.borderColor = datum.color;
    panel.innerHTML = "";

    const heading = document.createElement("h3");
    heading.textContent = datum.title;
    heading.style.color = datum.color;

    const paragraph = document.createElement("p");
    paragraph.textContent = datum.body;

    const formula = document.createElement("code");
    formula.className = "formula";
    formula.textContent = datum.formula;

    const close = document.createElement("button");
    close.type = "button";
    close.textContent = "Chiudi";
    close.style.cssText = `
      margin-top: 12px; padding: 7px 12px; cursor: pointer;
      color: #e6edff; background: #172640;
      border: 1px solid #435a7d; border-radius: 8px;
    `;
    close.addEventListener("click", () => panel.classList.remove("open"));

    panel.append(heading, paragraph, formula, close);
    status.textContent = `Selezionato · ${datum.title}`;
  }

  const animationNodes = Array.from(svg.querySelectorAll("path, line, polyline"))
    .filter(el => {
      const stroke = (el.getAttribute("stroke") || "").toLowerCase();
      return ["#38e6df", "#f6c96b", "#c084fc", "url(#cyan)", "url(#gold)"]
        .some(c => stroke.includes(c));
    });

  animationNodes.forEach(el => {
    el.classList.add("auf-flow");
  });

  const mainBoxes = Array.from(svg.querySelectorAll("rect")).filter(rect => {
    const width = Number(rect.getAttribute("width") || 0);
    const height = Number(rect.getAttribute("height") || 0);
    return width > 180 && height > 65;
  });

  mainBoxes.forEach((rect, i) => {
    rect.classList.add("auf-glow");
    rect.style.animationDelay = `${i * 0.17}s`;
  });

  controls.addEventListener("click", event => {
    const button = event.target.closest("[data-action]");
    if (!button) return;

    const action = button.dataset.action;

    if (action === "play") {
      state.playing = !state.playing;
      playButton.textContent = state.playing ? "Ⅱ Pausa" : "▶ Riprendi";
      status.textContent = state.playing ? "Animazione attiva" : "Animazione in pausa";
      svg.querySelectorAll(".auf-flow, .auf-pulse, .auf-glow").forEach(el => {
        el.style.animationPlayState = state.playing ? "running" : "paused";
      });
    }

    if (action === "restart") {
      state.playing = true;
      playButton.textContent = "Ⅱ Pausa";
      svg.querySelectorAll(".auf-flow, .auf-pulse, .auf-glow").forEach(el => {
        el.style.animation = "none";
        void el.getBoundingClientRect();
        el.style.animation = "";
        el.style.animationPlayState = "running";
      });
      drawProgress(0);
      status.textContent = "Sequenza riavviata";
    }

    if (action === "step") {
      drawProgress((state.progress + 100 / info.length) % 101);
      const next = Math.min(
        info.length - 1,
        Math.floor((state.progress / 100) * info.length)
      );
      select(next);
    }

    if (action === "focus") {
      state.playing = false;
      playButton.textContent = "▶ Riprendi";
      svg.querySelectorAll(".auf-node").forEach(node => {
        const index = Number(node.dataset.aufIndex);
        const inChain = [6, 7, 8, 9, 10, 11].includes(index);
        node.classList.toggle("auf-dimmed", !inChain);
        node.classList.toggle("auf-selected", inChain);
      });
      status.textContent = "Catena logica evidenziata";
    }

    if (action === "reset") {
      state.selected = null;
      state.playing = true;
      playButton.textContent = "Ⅱ Pausa";
      panel.classList.remove("open");
      svg.querySelectorAll(".auf-node").forEach(node => {
        node.classList.remove("auf-selected", "auf-dimmed", "auf-pulse");
        node.removeAttribute("aria-pressed");
      });
      svg.querySelectorAll(".auf-flow, .auf-pulse, .auf-glow").forEach(el => {
        el.style.animationPlayState = "running";
      });
      drawProgress(0);
      status.textContent = "Vista ripristinata";
    }
  });

  controls.querySelector('[data-action="speed"]').addEventListener("change", event => {
    state.speed = Number(event.target.value);
    svg.querySelectorAll(".auf-flow, .auf-pulse, .auf-glow").forEach(el => {
      el.style.animationDuration = `${2.5 / state.speed}s`;
    });
    status.textContent = `Velocità · ${state.speed}×`;
  });

  progressInput.addEventListener("input", event => {
    drawProgress(Number(event.target.value));
  });

  if (state.reducedMotion) {
    state.playing = false;
    svg.querySelectorAll(".auf-flow, .auf-pulse, .auf-glow").forEach(el => {
      el.style.animation = "none";
    });
    playButton.textContent = "▶ Avvia";
  }

  drawProgress(0);

  console.info("AUF2026 interattivo inizializzato.", {
    nodi: candidates.length,
    componenti: info.length
  });
})();
</script>
