<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>AOS KERNEL | Master Architect Console</title>
    <style>
        :root {
            --bg: #0a0a0c;
            --neon-blue: #00d2ff;
            --neon-gold: #ffaa00;
            --neon-red: #ff3c3c;
            --glass: rgba(20, 20, 25, 0.9);
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: #fff; 
            font-family: 'Inter', 'Segoe UI', monospace; overflow: hidden;
        }

        /* UI Console */
        #console-overlay {
            position: absolute; top: 25px; left: 25px; z-index: 100;
            width: 320px; background: var(--glass);
            border-left: 4px solid var(--neon-blue);
            padding: 25px; border-radius: 0 12px 12px 0;
            box-shadow: 20px 0 50px rgba(0,0,0,0.5);
            backdrop-filter: blur(15px);
        }

        h1 { font-size: 16px; margin: 0 0 5px 0; letter-spacing: 3px; color: var(--neon-blue); }
        .sub-title { font-size: 10px; margin-bottom: 25px; opacity: 0.6; text-transform: uppercase; }

        .control-block { margin-bottom: 20px; }
        label { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 8px; font-weight: 600; }
        .val-num { color: var(--neon-blue); }

        input[type="range"] {
            width: 100%; -webkit-appearance: none; background: #222;
            height: 4px; border-radius: 2px; outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 15px; height: 15px;
            background: var(--neon-blue); border-radius: 50%; cursor: pointer;
            box-shadow: 0 0 10px var(--neon-blue);
        }

        .status-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            margin-top: 25px; padding-top: 15px; border-top: 1px solid #333;
        }
        .stat { font-size: 9px; color: #888; }
        .stat b { display: block; color: #ddd; font-size: 11px; margin-top: 2px; }

        canvas { display: block; cursor: crosshair; }

        /* Signature Pulse */
        #signature {
            position: absolute; bottom: 30px; right: 40px;
            text-align: right; pointer-events: none;
        }
        .sig-name { font-size: 18px; font-weight: 900; letter-spacing: 2px; color: #fff; }
        .sig-rank { font-size: 10px; color: var(--neon-blue); letter-spacing: 1px; }
    </style>
</head>
<body>

<div id="console-overlay">
    <h1>AOS KERNEL v4.4</h1>
    <div class="sub-title">Audit Protocol AUF2026</div>

    <div class="control-block">
        <label>LAYER (Φ Faure) <span class="val-num" id="l-val">3.478</span></label>
        <input type="range" id="layerSlider" min="0.1" max="9" step="0.001" value="3.478">
    </div>

    <div class="control-block">
        <label>SYNC (π/φ Phase) <span class="val-num" id="s-val">1.00</span></label>
        <input type="range" id="syncSlider" min="0.5" max="5" step="0.01" value="1">
    </div>

    <div class="control-block">
        <label>RESONANCE (432Hz) <span class="val-num" id="r-val">1.50</span></label>
        <input type="range" id="resSlider" min="0.1" max="5" step="0.1" value="1.5">
    </div>

    <div class="status-grid">
        <div class="stat">STATUS<b>TIER 44 OP</b></div>
        <div class="stat">CLOCK<b>432.00 HZ</b></div>
        <div class="stat">TAU<b>1.000104</b></div>
        <div class="stat">GATE 137<b>LOCK ACTIVE</b></div>
    </div>
</div>

<div id="signature">
    <div class="sig-name">ALAIN FAURE</div>
    <div class="sig-rank">MASTER ARCHITECT | SINGLEPOINT MIND</div>
</div>

<canvas id="kernelCanvas"></canvas>

<script>
    const canvas = document.getElementById('kernelCanvas');
    const ctx = canvas.getContext('2d');
    
    let w, h;
    const N = 18000; 
    let t = 0;

    function init() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
    }

    // Generazione Flusso AOS Deterministico
    const seedData = Array.from({length: N}, (_, i) => ({
        p: (Math.sin(i * 0.13478) * 0.5 + 0.5) * 9,
        f: (Math.cos(i * 0.13478) * 0.5 + 0.5) * 9
    }));

    function draw() {
        ctx.fillStyle = 'rgba(10, 10, 12, 0.15)'; // Effetto scia (Motion Blur)
        ctx.fillRect(0, 0, w, h);

        const L = parseFloat(document.getElementById('layerSlider').value);
        const S = parseFloat(document.getElementById('syncSlider').value);
        const R = parseFloat(document.getElementById('resSlider').value);
        
        document.getElementById('l-val').innerText = L.toFixed(3);
        document.getElementById('s-val').innerText = S.toFixed(2);
        document.getElementById('r-val').innerText = R.toFixed(2);

        ctx.save();
        ctx.translate(w/2, h/2);

        seedData.forEach((node, i) => {
            const mod9 = (node.p * L + node.f * L) % 9;
            
            // Equazione della Sfera Faure 
            const angle = i * 0.05 + t * 0.002;
            const dist = (mod9 * 40 * S) + (Math.sin(t * 0.05 + i) * R * 10);
            
            const x = Math.cos(angle) * dist;
            const y = Math.sin(angle) * dist;

            // Colore basato sulla risonanza
            const alpha = 0.2 + (mod9 / 9) * 0.5;
            ctx.fillStyle = mod9 > 8.5 ? '#fff' : `rgba(0, 210, 255, ${alpha})`;
            
            if (i % 144 === 0) { // Nodi Primari 144
                ctx.fillStyle = '#ffaa00';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ffaa00';
                ctx.fillRect(x, y, 3, 3);
            } else {
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(x, y, 1, 0, Math.PI * 2);
                ctx.fill();
            }
        });

        // Gate 137 Central Pulse
        ctx.strokeStyle = 'rgba(0, 210, 255, 0.1)';
        ctx.beginPath();
        ctx.arc(0, 0, Math.abs(Math.sin(t*0.05)*100), 0, Math.PI*2);
        ctx.stroke();

        ctx.restore();
        t++;
        requestAnimationFrame(draw);
    }

    window.addEventListener('resize', init);
    init();
    draw();
</script>
</body>
</html>
