<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AUF2026 — Research Archive</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    /* =========================================================
       ARCHIVE DOCUMENT
       ========================================================= */

    .archive-page {
      width: min(900px, calc(100% - 40px));
      margin: 0 auto;
      padding: 70px 0 100px;
    }

    .archive-header {
      margin-bottom: 40px;
    }

    .archive-kicker {
      letter-spacing: .14em;
      text-transform: uppercase;
      font-size: .74rem;
      opacity: .58;
      margin-bottom: 12px;
    }

    .archive-header h1 {
      margin: 0 0 14px;
      line-height: 1.15;
    }

    .archive-subtitle {
      max-width: 760px;
      line-height: 1.75;
      opacity: .72;
    }

    .archive-document {
      padding: 40px;
      border: 1px solid rgba(127,127,127,.20);
      border-radius: 16px;
      background: rgba(127,127,127,.035);
    }

    .archive-document h1,
    .archive-document h2,
    .archive-document h3,
    .archive-document h4 {
      line-height: 1.25;
    }

    .archive-document h1 {
      margin-top: 0;
      font-size: 2rem;
    }

    .archive-document h2 {
      margin-top: 2.5rem;
      padding-bottom: .6rem;
      border-bottom: 1px solid rgba(127,127,127,.15);
    }

    .archive-document h3 {
      margin-top: 2rem;
    }

    .archive-document p,
    .archive-document li {
      line-height: 1.75;
    }

    .archive-document table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      overflow: hidden;
    }

    .archive-document th,
    .archive-document td {
      padding: .75rem;
      border: 1px solid rgba(127,127,127,.20);
      text-align: left;
      vertical-align: top;
    }

    .archive-document th {
      background: rgba(127,127,127,.08);
    }

    .archive-document pre {
      padding: 1.2rem;
      overflow-x: auto;
      border-radius: 10px;
      background: rgba(0,0,0,.20);
      border: 1px solid rgba(127,127,127,.15);
    }

    .archive-document code {
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;
    }

    .archive-document blockquote {
      margin: 1.5rem 0;
      padding: .8rem 1.2rem;
      border-left: 3px solid currentColor;
      background: rgba(127,127,127,.06);
      opacity: .85;
    }

    .archive-document a {
      color: inherit;
    }

    .archive-document hr {
      border: 0;
      border-top: 1px solid rgba(127,127,127,.18);
      margin: 2rem 0;
    }

    .archive-status {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 20px;
      padding: .8rem 1rem;
      border: 1px solid rgba(127,127,127,.18);
      border-radius: 10px;
      font-size: .8rem;
      opacity: .7;
    }

    .archive-error {
      padding: 1.5rem;
      border: 1px solid rgba(220,80,80,.30);
      border-radius: 12px;
      background: rgba(220,80,80,.06);
    }

    @media (max-width: 760px) {

      .archive-page {
        width: min(100% - 24px, 900px);
        padding-top: 40px;
      }

      .archive-document {
        padding: 22px;
      }

      .archive-document table {
        display: block;
        overflow-x: auto;
      }

      .archive-status {
        flex-direction: column;
      }

    }

  </style>

</head>


<body>


  <!-- =========================================================
       ARCHIVE PAGE
       ========================================================= -->

  <main class="archive-page">


    <header class="archive-header">

      <div class="archive-kicker">
        AUF2026 · Research Archive
      </div>

      <h1 id="document-title">
        Research Document
      </h1>

      <p class="archive-subtitle">
        Canonical research documentation rendered from the
        AUF2026 Markdown corpus.
      </p>

    </header>


    <div class="archive-status">

      <span>
        SOURCE:
        <strong id="document-source">
          loading...
        </strong>
      </span>

      <span>
        FORMAT:
        Markdown → HTML
      </span>

    </div>


    <article
      id="document"
      class="archive-document"
    >

      Loading document...

    </article>


  </main>


  <!-- =========================================================
       MARKDOWN RENDERER
       ========================================================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
  ></script>


  <!-- =========================================================
       ARCHIVE LOADER
       ========================================================= -->

  <script>

    /*
     * Read document from URL.
     *
     * Example:
     *
     * archive.html?doc=THEOREM-ORIGINALITY-MATRIX.md
     */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const requestedDocument =
      params.get("doc");


    const documentElement =
      document.getElementById(
        "document"
      );


    const titleElement =
      document.getElementById(
        "document-title"
      );


    const sourceElement =
      document.getElementById(
        "document-source"
      );


    /*
     * Allowed Markdown documents.
     *
     * This prevents arbitrary paths from being loaded.
     */

    const allowedDocuments = [

      "ARCHIVE-MAP.md",
      "AUTHOR-IDENTITY.md",
      "BIBLIOGRAPHIC-NOVELTY-MATRIX.md",
      "CLAIMS.md",
      "CONFIGURATION-MATRIX.md",
      "CORE-GENEALOGY.md",
      "CORPUS-INDEX.md",
      "EXTRACTION-STATUS.md",
      "LOCAL-CORPUS-MAP.md",
      "LOCAL-CORPUS-ROOTS.md",
      "NEXT-SESSION.md",
      "OBJECT-REGISTRY.md",
      "PROOF-INGESTION-PROTOCOL.md",
      "PROOF-REGISTRY.md",
      "README.md",
      "REPOSITORY-MAP.md",
      "RESEARCH-REGISTER.md",
      "SOURCE-INVENTORY.md",
      "SOURCE-MANIFEST.md",
      "THEOREM-ORIGINALITY-MATRIX.md"

    ];


    function humanTitle(
      filename
    ) {

      return filename

        .replace(
          /\.md$/i,
          ""
        )

        .replace(
          /[-_]+/g,
          " "
        )

        .replace(
          /\b\w/g,
          character =>
            character.toUpperCase()
        );

    }


    async function loadDocument() {

      if (
        !requestedDocument ||
        !allowedDocuments.includes(
          requestedDocument
        )
      ) {

        documentElement.innerHTML = `

          <div class="archive-error">

            <strong>
              Document not specified.
            </strong>

            <p>
              Select a document from the AUF2026
              research archive.
            </p>

          </div>

        `;

        return;

      }


      const sourcePath =
        "docs/" +
        requestedDocument;


      titleElement.textContent =
        humanTitle(
          requestedDocument
        );


      sourceElement.textContent =
        sourcePath;


      try {

        const response =
          await fetch(
            sourcePath
          );


        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }


        const markdown =
          await response.text();


        /*
         * Configure Markdown rendering.
         */

        marked.setOptions({

          gfm: true,

          breaks: true

        });


        documentElement.innerHTML =
          marked.parse(
            markdown
          );


        /*
         * Rewrite relative Markdown links.
         *
         * Example:
         *
         * AUTHOR-IDENTITY.md
         *
         * becomes:
         *
         * archive.html?doc=AUTHOR-IDENTITY.md
         */

        documentElement
          .querySelectorAll(
            "a"
          )
          .forEach(
            link => {

              const href =
                link.getAttribute(
                  "href"
                );


              if (
                href &&
                href.endsWith(".md") &&
                !href.startsWith("http")
              ) {

                link.href =
                  "archive.html?doc=" +
                  encodeURIComponent(
                    href
                  );

              }

            }
          );


        /*
         * Update browser title.
         */

        document.title =
          "AUF2026 — " +
          humanTitle(
            requestedDocument
          );


      } catch (
        error
      ) {

        documentElement.innerHTML = `

          <div class="archive-error">

            <strong>
              Unable to load document.
            </strong>

            <p>
              ${error.message}
            </p>

          </div>

        `;

      }

    }


    loadDocument();

  </script>


</body>

</html>
