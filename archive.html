<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AUF2026 — Research Archive</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    /* =========================================================
       AUF2026 ARCHIVE
       Uses the same visual language as index.html
       ========================================================= */

    .archive-page {

      width:
        min(
          var(--max),
          calc(100% - 40px)
        );

      margin:
        0 auto;

      padding:
        55px 0 90px;

    }


    /* =========================================================
       ARCHIVE HEADER
       ========================================================= */

    .archive-header {

      margin-bottom:
        35px;

    }


    .archive-top {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        20px;

      margin-bottom:
        38px;

    }


    .archive-brand {

      font-weight:
        900;

      letter-spacing:
        .14em;

      font-size:
        1.05rem;

      text-decoration:
        none;

      color:
        var(--text);

    }


    .archive-brand span {

      color:
        var(--green);

    }


    /* =========================================================
       BACK BUTTON
       ========================================================= */

    .archive-back {

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      gap:
        9px;

      padding:
        10px 15px;

      border:
        1px solid var(--border);

      border-radius:
        9px;

      background:
        var(--panel);

      color:
        var(--text);

      font:
        inherit;

      font-size:
        .82rem;

      font-weight:
        750;

      letter-spacing:
        .05em;

      cursor:
        pointer;

      transition:
        transform .2s ease,
        border-color .2s ease,
        background .2s ease;

    }


    .archive-back:hover {

      transform:
        translateY(-2px);

      border-color:
        rgba(99,230,190,.45);

      background:
        var(--panel2);

    }


    .archive-back-arrow {

      color:
        var(--green);

      font-size:
        1rem;

    }


    /* =========================================================
       EYEBROW
       ========================================================= */

    .archive-eyebrow {

      color:
        var(--green);

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

      font-size:
        .75rem;

      font-weight:
        800;

      letter-spacing:
        .18em;

      text-transform:
        uppercase;

    }


    /* =========================================================
       DOCUMENT TITLE
       ========================================================= */

    .archive-header h1 {

      max-width:
        1050px;

      margin-top:
        18px;

      font-size:
        clamp(
          2.6rem,
          6vw,
          5rem
        );

      line-height:
        .95;

      letter-spacing:
        -.055em;

    }


    .archive-description {

      max-width:
        820px;

      margin-top:
        25px;

      color:
        var(--muted);

      font-size:
        1.02rem;

      line-height:
        1.7;

    }


    /* =========================================================
       SOURCE BAR
       ========================================================= */

    .archive-meta {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        20px;

      margin-bottom:
        18px;

      padding:
        13px 17px;

      border:
        1px solid var(--border);

      border-radius:
        10px;

      background:
        rgba(255,255,255,.025);

      color:
        var(--muted);

      font-size:
        .76rem;

    }


    .archive-meta strong {

      color:
        var(--text);

      font-weight:
        700;

    }


    .archive-format {

      color:
        var(--green);

      font-family:
        ui-monospace,
        monospace;

    }


    /* =========================================================
       DOCUMENT
       ========================================================= */

    .archive-document {

      padding:
        clamp(
          25px,
          5vw,
          48px
        );

      background:
        linear-gradient(
          145deg,
          var(--panel),
          rgba(18,25,35,.72)
        );

      border:
        1px solid var(--border);

      border-radius:
        15px;

      box-shadow:
        var(--shadow);

    }


    /* =========================================================
       MARKDOWN TYPOGRAPHY
       ========================================================= */

    .archive-document h1,
    .archive-document h2,
    .archive-document h3,
    .archive-document h4,
    .archive-document h5,
    .archive-document h6 {

      color:
        var(--text);

      line-height:
        1.2;

      letter-spacing:
        -.025em;

    }


    .archive-document h1 {

      margin:
        0 0 25px;

      font-size:
        2.2rem;

    }


    .archive-document h2 {

      margin:
        48px 0 20px;

      padding-bottom:
        10px;

      border-bottom:
        1px solid var(--border);

      font-size:
        1.55rem;

    }


    .archive-document h3 {

      margin:
        32px 0 14px;

      font-size:
        1.2rem;

    }


    .archive-document h4 {

      margin:
        25px 0 12px;

      font-size:
        1rem;

    }


    .archive-document p {

      margin:
        0 0 17px;

      color:
        var(--text);

      line-height:
        1.78;

    }


    .archive-document li {

      color:
        var(--text);

      line-height:
        1.7;

      margin-bottom:
        7px;

    }


    .archive-document ul,
    .archive-document ol {

      margin:
        0 0 22px;

      padding-left:
        25px;

    }


    /* =========================================================
       LINKS
       ========================================================= */

    .archive-document a {

      color:
        var(--green);

      text-decoration:
        none;

      border-bottom:
        1px solid rgba(99,230,190,.25);

      transition:
        color .2s ease,
        border-color .2s ease;

    }


    .archive-document a:hover {

      color:
        var(--blue);

      border-color:
        rgba(110,168,255,.45);

    }


    /* =========================================================
       INLINE CODE
       ========================================================= */

    .archive-document code {

      color:
        var(--green);

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

      font-size:
        .88em;

    }


    .archive-document :not(pre) > code {

      padding:
        3px 6px;

      border-radius:
        6px;

      background:
        #070a0f;

      border:
        1px solid var(--border);

    }


    /* =========================================================
       CODE BLOCK
       ========================================================= */

    .archive-document pre {

      margin:
        25px 0;

      padding:
        20px;

      overflow-x:
        auto;

      background:
        #05070a;

      border:
        1px solid var(--border);

      border-radius:
        12px;

      color:
        var(--green);

      line-height:
        1.6;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.02);

    }


    .archive-document pre code {

      color:
        var(--green);

      font-size:
        .84rem;

    }


    /* =========================================================
       TABLES
       ========================================================= */

    .archive-table-wrapper {

      width:
        100%;

      overflow-x:
        auto;

      margin:
        25px 0;

      border:
        1px solid var(--border);

      border-radius:
        12px;

    }


    .archive-document table {

      width:
        100%;

      min-width:
        650px;

      border-collapse:
        collapse;

      background:
        rgba(255,255,255,.015);

    }


    .archive-document th {

      color:
        var(--text);

      background:
        var(--panel2);

      font-weight:
        800;

    }


    .archive-document th,
    .archive-document td {

      padding:
        11px 13px;

      border:
        1px solid var(--border);

      text-align:
        left;

      vertical-align:
        top;

      line-height:
        1.5;

    }


    .archive-document td {

      color:
        var(--muted);

    }


    .archive-document tr:hover td {

      background:
        rgba(99,230,190,.025);

    }


    /* =========================================================
       BLOCKQUOTE
       ========================================================= */

    .archive-document blockquote {

      margin:
        25px 0;

      padding:
        18px 22px;

      border-left:
        3px solid var(--green);

      border-radius:
        0 10px 10px 0;

      background:
        rgba(99,230,190,.035);

    }


    .archive-document blockquote p {

      color:
        var(--muted);

    }


    /* =========================================================
       HORIZONTAL RULE
       ========================================================= */

    .archive-document hr {

      height:
        1px;

      margin:
        35px 0;

      border:
        0;

      background:
        var(--border);

    }


    /* =========================================================
       IMAGES
       ========================================================= */

    .archive-document img {

      display:
        block;

      max-width:
        100%;

      height:
        auto;

      margin:
        25px auto;

      border:
        1px solid var(--border);

      border-radius:
        12px;

    }


    /* =========================================================
       LOADING
       ========================================================= */

    .archive-loading {

      padding:
        60px 20px;

      color:
        var(--muted);

      text-align:
        center;

      font-family:
        ui-monospace,
        monospace;

      font-size:
        .85rem;

    }


    /* =========================================================
       ERROR
       ========================================================= */

    .archive-error {

      padding:
        25px;

      border:
        1px solid rgba(255,123,123,.25);

      border-radius:
        12px;

      background:
        rgba(255,123,123,.045);

    }


    .archive-error strong {

      display:
        block;

      margin-bottom:
        10px;

      color:
        var(--red);

    }


    .archive-error p {

      color:
        var(--muted);

    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 900px) {

      .archive-page {

        width:
          min(
            100% - 28px,
            var(--max)
          );

      }


      .archive-header h1 {

        font-size:
          clamp(
            2.3rem,
            9vw,
            4rem
          );

      }


      .archive-meta {

        align-items:
          flex-start;

        flex-direction:
          column;

        gap:
          7px;

      }

    }


    @media (max-width: 600px) {

      .archive-page {

        padding-top:
          30px;

      }


      .archive-top {

        margin-bottom:
          30px;

      }


      .archive-brand {

        font-size:
          .9rem;

      }


      .archive-back {

        padding:
          9px 12px;

      }


      .archive-document {

        padding:
          24px 18px;

        border-radius:
          12px;

      }


      .archive-document h2 {

        margin-top:
          38px;

        font-size:
          1.35rem;

      }

    }

  </style>

</head>


<body>


  <!-- =========================================================
       ARCHIVE PAGE
       ========================================================= -->

  <main class="archive-page">


    <!-- =======================================================
         TOP BAR
         ======================================================= -->

    <div class="archive-top">

      <a
        href="index.html#archive"
        class="archive-brand"
      >
        <span>AUF</span>2026
      </a>


      <button
        type="button"
        class="archive-back"
        id="archiveBack"
      >

        <span class="archive-back-arrow">
          ←
        </span>

        BACK

      </button>

    </div>


    <!-- =======================================================
         HEADER
         ======================================================= -->

    <header class="archive-header">

      <div class="archive-eyebrow">
        RESEARCH ARCHIVE
      </div>


      <h1 id="document-title">
        Research Document
      </h1>


      <p class="archive-description">
        Canonical research documentation rendered from the
        AUF2026 Markdown corpus.
      </p>

    </header>


    <!-- =======================================================
         DOCUMENT META
         ======================================================= -->

    <div class="archive-meta">

      <span>

        SOURCE:

        <strong id="document-source">
          loading...
        </strong>

      </span>


      <span class="archive-format">
        MARKDOWN → HTML
      </span>

    </div>


    <!-- =======================================================
         DOCUMENT CONTENT
         ======================================================= -->

    <article
      id="document"
      class="archive-document"
    >

      <div class="archive-loading">
        Loading document...
      </div>

    </article>


  </main>


  <!-- =========================================================
       MARKED
       ========================================================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
  ></script>


  <!-- =========================================================
       ARCHIVE LOADER
       ========================================================= -->

  <script>

    /* =========================================================
       URL
       ========================================================= */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const requestedDocument =
      params.get("doc");


    /* =========================================================
       ELEMENTS
       ========================================================= */

    const documentElement =
      document.getElementById(
        "document"
      );


    const titleElement =
      document.getElementById(
        "document-title"
      );


    const sourceElement =
      document.getElementById(
        "document-source"
      );


    /* =========================================================
       ALLOWED DOCUMENTS
       ========================================================= */

    const allowedDocuments = [

      "ARCHIVE-MAP.md",
      "AUTHOR-IDENTITY.md",
      "BIBLIOGRAPHIC-NOVELTY-MATRIX.md",
      "CLAIMS.md",
      "CONFIGURATION-MATRIX.md",
      "CORE-GENEALOGY.md",
      "CORPUS-INDEX.md",
      "EXTRACTION-STATUS.md",
      "LOCAL-CORPUS-MAP.md",
      "LOCAL-CORPUS-ROOTS.md",
      "NEXT-SESSION.md",
      "OBJECT-REGISTRY.md",
      "PROOF-INGESTION-PROTOCOL.md",
      "PROOF-REGISTRY.md",
      "README.md",
      "REPOSITORY-MAP.md",
      "RESEARCH-REGISTER.md",
      "SOURCE-INVENTORY.md",
      "SOURCE-MANIFEST.md",
      "THEOREM-ORIGINALITY-MATRIX.md"

    ];


    /* =========================================================
       HUMAN TITLE
       ========================================================= */

    function humanTitle(
      filename
    ) {

      return filename

        .replace(
          /\.md$/i,
          ""
        )

        .replace(
          /[-_]+/g,
          " "
        )

        .replace(
          /\b\w/g,
          character =>
            character.toUpperCase()
        );

    }


    /* =========================================================
       BACK BUTTON
       ========================================================= */

    document
      .getElementById(
        "archiveBack"
      )
      .addEventListener(
        "click",
        function () {

          /*
           * If the archive document was opened from another
           * archive page, return exactly to that page.
           */

          if (
            window.history.length > 1
          ) {

            window.history.back();

            return;

          }


          /*
           * Fallback for direct access.
           */

          window.location.href =
            "index.html#archive";

        }
      );


    /* =========================================================
       NORMALIZE MARKDOWN LINKS
       ========================================================= */

    function normalizeMarkdownLinks() {

      documentElement
        .querySelectorAll("a")
        .forEach(
          function (link) {

            const href =
              link.getAttribute(
                "href"
              );


            if (!href) {

              return;

            }


            /*
             * External links remain untouched.
             */

            if (
              href.startsWith("http://") ||
              href.startsWith("https://") ||
              href.startsWith("mailto:") ||
              href.startsWith("#")
            ) {

              return;

            }


            /*
             * Convert internal Markdown links
             * into archive.html?doc=...
             */

            if (
              href
                .toLowerCase()
                .endsWith(".md")
            ) {

              const filename =
                href
                  .split("/")
                  .pop();


              if (
                allowedDocuments.includes(
                  filename
                )
              ) {

                link.href =
                  "archive.html?doc=" +
                  encodeURIComponent(
                    filename
                  );

              }

            }

          }
        );

    }


    /* =========================================================
       TABLE WRAPPER
       ========================================================= */

    function wrapTables() {

      documentElement
        .querySelectorAll("table")
        .forEach(
          function (table) {

            if (
              table.parentElement &&
              table.parentElement.classList.contains(
                "archive-table-wrapper"
              )
            ) {

              return;

            }


            const wrapper =
              document.createElement(
                "div"
              );


            wrapper.className =
              "archive-table-wrapper";


            table.parentNode.insertBefore(
              wrapper,
              table
            );


            wrapper.appendChild(
              table
            );

          }
        );

    }


    /* =========================================================
       LOAD DOCUMENT
       ========================================================= */

    async function loadDocument() {

      if (
        !requestedDocument ||
        !allowedDocuments.includes(
          requestedDocument
        )
      ) {

        sourceElement.textContent =
          "not specified";


        documentElement.innerHTML = `

          <div class="archive-error">

            <strong>
              Document not specified.
            </strong>

            <p>
              Select a document from the AUF2026
              research archive.
            </p>

          </div>

        `;

        return;

      }


      const sourcePath =
        "docs/" +
        requestedDocument;


      titleElement.textContent =
        humanTitle(
          requestedDocument
        );


      sourceElement.textContent =
        sourcePath;


      try {

        const response =
          await fetch(
            sourcePath
          );


        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }


        const markdown =
          await response.text();


        /* =====================================================
           MARKED CONFIGURATION
           ===================================================== */

        marked.setOptions({

          gfm:
            true,

          breaks:
            true

        });


        /* =====================================================
           MARKDOWN → HTML
           ===================================================== */

        documentElement.innerHTML =
          marked.parse(
            markdown
          );


        /* =====================================================
           POST PROCESSING
           ===================================================== */

        normalizeMarkdownLinks();

        wrapTables();


        /* =====================================================
           DOCUMENT TITLE
           ===================================================== */

        document.title =
          "AUF2026 — " +
          humanTitle(
            requestedDocument
          );

      }


      catch (error) {

        console.error(
          "AUF2026 Archive:",
          error
        );


        documentElement.innerHTML = `

          <div class="archive-error">

            <strong>
              Unable to load document.
            </strong>

            <p>
              ${error.message}
            </p>

          </div>

        `;

      }

    }


    /* =========================================================
       START
       ========================================================= */

    loadDocument();

  </script>


</body>

</html>
