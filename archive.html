<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AUF2026 — Research Archive</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script>
    /*
     * Apply the saved theme before the page is painted.
     * This prevents a white/light flash when dark mode is saved.
     */

    (function () {

      const key = "auf2026-theme";

      let theme =
        localStorage.getItem(key);

      if (
        theme !== "dark" &&
        theme !== "light"
      ) {

        theme =
          window.matchMedia &&
          window.matchMedia(
            "(prefers-color-scheme: light)"
          ).matches
            ? "light"
            : "dark";

      }

      document.documentElement.setAttribute(
        "data-theme",
        theme
      );

    })();
  </script>


  <style>

    /* =========================================================
       AUF2026 ARCHIVE
       ========================================================= */

    :root {

      --archive-bg: #070a0f;
      --archive-bg2: #0d121a;

      --archive-panel: #121923;
      --archive-panel2: #18212d;

      --archive-text: #f2f6fb;
      --archive-muted: #9ba8b7;

      --archive-green: #63e6be;
      --archive-blue: #6ea8ff;
      --archive-gold: #e6c76a;
      --archive-red: #ff7b7b;

      --archive-border:
        rgba(255,255,255,.10);

      --archive-border-soft:
        rgba(255,255,255,.075);

      --archive-shadow:
        0 20px 60px rgba(0,0,0,.35);

      --archive-code:
        #05070a;

      --archive-radius:
        15px;

    }


    /* =========================================================
       LIGHT THEME
       ========================================================= */

    html[data-theme="light"] {

      --archive-bg: #f4f6f8;
      --archive-bg2: #e9edf2;

      --archive-panel: #ffffff;
      --archive-panel2: #f1f4f7;

      --archive-text: #111820;
      --archive-muted: #5f6b78;

      --archive-green: #087f65;
      --archive-blue: #2868c7;
      --archive-gold: #9a7610;
      --archive-red: #c43f3f;

      --archive-border:
        rgba(17,24,32,.12);

      --archive-border-soft:
        rgba(17,24,32,.085);

      --archive-shadow:
        0 20px 60px rgba(15,23,42,.10);

      --archive-code:
        #e7ebef;

    }


    /* =========================================================
       GLOBAL THEME
       ========================================================= */

    html,
    body {

      margin: 0;
      padding: 0;

      min-height: 100%;

      background:
        var(--archive-bg);

      color:
        var(--archive-text);

    }


    html {

      color-scheme:
        dark;

      transition:
        background .25s ease,
        color .25s ease;

    }


    html[data-theme="light"] {

      color-scheme:
        light;

    }


    body {

      min-height:
        100vh;

      background:

        radial-gradient(
          circle at 80% 10%,
          color-mix(
            in srgb,
            var(--archive-blue) 10%,
            transparent
          ),
          transparent 35%
        ),

        radial-gradient(
          circle at 10% 40%,
          color-mix(
            in srgb,
            var(--archive-green) 6%,
            transparent
          ),
          transparent 30%
        ),

        var(--archive-bg);

      color:
        var(--archive-text);

      font:
        inherit;

      transition:

        background .25s ease,

        color .25s ease;

    }


    *,
    *::before,
    *::after {

      box-sizing:
        border-box;

    }


    /* =========================================================
       ARCHIVE PAGE
       ========================================================= */

    .archive-page {

      width:
        min(
          940px,
          calc(100% - 32px)
        );

      margin:
        0 auto;

      padding:
        42px 0 90px;

    }


    /* =========================================================
       TOP NAVIGATION
       ========================================================= */

    .archive-topbar {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        16px;

      margin-bottom:
        32px;

    }


    .archive-top-actions {

      display:
        flex;

      align-items:
        center;

      gap:
        9px;

    }


    /* =========================================================
       BACK BUTTON
       ========================================================= */

    .archive-back {

      display:
        inline-flex;

      align-items:
        center;

      gap:
        9px;

      appearance:
        none;

      border:
        1px solid
        var(--archive-border);

      border-radius:
        9px;

      padding:
        9px 15px;

      background:
        color-mix(
          in srgb,
          var(--archive-panel) 88%,
          transparent
        );

      color:
        var(--archive-text);

      font:
        inherit;

      font-size:
        .78rem;

      font-weight:
        650;

      letter-spacing:
        .08em;

      text-transform:
        uppercase;

      cursor:
        pointer;

      transition:

        background .2s ease,

        border-color .2s ease,

        color .2s ease,

        transform .2s ease;

    }


    .archive-back:hover {

      background:
        color-mix(
          in srgb,
          var(--archive-green) 8%,
          var(--archive-panel)
        );

      border-color:
        color-mix(
          in srgb,
          var(--archive-green) 38%,
          var(--archive-border)
        );

      transform:
        translateX(-2px);

    }


    .archive-back:active {

      transform:
        translateX(-1px);

    }


    .archive-back-arrow {

      font-size:
        1rem;

      line-height:
        1;

      opacity:
        .82;

    }


    /* =========================================================
       THEME TOGGLE
       ========================================================= */

    .archive-theme-toggle {

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      gap:
        8px;

      appearance:
        none;

      border:
        1px solid
        var(--archive-border);

      border-radius:
        9px;

      padding:
        9px 13px;

      min-height:
        36px;

      background:
        color-mix(
          in srgb,
          var(--archive-panel) 88%,
          transparent
        );

      color:
        var(--archive-text);

      font:
        inherit;

      font-size:
        .72rem;

      font-weight:
        650;

      letter-spacing:
        .08em;

      text-transform:
        uppercase;

      cursor:
        pointer;

      transition:

        background .2s ease,

        border-color .2s ease,

        color .2s ease,

        transform .2s ease;

    }


    .archive-theme-toggle:hover {

      background:
        color-mix(
          in srgb,
          var(--archive-blue) 8%,
          var(--archive-panel)
        );

      border-color:
        color-mix(
          in srgb,
          var(--archive-blue) 35%,
          var(--archive-border)
        );

      transform:
        translateY(-1px);

    }


    .archive-theme-icon {

      width:
        15px;

      height:
        15px;

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      font-size:
        .85rem;

      line-height:
        1;

    }


    .archive-theme-label {

      min-width:
        40px;

      text-align:
        left;

    }


    /* =========================================================
       TOP LABEL
       ========================================================= */

    .archive-top-label {

      font-size:
        .72rem;

      letter-spacing:
        .13em;

      text-transform:
        uppercase;

      color:
        var(--archive-muted);

      opacity:
        .62;

    }


    /* =========================================================
       HEADER
       ========================================================= */

    .archive-header {

      margin-bottom:
        30px;

    }


    .archive-kicker {

      margin-bottom:
        10px;

      font-size:
        .72rem;

      font-weight:
        650;

      letter-spacing:
        .16em;

      text-transform:
        uppercase;

      color:
        var(--archive-green);

      opacity:
        .78;

    }


    .archive-header h1 {

      margin:
        0 0 12px;

      color:
        var(--archive-text);

      line-height:
        1.12;

      letter-spacing:
        -.025em;

    }


    .archive-subtitle {

      max-width:
        760px;

      margin:
        0;

      line-height:
        1.7;

      font-size:
        .95rem;

      color:
        var(--archive-muted);

      opacity:
        .90;

    }


    /* =========================================================
       DOCUMENT STATUS
       ========================================================= */

    .archive-status {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        20px;

      margin-bottom:
        14px;

      padding:
        11px 14px;

      border:
        1px solid
        var(--archive-border-soft);

      border-radius:
        10px;

      background:
        color-mix(
          in srgb,
          var(--archive-panel) 72%,
          transparent
        );

      font-size:
        .72rem;

      line-height:
        1.4;

      color:
        var(--archive-muted);

      transition:

        background .25s ease,

        border-color .25s ease,

        color .25s ease;

    }


    .archive-status strong {

      color:
        var(--archive-text);

      font-weight:
        650;

    }


    /* =========================================================
       DOCUMENT CONTAINER
       ========================================================= */

    .archive-document {

      padding:
        42px 46px;

      border:
        1px solid
        var(--archive-border-soft);

      border-radius:
        16px;

      background:

        linear-gradient(
          145deg,

          color-mix(
            in srgb,
            var(--archive-panel) 94%,
            transparent
          ),

          color-mix(
            in srgb,
            var(--archive-panel2) 76%,
            transparent
          )
        );

      box-shadow:
        var(--archive-shadow);

      color:
        var(--archive-text);

      overflow-wrap:
        anywhere;

      transition:

        background .25s ease,

        border-color .25s ease,

        color .25s ease,

        box-shadow .25s ease;

    }


    /* =========================================================
       MARKDOWN TYPOGRAPHY
       ========================================================= */

    .archive-document h1,
    .archive-document h2,
    .archive-document h3,
    .archive-document h4,
    .archive-document h5,
    .archive-document h6 {

      color:
        var(--archive-text);

      line-height:
        1.25;

      letter-spacing:
        -.015em;

    }


    .archive-document h1 {

      margin-top:
        0;

      margin-bottom:
        1.2rem;

      font-size:
        2rem;

    }


    .archive-document h2 {

      margin-top:
        2.8rem;

      margin-bottom:
        1rem;

      padding-bottom:
        .65rem;

      font-size:
        1.45rem;

      border-bottom:
        1px solid
        var(--archive-border);

    }


    .archive-document h3 {

      margin-top:
        2rem;

      margin-bottom:
        .8rem;

      font-size:
        1.15rem;

    }


    .archive-document h4 {

      margin-top:
        1.6rem;

    }


    .archive-document h5,
    .archive-document h6 {

      margin-top:
        1.4rem;

    }


    .archive-document p {

      margin:
        0 0 1.05rem;

      line-height:
        1.78;

      color:
        var(--archive-text);

    }


    .archive-document ul,
    .archive-document ol {

      margin:
        0 0 1.2rem;

      padding-left:
        1.5rem;

    }


    .archive-document li {

      margin-bottom:
        .4rem;

      line-height:
        1.7;

      color:
        var(--archive-text);

    }


    /* =========================================================
       STRONG / EMPHASIS
       ========================================================= */

    .archive-document strong {

      color:
        var(--archive-text);

      font-weight:
        700;

    }


    .archive-document em {

      color:
        var(--archive-text);

    }


    /* =========================================================
       LINKS
       ========================================================= */

    .archive-document a {

      color:
        var(--archive-green);

      text-decoration:
        underline;

      text-decoration-color:
        color-mix(
          in srgb,
          var(--archive-green) 38%,
          transparent
        );

      text-underline-offset:
        3px;

      transition:

        color .2s ease,

        text-decoration-color .2s ease,

        opacity .2s ease;

    }


    .archive-document a:hover {

      color:
        var(--archive-blue);

      text-decoration-color:
        currentColor;

      opacity:
        .9;

    }


    /* =========================================================
       TABLES
       ========================================================= */

    .archive-table-wrap {

      width:
        100%;

      overflow-x:
        auto;

      margin:
        1.5rem 0;

      border:
        1px solid
        var(--archive-border-soft);

      border-radius:
        10px;

      background:
        var(--archive-panel);

    }


    .archive-document table {

      width:
        100%;

      min-width:
        620px;

      margin:
        0;

      border-collapse:
        collapse;

      background:
        color-mix(
          in srgb,
          var(--archive-bg) 30%,
          transparent
        );

    }


    .archive-document th,
    .archive-document td {

      padding:
        .72rem .8rem;

      border:
        1px solid
        var(--archive-border-soft);

      text-align:
        left;

      vertical-align:
        top;

      line-height:
        1.55;

      color:
        var(--archive-text);

    }


    .archive-document th {

      background:
        color-mix(
          in srgb,
          var(--archive-blue) 7%,
          var(--archive-panel)
        );

      font-weight:
        650;

    }


    .archive-document tr:nth-child(even) td {

      background:
        color-mix(
          in srgb,
          var(--archive-text) 2%,
          transparent
        );

    }


    /* =========================================================
       CODE
       ========================================================= */

    .archive-document code {

      font-family:

        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        monospace;

      font-size:
        .88em;

      color:
        var(--archive-green);

    }


    .archive-document :not(pre) > code {

      padding:
        .15em .38em;

      border-radius:
        5px;

      background:
        color-mix(
          in srgb,
          var(--archive-code) 88%,
          transparent
        );

      border:
        1px solid
        var(--archive-border-soft);

    }


    .archive-document pre {

      margin:
        1.5rem 0;

      padding:
        1.2rem 1.3rem;

      overflow-x:
        auto;

      border:
        1px solid
        var(--archive-border-soft);

      border-radius:
        10px;

      background:
        var(--archive-code);

      box-shadow:
        inset
        0 1px 0
        color-mix(
          in srgb,
          var(--archive-text) 3%,
          transparent
        );

      line-height:
        1.6;

    }


    .archive-document pre code {

      padding:
        0;

      background:
        transparent;

      border:
        0;

      color:
        var(--archive-green);

      font-size:
        .84rem;

    }


    /* =========================================================
       BLOCKQUOTE
       ========================================================= */

    .archive-document blockquote {

      margin:
        1.5rem 0;

      padding:
        .9rem 1.2rem;

      border-left:
        3px solid
        var(--archive-blue);

      border-radius:
        0 8px 8px 0;

      background:
        color-mix(
          in srgb,
          var(--archive-blue) 5%,
          transparent
        );

      color:
        var(--archive-muted);

    }


    .archive-document blockquote p {

      color:
        inherit;

    }


    .archive-document blockquote p:last-child {

      margin-bottom:
        0;

    }


    /* =========================================================
       HORIZONTAL RULE
       ========================================================= */

    .archive-document hr {

      height:
        1px;

      margin:
        2.2rem 0;

      border:
        0;

      background:
        var(--archive-border);

    }


    /* =========================================================
       IMAGES
       ========================================================= */

    .archive-document img {

      display:
        block;

      max-width:
        100%;

      height:
        auto;

      margin:
        1.5rem auto;

      border-radius:
        10px;

      border:
        1px solid
        var(--archive-border-soft);

      background:
        var(--archive-panel);

    }


    /* =========================================================
       CHECKBOXES
       ========================================================= */

    .archive-document input[type="checkbox"] {

      margin-right:
        .45rem;

      accent-color:
        var(--archive-green);

    }


    /* =========================================================
       ERROR
       ========================================================= */

    .archive-error {

      padding:
        1.4rem;

      border:
        1px solid
        color-mix(
          in srgb,
          var(--archive-red) 35%,
          transparent
        );

      border-radius:
        12px;

      background:
        color-mix(
          in srgb,
          var(--archive-red) 6%,
          transparent
        );

      color:
        var(--archive-text);

      line-height:
        1.65;

    }


    .archive-error strong {

      display:
        block;

      margin-bottom:
        .5rem;

      color:
        var(--archive-red);

    }


    /* =========================================================
       LOADING
       ========================================================= */

    .archive-loading {

      padding:
        2rem 0;

      text-align:
        center;

      color:
        var(--archive-muted);

      opacity:
        .65;

      font-size:
        .85rem;

    }


    /* =========================================================
       BOTTOM BACK BUTTON
       ========================================================= */

    .archive-footer {

      display:
        flex;

      justify-content:
        center;

      margin-top:
        28px;

    }


    .archive-back-bottom {

      display:
        inline-flex;

      align-items:
        center;

      gap:
        9px;

      padding:
        9px 16px;

      border:
        1px solid
        var(--archive-border);

      border-radius:
        9px;

      background:
        var(--archive-panel);

      color:
        var(--archive-text);

      font:
        inherit;

      font-size:
        .72rem;

      font-weight:
        650;

      letter-spacing:
        .1em;

      text-transform:
        uppercase;

      cursor:
        pointer;

      transition:

        background .2s ease,

        border-color .2s ease,

        color .2s ease,

        transform .2s ease;

    }


    .archive-back-bottom:hover {

      background:
        color-mix(
          in srgb,
          var(--archive-green) 7%,
          var(--archive-panel)
        );

      border-color:
        color-mix(
          in srgb,
          var(--archive-green) 35%,
          var(--archive-border)
        );

      transform:
        translateY(-1px);

    }


    /* =========================================================
       FOCUS
       ========================================================= */

    .archive-back:focus-visible,
    .archive-back-bottom:focus-visible,
    .archive-theme-toggle:focus-visible {

      outline:
        2px solid
        var(--archive-green);

      outline-offset:
        3px;

    }

        /* =========================================================
       UNIVERSAL PAGE / RESOURCE VIEWER
       ========================================================= */

    .archive-page-viewer {

      width: 100%;

      min-height: 400px;

      overflow: hidden;

      border:
        1px solid
        var(--archive-border-soft);

      border-radius:
        12px;

      background:
        var(--archive-panel);

    }


    .archive-page-frame {

      display: block;

      width: 100%;

      min-height: 900px;

      height: 85vh;

      border: 0;

      background: white;

    }


    .archive-resource {

      width: 100%;

      min-height: 500px;

      padding: 10px;

    }


    .archive-resource iframe {

      display: block;

      width: 100%;

      min-height: 800px;

      height: 80vh;

      border: 0;

      border-radius: 8px;

      background: white;

    }


    .archive-resource object {

      display: block;

      width: 100%;

      min-height: 800px;

      height: 80vh;

      border: 0;

      border-radius: 8px;

      background: white;

    }


    .archive-resource img {

      max-width: 100%;

      max-height: 80vh;

      object-fit: contain;

      margin: 0 auto;

    }


    .archive-resource audio {

      display: block;

      width: 100%;

      margin: 20px 0;

    }


    .archive-resource video {

      display: block;

      width: 100%;

      max-height: 80vh;

      margin: 0 auto;

      background: #000;

      border-radius: 8px;

    }


    .archive-resource pre {

      margin: 0;

      padding: 20px;

      overflow: auto;

      white-space: pre-wrap;

      word-break: break-word;

      background:
        var(--archive-code);

      color:
        var(--archive-text);

      border-radius: 8px;

      line-height: 1.6;

    }


    .archive-resource-table {

      width: 100%;

      overflow-x: auto;

    }


    .archive-resource-table table {

      width: 100%;

      border-collapse: collapse;

      min-width: 600px;

    }


    .archive-resource-table th,
    .archive-resource-table td {

      padding: 9px 11px;

      border:
        1px solid
        var(--archive-border-soft);

      text-align: left;

      vertical-align: top;

    }


    .archive-resource-table th {

      background:
        color-mix(
          in srgb,
          var(--archive-blue) 8%,
          var(--archive-panel)
        );

      color:
        var(--archive-text);

    }


    .archive-resource-table td {

      color:
        var(--archive-text);

    }


    .archive-resource-note {

      margin-bottom: 14px;

      padding: 10px 13px;

      border:
        1px solid
        var(--archive-border-soft);

      border-radius: 8px;

      color:
        var(--archive-muted);

      font-size: .75rem;

    }


    .archive-resource-note strong {

      color:
        var(--archive-text);

    }


    .archive-resource-download {

      display: inline-flex;

      align-items: center;

      gap: 8px;

      margin-top: 15px;

      padding: 9px 14px;

      border:
        1px solid
        var(--archive-border);

      border-radius: 8px;

      color:
        var(--archive-text);

      background:
        var(--archive-panel2);

      text-decoration: none;

      font-size: .78rem;

    }


    .archive-resource-download:hover {

      border-color:
        var(--archive-green);

      color:
        var(--archive-green);

    }


    @media (max-width: 760px) {

      .archive-page-frame {

        min-height: 700px;

        height: 80vh;

      }


      .archive-resource iframe,
      .archive-resource object {

        min-height: 650px;

        height: 75vh;

      }

    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 760px) {

      .archive-page {

        width:
          min(
            100% - 22px,
            940px
          );

        padding:
          24px 0 60px;

      }


      .archive-topbar {

        margin-bottom:
          24px;

      }


      .archive-top-actions {

        gap:
          6px;

      }


      .archive-top-label {

        display:
          none;

      }


      .archive-theme-label {

        display:
          none;

      }


      .archive-theme-toggle {

        width:

  <script>

/* =========================================================
   THEME
   ========================================================= */

const THEME_STORAGE_KEY =
  "auf2026-theme";


function getCurrentTheme() {

  return (
    document.documentElement.getAttribute(
      "data-theme"
    ) || "dark"
  );

}


function updateThemeControls(theme) {

  const isLight =
    theme === "light";


  const toggle =
    document.getElementById(
      "theme-toggle"
    );


  const icon =
    document.getElementById(
      "theme-icon"
    );


  const label =
    document.getElementById(
      "theme-label"
    );


  if (toggle) {

    toggle.setAttribute(
      "aria-pressed",
      String(!isLight)
    );


    toggle.setAttribute(
      "aria-label",
      isLight
        ? "Switch to dark theme"
        : "Switch to light theme"
    );

  }


  if (icon) {

    icon.textContent =
      isLight
        ? "☀"
        : "☾";

  }


  if (label) {

    label.textContent =
      isLight
        ? "Light"
        : "Dark";

  }

}


function applyTheme(theme) {

  if (
    theme !== "dark" &&
    theme !== "light"
  ) {

    theme = "dark";

  }


  document.documentElement.setAttribute(
    "data-theme",
    theme
  );


  localStorage.setItem(
    THEME_STORAGE_KEY,
    theme
  );


  updateThemeControls(theme);

}


updateThemeControls(
  getCurrentTheme()
);


const themeToggle =
  document.getElementById(
    "theme-toggle"
  );


if (themeToggle) {

  themeToggle.addEventListener(
    "click",
    function () {

      const current =
        getCurrentTheme();


      applyTheme(
        current === "light"
          ? "dark"
          : "light"
      );

    }
  );

}


/* =========================================================
   URL PARAMETERS
   ========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const requestedDocument =
  params.get("doc");


const requestedPage =
  params.get("page");


const requestedResource =
  params.get("file");


/* =========================================================
   DOM REFERENCES
   ========================================================= */

const documentElement =
  document.getElementById(
    "document"
  );


const titleElement =
  document.getElementById(
    "document-title"
  );


const sourceElement =
  document.getElementById(
    "document-source"
  );


/* =========================================================
   ALLOWED / SUPPORTED ARCHIVE FILES
   ========================================================= */

/*
 * Historical Markdown files.
 *
 * These short names are kept as fallback compatibility for
 * old URLs such as:
 *
 * archive.html?doc=ARCHIVE-MAP.md
 *
 * When GitHub discovery succeeds, complete repository paths
 * are added automatically.
 */

const allowedArchiveFiles = [

  "ARCHIVE-MAP.md",
  "AUTHOR-IDENTITY.md",
  "BIBLIOGRAPHIC-NOVELTY-MATRIX.md",
  "CLAIMS.md",
  "CONFIGURATION-MATRIX.md",
  "CORE-GENEALOGY.md",
  "CORPUS-INDEX.md",
  "EXTRACTION-STATUS.md",
  "FAURE-THEOREM-CANDIDATES.md",
  "FAURE-THEOREM-NO-GOD.md",
  "LOCAL-CORPUS-MAP.md",
  "LOCAL-CORPUS-ROOTS.md",
  "NEXT-SESSION.md",
  "OBJECT-REGISTRY.md",
  "PROOF-INGESTION-PROTOCOL.md",
  "PROOF-REGISTRY.md",
  "README.md",
  "REPOSITORY-MAP.md",
  "RESEARCH-REGISTER.md",
  "SOURCE-INVENTORY.md",
  "SOURCE-MANIFEST.md",
  "THEOREM-ORIGINALITY-MATRIX.md"

];


/* =========================================================
   SUPPORTED ARCHIVE EXTENSIONS
   ========================================================= */

const archiveExtensions = [

  /* Markdown */
  ".md",
  ".markdown",

  /* Plain text / source */
  ".txt",
  ".tex",
  ".latex",
  ".log",

  /* Data / structured text */
  ".csv",
  ".json",
  ".xml",
  ".yaml",
  ".yml",

  /* Web documents */
  ".html",
  ".htm",

  /* Documents */
  ".pdf",

  /* Images */
  ".svg",
  ".png",
  ".jpg",
  ".jpeg",
  ".gif",
  ".webp",
  ".avif",
  ".bmp",
  ".ico",

  /* Audio */
  ".mp3",
  ".wav",
  ".ogg",
  ".oga",
  ".m4a",
  ".aac",
  ".flac",

  /* Video */
  ".mp4",
  ".webm",
  ".ogv",
  ".mov"

];


/* =========================================================
   GITHUB
   ========================================================= */

const GITHUB_OWNER =
  "AUF2026";


const GITHUB_REPOSITORY =
  "AUF2026.github.io";


const GITHUB_BRANCH =
  "main";


/* =========================================================
   PATH NORMALIZATION
   ========================================================= */

function normalizeRepositoryPath(
  path
) {

  if (
    typeof path !== "string"
  ) {

    return null;

  }


  let clean =
    path.trim();


  try {

    clean =
      decodeURIComponent(
        clean
      );

  } catch {

    /*
     * Keep the original value if it is not
     * valid URI encoding.
     */

  }


  clean =
    clean
      .replace(/^\/+/, "")
      .replace(/\\/g, "/");


  /*
   * Never allow traversal.
   */

  if (
    !clean ||
    clean.includes("..")
  ) {

    return null;

  }


  /*
   * Remove duplicate separators.
   */

  clean =
    clean.replace(
      /\/+/g,
      "/"
    );


  return clean;

}


/* =========================================================
   EXTENSION
   ========================================================= */

function getExtension(
  path
) {

  if (
    typeof path !== "string"
  ) {

    return "";

  }


  const clean =
    path
      .split("?")[0]
      .split("#")[0]
      .toLowerCase();


  const index =
    clean.lastIndexOf(".");


  if (
    index < 0
  ) {

    return "";

  }


  return clean.slice(
    index
  );

}


/* =========================================================
   SUPPORTED FILE TEST
   ========================================================= */

function isSupportedArchiveFile(
  path
) {

  const normalized =
    normalizeRepositoryPath(
      path
    );


  if (
    !normalized
  ) {

    return false;

  }


  return archiveExtensions.includes(
    getExtension(
      normalized
    )
  );

}


/* =========================================================
   SAFE LOCAL PATH
   ========================================================= */

function isSafeLocalPath(
  path
) {

  const normalized =
    normalizeRepositoryPath(
      path
    );


  if (
    !normalized
  ) {

    return false;

  }


  if (
    normalized.startsWith("/")
  ) {

    return false;

  }


  return true;

}


/* =========================================================
   GITHUB ARCHIVE DISCOVERY
   ========================================================= */

async function discoverArchiveFiles() {

  const apiURL =
    "https://api.github.com/repos/" +
    GITHUB_OWNER +
    "/" +
    GITHUB_REPOSITORY +
    "/git/trees/" +
    GITHUB_BRANCH +
    "?recursive=1";


  try {

    const response =
      await fetch(
        apiURL,
        {
          cache: "no-cache",
          headers: {
            "Accept":
              "application/vnd.github+json"
          }
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "GitHub API HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if (
      !data ||
      !Array.isArray(
        data.tree
      )
    ) {

      throw new Error(
        "Invalid GitHub repository tree."
      );

    }


    data.tree
      .filter(
        item =>
          item &&
          item.type === "blob" &&
          typeof item.path === "string" &&
          isSupportedArchiveFile(
            item.path
          )
      )
      .forEach(
        item => {

          const path =
            normalizeRepositoryPath(
              item.path
            );


          if (
            path &&
            !allowedArchiveFiles.includes(
              path
            )
          ) {

            allowedArchiveFiles.push(
              path
            );

          }

        }
      );


    allowedArchiveFiles.sort(
      (a, b) =>
        a.localeCompare(
          b,
          undefined,
          {
            sensitivity: "base"
          }
        )
    );


    console.info(
      "AUF2026 Archive:",
      allowedArchiveFiles.length +
      " supported files discovered."
    );


    return true;

  } catch (error) {

    /*
     * Discovery failure must NOT destroy the historical
     * fallback documents.
     */

    console.warn(
      "AUF2026 Archive discovery failed:",
      error
    );


    return false;

  }

}


/* =========================================================
   RESOLVE ARCHIVE PATH
   ========================================================= */

function resolveArchivePath(
  requestedPath
) {

  const normalized =
    normalizeRepositoryPath(
      requestedPath
    );


  if (
    !normalized
  ) {

    return null;

  }


  /*
   * 1. Exact repository path.
   *
   * Example:
   *
   * Ricerche-Scientifiche/Theorem/example.md
   */

  const exact =
    allowedArchiveFiles.find(
      path =>
        path.toLowerCase() ===
        normalized.toLowerCase()
    );


  if (
    exact
  ) {

    return exact;

  }


  /*
   * 2. Historical compatibility.
   *
   * archive.html?doc=ARCHIVE-MAP.md
   *
   * resolves to:
   *
   * docs/ARCHIVE-MAP.md
   */

  if (
    !normalized.includes("/")
  ) {

    const docsPath =
      "docs/" +
      normalized;


    const docsMatch =
      allowedArchiveFiles.find(
        path =>
          path.toLowerCase() ===
          docsPath.toLowerCase()
      );


    if (
      docsMatch
    ) {

      return docsMatch;

    }

  }


  /*
   * 3. Search by filename.
   *
   * This permits:
   *
   * ?doc=FAURE-THEOREM-NO-GOD.md
   *
   * to find the file anywhere in the repository.
   */

  const basename =
    normalized
      .split("/")
      .filter(Boolean)
      .pop();


  if (
    !basename
  ) {

    return null;

  }


  const matches =
    allowedArchiveFiles.filter(
      path => {

        const filename =
          path
            .split("/")
            .filter(Boolean)
            .pop();


        return (
          filename &&
          filename.toLowerCase() ===
          basename.toLowerCase()
        );

      }
    );


  /*
   * Only resolve a filename when it is unique.
   */

  if (
    matches.length === 1
  ) {

    return matches[0];

  }


  return null;

}


/* =========================================================
   HUMAN TITLE
   ========================================================= */

function humanTitle(
  filename
) {

  return filename

    .replace(
      /\.(md|markdown|html?|pdf|csv|svg|txt|tex|latex|json|xml|yaml|yml)$/i,
      ""
    )

    .replace(
      /[-_]+/g,
      " "
    )

    .replace(
      /\b\w/g,
      character =>
        character.toUpperCase()
    );

}


/* =========================================================
   RESOURCE ROUTER
   ========================================================= */

async function loadResource(
  path,
  filename
) {

  const normalized =
    normalizeRepositoryPath(
      path
    );


  if (
    !normalized
  ) {

    renderError(
      new Error(
        "Invalid repository path."
      )
    );

    return;

  }


  const ext =
    getExtension(
      normalized
    );


  sourceElement.textContent =
    normalized;


  /* ---------------------------------------------------------
     MARKDOWN
     --------------------------------------------------------- */

  if (
    ext === ".md" ||
    ext === ".markdown"
  ) {

    try {

      const response =
        await fetch(
          normalized,
          {
            cache: "no-cache"
          }
        );


      if (
        !response.ok
      ) {

        throw new Error(
          "HTTP " +
          response.status +
          " — " +
          normalized
        );

      }


      const markdown =
        await response.text();


      if (
        typeof marked ===
        "undefined"
      ) {

        throw new Error(
          "Markdown parser 'marked' is not loaded."
        );

      }


      marked.setOptions({

        gfm: true,

        breaks: true

      });


      documentElement.innerHTML =
        marked.parse(
          markdown
        );


      normalizeMarkdownLinks(
        normalized
      );


      improveTables();


      titleElement.textContent =
        humanTitle(
          filename
        );


      document.title =
        "AUF2026 — " +
        humanTitle(
          filename
        );


    } catch (error) {

      console.error(
        "AUF2026 Markdown:",
        error
      );


      renderError(
        error
      );

    }


    return;

  }


  /* ---------------------------------------------------------
     HTML
     --------------------------------------------------------- */

  if (
    ext === ".html" ||
    ext === ".htm"
  ) {

    renderHTMLPage(
      normalized,
      filename
    );

    return;

  }


  /* ---------------------------------------------------------
     PDF
     --------------------------------------------------------- */

  if (
    ext === ".pdf"
  ) {

    renderPDF(
      normalized,
      filename
    );

    return;

  }


  /* ---------------------------------------------------------
     IMAGE
     --------------------------------------------------------- */

  if (
    [
      ".svg",
      ".png",
      ".jpg",
      ".jpeg",
      ".gif",
      ".webp",
      ".avif",
      ".bmp",
      ".ico"
    ].includes(ext)
  ) {

    renderImage(
      normalized,
      filename
    );

    return;

  }


  /* ---------------------------------------------------------
     AUDIO / VIDEO
     --------------------------------------------------------- */

  if (
    [
      ".mp3",
      ".wav",
      ".ogg",
      ".oga",
      ".m4a",
      ".aac",
      ".flac",
      ".mp4",
      ".webm",
      ".ogv",
      ".mov"
    ].includes(ext)
  ) {

    renderMedia(
      normalized,
      filename
    );

    return;

  }


  /* ---------------------------------------------------------
     CSV
     --------------------------------------------------------- */

  if (
    ext === ".csv"
  ) {

    try {

      const response =
        await fetch(
          normalized,
          {
            cache: "no-cache"
          }
        );


      if (
        !response.ok
      ) {

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      const text =
        await response.text();


      renderCSV(
        text,
        filename
      );


    } catch (error) {

      renderError(
        error
      );

    }


    return;

  }


  /* ---------------------------------------------------------
     TEXT / TEX / DATA
     --------------------------------------------------------- */

  if (
    [
      ".txt",
      ".tex",
      ".latex",
      ".json",
      ".xml",
      ".yaml",
      ".yml",
      ".log"
    ].includes(ext)
  ) {

    try {

      const response =
        await fetch(
          normalized,
          {
            cache: "no-cache"
          }
        );


      if (
        !response.ok
      ) {

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      const text =
        await response.text();


      renderText(
        text,
        filename
      );


    } catch (error) {

      renderError(
        error
      );

    }


    return;

  }


  /* ---------------------------------------------------------
     FALLBACK
     --------------------------------------------------------- */

  const resource =
    document.createElement(
      "div"
    );


  resource.className =
    "archive-resource";


  const note =
    document.createElement(
      "div"
    );


  note.className =
    "archive-resource-note";


  note.textContent =
    "Resource: " +
    filename;


  const link =
    document.createElement(
      "a"
    );


  link.className =
    "archive-resource-download";


  link.href =
    normalized;


  link.target =
    "_blank";


  link.rel =
    "noopener noreferrer";


  link.textContent =
    "Open resource";


  resource.appendChild(
    note
  );


  resource.appendChild(
    link
  );


  documentElement.replaceChildren(
    resource
  );


  titleElement.textContent =
    humanTitle(
      filename
    );

}


/* =========================================================
   ERROR
   ========================================================= */

function renderError(
  error
) {

  const message =
    error &&
    error.message
      ? error.message
      : String(error);


  documentElement.innerHTML = `

    <div class="archive-error">

      <strong>
        Unable to load resource.
      </strong>

      <p></p>

    </div>

  `;


  const paragraph =
    documentElement.querySelector(
      "p"
    );


  if (
    paragraph
  ) {

    paragraph.textContent =
      message;

  }

}


/* =========================================================
   LOAD MARKDOWN DOCUMENT
   ========================================================= */

async function loadMarkdownDocument() {

  if (
    !requestedDocument
  ) {

    renderError(
      new Error(
        "Document not specified."
      )
    );

    return;

  }


  const resolvedPath =
    resolveArchivePath(
      requestedDocument
    );


  if (
    !resolvedPath
  ) {

    renderError(
      new Error(
        "Markdown document not found: " +
        requestedDocument
      )
    );

    return;

  }


  const filename =
    resolvedPath
      .split("/")
      .filter(Boolean)
      .pop();


  if (
    !filename
  ) {

    renderError(
      new Error(
        "Invalid Markdown document."
      )
    );

    return;

  }


  await loadResource(
    resolvedPath,
    filename
  );

}


/* =========================================================
   LOAD PAGE
   ========================================================= */

async function loadPage() {

  if (
    !requestedPage
  ) {

    return;

  }


  if (
    !isSafeLocalPath(
      requestedPage
    )
  ) {

    renderError(
      new Error(
        "Invalid page path."
      )
    );

    return;

  }


  const resolvedPath =
    resolveArchivePath(
      requestedPage
    );


  if (
    !resolvedPath
  ) {

    renderError(
      new Error(
        "Page not found: " +
        requestedPage
      )
    );

    return;

  }


  const filename =
    resolvedPath
      .split("/")
      .filter(Boolean)
      .pop();


  if (
    !filename
  ) {

    renderError(
      new Error(
        "Invalid page."
      )
    );

    return;

  }


  const ext =
    getExtension(
      filename
    );


  if (
    ext !== ".html" &&
    ext !== ".htm"
  ) {

    renderError(
      new Error(
        "Only HTML pages are allowed."
      )
    );

    return;

  }


  await loadResource(
    resolvedPath,
    filename
  );

}


/* =========================================================
   LOAD GENERIC RESOURCE
   ========================================================= */

async function loadGenericResource() {

  if (
    !requestedResource
  ) {

    return;

  }


  if (
    !isSafeLocalPath(
      requestedResource
    )
  ) {

    renderError(
      new Error(
        "Invalid resource path."
      )
    );

    return;

  }


  const resolvedPath =
    resolveArchivePath(
      requestedResource
    );


  if (
    !resolvedPath
  ) {

    renderError(
      new Error(
        "Resource not found: " +
        requestedResource
      )
    );

    return;

  }


  const filename =
    resolvedPath
      .split("/")
      .filter(Boolean)
      .pop();


  if (
    !filename
  ) {

    renderError(
      new Error(
        "Invalid resource."
      )
    );

    return;

  }


  const ext =
    getExtension(
      resolvedPath
    );


  if (
    !archiveExtensions.includes(
      ext
    )
  ) {

    renderError(
      new Error(
        "Resource type not allowed: " +
        ext
      )
    );

    return;

  }


  await loadResource(
    resolvedPath,
    filename
  );

}


/* =========================================================
   MARKDOWN LINK NORMALIZATION
   ========================================================= */

function normalizeMarkdownLinks(
  currentDocumentPath
) {

  const currentDirectory =
    currentDocumentPath
      .split("/")
      .slice(0, -1)
      .join("/");


  documentElement
    .querySelectorAll("a")
    .forEach(
      link => {

        const rawHref =
          link.getAttribute(
            "href"
          );


        if (
          !rawHref
        ) {

          return;

        }


        const href =
          rawHref.trim();


        if (

          href.startsWith(
            "http://"
          ) ||

          href.startsWith(
            "https://"
          ) ||

          href.startsWith(
            "mailto:"
          ) ||

          href.startsWith(
            "tel:"
          ) ||

          href.startsWith(
            "#"
          )

        ) {

          return;

        }


        const hashIndex =
          href.indexOf("#");


        const queryIndex =
          href.indexOf("?");


        let splitIndex = -1;


        if (
          hashIndex >= 0 &&
          queryIndex >= 0
        ) {

          splitIndex =
            Math.min(
              hashIndex,
              queryIndex
            );

        } else if (
          hashIndex >= 0
        ) {

          splitIndex =
            hashIndex;

        } else if (
          queryIndex >= 0
        ) {

          splitIndex =
            queryIndex;

        }


        const rawPath =
          splitIndex >= 0
            ? href.slice(
                0,
                splitIndex
              )
            : href;


        const suffix =
          splitIndex >= 0
            ? href.slice(
                splitIndex
              )
            : "";


        if (
          !rawPath
            .toLowerCase()
            .endsWith(".md") &&
          !rawPath
            .toLowerCase()
            .endsWith(".markdown")
        ) {

          return;

        }


        let repositoryPath =
          normalizeRepositoryPath(
            rawPath
          );


        /*
         * Relative Markdown link.
         *
         * Example:
         *
         * current:
         * Ricerche-Scientifiche/Theorem/a.md
         *
         * link:
         * b.md
         *
         * becomes:
         * Ricerche-Scientifiche/Theorem/b.md
         */

        if (
          repositoryPath &&
          !rawPath.startsWith("/")
        ) {

          if (
            !repositoryPath.includes("/")
          ) {

            repositoryPath =
              currentDirectory
                ? currentDirectory +
                  "/" +
                  repositoryPath
                : repositoryPath;

          }

        }


        const resolvedPath =
          resolveArchivePath(
            repositoryPath
          );


        if (
          !resolvedPath
        ) {

          return;

        }


        link.href =
          "archive.html?doc=" +
          encodeURIComponent(
            resolvedPath
          ) +
          suffix;

      }
    );

}


/* =========================================================
   YOUTUBE / VIMEO
   ========================================================= */

function loadExternalEmbed() {

  const url =
    params.get(
      "embed"
    );


  if (
    !url
  ) {

    return false;

  }


  try {

    const parsed =
      new URL(
        url
      );


    const allowedHosts = [

      "www.youtube.com",
      "youtube.com",
      "youtu.be",
      "www.youtube-nocookie.com",
      "player.vimeo.com",
      "vimeo.com"

    ];


    if (
      !allowedHosts.includes(
        parsed.hostname.toLowerCase()
      )
    ) {

      renderError(
        new Error(
          "External embed host not allowed."
        )
      );

      return true;

    }


    renderEmbed(
      parsed.href,
      "External media"
    );


    sourceElement.textContent =
      parsed.href;


    document.title =
      "AUF2026 — External Media";


    return true;

  } catch {

    renderError(
      new Error(
        "Invalid external media URL."
      )
    );


    return true;

  }

}


/* =========================================================
   START ARCHIVE
   ========================================================= */

async function startArchive() {

  /*
   * Discover the complete repository before routing.
   */

  await discoverArchiveFiles();


  /*
   * External media.
   */

  if (
    loadExternalEmbed()
  ) {

    return;

  }


  /*
   * Explicit HTML page.
   */

  if (
    requestedPage
  ) {

    await loadPage();

    return;

  }


  /*
   * Generic resource.
   */

  if (
    requestedResource
  ) {

    await loadGenericResource();

    return;

  }


  /*
   * Document / Markdown.
   */

  if (
    requestedDocument
  ) {

    await loadMarkdownDocument();

    return;

  }


  /*
   * Nothing requested.
   */

  documentElement.innerHTML = `

    <div class="archive-error">

      <strong>
        Resource not specified.
      </strong>

      <p>
        Select a document, page or resource
        from the AUF2026 research archive.
      </p>

    </div>

  `;


  sourceElement.textContent =
    "not specified";


  document.title =
    "AUF2026 — Research Archive";

}


/* =========================================================
   START
   ========================================================= */

startArchive();

</script>
