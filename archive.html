<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>AUF2026 Archive</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="archive.css" />
</head>
<body>

  <header class="archive-header">
    <div class="archive-header-left">
      <button id="back-button" class="archive-back">
        ← Back
      </button>
    </div>
    <div class="archive-header-center">
      <h1 id="document-title">AUF2026 Archive</h1>
      <div id="document-source" class="archive-source"></div>
    </div>
    <div class="archive-header-right">
      <button
        id="theme-toggle"
        class="archive-theme-toggle"
        type="button"
        aria-pressed="false"
        aria-label="Switch to dark theme"
      >
        <span id="theme-icon">☾</span>
        <span id="theme-label">Dark</span>
      </button>
    </div>
  </header>

  <main id="document" class="archive-main">
    <p>
      Loading document…
    </p>
  </main>

  <footer class="archive-footer">
    <button id="back-button-bottom" class="archive-back">
      ← Back
    </button>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
  /* =========================================================
     THEME
     ========================================================= */

  const THEME_STORAGE_KEY = "auf2026-theme";

  function getCurrentTheme() {
    return (
      document.documentElement.getAttribute("data-theme") || "dark"
    );
  }

  function updateThemeControls(theme) {
    const isLight = theme === "light";

    const toggle = document.getElementById("theme-toggle");
    const icon   = document.getElementById("theme-icon");
    const label  = document.getElementById("theme-label");

    if (toggle) {
      toggle.setAttribute("aria-pressed", String(!isLight));
      toggle.setAttribute(
        "aria-label",
        isLight ? "Switch to dark theme" : "Switch to light theme"
      );
    }

    if (icon) {
      icon.textContent = isLight ? "☀" : "☾";
    }

    if (label) {
      label.textContent = isLight ? "Light" : "Dark";
    }
  }

  function applyTheme(theme) {
    if (theme !== "dark" && theme !== "light") {
      theme = "dark";
    }

    document.documentElement.setAttribute("data-theme", theme);

    localStorage.setItem(THEME_STORAGE_KEY, theme);

    updateThemeControls(theme);
  }

  updateThemeControls(getCurrentTheme());

  document
    .getElementById("theme-toggle")
    .addEventListener("click", function () {
      const current = getCurrentTheme();
      applyTheme(current === "light" ? "dark" : "light");
    });

  /* =========================================================
     URL PARAMETERS
     ========================================================= */

  const params = new URLSearchParams(window.location.search);

  const requestedDocument = params.get("doc");
  const requestedPage     = params.get("page");
  const requestedResource = params.get("file");

  /* =========================================================
     DOM REFERENCES
     ========================================================= */

  const documentElement = document.getElementById("document");
  const titleElement    = document.getElementById("document-title");
  const sourceElement   = document.getElementById("document-source");

  /* =========================================================
     ALLOWED MARKDOWN DOCUMENTS
     ========================================================= */

  /*
   * Static fallback / known documents.
   *
   * These remain available immediately even if the GitHub API
   * is temporarily unavailable.
   *
   * The static entries intentionally keep their historical
   * short form because existing links use:
   *
   * archive.html?doc=ARCHIVE-MAP.md
   *
   * GitHub discovery below adds the complete repository path
   * for every Markdown file found recursively.
   */
  const allowedDocuments = [
    "ARCHIVE-MAP.md",
    "AUTHOR-IDENTITY.md",
    "BIBLIOGRAPHIC-NOVELTY-MATRIX.md",
    "CLAIMS.md",
    "CONFIGURATION-MATRIX.md",
    "CORE-GENEALOGY.md",
    "CORPUS-INDEX.md",
    "EXTRACTION-STATUS.md",
    "FAURE-THEOREM-CANDIDATES.md",
    "FAURE-THEOREM-NO-GOD.md",
    "LOCAL-CORPUS-MAP.md",
    "LOCAL-CORPUS-ROOTS.md",
    "NEXT-SESSION.md",
    "OBJECT-REGISTRY.md",
    "PROOF-INGESTION-PROTOCOL.md",
    "PROOF-REGISTRY.md",
    "README.md",
    "REPOSITORY-MAP.md",
    "RESEARCH-REGISTER.md",
    "SOURCE-INVENTORY.md",
    "SOURCE-MANIFEST.md",
    "THEOREM-ORIGINALITY-MATRIX.md"
  ];

  /* =========================================================
     GITHUB API DOCUMENT DISCOVERY
     ========================================================= */

  const GITHUB_OWNER      = "AUF2026";
  const GITHUB_REPOSITORY = "AUF2026.github.io";
  const GITHUB_BRANCH     = "main";

  async function discoverMarkdownDocuments() {
    const apiURL =
      "https://api.github.com/repos/" +
      GITHUB_OWNER +
      "/" +
      GITHUB_REPOSITORY +
      "/git/trees/" +
      GITHUB_BRANCH +
      "?recursive=1";

    try {
      const response = await fetch(apiURL, {
        cache: "no-cache",
        headers: {
          "Accept": "application/vnd.github+json"
        }
      });

      if (!response.ok) {
        throw new Error("GitHub API HTTP " + response.status);
      }

      const data = await response.json();

      if (!data || !Array.isArray(data.tree)) {
        throw new Error("Invalid GitHub API tree response.");
      }

      /*
       * Discover EVERY Markdown file in EVERY directory.
       *
       * No directory is hardcoded.
       *
       * Examples:
       *
       *   docs/ARCHIVE-MAP.md
       *   docs/FAURE-THEOREM-NO-GOD.md
       *   bibliography/README.md
       *   pages/some-page.md
       *   papers/Faure_Universal_Theory.md
       *   proofs/FAURE_THEOREM_X.md
       *   validation/record.md
       *
       * All of them are discovered automatically.
       */
      data.tree
        .filter(item => {
          return (
            item.type === "blob" &&
            typeof item.path === "string" &&
            item.path.toLowerCase().endsWith(".md")
          );
        })
        .forEach(item => {
          const path =
            item.path
              .replace(/^\/+/, "")
              .replace(/\\/g, "/");

          if (path && !allowedDocuments.includes(path)) {
            allowedDocuments.push(path);
          }
        });

      /*
       * Keep the array deterministic.
       */
      allowedDocuments.sort(
        (a, b) =>
          a.localeCompare(
            b,
            undefined,
            { sensitivity: "base" }
          )
      );

      return true;

    } catch (error) {
      /*
       * GitHub discovery is additive.
       *
       * If the API is unavailable, the existing static
       * documents continue to work exactly as before.
       */
      console.warn(
        "AUF2026 Markdown discovery:",
        error
      );

      return false;
    }
  }

  /* =========================================================
     MARKDOWN PATH RESOLUTION
     ========================================================= */

  function resolveMarkdownPath(requestedDocument) {
    if (!requestedDocument) {
      return null;
    }

    const cleanPath =
      requestedDocument
        .replace(/^\/+/, "")
        .replace(/\\/g, "/");

    /*
     * If the URL already contains a repository path,
     * use it directly.
     *
     * Example:
     *
     * archive.html?doc=docs/FAURE-THEOREM-NO-GOD.md
     * archive.html?doc=papers/Faure_Universal_Theory.md
     */
    if (cleanPath.includes("/")) {
      if (allowedDocuments.includes(cleanPath)) {
        return cleanPath;
      }
      return null;
    }

    /*
     * Historical compatibility:
     *
     * Existing navigation uses:
     *
     * archive.html?doc=ARCHIVE-MAP.md
     *
     * These documents originally lived in /docs/.
     *
     * We now accept ANY discovered path whose filename
     * matches the requested short name.
     */

    /*
     * Static fallback compatibility.
     *
     * This preserves the behaviour of the original archive
     * while GitHub discovery is unavailable.
     */
    if (allowedDocuments.includes(cleanPath)) {
      return cleanPath;
    }

    /*
     * Finally, look for a discovered repository path
     * whose filename matches the requested short name.
     *
     * This allows:
     *
     * archive.html?doc=FAURE-THEOREM-NO-GOD.md
     *
     * to resolve automatically even after the file has
     * moved outside /docs/.
     */
    const matches =
      allowedDocuments.filter(path => {
        return (
          path
            .split("/")
            .filter(Boolean)
            .pop()
            ?.toLowerCase() ===
          cleanPath.toLowerCase()
        );
      });

    if (matches.length === 1) {
      return matches[0];
    }

    return null;
  }

  /* =========================================================
     PAGE / RESOURCE VALIDATION
     ========================================================= */

  const allowedPageExtensions = [
    ".html",
    ".htm"
  ];

  const allowedResourceExtensions = [
    ".pdf",
    ".csv",
    ".svg",
    ".png",
    ".jpg",
    ".jpeg",
    ".gif",
    ".webp",
    ".avif",
    ".bmp",
    ".ico",
    ".mp3",
    ".wav",
    ".ogg",
    ".oga",
    ".m4a",
    ".aac",
    ".flac",
    ".mp4",
    ".webm",
    ".ogv",
    ".mov",
    ".txt",
    ".json",
    ".xml",
    ".yaml",
    ".yml",
    ".log"
  ];

  /* =========================================================
     HUMAN TITLE
     ========================================================= */

  function humanTitle(filename) {
    return filename
      .replace(/\.(md|html?|pdf|csv|svg|txt|json|xml)$/i, "")
      .replace(/[-_]+/g, " ")
      .replace(/\b\w/g, character => character.toUpperCase());
  }

  /* =========================================================
     SAFE LOCAL PATH
     ========================================================= */

  function isSafeLocalPath(path) {
    if (!path) {
      return false;
    }

    if (path.includes("..")) {
      return false;
    }

    if (path.startsWith("/")) {
      return false;
    }

    if (path.includes("\\")) {
      return false;
    }

    return true;
  }

  /* =========================================================
     EXTENSION
     ========================================================= */

  function getExtension(path) {
    const clean =
      path
        .split("?")[0]
        .split("#")[0]
        .toLowerCase();

    const index = clean.lastIndexOf(".");

    if (index < 0) {
      return "";
    }

    return clean.slice(index);
  }

  /* =========================================================
     BACK NAVIGATION
     ========================================================= */

  function goBack() {
    if (window.history.length > 1) {
      window.history.back();
      return;
    }

    window.location.href = "index.html#verification";
  }

  document
    .getElementById("back-button")
    .addEventListener("click", goBack);

  document
    .getElementById("back-button-bottom")
    .addEventListener("click", goBack);

  /* =========================================================
     MARKDOWN LINK NORMALIZATION
     ========================================================= */

  function normalizeMarkdownLinks() {
    documentElement
      .querySelectorAll("a")
      .forEach(link => {
        const rawHref = link.getAttribute("href");

        if (!rawHref) {
          return;
        }

        const href = rawHref.trim();

        if (
          href.startsWith("http://") ||
          href.startsWith("https://") ||
          href.startsWith("mailto:") ||
          href.startsWith("tel:") ||
          href.startsWith("#")
        ) {
          return;
        }

        const hashIndex  = href.indexOf("#");
        const queryIndex = href.indexOf("?");

        let splitIndex = -1;

        if (hashIndex >= 0 && queryIndex >= 0) {
          splitIndex = Math.min(hashIndex, queryIndex);
        } else if (hashIndex >= 0) {
          splitIndex = hashIndex;
        } else if (queryIndex >= 0) {
          splitIndex = queryIndex;
        }

        const path =
          splitIndex >= 0
            ? href.slice(0, splitIndex)
            : href;

        const suffix =
          splitIndex >= 0
            ? href.slice(splitIndex)
            : "";

        if (!path.toLowerCase().endsWith(".md")) {
          return;
        }

        const normalizedPath =
          path
            .replace(/^\/+/, "")
            .replace(/\\/g, "/");

        /*
         * Direct repository path.
         */
        if (allowedDocuments.includes(normalizedPath)) {
          link.href =
            "archive.html?doc=" +
            encodeURIComponent(normalizedPath) +
            suffix;
          return;
        }

        /*
         * Historical /docs/ Markdown link.
         */
        const filename =
          normalizedPath
            .split("/")
            .filter(Boolean)
            .pop();

        if (!filename) {
          return;
        }

        const resolvedPath =
          resolveMarkdownPath(filename);

        if (!resolvedPath) {
          return;
        }

        link.href =
          "archive.html?doc=" +
          encodeURIComponent(resolvedPath) +
          suffix;
      });
  }

  /* =========================================================
     TABLE WRAPPER
     ========================================================= */

  function improveTables() {
    documentElement
      .querySelectorAll("table")
      .forEach(table => {
        if (
          table.parentElement &&
          table.parentElement.classList.contains("archive-table-wrap")
        ) {
          return;
        }

        const wrapper = document.createElement("div");

        wrapper.className = "archive-table-wrap";

        table.parentNode.insertBefore(wrapper, table);

        wrapper.appendChild(table);
      });
  }

  /* =========================================================
     CSV PARSER
     ========================================================= */

  function parseCSV(text) {
    const rows = [];
    let row = [];
    let cell = "";
    let insideQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      const next = text[i + 1];

      if (char === '"' && insideQuotes && next === '"') {
        cell += '"';
        i++;
        continue;
      }

      if (char === '"') {
        insideQuotes = !insideQuotes;
        continue;
      }

      if (char === "," && !insideQuotes) {
        row.push(cell);
        cell = "";
        continue;
      }

      if ((char === "\n" || char === "\r") && !insideQuotes) {
        if (char === "\r" && next === "\n") {
          i++;
        }

        row.push(cell);
        rows.push(row);
        row = [];
        cell = "";
        continue;
      }

      cell += char;
    }

    if (cell.length || row.length) {
      row.push(cell);
      rows.push(row);
    }

    return rows;
  }

  /* =========================================================
     CSV RENDERER
     ========================================================= */

  function renderCSV(text, filename) {
    const rows = parseCSV(text);

    const wrapper = document.createElement("div");
    wrapper.className = "archive-csv";

    const title = document.createElement("h2");
    title.textContent = humanTitle(filename);

    const table = document.createElement("table");
    const tbody = document.createElement("tbody");

    rows.forEach((row, index) => {
      const tr = document.createElement("tr");

      row.forEach(cell => {
        const cellElement =
          index === 0
            ? document.createElement("th")
            : document.createElement("td");

        cellElement.textContent = cell;
        tr.appendChild(cellElement);
      });

      tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    wrapper.appendChild(title);
    wrapper.appendChild(table);

    documentElement.innerHTML = "";
    documentElement.appendChild(wrapper);

    improveTables();
  }

  /* =========================================================
     RESOURCE RENDERER
     ========================================================= */

  function renderResource(path) {
    const extension = getExtension(path);

    const safePath = isSafeLocalPath(path)
      ? path
      : null;

    if (!safePath) {
      documentElement.innerHTML =
        "<p>Invalid resource path.</p>";
      return;
    }

    const title = humanTitle(path.split("/").pop() || path);

    titleElement.textContent = title;
    sourceElement.textContent = safePath;

    const url = safePath;

    if (extension === ".csv") {
      fetch(url)
        .then(response => response.text())
        .then(text => renderCSV(text, path))
        .catch(error => {
          documentElement.innerHTML =
            "<p>Failed to load CSV: " +
            String(error) +
            "</p>";
        });
      return;
    }

    if (extension === ".pdf") {
      documentElement.innerHTML =
        '<iframe src="' +
        url +
        '" class="archive-pdf" title="' +
        title +
        '"></iframe>';
      return;
    }

    if (allowedResourceExtensions.includes(extension)) {
      documentElement.innerHTML =
        '<a href="' +
        url +
        '" target="_blank" rel="noopener">Open resource: ' +
        title +
        "</a>";
      return;
    }

    documentElement.innerHTML =
      "<p>Unsupported resource type.</p>";
  }

  /* =========================================================
     PAGE RENDERER
     ========================================================= */

  function renderPage(path) {
    const extension = getExtension(path);

    const safePath = isSafeLocalPath(path)
      ? path
      : null;

    if (!safePath) {
      documentElement.innerHTML =
        "<p>Invalid page path.</p>";
      return;
    }

    if (!allowedPageExtensions.includes(extension)) {
      documentElement.innerHTML =
        "<p>Unsupported page type.</p>";
      return;
    }

    const title = humanTitle(path.split("/").pop() || path);

    titleElement.textContent = title;
    sourceElement.textContent = safePath;

    const url = safePath;

    documentElement.innerHTML =
      '<iframe src="' +
      url +
      '" class="archive-page" title="' +
      title +
      '"></iframe>';
  }

  /* =========================================================
     MARKDOWN RENDERER
     ========================================================= */

  async function renderMarkdown(path) {
    const resolved = resolveMarkdownPath(path);

    if (!resolved) {
      documentElement.innerHTML =
        "<p>Document not found.</p>";
      return;
    }

    const title = humanTitle(resolved.split("/").pop() || resolved);

    titleElement.textContent = title;
    sourceElement.textContent = resolved;

    const rawURL =
      "https://raw.githubusercontent.com/" +
      GITHUB_OWNER +
      "/" +
      GITHUB_REPOSITORY +
      "/" +
      GITHUB_BRANCH +
      "/" +
      resolved;

    try {
      const response = await fetch(rawURL, {
        cache: "no-cache"
      });

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const text = await response.text();

      const html = marked.parse(text);

      documentElement.innerHTML = html;

      normalizeMarkdownLinks();
      improveTables();

    } catch (error) {
      documentElement.innerHTML =
        "<p>Failed to load document: " +
        String(error) +
        "</p>";
    }
  }

  /* =========================================================
     INITIALIZATION
     ========================================================= */

  (async function initArchive() {
    await discoverMarkdownDocuments();

    if (requestedResource) {
      renderResource(requestedResource);
      return;
    }

    if (requestedPage) {
      renderPage(requestedPage);
      return;
    }

    if (requestedDocument) {
      renderMarkdown(requestedDocument);
      return;
    }

    documentElement.innerHTML =
      "<p>No document specified.</p>";
  })();

  </script>
</body>
</html>
