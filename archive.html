<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AUF2026 — Research Archive</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script>
    /*
     * Apply the saved theme before the page is painted.
     * This prevents a white/light flash when dark mode is saved.
     */

    (function () {

      const key = "auf2026-theme";

      let theme =
        localStorage.getItem(key);

      if (
        theme !== "dark" &&
        theme !== "light"
      ) {

        theme =
          window.matchMedia &&
          window.matchMedia(
            "(prefers-color-scheme: light)"
          ).matches
            ? "light"
            : "dark";

      }

      document.documentElement.setAttribute(
        "data-theme",
        theme
      );

    })();
  </script>


  <style>

    /* =========================================================
       AUF2026 ARCHIVE
       ========================================================= */

    :root {

      --archive-bg: #070a0f;
      --archive-bg2: #0d121a;

      --archive-panel: #121923;
      --archive-panel2: #18212d;

      --archive-text: #f2f6fb;
      --archive-muted: #9ba8b7;

      --archive-green: #63e6be;
      --archive-blue: #6ea8ff;
      --archive-gold: #e6c76a;
      --archive-red: #ff7b7b;

      --archive-border:
        rgba(255,255,255,.10);

      --archive-border-soft:
        rgba(255,255,255,.075);

      --archive-shadow:
        0 20px 60px rgba(0,0,0,.35);

      --archive-code:
        #05070a;

      --archive-radius:
        15px;

    }


    /* =========================================================
       LIGHT THEME
       ========================================================= */

    html[data-theme="light"] {

      --archive-bg: #f4f6f8;
      --archive-bg2: #e9edf2;

      --archive-panel: #ffffff;
      --archive-panel2: #f1f4f7;

      --archive-text: #111820;
      --archive-muted: #5f6b78;

      --archive-green: #087f65;
      --archive-blue: #2868c7;
      --archive-gold: #9a7610;
      --archive-red: #c43f3f;

      --archive-border:
        rgba(17,24,32,.12);

      --archive-border-soft:
        rgba(17,24,32,.085);

      --archive-shadow:
        0 20px 60px rgba(15,23,42,.10);

      --archive-code:
        #e7ebef;

    }


    /* =========================================================
       GLOBAL THEME
       ========================================================= */

    html,
    body {

      margin: 0;
      padding: 0;

      min-height: 100%;

      background:
        var(--archive-bg);

      color:
        var(--archive-text);

    }


    html {

      color-scheme:
        dark;

      transition:
        background .25s ease,
        color .25s ease;

    }


    html[data-theme="light"] {

      color-scheme:
        light;

    }


    body {

      min-height:
        100vh;

      background:

        radial-gradient(
          circle at 80% 10%,
          color-mix(
            in srgb,
            var(--archive-blue) 10%,
            transparent
          ),
          transparent 35%
        ),

        radial-gradient(
          circle at 10% 40%,
          color-mix(
            in srgb,
            var(--archive-green) 6%,
            transparent
          ),
          transparent 30%
        ),

        var(--archive-bg);

      color:
        var(--archive-text);

      font:
        inherit;

      transition:

        background .25s ease,

        color .25s ease;

    }


    *,
    *::before,
    *::after {

      box-sizing:
        border-box;

    }


    /* =========================================================
       ARCHIVE PAGE
       ========================================================= */

    .archive-page {

      width:
        min(
          940px,
          calc(100% - 32px)
        );

      margin:
        0 auto;

      padding:
        42px 0 90px;

    }


    /* =========================================================
       TOP NAVIGATION
       ========================================================= */

    .archive-topbar {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        16px;

      margin-bottom:
        32px;

    }


    .archive-top-actions {

      display:
        flex;

      align-items:
        center;

      gap:
        9px;

    }


    /* =========================================================
       BACK BUTTON
       ========================================================= */

    .archive-back {

      display:
        inline-flex;

      align-items:
        center;

      gap:
        9px;

      appearance:
        none;

      border:
        1px solid
        var(--archive-border);

      border-radius:
        9px;

      padding:
        9px 15px;

      background:
        color-mix(
          in srgb,
          var(--archive-panel) 88%,
          transparent
        );

      color:
        var(--archive-text);

      font:
        inherit;

      font-size:
        .78rem;

      font-weight:
        650;

      letter-spacing:
        .08em;

      text-transform:
        uppercase;

      cursor:
        pointer;

      transition:

        background .2s ease,

        border-color .2s ease,

        color .2s ease,

        transform .2s ease;

    }


    .archive-back:hover {

      background:
        color-mix(
          in srgb,
          var(--archive-green) 8%,
          var(--archive-panel)
        );

      border-color:
        color-mix(
          in srgb,
          var(--archive-green) 38%,
          var(--archive-border)
        );

      transform:
        translateX(-2px);

    }


    .archive-back:active {

      transform:
        translateX(-1px);

    }


    .archive-back-arrow {

      font-size:
        1rem;

      line-height:
        1;

      opacity:
        .82;

    }


    /* =========================================================
       THEME TOGGLE
       ========================================================= */

    .archive-theme-toggle {

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      gap:
        8px;

      appearance:
        none;

      border:
        1px solid
        var(--archive-border);

      border-radius:
        9px;

      padding:
        9px 13px;

      min-height:
        36px;

      background:
        color-mix(
          in srgb,
          var(--archive-panel) 88%,
          transparent
        );

      color:
        var(--archive-text);

      font:
        inherit;

      font-size:
        .72rem;

      font-weight:
        650;

      letter-spacing:
        .08em;

      text-transform:
        uppercase;

      cursor:
        pointer;

      transition:

        background .2s ease,

        border-color .2s ease,

        color .2s ease,

        transform .2s ease;

    }


    .archive-theme-toggle:hover {

      background:
        color-mix(
          in srgb,
          var(--archive-blue) 8%,
          var(--archive-panel)
        );

      border-color:
        color-mix(
          in srgb,
          var(--archive-blue) 35%,
          var(--archive-border)
        );

      transform:
        translateY(-1px);

    }


    .archive-theme-icon {

      width:
        15px;

      height:
        15px;

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      font-size:
        .85rem;

      line-height:
        1;

    }


    .archive-theme-label {

      min-width:
        40px;

      text-align:
        left;

    }


    /* =========================================================
       TOP LABEL
       ========================================================= */

    .archive-top-label {

      font-size:
        .72rem;

      letter-spacing:
        .13em;

      text-transform:
        uppercase;

      color:
        var(--archive-muted);

      opacity:
        .62;

    }


    /* =========================================================
       HEADER
       ========================================================= */

    .archive-header {

      margin-bottom:
        30px;

    }


    .archive-kicker {

      margin-bottom:
        10px;

      font-size:
        .72rem;

      font-weight:
        650;

      letter-spacing:
        .16em;

      text-transform:
        uppercase;

      color:
        var(--archive-green);

      opacity:
        .78;

    }


    .archive-header h1 {

      margin:
        0 0 12px;

      color:
        var(--archive-text);

      line-height:
        1.12;

      letter-spacing:
        -.025em;

    }


    .archive-subtitle {

      max-width:
        760px;

      margin:
        0;

      line-height:
        1.7;

      font-size:
        .95rem;

      color:
        var(--archive-muted);

      opacity:
        .90;

    }


    /* =========================================================
       DOCUMENT STATUS
       ========================================================= */

    .archive-status {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        20px;

      margin-bottom:
        14px;

      padding:
        11px 14px;

      border:
        1px solid
        var(--archive-border-soft);

      border-radius:
        10px;

      background:
        color-mix(
          in srgb,
          var(--archive-panel) 72%,
          transparent
        );

      font-size:
        .72rem;

      line-height:
        1.4;

      color:
        var(--archive-muted);

      transition:

        background .25s ease,

        border-color .25s ease,

        color .25s ease;

    }


    .archive-status strong {

      color:
        var(--archive-text);

      font-weight:
        650;

    }


    /* =========================================================
       DOCUMENT CONTAINER
       ========================================================= */

    .archive-document {

      padding:
        42px 46px;

      border:
        1px solid
        var(--archive-border-soft);

      border-radius:
        16px;

      background:

        linear-gradient(
          145deg,

          color-mix(
            in srgb,
            var(--archive-panel) 94%,
            transparent
          ),

          color-mix(
            in srgb,
            var(--archive-panel2) 76%,
            transparent
          )
        );

      box-shadow:
        var(--archive-shadow);

      color:
        var(--archive-text);

      overflow-wrap:
        anywhere;

      transition:

        background .25s ease,

        border-color .25s ease,

        color .25s ease,

        box-shadow .25s ease;

    }


    /* =========================================================
       MARKDOWN TYPOGRAPHY
       ========================================================= */

    .archive-document h1,
    .archive-document h2,
    .archive-document h3,
    .archive-document h4,
    .archive-document h5,
    .archive-document h6 {

      color:
        var(--archive-text);

      line-height:
        1.25;

      letter-spacing:
        -.015em;

    }


    .archive-document h1 {

      margin-top:
        0;

      margin-bottom:
        1.2rem;

      font-size:
        2rem;

    }


    .archive-document h2 {

      margin-top:
        2.8rem;

      margin-bottom:
        1rem;

      padding-bottom:
        .65rem;

      font-size:
        1.45rem;

      border-bottom:
        1px solid
        var(--archive-border);

    }


    .archive-document h3 {

      margin-top:
        2rem;

      margin-bottom:
        .8rem;

      font-size:
        1.15rem;

    }


    .archive-document h4 {

      margin-top:
        1.6rem;

    }


    .archive-document h5,
    .archive-document h6 {

      margin-top:
        1.4rem;

    }


    .archive-document p {

      margin:
        0 0 1.05rem;

      line-height:
        1.78;

      color:
        var(--archive-text);

    }


    .archive-document ul,
    .archive-document ol {

      margin:
        0 0 1.2rem;

      padding-left:
        1.5rem;

    }


    .archive-document li {

      margin-bottom:
        .4rem;

      line-height:
        1.7;

      color:
        var(--archive-text);

    }


    /* =========================================================
       STRONG / EMPHASIS
       ========================================================= */

    .archive-document strong {

      color:
        var(--archive-text);

      font-weight:
        700;

    }


    .archive-document em {

      color:
        var(--archive-text);

    }


    /* =========================================================
       LINKS
       ========================================================= */

    .archive-document a {

      color:
        var(--archive-green);

      text-decoration:
        underline;

      text-decoration-color:
        color-mix(
          in srgb,
          var(--archive-green) 38%,
          transparent
        );

      text-underline-offset:
        3px;

      transition:

        color .2s ease,

        text-decoration-color .2s ease,

        opacity .2s ease;

    }


    .archive-document a:hover {

      color:
        var(--archive-blue);

      text-decoration-color:
        currentColor;

      opacity:
        .9;

    }


    /* =========================================================
       TABLES
       ========================================================= */

    .archive-table-wrap {

      width:
        100%;

      overflow-x:
        auto;

      margin:
        1.5rem 0;

      border:
        1px solid
        var(--archive-border-soft);

      border-radius:
        10px;

      background:
        var(--archive-panel);

    }


    .archive-document table {

      width:
        100%;

      min-width:
        620px;

      margin:
        0;

      border-collapse:
        collapse;

      background:
        color-mix(
          in srgb,
          var(--archive-bg) 30%,
          transparent
        );

    }


    .archive-document th,
    .archive-document td {

      padding:
        .72rem .8rem;

      border:
        1px solid
        var(--archive-border-soft);

      text-align:
        left;

      vertical-align:
        top;

      line-height:
        1.55;

      color:
        var(--archive-text);

    }


    .archive-document th {

      background:
        color-mix(
          in srgb,
          var(--archive-blue) 7%,
          var(--archive-panel)
        );

      font-weight:
        650;

    }


    .archive-document tr:nth-child(even) td {

      background:
        color-mix(
          in srgb,
          var(--archive-text) 2%,
          transparent
        );

    }


    /* =========================================================
       CODE
       ========================================================= */

    .archive-document code {

      font-family:

        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        monospace;

      font-size:
        .88em;

      color:
        var(--archive-green);

    }


    .archive-document :not(pre) > code {

      padding:
        .15em .38em;

      border-radius:
        5px;

      background:
        color-mix(
          in srgb,
          var(--archive-code) 88%,
          transparent
        );

      border:
        1px solid
        var(--archive-border-soft);

    }


    .archive-document pre {

      margin:
        1.5rem 0;

      padding:
        1.2rem 1.3rem;

      overflow-x:
        auto;

      border:
        1px solid
        var(--archive-border-soft);

      border-radius:
        10px;

      background:
        var(--archive-code);

      box-shadow:
        inset
        0 1px 0
        color-mix(
          in srgb,
          var(--archive-text) 3%,
          transparent
        );

      line-height:
        1.6;

    }


    .archive-document pre code {

      padding:
        0;

      background:
        transparent;

      border:
        0;

      color:
        var(--archive-green);

      font-size:
        .84rem;

    }


    /* =========================================================
       BLOCKQUOTE
       ========================================================= */

    .archive-document blockquote {

      margin:
        1.5rem 0;

      padding:
        .9rem 1.2rem;

      border-left:
        3px solid
        var(--archive-blue);

      border-radius:
        0 8px 8px 0;

      background:
        color-mix(
          in srgb,
          var(--archive-blue) 5%,
          transparent
        );

      color:
        var(--archive-muted);

    }


    .archive-document blockquote p {

      color:
        inherit;

    }


    .archive-document blockquote p:last-child {

      margin-bottom:
        0;

    }


    /* =========================================================
       HORIZONTAL RULE
       ========================================================= */

    .archive-document hr {

      height:
        1px;

      margin:
        2.2rem 0;

      border:
        0;

      background:
        var(--archive-border);

    }


    /* =========================================================
       IMAGES
       ========================================================= */

    .archive-document img {

      display:
        block;

      max-width:
        100%;

      height:
        auto;

      margin:
        1.5rem auto;

      border-radius:
        10px;

      border:
        1px solid
        var(--archive-border-soft);

      background:
        var(--archive-panel);

    }


    /* =========================================================
       CHECKBOXES
       ========================================================= */

    .archive-document input[type="checkbox"] {

      margin-right:
        .45rem;

      accent-color:
        var(--archive-green);

    }


    /* =========================================================
       ERROR
       ========================================================= */

    .archive-error {

      padding:
        1.4rem;

      border:
        1px solid
        color-mix(
          in srgb,
          var(--archive-red) 35%,
          transparent
        );

      border-radius:
        12px;

      background:
        color-mix(
          in srgb,
          var(--archive-red) 6%,
          transparent
        );

      color:
        var(--archive-text);

      line-height:
        1.65;

    }


    .archive-error strong {

      display:
        block;

      margin-bottom:
        .5rem;

      color:
        var(--archive-red);

    }


    /* =========================================================
       LOADING
       ========================================================= */

    .archive-loading {

      padding:
        2rem 0;

      text-align:
        center;

      color:
        var(--archive-muted);

      opacity:
        .65;

      font-size:
        .85rem;

    }


    /* =========================================================
       BOTTOM BACK BUTTON
       ========================================================= */

    .archive-footer {

      display:
        flex;

      justify-content:
        center;

      margin-top:
        28px;

    }


    .archive-back-bottom {

      display:
        inline-flex;

      align-items:
        center;

      gap:
        9px;

      padding:
        9px 16px;

      border:
        1px solid
        var(--archive-border);

      border-radius:
        9px;

      background:
        var(--archive-panel);

      color:
        var(--archive-text);

      font:
        inherit;

      font-size:
        .72rem;

      font-weight:
        650;

      letter-spacing:
        .1em;

      text-transform:
        uppercase;

      cursor:
        pointer;

      transition:

        background .2s ease,

        border-color .2s ease,

        color .2s ease,

        transform .2s ease;

    }


    .archive-back-bottom:hover {

      background:
        color-mix(
          in srgb,
          var(--archive-green) 7%,
          var(--archive-panel)
        );

      border-color:
        color-mix(
          in srgb,
          var(--archive-green) 35%,
          var(--archive-border)
        );

      transform:
        translateY(-1px);

    }


    /* =========================================================
       FOCUS
       ========================================================= */

    .archive-back:focus-visible,
    .archive-back-bottom:focus-visible,
    .archive-theme-toggle:focus-visible {

      outline:
        2px solid
        var(--archive-green);

      outline-offset:
        3px;

    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 760px) {

      .archive-page {

        width:
          min(
            100% - 22px,
            940px
          );

        padding:
          24px 0 60px;

      }


      .archive-topbar {

        margin-bottom:
          24px;

      }


      .archive-top-actions {

        gap:
          6px;

      }


      .archive-top-label {

        display:
          none;

      }


      .archive-theme-label {

        display:
          none;

      }


      .archive-theme-toggle {

        width:
          38px;

        height:
          36px;

        justify-content:
          center;

        padding:
          0;

      }


      .archive-header {

        margin-bottom:
          24px;

      }


      .archive-header h1 {

        font-size:
          1.65rem;

      }


      .archive-subtitle {

        font-size:
          .9rem;

      }


      .archive-status {

        flex-direction:
          column;

        align-items:
          flex-start;

        gap:
          5px;

      }


      .archive-document {

        padding:
          25px 20px;

        border-radius:
          13px;

      }


      .archive-document h1 {

        font-size:
          1.65rem;

      }


      .archive-document h2 {

        font-size:
          1.3rem;

        margin-top:
          2.2rem;

      }


      .archive-document pre {

        margin-left:
          -5px;

        margin-right:
          -5px;

        border-radius:
          8px;

        padding:
          1rem;

      }

    }

  </style>

</head>


<body>


  <!-- =========================================================
       ARCHIVE
       ========================================================= -->

  <main class="archive-page">


    <!-- =======================================================
         TOP BAR
         ======================================================= -->

    <nav class="archive-topbar">


      <button
        type="button"
        class="archive-back"
        id="back-button"
        aria-label="Go back"
      >

        <span
          class="archive-back-arrow"
          aria-hidden="true"
        >
          ←
        </span>

        <span>
          Back
        </span>

      </button>


      <div class="archive-top-actions">


        <span class="archive-top-label">
          AUF2026 · Research Archive
        </span>


        <button
          type="button"
          class="archive-theme-toggle"
          id="theme-toggle"
          aria-label="Switch theme"
          aria-pressed="true"
        >

          <span
            class="archive-theme-icon"
            id="theme-icon"
            aria-hidden="true"
          >
            ☾
          </span>

          <span
            class="archive-theme-label"
            id="theme-label"
          >
            Dark
          </span>

        </button>


      </div>


    </nav>


    <!-- =======================================================
         HEADER
         ======================================================= -->

    <header class="archive-header">


      <div class="archive-kicker">
        AUF2026 · Research Archive
      </div>


      <h1 id="document-title">
        Research Document
      </h1>


      <p class="archive-subtitle">
        Canonical research documentation rendered from the
        AUF2026 Markdown corpus.
      </p>


    </header>


    <!-- =======================================================
         SOURCE STATUS
         ======================================================= -->

    <div class="archive-status">


      <span>

        SOURCE:

        <strong id="document-source">
          loading...
        </strong>

      </span>


      <span>

        FORMAT:

        <strong>
          Markdown → HTML
        </strong>

      </span>


    </div>


    <!-- =======================================================
         DOCUMENT
         ======================================================= -->

    <article
      id="document"
      class="archive-document"
    >

      <div class="archive-loading">
        Loading document...
      </div>

    </article>


    <!-- =======================================================
         FOOTER BACK
         ======================================================= -->

    <div class="archive-footer">


      <button
        type="button"
        class="archive-back-bottom"
        id="back-button-bottom"
      >

        <span aria-hidden="true">
          ←
        </span>

      </button>


    </div>


  </main>


  <!-- =========================================================
       MARKDOWN RENDERER
       ========================================================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
  ></script>


  <!-- =========================================================
       ARCHIVE LOADER
       ========================================================= -->

  <script>

    /* =========================================================
       THEME
       ========================================================= */

    const THEME_STORAGE_KEY =
      "auf2026-theme";


    function getCurrentTheme() {

      return (
        document.documentElement.getAttribute(
          "data-theme"
        ) || "dark"
      );

    }


    function updateThemeControls(
      theme
    ) {

      const isLight =
        theme === "light";


      const toggle =
        document.getElementById(
          "theme-toggle"
        );


      const icon =
        document.getElementById(
          "theme-icon"
        );


      const label =
        document.getElementById(
          "theme-label"
        );


      if (toggle) {

        toggle.setAttribute(
          "aria-pressed",
          String(
            !isLight
          )
        );


        toggle.setAttribute(
          "aria-label",
          isLight
            ? "Switch to dark theme"
            : "Switch to light theme"
        );

      }


      if (icon) {

        icon.textContent =
          isLight
            ? "☀"
            : "☾";

      }


      if (label) {

        label.textContent =
          isLight
            ? "Light"
            : "Dark";

      }

    }


    function applyTheme(
      theme
    ) {

      if (
        theme !== "dark" &&
        theme !== "light"
      ) {

        theme = "dark";

      }


      document.documentElement.setAttribute(
        "data-theme",
        theme
      );


      localStorage.setItem(
        THEME_STORAGE_KEY,
        theme
      );


      updateThemeControls(
        theme
      );

    }


    updateThemeControls(
      getCurrentTheme()
    );


    document
      .getElementById(
        "theme-toggle"
      )
      .addEventListener(
        "click",
        function () {

          const current =
            getCurrentTheme();


          applyTheme(
            current === "light"
              ? "dark"
              : "light"
          );

        }
      );


    /* =========================================================
       URL PARAMETERS
       ========================================================= */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const requestedDocument =
      params.get("doc");


    /* =========================================================
       DOM REFERENCES
       ========================================================= */

    const documentElement =
      document.getElementById(
        "document"
      );


    const titleElement =
      document.getElementById(
        "document-title"
      );


    const sourceElement =
      document.getElementById(
        "document-source"
      );


    /* =========================================================
       ALLOWED DOCUMENTS
       ========================================================= */

    const allowedDocuments = [

      "ARCHIVE-MAP.md",
      "AUTHOR-IDENTITY.md",
      "BIBLIOGRAPHIC-NOVELTY-MATRIX.md",
      "CLAIMS.md",
      "CONFIGURATION-MATRIX.md",
      "CORE-GENEALOGY.md",
      "CORPUS-INDEX.md",
      "EXTRACTION-STATUS.md",
      "LOCAL-CORPUS-MAP.md",
      "LOCAL-CORPUS-ROOTS.md",
      "NEXT-SESSION.md",
      "OBJECT-REGISTRY.md",
      "PROOF-INGESTION-PROTOCOL.md",
      "PROOF-REGISTRY.md",
      "README.md",
      "REPOSITORY-MAP.md",
      "RESEARCH-REGISTER.md",
      "SOURCE-INVENTORY.md",
      "SOURCE-MANIFEST.md",
      "THEOREM-ORIGINALITY-MATRIX.md"

    ];


    /* =========================================================
       HUMAN READABLE TITLE
       ========================================================= */

    function humanTitle(
      filename
    ) {

      return filename

        .replace(
          /\.md$/i,
          ""
        )

        .replace(
          /[-_]+/g,
          " "
        )

        .replace(
          /\b\w/g,
          character =>
            character.toUpperCase()
        );

    }


    /* =========================================================
       BACK NAVIGATION
       ========================================================= */

    function goBack() {

      /*
       * If this document was opened from another archive
       * page, return to that exact browser state.
       */

      if (
        window.history.length > 1
      ) {

        window.history.back();

        return;

      }


      /*
       * Direct navigation fallback.
       */

      window.location.href =
        "index.html#verification";

    }


    document
      .getElementById(
        "back-button"
      )
      .addEventListener(
        "click",
        goBack
      );


    document
      .getElementById(
        "back-button-bottom"
      )
      .addEventListener(
        "click",
        goBack
      );


    /* =========================================================
       MARKDOWN LINK NORMALIZATION
       ========================================================= */

    function normalizeMarkdownLinks() {

      documentElement
        .querySelectorAll(
          "a"
        )
        .forEach(
          link => {

            const rawHref =
              link.getAttribute(
                "href"
              );


            if (
              !rawHref
            ) {

              return;

            }


            const href =
              rawHref.trim();


            /*
             * Keep external and special links untouched.
             */

            if (

              href.startsWith(
                "http://"
              ) ||

              href.startsWith(
                "https://"
              ) ||

              href.startsWith(
                "mailto:"
              ) ||

              href.startsWith(
                "tel:"
              ) ||

              href.startsWith(
                "#"
              )

            ) {

              return;

            }


            /*
             * Remove query/hash from a local Markdown path
             * while preserving them separately if needed.
             */

            const hashIndex =
              href.indexOf("#");


            const queryIndex =
              href.indexOf("?");


            let splitIndex =
              -1;


            if (
              hashIndex >= 0 &&
              queryIndex >= 0
            ) {

              splitIndex =
                Math.min(
                  hashIndex,
                  queryIndex
                );

            } else if (
              hashIndex >= 0
            ) {

              splitIndex =
                hashIndex;

            } else if (
              queryIndex >= 0
            ) {

              splitIndex =
                queryIndex;

            }


            const path =
              splitIndex >= 0
                ? href.slice(
                    0,
                    splitIndex
                  )
                : href;


            const suffix =
              splitIndex >= 0
                ? href.slice(
                    splitIndex
                  )
                : "";


            /*
             * Only rewrite Markdown documents.
             */

            if (
              !path
                .toLowerCase()
                .endsWith(
                  ".md"
                )
            ) {

              return;

            }


            /*
             * Normalize:
             *
             * docs/FILE.md
             * ./FILE.md
             * ../FILE.md
             * FILE.md
             */

            const filename =
              path
                .split("/")
                .filter(Boolean)
                .pop();


            if (
              !filename
            ) {

              return;

            }


            if (
              !allowedDocuments.includes(
                filename
              )
            ) {

              return;

            }


            link.href =
              "archive.html?doc=" +
              encodeURIComponent(
                filename
              ) +
              suffix;

          }
        );

    }


    /* =========================================================
       MARKDOWN TABLE WRAPPER
       ========================================================= */

    function improveTables() {

      documentElement
        .querySelectorAll(
          "table"
        )
        .forEach(
          table => {

            if (

              table.parentElement &&

              table.parentElement.classList.contains(
                "archive-table-wrap"
              )

            ) {

              return;

            }


            const wrapper =
              document.createElement(
                "div"
              );


            wrapper.className =
              "archive-table-wrap";


            table.parentNode.insertBefore(
              wrapper,
              table
            );


            wrapper.appendChild(
              table
            );

          }
        );

    }


    /* =========================================================
       LOAD DOCUMENT
       ========================================================= */

    async function loadDocument() {


      if (

        !requestedDocument ||

        !allowedDocuments.includes(
          requestedDocument
        )

      ) {


        documentElement.innerHTML = `

          <div class="archive-error">

            <strong>
              Document not specified.
            </strong>

            <p>
              Select a document from the AUF2026
              research archive.
            </p>

          </div>

        `;


        sourceElement.textContent =
          "not specified";


        document.title =
          "AUF2026 — Research Archive";


        return;

      }


      const sourcePath =
        "docs/" +
        requestedDocument;


      titleElement.textContent =
        humanTitle(
          requestedDocument
        );


      sourceElement.textContent =
        sourcePath;


      try {


        const response =
          await fetch(
            sourcePath,
            {
              cache:
                "no-cache"
            }
          );


        if (
          !response.ok
        ) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }


        const markdown =
          await response.text();


        /* =====================================================
           MARKED CONFIGURATION
           ===================================================== */

        marked.setOptions({

          gfm:
            true,

          breaks:
            true

        });


        /* =====================================================
           RENDER MARKDOWN
           ===================================================== */

        documentElement.innerHTML =
          marked.parse(
            markdown
          );


        /* =====================================================
           POST PROCESSING
           ===================================================== */

        normalizeMarkdownLinks();

        improveTables();


        /* =====================================================
           PAGE TITLE
           ===================================================== */

        document.title =
          "AUF2026 — " +
          humanTitle(
            requestedDocument
          );


      } catch (
        error
      ) {


        console.error(
          "AUF2026 Archive:",
          error
        );


        documentElement.innerHTML = `

          <div class="archive-error">

            <strong>
              Unable to load document.
            </strong>

            <p>
              ${error.message}
            </p>

          </div>

        `;

      }

    }


    /* =========================================================
       START
       ========================================================= */

    loadDocument();

  </script>
