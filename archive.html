<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AUF2026 — Research Archive</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script>
    /*
     * Apply the saved theme before the page is painted.
     * This prevents a white/light flash when dark mode is saved.
     */

    (function () {

      const key = "auf2026-theme";

      let theme =
        localStorage.getItem(key);

      if (
        theme !== "dark" &&
        theme !== "light"
      ) {

        theme =
          window.matchMedia &&
          window.matchMedia(
            "(prefers-color-scheme: light)"
          ).matches
            ? "light"
            : "dark";

      }

      document.documentElement.setAttribute(
        "data-theme",
        theme
      );

    })();
  </script>


  <style>

    /* =========================================================
       AUF2026 ARCHIVE
       ========================================================= */

    :root {

      --archive-bg: #070a0f;
      --archive-bg2: #0d121a;

      --archive-panel: #121923;
      --archive-panel2: #18212d;

      --archive-text: #f2f6fb;
      --archive-muted: #9ba8b7;

      --archive-green: #63e6be;
      --archive-blue: #6ea8ff;
      --archive-gold: #e6c76a;
      --archive-red: #ff7b7b;

      --archive-border:
        rgba(255,255,255,.10);

      --archive-border-soft:
        rgba(255,255,255,.075);

      --archive-shadow:
        0 20px 60px rgba(0,0,0,.35);

      --archive-code:
        #05070a;

      --archive-radius:
        15px;

    }


    /* =========================================================
       LIGHT THEME
       ========================================================= */

    html[data-theme="light"] {

      --archive-bg: #f4f6f8;
      --archive-bg2: #e9edf2;

      --archive-panel: #ffffff;
      --archive-panel2: #f1f4f7;

      --archive-text: #111820;
      --archive-muted: #5f6b78;

      --archive-green: #087f65;
      --archive-blue: #2868c7;
      --archive-gold: #9a7610;
      --archive-red: #c43f3f;

      --archive-border:
        rgba(17,24,32,.12);

      --archive-border-soft:
        rgba(17,24,32,.085);

      --archive-shadow:
        0 20px 60px rgba(15,23,42,.10);

      --archive-code:
        #e7ebef;

    }


    /* =========================================================
       GLOBAL THEME
       ========================================================= */

    html,
    body {

      margin: 0;
      padding: 0;

      min-height: 100%;

      background:
        var(--archive-bg);

      color:
        var(--archive-text);

    }


    html {

      color-scheme:
        dark;

      transition:
        background .25s ease,
        color .25s ease;

    }


    html[data-theme="light"] {

      color-scheme:
        light;

    }


    body {

      min-height:
        100vh;

      background:

        radial-gradient(
          circle at 80% 10%,
          color-mix(
            in srgb,
            var(--archive-blue) 10%,
            transparent
          ),
          transparent 35%
        ),

        radial-gradient(
          circle at 10% 40%,
          color-mix(
            in srgb,
            var(--archive-green) 6%,
            transparent
          ),
          transparent 30%
        ),

        var(--archive-bg);

      color:
        var(--archive-text);

      font:
        inherit;

      transition:

        background .25s ease,

        color .25s ease;

    }


    *,
    *::before,
    *::after {

      box-sizing:
        border-box;

    }


    /* =========================================================
       ARCHIVE PAGE
       ========================================================= */

    .archive-page {

      width:
        min(
          940px,
          calc(100% - 32px)
        );

      margin:
        0 auto;

      padding:
        42px 0 90px;

    }


    /* =========================================================
       TOP NAVIGATION
       ========================================================= */

    .archive-topbar {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        16px;

      margin-bottom:
        32px;

    }


    .archive-top-actions {

      display:
        flex;

      align-items:
        center;

      gap:
        9px;

    }


    /* =========================================================
       BACK BUTTON
       ========================================================= */

    .archive-back {

      display:
        inline-flex;

      align-items:
        center;

      gap:
        9px;

      appearance:
        none;

      border:
        1px solid
        var(--archive-border);

      border-radius:
        9px;

      padding:
        9px 15px;

      background:
        color-mix(
          in srgb,
          var(--archive-panel) 88%,
          transparent
        );

      color:
        var(--archive-text);

      font:
        inherit;

      font-size:
        .78rem;

      font-weight:
        650;

      letter-spacing:
        .08em;

      text-transform:
        uppercase;

      cursor:
        pointer;

      transition:

        background .2s ease,

        border-color .2s ease,

        color .2s ease,

        transform .2s ease;

    }


    .archive-back:hover {

      background:
        color-mix(
          in srgb,
          var(--archive-green) 8%,
          var(--archive-panel)
        );

      border-color:
        color-mix(
          in srgb,
          var(--archive-green) 38%,
          var(--archive-border)
        );

      transform:
        translateX(-2px);

    }


    .archive-back:active {

      transform:
        translateX(-1px);

    }


    .archive-back-arrow {

      font-size:
        1rem;

      line-height:
        1;

      opacity:
        .82;

    }


    /* =========================================================
       THEME TOGGLE
       ========================================================= */

    .archive-theme-toggle {

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      gap:
        8px;

      appearance:
        none;

      border:
        1px solid
        var(--archive-border);

      border-radius:
        9px;

      padding:
        9px 13px;

      min-height:
        36px;

      background:
        color-mix(
          in srgb,
          var(--archive-panel) 88%,
          transparent
        );

      color:
        var(--archive-text);

      font:
        inherit;

      font-size:
        .72rem;

      font-weight:
        650;

      letter-spacing:
        .08em;

      text-transform:
        uppercase;

      cursor:
        pointer;

      transition:

        background .2s ease,

        border-color .2s ease,

        color .2s ease,

        transform .2s ease;

    }


    .archive-theme-toggle:hover {

      background:
        color-mix(
          in srgb,
          var(--archive-blue) 8%,
          var(--archive-panel)
        );

      border-color:
        color-mix(
          in srgb,
          var(--archive-blue) 35%,
          var(--archive-border)
        );

      transform:
        translateY(-1px);

    }


    .archive-theme-icon {

      width:
        15px;

      height:
        15px;

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      font-size:
        .85rem;

      line-height:
        1;

    }


    .archive-theme-label {

      min-width:
        40px;

      text-align:
        left;

    }


    /* =========================================================
       TOP LABEL
       ========================================================= */

    .archive-top-label {

      font-size:
        .72rem;

      letter-spacing:
        .13em;

      text-transform:
        uppercase;

      color:
        var(--archive-muted);

      opacity:
        .62;

    }


    /* =========================================================
       HEADER
       ========================================================= */

    .archive-header {

      margin-bottom:
        30px;

    }


    .archive-kicker {

      margin-bottom:
        10px;

      font-size:
        .72rem;

      font-weight:
        650;

      letter-spacing:
        .16em;

      text-transform:
        uppercase;

      color:
        var(--archive-green);

      opacity:
        .78;

    }


    .archive-header h1 {

      margin:
        0 0 12px;

      color:
        var(--archive-text);

      line-height:
        1.12;

      letter-spacing:
        -.025em;

    }


    .archive-subtitle {

      max-width:
        760px;

      margin:
        0;

      line-height:
        1.7;

      font-size:
        .95rem;

      color:
        var(--archive-muted);

      opacity:
        .90;

    }


    /* =========================================================
       DOCUMENT STATUS
       ========================================================= */

    .archive-status {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        20px;

      margin-bottom:
        14px;

      padding:
        11px 14px;

      border:
        1px solid
        var(--archive-border-soft);

      border-radius:
        10px;

      background:
        color-mix(
          in srgb,
          var(--archive-panel) 72%,
          transparent
        );

      font-size:
        .72rem;

      line-height:
        1.4;

      color:
        var(--archive-muted);

      transition:

        background .25s ease,

        border-color .25s ease,

        color .25s ease;

    }


    .archive-status strong {

      color:
        var(--archive-text);

      font-weight:
        650;

    }


    /* =========================================================
       DOCUMENT CONTAINER
       ========================================================= */

    .archive-document {

      padding:
        42px 46px;

      border:
        1px solid
        var(--archive-border-soft);

      border-radius:
        16px;

      background:

        linear-gradient(
          145deg,

          color-mix(
            in srgb,
            var(--archive-panel) 94%,
            transparent
          ),

          color-mix(
            in srgb,
            var(--archive-panel2) 76%,
            transparent
          )
        );

      box-shadow:
        var(--archive-shadow);

      color:
        var(--archive-text);

      overflow-wrap:
        anywhere;

      transition:

        background .25s ease,

        border-color .25s ease,

        color .25s ease,

        box-shadow .25s ease;

    }


    /* =========================================================
       MARKDOWN TYPOGRAPHY
       ========================================================= */

    .archive-document h1,
    .archive-document h2,
    .archive-document h3,
    .archive-document h4,
    .archive-document h5,
    .archive-document h6 {

      color:
        var(--archive-text);

      line-height:
        1.25;

      letter-spacing:
        -.015em;

    }


    .archive-document h1 {

      margin-top:
        0;

      margin-bottom:
        1.2rem;

      font-size:
        2rem;

    }


    .archive-document h2 {

      margin-top:
        2.8rem;

      margin-bottom:
        1rem;

      padding-bottom:
        .65rem;

      font-size:
        1.45rem;

      border-bottom:
        1px solid
        var(--archive-border);

    }


    .archive-document h3 {

      margin-top:
        2rem;

      margin-bottom:
        .8rem;

      font-size:
        1.15rem;

    }


    .archive-document h4 {

      margin-top:
        1.6rem;

    }


    .archive-document h5,
    .archive-document h6 {

      margin-top:
        1.4rem;

    }


    .archive-document p {

      margin:
        0 0 1.05rem;

      line-height:
        1.78;

      color:
        var(--archive-text);

    }


    .archive-document ul,
    .archive-document ol {

      margin:
        0 0 1.2rem;

      padding-left:
        1.5rem;

    }


    .archive-document li {

      margin-bottom:
        .4rem;

      line-height:
        1.7;

      color:
        var(--archive-text);

    }


    /* =========================================================
       STRONG / EMPHASIS
       ========================================================= */

    .archive-document strong {

      color:
        var(--archive-text);

      font-weight:
        700;

    }


    .archive-document em {

      color:
        var(--archive-text);

    }


    /* =========================================================
       LINKS
       ========================================================= */

    .archive-document a {

      color:
        var(--archive-green);

      text-decoration:
        underline;

      text-decoration-color:
        color-mix(
          in srgb,
          var(--archive-green) 38%,
          transparent
        );

      text-underline-offset:
        3px;

      transition:

        color .2s ease,

        text-decoration-color .2s ease,

        opacity .2s ease;

    }


    .archive-document a:hover {

      color:
        var(--archive-blue);

      text-decoration-color:
        currentColor;

      opacity:
        .9;

    }


    /* =========================================================
       TABLES
       ========================================================= */

    .archive-table-wrap {

      width:
        100%;

      overflow-x:
        auto;

      margin:
        1.5rem 0;

      border:
        1px solid
        var(--archive-border-soft);

      border-radius:
        10px;

      background:
        var(--archive-panel);

    }


    .archive-document table {

      width:
        100%;

      min-width:
        620px;

      margin:
        0;

      border-collapse:
        collapse;

      background:
        color-mix(
          in srgb,
          var(--archive-bg) 30%,
          transparent
        );

    }


    .archive-document th,
    .archive-document td {

      padding:
        .72rem .8rem;

      border:
        1px solid
        var(--archive-border-soft);

      text-align:
        left;

      vertical-align:
        top;

      line-height:
        1.55;

      color:
        var(--archive-text);

    }


    .archive-document th {

      background:
        color-mix(
          in srgb,
          var(--archive-blue) 7%,
          var(--archive-panel)
        );

      font-weight:
        650;

    }


    .archive-document tr:nth-child(even) td {

      background:
        color-mix(
          in srgb,
          var(--archive-text) 2%,
          transparent
        );

    }


    /* =========================================================
       CODE
       ========================================================= */

    .archive-document code {

      font-family:

        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        monospace;

      font-size:
        .88em;

      color:
        var(--archive-green);

    }


    .archive-document :not(pre) > code {

      padding:
        .15em .38em;

      border-radius:
        5px;

      background:
        color-mix(
          in srgb,
          var(--archive-code) 88%,
          transparent
        );

      border:
        1px solid
        var(--archive-border-soft);

    }


    .archive-document pre {

      margin:
        1.5rem 0;

      padding:
        1.2rem 1.3rem;

      overflow-x:
        auto;

      border:
        1px solid
        var(--archive-border-soft);

      border-radius:
        10px;

      background:
        var(--archive-code);

      box-shadow:
        inset
        0 1px 0
        color-mix(
          in srgb,
          var(--archive-text) 3%,
          transparent
        );

      line-height:
        1.6;

    }


    .archive-document pre code {

      padding:
        0;

      background:
        transparent;

      border:
        0;

      color:
        var(--archive-green);

      font-size:
        .84rem;

    }


    /* =========================================================
       BLOCKQUOTE
       ========================================================= */

    .archive-document blockquote {

      margin:
        1.5rem 0;

      padding:
        .9rem 1.2rem;

      border-left:
        3px solid
        var(--archive-blue);

      border-radius:
        0 8px 8px 0;

      background:
        color-mix(
          in srgb,
          var(--archive-blue) 5%,
          transparent
        );

      color:
        var(--archive-muted);

    }


    .archive-document blockquote p {

      color:
        inherit;

    }


    .archive-document blockquote p:last-child {

      margin-bottom:
        0;

    }


    /* =========================================================
       HORIZONTAL RULE
       ========================================================= */

    .archive-document hr {

      height:
        1px;

      margin:
        2.2rem 0;

      border:
        0;

      background:
        var(--archive-border);

    }


    /* =========================================================
       IMAGES
       ========================================================= */

    .archive-document img {

      display:
        block;

      max-width:
        100%;

      height:
        auto;

      margin:
        1.5rem auto;

      border-radius:
        10px;

      border:
        1px solid
        var(--archive-border-soft);

      background:
        var(--archive-panel);

    }


    /* =========================================================
       CHECKBOXES
       ========================================================= */

    .archive-document input[type="checkbox"] {

      margin-right:
        .45rem;

      accent-color:
        var(--archive-green);

    }


    /* =========================================================
       ERROR
       ========================================================= */

    .archive-error {

      padding:
        1.4rem;

      border:
        1px solid
        color-mix(
          in srgb,
          var(--archive-red) 35%,
          transparent
        );

      border-radius:
        12px;

      background:
        color-mix(
          in srgb,
          var(--archive-red) 6%,
          transparent
        );

      color:
        var(--archive-text);

      line-height:
        1.65;

    }


    .archive-error strong {

      display:
        block;

      margin-bottom:
        .5rem;

      color:
        var(--archive-red);

    }


    /* =========================================================
       LOADING
       ========================================================= */

    .archive-loading {

      padding:
        2rem 0;

      text-align:
        center;

      color:
        var(--archive-muted);

      opacity:
        .65;

      font-size:
        .85rem;

    }


    /* =========================================================
       BOTTOM BACK BUTTON
       ========================================================= */

    .archive-footer {

      display:
        flex;

      justify-content:
        center;

      margin-top:
        28px;

    }


    .archive-back-bottom {

      display:
        inline-flex;

      align-items:
        center;

      gap:
        9px;

      padding:
        9px 16px;

      border:
        1px solid
        var(--archive-border);

      border-radius:
        9px;

      background:
        var(--archive-panel);

      color:
        var(--archive-text);

      font:
        inherit;

      font-size:
        .72rem;

      font-weight:
        650;

      letter-spacing:
        .1em;

      text-transform:
        uppercase;

      cursor:
        pointer;

      transition:

        background .2s ease,

        border-color .2s ease,

        color .2s ease,

        transform .2s ease;

    }


    .archive-back-bottom:hover {

      background:
        color-mix(
          in srgb,
          var(--archive-green) 7%,
          var(--archive-panel)
        );

      border-color:
        color-mix(
          in srgb,
          var(--archive-green) 35%,
          var(--archive-border)
        );

      transform:
        translateY(-1px);

    }


    /* =========================================================
       FOCUS
       ========================================================= */

    .archive-back:focus-visible,
    .archive-back-bottom:focus-visible,
    .archive-theme-toggle:focus-visible {

      outline:
        2px solid
        var(--archive-green);

      outline-offset:
        3px;

    }

        /* =========================================================
       UNIVERSAL PAGE / RESOURCE VIEWER
       ========================================================= */

    .archive-page-viewer {

      width: 100%;

      min-height: 400px;

      overflow: hidden;

      border:
        1px solid
        var(--archive-border-soft);

      border-radius:
        12px;

      background:
        var(--archive-panel);

    }


    .archive-page-frame {

      display: block;

      width: 100%;

      min-height: 900px;

      height: 85vh;

      border: 0;

      background: white;

    }


    .archive-resource {

      width: 100%;

      min-height: 500px;

      padding: 10px;

    }


    .archive-resource iframe {

      display: block;

      width: 100%;

      min-height: 800px;

      height: 80vh;

      border: 0;

      border-radius: 8px;

      background: white;

    }


    .archive-resource object {

      display: block;

      width: 100%;

      min-height: 800px;

      height: 80vh;

      border: 0;

      border-radius: 8px;

      background: white;

    }


    .archive-resource img {

      max-width: 100%;

      max-height: 80vh;

      object-fit: contain;

      margin: 0 auto;

    }


    .archive-resource audio {

      display: block;

      width: 100%;

      margin: 20px 0;

    }


    .archive-resource video {

      display: block;

      width: 100%;

      max-height: 80vh;

      margin: 0 auto;

      background: #000;

      border-radius: 8px;

    }


    .archive-resource pre {

      margin: 0;

      padding: 20px;

      overflow: auto;

      white-space: pre-wrap;

      word-break: break-word;

      background:
        var(--archive-code);

      color:
        var(--archive-text);

      border-radius: 8px;

      line-height: 1.6;

    }


    .archive-resource-table {

      width: 100%;

      overflow-x: auto;

    }


    .archive-resource-table table {

      width: 100%;

      border-collapse: collapse;

      min-width: 600px;

    }


    .archive-resource-table th,
    .archive-resource-table td {

      padding: 9px 11px;

      border:
        1px solid
        var(--archive-border-soft);

      text-align: left;

      vertical-align: top;

    }


    .archive-resource-table th {

      background:
        color-mix(
          in srgb,
          var(--archive-blue) 8%,
          var(--archive-panel)
        );

      color:
        var(--archive-text);

    }


    .archive-resource-table td {

      color:
        var(--archive-text);

    }


    .archive-resource-note {

      margin-bottom: 14px;

      padding: 10px 13px;

      border:
        1px solid
        var(--archive-border-soft);

      border-radius: 8px;

      color:
        var(--archive-muted);

      font-size: .75rem;

    }


    .archive-resource-note strong {

      color:
        var(--archive-text);

    }


    .archive-resource-download {

      display: inline-flex;

      align-items: center;

      gap: 8px;

      margin-top: 15px;

      padding: 9px 14px;

      border:
        1px solid
        var(--archive-border);

      border-radius: 8px;

      color:
        var(--archive-text);

      background:
        var(--archive-panel2);

      text-decoration: none;

      font-size: .78rem;

    }


    .archive-resource-download:hover {

      border-color:
        var(--archive-green);

      color:
        var(--archive-green);

    }


    @media (max-width: 760px) {

      .archive-page-frame {

        min-height: 700px;

        height: 80vh;

      }


      .archive-resource iframe,
      .archive-resource object {

        min-height: 650px;

        height: 75vh;

      }

    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 760px) {

      .archive-page {

        width:
          min(
            100% - 22px,
            940px
          );

        padding:
          24px 0 60px;

      }


      .archive-topbar {

        margin-bottom:
          24px;

      }


      .archive-top-actions {

        gap:
          6px;

      }


      .archive-top-label {

        display:
          none;

      }


      .archive-theme-label {

        display:
          none;

      }


      .archive-theme-toggle {

        width:

/* =========================================================
   AUF2026 ARCHIVE PARSER
   =========================================================
   archive.html is ONLY the parser/viewer.

   Repository:

   The parser discovers the repository recursively and can
   render Markdown, HTML, PDF, CSV, images, audio, video,
   and text resources from any repository directory.
   ========================================================= */


/* =========================================================
   THEME
   ========================================================= */

const THEME_STORAGE_KEY =
  "auf2026-theme";


function getCurrentTheme() {

  return (
    document.documentElement.getAttribute(
      "data-theme"
    ) || "dark"
  );

}


function updateThemeControls(theme) {

  const isLight =
    theme === "light";


  const toggle =
    document.getElementById(
      "theme-toggle"
    );


  const icon =
    document.getElementById(
      "theme-icon"
    );


  const label =
    document.getElementById(
      "theme-label"
    );


  if (toggle) {

    toggle.setAttribute(
      "aria-pressed",
      String(!isLight)
    );


    toggle.setAttribute(
      "aria-label",
      isLight
        ? "Switch to dark theme"
        : "Switch to light theme"
    );

  }


  if (icon) {

    icon.textContent =
      isLight
        ? "☀"
        : "☾";

  }


  if (label) {

    label.textContent =
      isLight
        ? "Light"
        : "Dark";

  }

}


function applyTheme(theme) {

  if (
    theme !== "dark" &&
    theme !== "light"
  ) {

    theme = "dark";

  }


  document.documentElement.setAttribute(
    "data-theme",
    theme
  );


  try {

    localStorage.setItem(
      THEME_STORAGE_KEY,
      theme
    );

  } catch {

    /* localStorage may be unavailable. */

  }


  updateThemeControls(theme);

}


function initializeTheme() {

  let theme =
    getCurrentTheme();


  try {

    const stored =
      localStorage.getItem(
        THEME_STORAGE_KEY
      );


    if (
      stored === "dark" ||
      stored === "light"
    ) {

      theme = stored;

    }

  } catch {

    /* Ignore localStorage failures. */

  }


  applyTheme(theme);


  const toggle =
    document.getElementById(
      "theme-toggle"
    );


  if (toggle) {

    toggle.addEventListener(
      "click",
      function () {

        const current =
          getCurrentTheme();


        applyTheme(
          current === "light"
            ? "dark"
            : "light"
        );

      }
    );

  }

}


/* =========================================================
   URL PARAMETERS
   ========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const requestedDocument =
  params.get("doc");


const requestedPage =

const requestedResource =

/* =========================================================
   DOM REFERENCES
   ========================================================= */

const documentElement =
  document.getElementById(
    "document"
  );


const titleElement =
  document.getElementById(
    "document-title"
  );


const sourceElement =
  document.getElementById(
    "document-source"
  );


/* =========================================================
   REQUIRED DOM CHECK
   ========================================================= */

function assertDOM() {

  if (!documentElement) {

    throw new Error(
      'Missing #document element.'
    );

  }


  if (!titleElement) {

    );

/* =========================================================
   GITHUB REPOSITORY
   ========================================================= */

const GITHUB_OWNER =
  "AUF2026";


const GITHUB_REPOSITORY =
  "AUF2026.github.io";


const GITHUB_BRANCH =
  "main";


const GITHUB_API_BASE =
  "https://api.github.com/repos/" +
  GITHUB_OWNER +
  "/" +
  GITHUB_REPOSITORY;


const GITHUB_RAW_BASE =
  "https://raw.githubusercontent.com/" +
  GITHUB_OWNER +
  "/" +
  GITHUB_REPOSITORY +
  "/" +
  GITHUB_BRANCH;


/* =========================================================
   REPOSITORY INDEX
   ========================================================= */

/*
 * Every discovered repository file is stored here.
 *
 * Example:
 *
 *   docs/ARCHIVE-MAP.md
 *   pages/example.html
 *   papers/faure.pdf
 *   proofs/example.md
 *
 * No repository directory is hardcoded.
 */

const repositoryFiles =
  new Set();


let repositoryTreeLoaded =
  false;


let repositoryTreeTruncated =
  false;


/* =========================================================
   NORMALIZE REPOSITORY PATH
   ========================================================= */

function normalizeRepositoryPath(path) {

  if (
    typeof path !== "string"
  ) {

    return "";

  }


  return path

    .trim()

    .replace(
      /^\/+/,
      ""
    )

    .replace(
      /\\/g,
      "/"
    )

    .replace(
      /\/+/g,
      "/"
    );

}


/* =========================================================
   SAFE REPOSITORY PATH
   ========================================================= */

function isSafeRepositoryPath(path) {

  const clean =
    normalizeRepositoryPath(
      path
    );


  if (!clean) {

    return false;

  }


  if (
    clean.startsWith("/")
  ) {

    return false;

  }


  const parts =
    clean.split("/");


  if (
    parts.includes("..")
  ) {

    return false;

  }


  if (
    parts.includes("")
  ) {

    return false;

  }


  return true;

}


/* =========================================================
   FILE EXTENSION
   ========================================================= */

function getExtension(path) {

  const clean =
    String(path || "")
      .split("?")[0]
      .split("#")[0]
      .toLowerCase();


  const index =
    clean.lastIndexOf(".");


  if (
    index < 0
  ) {

    return "";

  }


  return clean.slice(
    index
  );

}


/* =========================================================
   HUMAN TITLE
   ========================================================= */

function humanTitle(filename) {

  return String(
    filename || ""
  )

    .replace(
      /\.(md|html?|pdf|csv|svg|txt|json|xml|yaml|yml|log)$/i,
      ""
    )

    .replace(
      /[-_]+/g,
      " "
    )

    .replace(
      /\b\w/g,
      character =>
        character.toUpperCase()
    );

}


/* =========================================================
   DISCOVER REPOSITORY TREE
   ========================================================= */

async function discoverRepository() {

  repositoryFiles.clear();

  repositoryTreeLoaded =
    false;

  repositoryTreeTruncated =
    false;


  const apiURL =
    GITHUB_API_BASE +
    "/git/trees/" +
    encodeURIComponent(
      GITHUB_BRANCH
    ) +
    "?recursive=1";


  try {

    const response =
      await fetch(
        apiURL,
        {
          cache: "no-cache",
          headers: {
            "Accept":
              "application/vnd.github+json"
          }
        }
      );


    if (!response.ok) {

      throw new Error(
        "GitHub API HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if (
      !data ||
      !Array.isArray(
        data.tree
      )
    ) {

      throw new Error(
        "Invalid GitHub repository tree."
      );

    }


    repositoryTreeTruncated =
      Boolean(
        data.truncated
      );


    data.tree
      .filter(
        item =>
          item &&
          item.type === "blob" &&
          typeof item.path === "string"
      )
      .forEach(
        item => {

          const path =
            normalizeRepositoryPath(
              item.path
            );


          if (
            isSafeRepositoryPath(
              path
            )
          ) {

            repositoryFiles.add(
              path
            );

          }

        }
      );


    repositoryTreeLoaded =
      true;


    /*
     * GitHub may mark a very large recursive tree as
     * truncated. We still keep everything returned by the
     * API, but remember that condition.
     */
    if (
      repositoryTreeTruncated
    ) {

      console.warn(
        "AUF2026 repository tree is truncated."
      );

    }


    return true;


  } catch (error) {

    console.error(
      "AUF2026 repository discovery failed:",
      error
    );


    return false;

  }

}


/* =========================================================
   GITHUB CONTENTS FALLBACK
   ========================================================= */

/*
 * Used when the recursive tree is unavailable or when a
 * requested directory/file needs explicit verification.
 */

async function githubContentsPathExists(
  path
) {

  const clean =
    normalizeRepositoryPath(
      path
    );


  if (
    !isSafeRepositoryPath(
      clean
    )
  ) {

    return false;

  }


  try {

    const response =
      await fetch(
        GITHUB_API_BASE +
        "/contents/" +
        clean +
        "?ref=" +
        encodeURIComponent(
          GITHUB_BRANCH
        ),
        {
          cache: "no-cache",
          headers: {
            "Accept":
              "application/vnd.github+json"
          }
        }
      );


    return response.ok;


  } catch {

    return false;

  }

}


/* =========================================================
   FILE MATCHING
   ========================================================= */

function findExactRepositoryFile(
  requestedPath
) {

  const clean =
    normalizeRepositoryPath(
      requestedPath
    );


  if (
    repositoryFiles.has(
      clean
    )
  ) {

    return clean;

  }


  /*
   * Case-insensitive fallback.
   */
  const lower =
    clean.toLowerCase();


  const matches =
    Array.from(
      repositoryFiles
    )
    .filter(
      path =>
        path.toLowerCase() ===
        lower
    );


  if (
    matches.length === 1
  ) {

    return matches[0];

  }


  return null;

}


/* =========================================================
   FILENAME MATCHING
   ========================================================= */

function findRepositoryFileByName(
  filename
) {

  const clean =
    normalizeRepositoryPath(
      filename
    );


  const base =
    clean
      .split("/")
      .filter(Boolean)
      .pop();


  if (!base) {

    return null;

  }


  const lower =
    base.toLowerCase();


  const matches =
    Array.from(
      repositoryFiles
    )
    .filter(
      path => {

        const candidate =
          path
            .split("/")
            .filter(Boolean)
            .pop();


        return (
          candidate &&
          candidate.toLowerCase() ===
          lower
        );

      }
    );


  /*
   * Only resolve a short filename when it is unique.
   *
   * This avoids silently selecting the wrong file when
   * two directories contain files with the same name.
   */
  if (
    matches.length === 1
  ) {

    return matches[0];

  }


  return null;

}


/* =========================================================
   GENERAL REPOSITORY PATH RESOLUTION
   ========================================================= */

function resolveRepositoryFile(
  requestedPath
) {

  if (
    !requestedPath
  ) {

    return null;

  }


  const clean =
    normalizeRepositoryPath(
      requestedPath
    );


  if (
    !isSafeRepositoryPath(
      clean
    )
  ) {

    return null;

  }


  /*
   * Exact repository path.
   */
  const exact =
    findExactRepositoryFile(
      clean
    );


  if (exact) {

    return exact;

  }


  /*
   * Short filename.
   */
  return findRepositoryFileByName(
    clean
  );

}


/* =========================================================
   MARKDOWN PATH RESOLUTION
   ========================================================= */

function resolveMarkdownPath(
  requestedPath
) {

  const clean =
    normalizeRepositoryPath(
      requestedPath
    );


  if (!clean) {

    return null;

  }


  /*
   * Direct repository path.
   */
  const exact =
    findExactRepositoryFile(
      clean
    );


  if (
    exact &&
    getExtension(exact) === ".md"
  ) {

    return exact;

  }


  /*
   * Historical URLs:
   *
   * ?doc=README.md
   *
   * First try docs/README.md.
   */
  const docsPath =
    "docs/" +
    clean;


  const docsMatch =
    findExactRepositoryFile(
      docsPath
    );


  if (
    docsMatch &&
    getExtension(docsMatch) === ".md"
  ) {

    return docsMatch;

  }


  /*
   * Finally search the entire repository by filename.
   */
  const filenameMatch =
    findRepositoryFileByName(
      clean
    );


  if (
    filenameMatch &&
    getExtension(filenameMatch) === ".md"
  ) {

    return filenameMatch;

  }


  return null;

}

/* =========================================================
   RESOLVE RELATIVE MARKDOWN LINKS
   ========================================================= */

function resolveRelativeMarkdownPath(
  sourcePath,
  linkPath
) {

  const cleanSource =
    normalizeRepositoryPath(
      sourcePath
    );


  const cleanLink =
    String(
      linkPath || ""
    )
    .trim()
    .replace(
      /\\/g,
      "/"
    );


  if (!cleanLink) {

    return null;

  }


  /*
   * Root-relative repository path.
   */
  if (
    cleanLink.startsWith("/")
  ) {

    const rootPath =
      normalizeRepositoryPath(
        cleanLink
      );


    return resolveRepositoryFile(
      rootPath
    );

  }


  const sourceParts =
    cleanSource
      .split("/")
      .filter(Boolean);


  sourceParts.pop();


  const linkParts =
    cleanLink
      .split("/")
      .filter(Boolean);


  for (
    const part of linkParts
  ) {

    if (
      part === "."
    ) {

      continue;

    }


    if (
      part === ".."
    ) {

      if (
        sourceParts.length
      ) {

        sourceParts.pop();

      }

      continue;

    }


    sourceParts.push(
      part
    );

  }


  const resolved =
    sourceParts.join("/");


  return resolveRepositoryFile(
    resolved
  );

}


/* =========================================================
   MARKDOWN LINK NORMALIZATION
   ========================================================= */

function normalizeMarkdownLinks(
  sourcePath
) {

  documentElement
    .querySelectorAll("a")
    .forEach(
      link => {

        const rawHref =
          link.getAttribute(
            "href"
          );


        if (!rawHref) {

          return;

        }


        const href =
          rawHref.trim();


        /*
         * Leave external and special links alone.
         */
        if (

          href.startsWith(
            "http://"
          ) ||

          href.startsWith(
            "https://"
          ) ||

          href.startsWith(
            "mailto:"
          ) ||

          href.startsWith(
            "tel:"
          ) ||

          href.startsWith(
            "#"
          )

        ) {

          return;

        }


        /*
         * Separate path from query/hash.
         */
        let path =
          href;


        let suffix =
          "";


        const hashIndex =
          href.indexOf("#");


        const queryIndex =
          href.indexOf("?");


        let splitIndex =
          -1;


        if (
          hashIndex >= 0 &&
          queryIndex >= 0
        ) {

          splitIndex =
            Math.min(
              hashIndex,
              queryIndex
            );

        } else if (
          hashIndex >= 0
        ) {

          splitIndex =
            hashIndex;

        } else if (
          queryIndex >= 0
        ) {

          splitIndex =
            queryIndex;

        }


        if (
          splitIndex >= 0
        ) {

          path =
            href.slice(
              0,
              splitIndex
            );


          suffix =
            href.slice(
              splitIndex
            );

        }


        if (!path) {

          return;

        }


        /*
         * Markdown document.
         */
        if (
          path
            .toLowerCase()
            .endsWith(".md")
        ) {

          const resolved =
            resolveRelativeMarkdownPath(
              sourcePath,
              path
            );


          if (!resolved) {

            return;

          }


          link.href =
            "archive.html?doc=" +
            encodeURIComponent(
              resolved
            ) +
            suffix;


          return;

        }


        /*
         * HTML document.
         */
        if (
          path
            .toLowerCase()
            .endsWith(".html") ||
          path
            .toLowerCase()
            .endsWith(".htm")
        ) {

          const resolved =
            resolveRelativeMarkdownPath(
              sourcePath,
              path
            );


          if (!resolved) {

            return;

          }


          link.href =
            "archive.html?page=" +
            encodeURIComponent(
              resolved
            ) +
            suffix;


          return;

        }


        /*
         * Other repository resources.
         */
        const extension =
          getExtension(
            path
          );


        const resourceExtensions = [

          ".pdf",
          ".csv",

          ".svg",
          ".png",
          ".jpg",
          ".jpeg",
          ".gif",
          ".webp",
          ".avif",
          ".bmp",
          ".ico",

          ".mp3",
          ".wav",
          ".ogg",
          ".oga",
          ".m4a",
          ".aac",
          ".flac",

          ".mp4",
          ".webm",
          ".ogv",
          ".mov",

          ".txt",
          ".json",
          ".xml",
          ".yaml",
          ".yml",
          ".log"

        ];


        if (
          resourceExtensions.includes(
            extension
          )
        ) {

          const resolved =
            resolveRelativeMarkdownPath(
              sourcePath,
              path
            );


          if (!resolved) {

            return;

          }


          link.href =
            "archive.html?file=" +
            encodeURIComponent(
              resolved
            ) +
            suffix;

        }

      }
    );

}


/* =========================================================
   TABLE WRAPPER
   ========================================================= */

function improveTables() {

  documentElement
    .querySelectorAll("table")
    .forEach(
      table => {

        if (
          table.parentElement &&
          table.parentElement.classList.contains(
            "archive-table-wrap"
          )
        ) {

          return;

        }


        const wrapper =
          document.createElement(
            "div"
          );


        wrapper.className =
          "archive-table-wrap";


        table.parentNode.insertBefore(
          wrapper,
          table
        );


        wrapper.appendChild(
          table
        );

      }
    );

}


/* =========================================================
   CSV PARSER
   ========================================================= */

function parseCSV(text) {

  const rows = [];

  let row = [];

  let cell = "";

  let insideQuotes =
    false;


  for (
    let i = 0;
    i < text.length;
    i++
  ) {

    const char =
      text[i];


    const next =
      text[i + 1];


    if (
      char === '"' &&
      insideQuotes &&
      next === '"'
    ) {

      cell += '"';

      i++;

      continue;

    }


    if (
      char === '"'
    ) {

      insideQuotes =
        !insideQuotes;

      continue;

    }


    if (
      char === "," &&
      !insideQuotes
    ) {

      row.push(
        cell
      );

      cell = "";

      continue;

    }


    if (
      (
        char === "\n" ||
        char === "\r"
      ) &&
      !insideQuotes
    ) {

      if (
        char === "\r" &&
        next === "\n"
      ) {

        i++;

      }


      row.push(
        cell
      );


      rows.push(
        row
      );


      row = [];

      cell = "";

      continue;

    }


    cell += char;

  }


  if (
    cell.length ||
    row.length
  ) {

    row.push(
      cell
    );


    rows.push(
      row
    );

  }


  return rows;

}


/* =========================================================
   CSV RENDERER
   ========================================================= */

function renderCSV(
  text,
  filename
) {

  const rows =
    parseCSV(text);


  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "archive-resource-table";


  const table =
    document.createElement(
      "table"
    );


  rows.forEach(
    (row, index) => {

      const tr =
        document.createElement(
          "tr"
        );


      row.forEach(
        value => {

          const cell =
            document.createElement(
              index === 0
                ? "th"
                : "td"
            );


          cell.textContent =
            value;


          tr.appendChild(
            cell
          );

        }
      );


      table.appendChild(
        tr
      );

    }
  );


  wrapper.appendChild(
    table

/* =========================================================
   RESOURCE ROUTER
   ========================================================= */

async function loadResource(
  path,
  filename
) {

  const ext =
    getExtension(
      path
    );


  sourceElement.textContent =
    path;


  /* ---------------------------------------------------------
     HTML
     --------------------------------------------------------- */

  if (
    ext === ".html" ||
    ext === ".htm"
  ) {

    renderHTMLPage(
      path,
      filename
    );

    return;

  }


  /* ---------------------------------------------------------
     PDF
     --------------------------------------------------------- */

  if (
    ext === ".pdf"
  ) {

    renderPDF(
      path,
      filename
    );

    return;

  }


  /* ---------------------------------------------------------
     IMAGES / SVG
     --------------------------------------------------------- */

  if (
    [
      ".svg",
      ".png",
      ".jpg",
      ".jpeg",
      ".gif",
      ".webp",
      ".avif",
      ".bmp",
      ".ico"
    ].includes(ext)
  ) {

    renderImage(
      path,
      filename
    );

    return;

  }


  /* ---------------------------------------------------------
     AUDIO / VIDEO
     --------------------------------------------------------- */

  if (
    [
      ".mp3",
      ".wav",
      ".ogg",
      ".oga",
      ".m4a",
      ".aac",
      ".flac",
      ".mp4",
      ".webm",
      ".ogv",
      ".mov"
    ].includes(ext)
  ) {

    renderMedia(
      path,
      filename
    );

    return;

  }


  /* ---------------------------------------------------------
     CSV
     --------------------------------------------------------- */

  if (
    ext === ".csv"
  ) {

    try {

      const response =
        await fetch(
          path,
          {
            cache: "no-cache"
          }
        );


      if (
        !response.ok
      ) {

        throw new Error(
          "HTTP " +
          response.status +
          " — " +
          path
        );

      }


      const text =
        await response.text();


      renderCSV(
        text,
        filename
      );


    } catch (
      error
    ) {

      renderError(
        error
      );

    }


    return;

  }


  /* ---------------------------------------------------------
     TEXT
     --------------------------------------------------------- */

  if (
    [
      ".txt",
      ".json",
      ".xml",
      ".yaml",
      ".yml",
      ".log"
    ].includes(ext)
  ) {

    try {

      const response =
        await fetch(
          path,
          {
            cache: "no-cache"
          }
        );


      if (
        !response.ok
      ) {

        throw new Error(
          "HTTP " +
          response.status +
          " — " +
          path
        );

      }


      const text =
        await response.text();


      renderText(
        text,
        filename
      );


    } catch (
      error
    ) {

      renderError(
        error
      );

    }


    return;

  }


  /* ---------------------------------------------------------
     UNKNOWN RESOURCE
     --------------------------------------------------------- */

  const resource =
    document.createElement(
      "div"
    );


  resource.className =
    "archive-resource";


  const note =
    document.createElement(
      "div"
    );


  note.className =
    "archive-resource-note";


  const strong =
    document.createElement(
      "strong"
    );


  strong.textContent =
    "Resource: ";


  note.appendChild(
    strong
  );


  note.appendChild(
    document.createTextNode(
      filename
    )
  );


  const link =
    document.createElement(
      "a"
    );


  link.className =
    "archive-resource-download";


  link.href =
    path;


  link.target =
    "_blank";


  link.rel =
    "noopener noreferrer";


  link.textContent =
    "Open resource";


  resource.appendChild(
    note
  );


  resource.appendChild(
    link
  );


  documentElement.replaceChildren(
    resource
  );


  titleElement.textContent =
    humanTitle(
      filename
    );

}

/* =========================================================
   MARKDOWN PATH
   ========================================================= */

/*
 * Converts the value supplied in:
 *
 *   ?doc=...
 *
 * into a real repository path.
 *
 * Supported:
 *
 *   README.md
 *   docs/README.md
 *   docs/foo/README.md
 *   foo/bar/file.md
 *
 * Filename-only requests are resolved against the discovered
 * GitHub tree when possible.
 */

function resolveMarkdownDocument(
  value
) {

  if (
    !value
  ) {

    return null;

  }


  let requested =
    value
      .trim()
      .replace(/^\/+/, "")
      .replace(/\\/g, "/");


  /*
   * Remove query/hash if present.
   */
  const hash =
    requested.indexOf("#");


  const query =
    requested.indexOf("?");


  let cut =
    -1;


  if (
    hash >= 0 &&
    query >= 0
  ) {

    cut =
      Math.min(
        hash,
        query
      );

  } else if (
    hash >= 0
  ) {

    cut =
      hash;

  } else if (
    query >= 0
  ) {

    cut =
      query;

  }


  if (
    cut >= 0
  ) {

    requested =
      requested.slice(
        0,
        cut
      );

  }


  if (
    !requested
  ) {

    return null;

  }


  /*
   * Markdown only.
   */
  if (
    !requested
      .toLowerCase()
      .endsWith(".md")
  ) {

    return null;

  }


  /*
   * Security.
   */
  if (
    requested.includes("..") ||
    requested.startsWith("/") ||
    requested.includes("\\")
  ) {

    return null;

  }


  /*
   * ---------------------------------------------------------
   * DIRECT PATH
   * ---------------------------------------------------------
   *
   * If the user supplied:
   *
   * docs/foo/bar.md
   *
   * use exactly that path.
   */

  if (
    requested.includes("/")
  ) {

    return requested;

  }


  /*
   * ---------------------------------------------------------
   * SHORT FORM
   * ---------------------------------------------------------
   *
   * First assume the historical /docs/ location.
   */

  const docsPath =
    "docs/" +
    requested;


  /*
   * If it is known, use it.
   */
  if (
    allowedDocuments.some(
      path =>
        path.toLowerCase() ===
        docsPath.toLowerCase()
    )
  ) {

    return docsPath;

  }


  /*
   * ---------------------------------------------------------
   * SEARCH DISCOVERED TREE
   * ---------------------------------------------------------
   *
   * Find a unique matching filename anywhere in repository.
   */

  const matches =
    allowedDocuments.filter(
      path => {

        const filename =
          path
            .split("/")
            .filter(Boolean)
            .pop();


        return (
          filename &&
          filename.toLowerCase() ===
          requested.toLowerCase()
        );

      }
    );


  if (
    matches.length === 1
  ) {

    return matches[0];

  }


  /*
   * ---------------------------------------------------------
   * HISTORICAL STATIC FALLBACK
   * ---------------------------------------------------------
   */

  if (
    allowedDocuments.some(
      path =>
        path.toLowerCase() ===
        requested.toLowerCase()
    )
  ) {

    return (
      "docs/" +
      requested
    );

  }


  /*
   * Even if GitHub discovery did not know the file,
   * the historical /docs/ convention is still valid.
   */

  return docsPath;

}


/* =========================================================
   LOAD MARKDOWN
   ========================================================= */

async function loadMarkdownDocument() {

  if (
    !requestedDocument
  ) {

    renderError(
      new Error(
        "No Markdown document was specified."
      )
    );

    return;

  }


  const sourcePath =
    resolveMarkdownDocument(
      requestedDocument
    );


  if (
    !sourcePath
  ) {

    renderError(
      new Error(
        "Invalid Markdown document path."
      )
    );

    return;

  }


  /*
   * IMPORTANT:
   *
   * sourcePath is already the complete path.
   *
   * DO NOT add "docs/" here.
   */

  sourceElement.textContent =
    sourcePath;


  const filename =
    sourcePath
      .split("/")
      .filter(Boolean)
      .pop();


  titleElement.textContent =
    humanTitle(
      filename ||
      requestedDocument
    );


  document.title =
    "AUF2026 — " +
    humanTitle(
      filename ||
      requestedDocument
    );


  try {

    console.log(
      "AUF2026 Archive: loading Markdown:",
      sourcePath
    );


    const response =
      await fetch(
        sourcePath,
        {
          cache: "no-cache"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "HTTP " +
        response.status +
        " while loading " +
        sourcePath
      );

    }


    const markdown =
      await response.text();


    if (
      !markdown.trim()
    ) {

      throw new Error(
        "Markdown file is empty: " +
        sourcePath
      );

    }


    /*
     * Check parser.
     */

    if (
      typeof marked ===
      "undefined"
    ) {

      throw new Error(
        "The 'marked' Markdown parser is not loaded."
      );

    }


    /*
     * Configure marked.
     */

    if (
      typeof marked.setOptions ===
      "function"
    ) {

      marked.setOptions({

        gfm: true,

        breaks: true

      });

    }


    /*
     * Parse Markdown.
     */

    const html =
      marked.parse(
        markdown
      );


    documentElement.innerHTML =
      html;


    /*
     * Normalize links after rendering.
     */

    normalizeMarkdownLinks();


    /*
     * Improve tables.
     */

    improveTables();


    /*
     * Final title.
     */

    document.title =
      "AUF2026 — " +
      humanTitle(
        filename ||
        requestedDocument
      );


    console.log(
      "AUF2026 Archive: Markdown loaded:",
      sourcePath
    );


  } catch (
    error
  ) {

    renderError(
      error
    );

  }

}

      "vimeo.com",
      "www.vimeo.com",
      "player.vimeo.com"

    const hostname =

    if (

        hostname
      )
    ) {

      renderError(

    );

    return true;

  }

/* =========================================================
   MARKDOWN PATH RESOLUTION
   ========================================================= */

/*
 * This function is the single source of truth for Markdown
 * resolution.
 *
 * Accepted:
 *
 *   README.md
 *   docs/README.md
 *   docs/foo/README.md
 *
 * The function NEVER blindly prepends "docs/" to a path
 * that already contains a directory.
 */

function resolveRequestedMarkdown(
  requested
) {

  if (
    !requested
  ) {

    return null;

  }


  let value =
    requested
      .trim()
      .replace(/^\/+/, "")
      .replace(/\\/g, "/");


  /*
   * Remove URL query/hash from the document name.
   */
  const hashIndex =
    value.indexOf("#");


  const queryIndex =
    value.indexOf("?");


  let cutIndex = -1;


  if (
    hashIndex >= 0 &&
    queryIndex >= 0
  ) {

    cutIndex =
      Math.min(
        hashIndex,
        queryIndex
      );

  } else if (
    hashIndex >= 0
  ) {

    cutIndex =
      hashIndex;

  } else if (
    queryIndex >= 0
  ) {

    cutIndex =
      queryIndex;

  }


  if (
    cutIndex >= 0
  ) {

    value =
      value.slice(
        0,
        cutIndex
      );

  }


  if (
    !value
  ) {

    return null;

  }


  /*
   * Markdown only.
   */
  if (
    !value
      .toLowerCase()
      .endsWith(".md")
  ) {

    return null;

  }


  /*
   * Reject traversal.
   */
  if (
    value.includes("..")
  ) {

    return null;

  }


  /*
   * ---------------------------------------------------------
   * CASE 1
   *
   * Complete repository path.
   *
   * Example:
   *
   * docs/README.md
   * archive/docs/foo.md
   * research/source.md
   * ---------------------------------------------------------
   */

  if (
    value.includes("/")
  ) {

    const exact =
      allowedDocuments.find(
        path =>
          path.toLowerCase() ===
          value.toLowerCase()
      );


    if (
      exact
    ) {

      return exact;

    }


    return null;

  }


  /*
   * ---------------------------------------------------------
   * CASE 2
   *
   * Historical short form.
   *
   * README.md
   *
   * First try docs/README.md.
   * ---------------------------------------------------------
   */

  const docsCandidate =
    "docs/" +
    value;


  const docsMatch =
    allowedDocuments.find(
      path =>
        path.toLowerCase() ===
        docsCandidate.toLowerCase()
    );


  if (
    docsMatch
  ) {

    return docsMatch;

  }


  /*
   * ---------------------------------------------------------
   * CASE 3
   *
   * Static historical entries.
   *
   * The original array contains:
   *
   * README.md
   *
   * even though the physical file is:
   *
   * docs/README.md
   *
   * ---------------------------------------------------------
   */

  const staticMatch =
    allowedDocuments.find(
      path =>
        path.toLowerCase() ===
        value.toLowerCase()
    );


  if (
    staticMatch
  ) {

    /*
     * If this is already a complete discovered path,
     * return it.
     */
    if (
      staticMatch.includes("/")
    ) {

      return staticMatch;

    }


    /*
     * Historical short-form entry.
     */
    return (
      "docs/" +
      staticMatch
    );

  }


  /*
   * ---------------------------------------------------------
   * CASE 4
   *
   * Search recursively by filename.
   *
   * Example:
   *
   * ?doc=FAURE-THEOREM-NO-GOD.md
   *
   * can resolve:
   *
   * research/theorems/FAURE-THEOREM-NO-GOD.md
   *
   * ---------------------------------------------------------
   */

  const matches =
    allowedDocuments.filter(
      path => {

        const filename =
          path
            .split("/")
            .filter(Boolean)
            .pop();


        return (
          filename &&
          filename.toLowerCase() ===
          value.toLowerCase()
        );

      }
    );


  /*
   * Only accept a filename-only request when it resolves
   * uniquely.
   */
  if (
    matches.length === 1
  ) {

    return matches[0];

  }


  /*
   * Ambiguous or nonexistent.
   */
  return null;

}


/* =========================================================
   LOAD MARKDOWN DOCUMENT
   ========================================================= */

async function loadMarkdownDocument() {

  if (
    !requestedDocument
  ) {

    renderError(
      new Error(
        "Markdown document not specified."
      )
    );

    return;

  }


  /*
   * Resolve the actual repository path.
   */
  const resolvedPath =
    resolveRequestedMarkdown(
      requestedDocument
    );


  if (
    !resolvedPath
  ) {

    renderError(
      new Error(
        "Markdown document not found: " +
        requestedDocument
      )
    );

    return;

  }


  /*
   * IMPORTANT:
   *
   * Do NOT prepend docs/ here.
   *
   * resolveRequestedMarkdown() already returned the
   * complete repository path.
   */
  const sourcePath =
    resolvedPath;


  const filename =
    sourcePath
      .split("/")
      .filter(Boolean)
      .pop();


  titleElement.textContent =
    humanTitle(
      filename ||
      requestedDocument
    );


  sourceElement.textContent =
    sourcePath;


  try {

    const response =
      await fetch(
        sourcePath,
        {
          cache: "no-cache"
        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status +
        " while loading " +
        sourcePath
      );

    }


    const markdown =
      await response.text();


    /*
     * Verify that we actually received something.
     */
    if (
      !markdown.trim()
    ) {

      throw new Error(
        "The Markdown file is empty: " +
        sourcePath
      );

    }


    /*
     * marked must exist.
     */
    if (
      typeof marked ===
      "undefined"
    ) {

      throw new Error(
        "Markdown parser 'marked' is not available."
      );

    }


    marked.setOptions({

      gfm: true,

      breaks: true

    });


    documentElement.innerHTML =
      marked.parse(
        markdown
      );


    /*
     * Convert .md links to archive.html?doc=...
     */
    normalizeMarkdownLinks();


    /*
     * Make tables horizontally scrollable.
     */
    improveTables();


    /*
     * Set final browser title.
     */
    document.title =
      "AUF2026 — " +
      humanTitle(
        filename ||
        requestedDocument
      );


  } catch (error) {

    renderError(
      error
    );

  }

}

/* =========================================================

   ========================================================= */

async function startArchive() {

  /*
   * First discover the complete repository tree.
   *
   * This populates allowedDocuments with paths such as:
   *
   *   docs/README.md
   *   docs/FAURE-THEOREM-NO-GOD.md
   *   research/foo/bar.md
   *
   * If GitHub is unavailable, the static fallback entries
   * remain usable.
   */
  await discoverMarkdownDocuments();


  /*
   * External embed has highest priority.
   */
  if (
    loadExternalEmbed()
  ) {

    return;

  }


  /*
   * HTML page.
   */
  if (
    requestedPage
  ) {

    loadPage();

    return;

  }


  /*
   * Generic resource.
   */
  if (
    requestedResource
  ) {

    loadGenericResource();

    return;

  }


  /*
   * Markdown document.
   */
  if (
    requestedDocument
  ) {

    await loadMarkdownDocument();

    return;

  }


  /*
   * Nothing requested.
   */
  documentElement.innerHTML = "";


  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "archive-error";


  const heading =
    document.createElement(
      "strong"
    );


  heading.textContent =
    "Resource not specified.";


  const paragraph =
    document.createElement(
      "p"
    );


  paragraph.textContent =
    "Select a document, page or resource " +
    "from the AUF2026 research archive.";


  wrapper.appendChild(
    heading
  );


  wrapper.appendChild(
    paragraph
  );


  documentElement.appendChild(
    wrapper
  );


  sourceElement.textContent =
    "not specified";


  document.title =
    "AUF2026 — Research Archive";

}


/* =========================================================
   START
   ========================================================= */

startArchive();

/* =========================================================
   ERROR
   ========================================================= */

function renderError(
  error
) {

  const message =
    error &&
    error.message
      ? error.message
      : "Unknown error.";


  documentElement.replaceChildren();


  const container =
    document.createElement(
      "div"
    );


  container.className =
    "archive-error";


  const strong =
    document.createElement(
      "strong"
    );


  strong.textContent =
    "Unable to load resource.";


  const paragraph =
    document.createElement(
      "p"
    );


  paragraph.textContent =
    message;


  container.appendChild(
    strong
  );


  container.appendChild(
    paragraph
  );


  documentElement.appendChild(
    container
  );

}


/* =========================================================
   LOAD MARKDOWN DOCUMENT
   ========================================================= */

async function loadMarkdownDocument() {

  if (
    !requestedDocument
  ) {

    renderError(
      new Error(
        "Document not specified."
      )
    );

    return;

  }


  /*
   * Resolve the requested document through the
   * repository discovery system.
   *
   * Supported:
   *
   *   archive.html?doc=README.md
   *
   *   archive.html?doc=docs/README.md
   *
   *   archive.html?doc=folder/example.md
   */
  const sourcePath =
    resolveMarkdownPath(
      requestedDocument
    );


  if (
    !sourcePath
  ) {

    renderError(
      new Error(
        "Markdown document not found or not allowed."
      )
    );

    return;

  }


  if (
    !sourcePath
      .toLowerCase()
      .endsWith(
        ".md"
      )
  ) {

    renderError(
      new Error(
        "Invalid Markdown document path."
      )
    );

    return;

  }


  const filename =
    sourcePath
      .split("/")
      .filter(
        Boolean
      )
      .pop();


  titleElement.textContent =
    humanTitle(
      filename
    );


  sourceElement.textContent =
    sourcePath;


  try {

    const response =
      await fetch(
        sourcePath,
        {
          cache: "no-cache"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const markdown =
      await response.text();


    if (
      typeof marked ===
      "undefined"
    ) {

      throw new Error(
        "Markdown renderer is unavailable."
      );

    }


    marked.setOptions({

      gfm: true,

      breaks: true

    });


    documentElement.innerHTML =
      marked.parse(
        markdown
      );


    normalizeMarkdownLinks(
      sourcePath
    );


    improveTables();


    document.title =
      "AUF2026 — " +
      humanTitle(
        filename
      );


  } catch (
    error
  ) {

    console.error(
      "AUF2026 Archive:",
      error
    );


    renderError(
      error
    );

  }

}

/* =========================================================
   START
   ========================================================= */

async function startArchive() {

  /*
   * Discover the current repository tree before
   * resolving any Markdown document.
   *
   * This allows newly-created Markdown files to become
   * available without manually editing allowedDocuments.
   */
  await discoverMarkdownDocuments();


  /*
   * Routing priority:
   *
   *   1. External embed
   *   2. HTML page
   *   3. Generic resource
   *   4. Markdown document
   *   5. Empty archive state
   */

  if (
    loadExternalEmbed()
  ) {

    return;

  }


  if (
    requestedPage
  ) {

    loadPage();

    return;

  }


  if (
    requestedResource
  ) {

    loadGenericResource();

    return;

  }


  if (
    requestedDocument
  ) {

    await loadMarkdownDocument();

    return;

  }


  documentElement.innerHTML = `

    <div class="archive-error">

      <strong>
        Resource not specified.
      </strong>

      <p>
        Select a document, page or resource
        from the AUF2026 research archive.
      </p>

    </div>

  `;


  sourceElement.textContent =
    "not specified";


  titleElement.textContent =
    "Research Archive";


  document.title =
    "AUF2026 — Research Archive";

}
