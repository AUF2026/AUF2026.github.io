<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AUF2026 — Research Archive</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    /* =========================================================
       ARCHIVE PAGE
       ========================================================= */

    .archive-page {
      width: min(940px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 90px;
    }


    /* =========================================================
       TOP NAVIGATION
       ========================================================= */

    .archive-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 32px;
    }


    .archive-back {
      display: inline-flex;
      align-items: center;
      gap: 9px;

      appearance: none;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 10px;

      padding: 9px 15px;

      background:
        rgba(255,255,255,.045);

      color: inherit;

      font: inherit;
      font-size: .78rem;
      font-weight: 600;

      letter-spacing: .08em;
      text-transform: uppercase;

      cursor: pointer;

      transition:
        background .2s ease,
        border-color .2s ease,
        transform .2s ease;
    }


    .archive-back:hover {
      background:
        rgba(255,255,255,.09);

      border-color:
        rgba(255,255,255,.18);

      transform:
        translateX(-2px);
    }


    .archive-back:active {
      transform:
        translateX(-1px);
    }


    .archive-back-arrow {
      font-size: 1rem;
      line-height: 1;
      opacity: .8;
    }


    .archive-top-label {
      font-size: .72rem;
      letter-spacing: .13em;
      text-transform: uppercase;
      opacity: .42;
    }


    /* =========================================================
       HEADER
       ========================================================= */

    .archive-header {
      margin-bottom: 30px;
    }


    .archive-kicker {
      margin-bottom: 10px;

      font-size: .72rem;
      font-weight: 600;

      letter-spacing: .16em;
      text-transform: uppercase;

      opacity: .48;
    }


    .archive-header h1 {
      margin: 0 0 12px;

      line-height: 1.12;
      letter-spacing: -.025em;
    }


    .archive-subtitle {
      max-width: 760px;
      margin: 0;

      line-height: 1.7;
      font-size: .95rem;

      opacity: .60;
    }


    /* =========================================================
       DOCUMENT STATUS
       ========================================================= */

    .archive-status {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;

      margin-bottom: 14px;
      padding: 11px 14px;

      border:
        1px solid rgba(255,255,255,.075);

      border-radius: 10px;

      background:
        rgba(255,255,255,.025);

      font-size: .72rem;
      line-height: 1.4;

      color: inherit;

      opacity: .72;
    }


    .archive-status strong {
      font-weight: 600;
      opacity: .95;
    }


    /* =========================================================
       DOCUMENT CONTAINER
       ========================================================= */

    .archive-document {

      padding: 42px 46px;

      border:
        1px solid rgba(255,255,255,.075);

      border-radius: 16px;

      /*
       * Important:
       * Do not use a white document background.
       *
       * The archive intentionally follows the site's
       * dark / muted visual language.
       */

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.045),
          rgba(255,255,255,.022)
        );

      box-shadow:
        0 18px 55px rgba(0,0,0,.18);

      color: inherit;

      overflow-wrap: anywhere;
    }


    /* =========================================================
       MARKDOWN TYPOGRAPHY
       ========================================================= */

    .archive-document h1,
    .archive-document h2,
    .archive-document h3,
    .archive-document h4,
    .archive-document h5,
    .archive-document h6 {

      line-height: 1.25;
      letter-spacing: -.015em;

    }


    .archive-document h1 {

      margin-top: 0;
      margin-bottom: 1.2rem;

      font-size: 2rem;

    }


    .archive-document h2 {

      margin-top: 2.8rem;
      margin-bottom: 1rem;
      padding-bottom: .65rem;

      font-size: 1.45rem;

      border-bottom:
        1px solid rgba(255,255,255,.09);

    }


    .archive-document h3 {

      margin-top: 2rem;
      margin-bottom: .8rem;

      font-size: 1.15rem;

    }


    .archive-document h4 {

      margin-top: 1.6rem;

    }


    .archive-document p {

      margin:
        0 0 1.05rem;

      line-height: 1.78;

    }


    .archive-document ul,
    .archive-document ol {

      margin:
        0 0 1.2rem;

      padding-left: 1.5rem;

    }


    .archive-document li {

      margin-bottom: .4rem;
      line-height: 1.7;

    }


    /* =========================================================
       LINKS
       ========================================================= */

    .archive-document a {

      color: inherit;

      text-decoration:
        underline;

      text-decoration-color:
        rgba(255,255,255,.28);

      text-underline-offset:
        3px;

      transition:
        color .2s ease,
        text-decoration-color .2s ease;

    }


    .archive-document a:hover {

      text-decoration-color:
        currentColor;

      opacity: .8;

    }


    /* =========================================================
       TABLES
       ========================================================= */

    .archive-table-wrap {

      width: 100%;
      overflow-x: auto;

      margin:
        1.5rem 0;

      border:
        1px solid rgba(255,255,255,.075);

      border-radius: 10px;

    }


    .archive-document table {

      width: 100%;
      min-width: 620px;

      margin: 0;

      border-collapse: collapse;

      background:
        rgba(0,0,0,.08);

    }


    .archive-document th,
    .archive-document td {

      padding:
        .72rem .8rem;

      border:
        1px solid rgba(255,255,255,.07);

      text-align: left;
      vertical-align: top;

      line-height: 1.55;

    }


    .archive-document th {

      background:
        rgba(255,255,255,.055);

      font-weight: 600;

    }


    .archive-document tr:nth-child(even) td {

      background:
        rgba(255,255,255,.018);

    }


    /* =========================================================
       CODE
       ========================================================= */

    .archive-document code {

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        monospace;

      font-size: .88em;

    }


    .archive-document :not(pre) > code {

      padding:
        .15em .38em;

      border-radius: 5px;

      background:
        rgba(0,0,0,.18);

      border:
        1px solid rgba(255,255,255,.06);

    }


    .archive-document pre {

      margin:
        1.5rem 0;

      padding:
        1.2rem 1.3rem;

      overflow-x: auto;

      border:
        1px solid rgba(255,255,255,.07);

      border-radius: 10px;

      background:
        rgba(0,0,0,.25);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.025);

      line-height: 1.6;

    }


    .archive-document pre code {

      padding: 0;

      background: transparent;

      border: 0;

      font-size: .84rem;

    }


    /* =========================================================
       BLOCKQUOTE
       ========================================================= */

    .archive-document blockquote {

      margin:
        1.5rem 0;

      padding:
        .9rem 1.2rem;

      border-left:
        3px solid rgba(255,255,255,.25);

      border-radius:
        0 8px 8px 0;

      background:
        rgba(255,255,255,.035);

      opacity: .84;

    }


    .archive-document blockquote p:last-child {

      margin-bottom: 0;

    }


    /* =========================================================
       HORIZONTAL RULE
       ========================================================= */

    .archive-document hr {

      height: 1px;

      margin:
        2.2rem 0;

      border: 0;

      background:
        rgba(255,255,255,.09);

    }


    /* =========================================================
       IMAGES
       ========================================================= */

    .archive-document img {

      display: block;

      max-width: 100%;
      height: auto;

      margin:
        1.5rem auto;

      border-radius: 10px;

      border:
        1px solid rgba(255,255,255,.08);

    }


    /* =========================================================
       LISTS / CHECKBOXES
       ========================================================= */

    .archive-document input[type="checkbox"] {

      margin-right: .45rem;

      accent-color:
        currentColor;

    }


    /* =========================================================
       ERROR
       ========================================================= */

    .archive-error {

      padding: 1.4rem;

      border:
        1px solid rgba(220,80,80,.25);

      border-radius: 12px;

      background:
        rgba(220,80,80,.055);

      line-height: 1.65;

    }


    .archive-error strong {

      display: block;
      margin-bottom: .5rem;

    }


    /* =========================================================
       LOADING
       ========================================================= */

    .archive-loading {

      padding:
        2rem 0;

      text-align: center;

      opacity: .45;

      font-size: .85rem;

    }


    /* =========================================================
       BOTTOM BACK BUTTON
       ========================================================= */

    .archive-footer {

      display: flex;
      justify-content: center;

      margin-top: 28px;

    }


    .archive-back-bottom {

      display: inline-flex;
      align-items: center;
      gap: 9px;

      padding:
        9px 16px;

      border:
        1px solid rgba(255,255,255,.08);

      border-radius: 9px;

      background:
        rgba(255,255,255,.035);

      color: inherit;

      font: inherit;
      font-size: .72rem;
      font-weight: 600;

      letter-spacing: .1em;
      text-transform: uppercase;

      cursor: pointer;

      transition:
        background .2s ease,
        border-color .2s ease;

    }


    .archive-back-bottom:hover {

      background:
        rgba(255,255,255,.075);

      border-color:
        rgba(255,255,255,.15);

    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 760px) {

      .archive-page {

        width:
          min(100% - 22px, 940px);

        padding:
          24px 0 60px;

      }


      .archive-topbar {

        margin-bottom: 24px;

      }


      .archive-top-label {

        display: none;

      }


      .archive-header {

        margin-bottom: 24px;

      }


      .archive-header h1 {

        font-size: 1.65rem;

      }


      .archive-subtitle {

        font-size: .9rem;

      }


      .archive-status {

        flex-direction: column;
        align-items: flex-start;

        gap: 5px;

      }


      .archive-document {

        padding:
          25px 20px;

        border-radius: 13px;

      }


      .archive-document h1 {

        font-size: 1.65rem;

      }


      .archive-document h2 {

        font-size: 1.3rem;

        margin-top:
          2.2rem;

      }


      .archive-document pre {

        margin-left: -5px;
        margin-right: -5px;

        border-radius: 8px;

        padding:
          1rem;

      }

    }

  </style>

</head>


<body>


  <!-- =========================================================
       ARCHIVE
       ========================================================= -->

  <main class="archive-page">


    <!-- =======================================================
         TOP BAR
         ======================================================= -->

    <nav class="archive-topbar">

      <button
        type="button"
        class="archive-back"
        id="back-button"
        aria-label="Go back"
      >

        <span
          class="archive-back-arrow"
          aria-hidden="true"
        >
          ←
        </span>

        <span>
          Back
        </span>

      </button>


      <span class="archive-top-label">
        AUF2026 · Research Archive
      </span>

    </nav>


    <!-- =======================================================
         HEADER
         ======================================================= -->

    <header class="archive-header">

      <div class="archive-kicker">
        AUF2026 · Research Archive
      </div>


      <h1 id="document-title">
        Research Document
      </h1>


      <p class="archive-subtitle">
        Canonical research documentation rendered from the
        AUF2026 Markdown corpus.
      </p>

    </header>


    <!-- =======================================================
         SOURCE STATUS
         ======================================================= -->

    <div class="archive-status">

      <span>

        SOURCE:

        <strong id="document-source">
          loading...
        </strong>

      </span>


      <span>
        FORMAT:
        <strong>Markdown → HTML</strong>
      </span>

    </div>


    <!-- =======================================================
         DOCUMENT
         ======================================================= -->

    <article
      id="document"
      class="archive-document"
    >

      <div class="archive-loading">
        Loading document...
      </div>

    </article>


    <!-- =======================================================
         FOOTER BACK
         ======================================================= -->

    <div class="archive-footer">

      <button
        type="button"
        class="archive-back-bottom"
        id="back-button-bottom"
      >

        <span aria-hidden="true">
          ←
        </span>

        Back to archive

      </button>

    </div>


  </main>


  <!-- =========================================================
       MARKDOWN RENDERER
       ========================================================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
  ></script>


  <!-- =========================================================
       ARCHIVE LOADER
       ========================================================= -->

  <script>

    /* =========================================================
       URL PARAMETERS
       ========================================================= */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const requestedDocument =
      params.get("doc");


    /* =========================================================
       DOM REFERENCES
       ========================================================= */

    const documentElement =
      document.getElementById(
        "document"
      );


    const titleElement =
      document.getElementById(
        "document-title"
      );


    const sourceElement =
      document.getElementById(
        "document-source"
      );


    /* =========================================================
       ALLOWED DOCUMENTS
       ========================================================= */

    const allowedDocuments = [

      "ARCHIVE-MAP.md",
      "AUTHOR-IDENTITY.md",
      "BIBLIOGRAPHIC-NOVELTY-MATRIX.md",
      "CLAIMS.md",
      "CONFIGURATION-MATRIX.md",
      "CORE-GENEALOGY.md",
      "CORPUS-INDEX.md",
      "EXTRACTION-STATUS.md",
      "LOCAL-CORPUS-MAP.md",
      "LOCAL-CORPUS-ROOTS.md",
      "NEXT-SESSION.md",
      "OBJECT-REGISTRY.md",
      "PROOF-INGESTION-PROTOCOL.md",
      "PROOF-REGISTRY.md",
      "README.md",
      "REPOSITORY-MAP.md",
      "RESEARCH-REGISTER.md",
      "SOURCE-INVENTORY.md",
      "SOURCE-MANIFEST.md",
      "THEOREM-ORIGINALITY-MATRIX.md"

    ];


    /* =========================================================
       HUMAN READABLE TITLE
       ========================================================= */

    function humanTitle(
      filename
    ) {

      return filename

        .replace(
          /\.md$/i,
          ""
        )

        .replace(
          /[-_]+/g,
          " "
        )

        .replace(
          /\b\w/g,
          character =>
            character.toUpperCase()
        );

    }


    /* =========================================================
       BACK NAVIGATION
       ========================================================= */

    function goBack() {

      /*
       * Prefer browser history so the user returns to the
       * exact archive page / previous state.
       */

      if (
        window.history.length > 1
      ) {

        window.history.back();

        return;

      }


      /*
       * Fallback when archive.html was opened directly.
       */

      window.location.href =
        "index.html";

    }


    document
      .getElementById(
        "back-button"
      )
      .addEventListener(
        "click",
        goBack
      );


    document
      .getElementById(
        "back-button-bottom"
      )
      .addEventListener(
        "click",
        goBack
      );


    /* =========================================================
       MARKDOWN LINK NORMALIZATION
       ========================================================= */

    function normalizeMarkdownLinks() {

      documentElement
        .querySelectorAll(
          "a"
        )
        .forEach(
          link => {

            const href =
              link.getAttribute(
                "href"
              );


            if (
              !href
            ) {

              return;

            }


            /*
             * Ignore absolute URLs.
             */

            if (
              href.startsWith(
                "http://"
              ) ||
              href.startsWith(
                "https://"
              ) ||
              href.startsWith(
                "mailto:"
              ) ||
              href.startsWith(
                "#"
              )
            ) {

              return;

            }


            /*
             * Markdown document links.
             */

            if (
              href
                .toLowerCase()
                .endsWith(
                  ".md"
                )
            ) {

              /*
               * Remove a possible docs/ prefix.
               */

              const filename =
                href
                  .split("/")
                  .pop();


              if (
                allowedDocuments.includes(
                  filename
                )
              ) {

                link.href =
                  "archive.html?doc=" +
                  encodeURIComponent(
                    filename
                  );

              }

            }

          }
        );

    }


    /* =========================================================
       MARKDOWN TABLE WRAPPER
       ========================================================= */

    function improveTables() {

      documentElement
        .querySelectorAll(
          "table"
        )
        .forEach(
          table => {

            /*
             * Avoid wrapping the same table twice.
             */

            if (
              table.parentElement &&
              table.parentElement.classList.contains(
                "archive-table-wrap"
              )
            ) {

              return;

            }


            const wrapper =
              document.createElement(
                "div"
              );


            wrapper.className =
              "archive-table-wrap";


            table.parentNode.insertBefore(
              wrapper,
              table
            );


            wrapper.appendChild(
              table
            );

          }
        );

    }


    /* =========================================================
       LOAD DOCUMENT
       ========================================================= */

    async function loadDocument() {

      if (
        !requestedDocument ||
        !allowedDocuments.includes(
          requestedDocument
        )
      ) {

        documentElement.innerHTML = `

          <div class="archive-error">

            <strong>
              Document not specified.
            </strong>

            <p>
              Select a document from the AUF2026
              research archive.
            </p>

          </div>

        `;

        sourceElement.textContent =
          "not specified";

        return;

      }


      const sourcePath =
        "docs/" +
        requestedDocument;


      titleElement.textContent =
        humanTitle(
          requestedDocument
        );


      sourceElement.textContent =
        sourcePath;


      try {

        const response =
          await fetch(
            sourcePath,
            {
              cache: "no-cache"
            }
          );


        if (
          !response.ok
        ) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }


        const markdown =
          await response.text();


        /* =====================================================
           MARKED CONFIGURATION
           ===================================================== */

        marked.setOptions({

          gfm: true,

          breaks: true,

          headerIds: true,

          mangle: false

        });


        /* =====================================================
           RENDER MARKDOWN
           ===================================================== */

        documentElement.innerHTML =
          marked.parse(
            markdown
          );


        /* =====================================================
           POST PROCESSING
           ===================================================== */

        normalizeMarkdownLinks();

        improveTables();


        /* =====================================================
           PAGE TITLE
           ===================================================== */

        document.title =
          "AUF2026 — " +
          humanTitle(
            requestedDocument
          );


      } catch (
        error
      ) {

        console.error(
          "AUF2026 Archive:",
          error
        );


        documentElement.innerHTML = `

          <div class="archive-error">

            <strong>
              Unable to load document.
            </strong>

            <p>
              ${error.message}
            </p>

          </div>

        `;

      }

    }


    /* =========================================================
       START
       ========================================================= */

    loadDocument();

  </script>


</body>

</html>
