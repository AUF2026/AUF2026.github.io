  <script>
    /*
     * Apply the saved theme before the page is painted.
     * This prevents a white/light flash when dark mode is saved.
     */

    (function () {

      const key = "auf2026-theme";

      let theme =
        localStorage.getItem(key);

      if (
        theme !== "dark" &&
        theme !== "light"
      ) {

        theme =
          window.matchMedia &&
          window.matchMedia(
            "(prefers-color-scheme: light)"
          ).matches
            ? "light"
            : "dark";

      }

      document.documentElement.setAttribute(
        "data-theme",
        theme
      );

    })();

<script>

/* =========================================================
   THEME
   ========================================================= */

const THEME_STORAGE_KEY =
  "auf2026-theme";


function getCurrentTheme() {

  return (
    document.documentElement.getAttribute(
      "data-theme"
    ) || "dark"
  );

}


function updateThemeControls(theme) {

  const isLight =
    theme === "light";


  const toggle =
    document.getElementById(
      "theme-toggle"
    );


  const icon =
    document.getElementById(
      "theme-icon"
    );


  const label =
    document.getElementById(
      "theme-label"
    );


  if (toggle) {

    toggle.setAttribute(
      "aria-pressed",
      String(!isLight)
    );


    toggle.setAttribute(
      "aria-label",
      isLight
        ? "Switch to dark theme"
        : "Switch to light theme"
    );

  }


  if (icon) {

    icon.textContent =
      isLight
        ? "☀"
        : "☾";

  }


  if (label) {

    label.textContent =
      isLight
        ? "Light"
        : "Dark";

  }

}


function applyTheme(theme) {

  if (
    theme !== "dark" &&
    theme !== "light"
  ) {

    theme = "dark";

  }


  document.documentElement.setAttribute(
    "data-theme",
    theme
  );


  localStorage.setItem(
    THEME_STORAGE_KEY,
    theme
  );


  updateThemeControls(theme);

}


updateThemeControls(
  getCurrentTheme()
);


document
  .getElementById(
    "theme-toggle"
  )
  .addEventListener(
    "click",
    function () {

      const current =
        getCurrentTheme();


      applyTheme(
        current === "light"
          ? "dark"
          : "light"
      );

    }
  );


/* =========================================================
   URL PARAMETERS
   ========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const requestedDocument =
  params.get("doc");


const requestedPage =
  params.get("page");


const requestedResource =
  params.get("file");


/* =========================================================
   DOM REFERENCES
   ========================================================= */

const documentElement =

/* =========================================================
   MARKDOWN DOCUMENT DISCOVERY
   ========================================================= */

const GITHUB_OWNER =
  "AUF2026";


const GITHUB_REPOSITORY =
  "AUF2026.github.io";


const GITHUB_DOCS_PATH =
  "docs";


let allowedDocuments = [];


async function discoverMarkdownDocuments() {

  try {

    const apiURL =
      "https://api.github.com/repos/" +
      encodeURIComponent(
        GITHUB_OWNER
      ) +
      "/" +
      encodeURIComponent(
        GITHUB_REPOSITORY
      ) +
      "/contents/" +
      encodeURIComponent(
        GITHUB_DOCS_PATH
      );


    const response =
      await fetch(
        apiURL,
        {
          cache: "no-cache",
          headers: {
            "Accept":
              "application/vnd.github+json"
          }
        }
      );


    if (!response.ok) {

      throw new Error(
        "GitHub API HTTP " +
        response.status
      );

    }


    const entries =
      await response.json();


    if (!Array.isArray(entries)) {

      throw new Error(
        "Invalid GitHub directory response."
      );

    }


    allowedDocuments =
      entries

        .filter(entry =>
          entry.type === "file" &&
          typeof entry.name === "string" &&
          entry.name
            .toLowerCase()
            .endsWith(".md")
        )

        .map(entry =>
          entry.name
        )

        .sort(
          (a, b) =>
            a.localeCompare(
              b,
              undefined,
              {
                sensitivity: "base"
              }
            )
        );


    return true;

  } catch (error) {

    console.error(
      "AUF2026 Markdown discovery:",
      error
    );


    /*
     * Fallback minimo:
     * mantiene il loader operativo anche
     * se GitHub API non è temporaneamente disponibile.
     */

    allowedDocuments = [

      "README.md"

    ];


    return false;

  }

}


/* =========================================================
   PAGE / RESOURCE VALIDATION
   ========================================================= */

const allowedPageExtensions = [

  ".html",
  ".htm"

];


const allowedResourceExtensions = [

  ".pdf",
  ".csv",
  ".svg",
  ".png",
  ".jpg",
  ".jpeg",
  ".gif",
  ".webp",
  ".avif",
  ".bmp",

  ".oga",
  ".m4a",

  ".mp4",

  ".ogv",
  ".mov",

  ".txt",
  ".json",

  ".yaml",
  ".yml",
  ".log"

/* =========================================================
   HUMAN TITLE
   ========================================================= */

function humanTitle(filename) {

  return filename

    .replace(
      /\.(md|html?|pdf|csv|svg|txt|json|xml)$/i,
      ""
    )

    .replace(
      /[-_]+/g,
      " "
    )

    .replace(
      /\b\w/g,
      character =>
        character.toUpperCase()
    );

}


/* =========================================================
   SAFE LOCAL PATH
   ========================================================= */

function isSafeLocalPath(path) {

  if (!path) {

    return false;

  }


  if (
    path.includes("..")
  ) {

    return false;

  }


  if (
    path.startsWith("/")
  ) {

    return false;

  }


  if (
    path.includes("\\")
  ) {

    return false;

  }


  return true;

}


/* =========================================================
   EXTENSION
   ========================================================= */

function getExtension(path) {

  const clean =
    path
      .split("?")[0]
      .split("#")[0]
      .toLowerCase();


  const index =
    clean.lastIndexOf(".");


  if (
    index < 0
  ) {

    return "";

  }


  return clean.slice(
    index
  );

}

    window.history.length > 1

    window.history.back();

    return;

  window.location.href =

document

/* =========================================================
   MARKDOWN LINK NORMALIZATION
   ========================================================= */

function normalizeMarkdownLinks() {

  documentElement
    .querySelectorAll("a")
    .forEach(link => {

      const rawHref =
        link.getAttribute("href");


      if (!rawHref) {

        return;

      }


      const href =
        rawHref.trim();


      if (

        href.startsWith("http://") ||

        href.startsWith("https://") ||

        href.startsWith("mailto:") ||

        href.startsWith("tel:") ||

        href.startsWith("#")

      ) {

        return;

      }


      const hashIndex =
        href.indexOf("#");


      const queryIndex =
        href.indexOf("?");


      let splitIndex = -1;


      if (
        hashIndex >= 0 &&
        queryIndex >= 0
      ) {

        splitIndex =
          Math.min(
            hashIndex,
            queryIndex
          );

      } else if (
        hashIndex >= 0
      ) {

        splitIndex =
          hashIndex;

      } else if (
        queryIndex >= 0
      ) {

        splitIndex =
          queryIndex;

      }


      const path =
        splitIndex >= 0
          ? href.slice(0, splitIndex)
          : href;


      const suffix =
        splitIndex >= 0
          ? href.slice(splitIndex)
          : "";


      if (
        !path
          .toLowerCase()
          .endsWith(".md")
      ) {

        return;

      }


      const filename =
        path
          .split("/")
          .filter(Boolean)
          .pop();


      if (
        !filename
      ) {

        return;

      }


      if (
        !allowedDocuments.includes(
          filename
        )
      ) {

        return;

      }


      link.href =
        "archive.html?doc=" +
        encodeURIComponent(
          filename
        ) +
        suffix;

    });

}


/* =========================================================
   TABLE WRAPPER
   ========================================================= */

function improveTables() {

  documentElement
    .querySelectorAll("table")
    .forEach(table => {

      if (
        table.parentElement &&
        table.parentElement.classList.contains(
          "archive-table-wrap"
        )
      ) {

        return;

      }


      const wrapper =
        document.createElement("div");


      wrapper.className =
        "archive-table-wrap";


      table.parentNode.insertBefore(
        wrapper,
        table
      );


      wrapper.appendChild(
        table
      );

    });

}


/* =========================================================
   CSV PARSER
   ========================================================= */

function parseCSV(text) {

  const rows = [];

  let row = [];

  let cell = "";

  let insideQuotes = false;


  for (
    let i = 0;
    i < text.length;
    i++
  ) {

    const char =
      text[i];


    const next =
      text[i + 1];


    if (
      char === '"' &&
      insideQuotes &&
      next === '"'
    ) {

      cell += '"';

      i++;

      continue;

    }


    if (
      char === '"'
    ) {

      insideQuotes =
        !insideQuotes;

      continue;

    }


    if (
      char === "," &&
      !insideQuotes
    ) {

      row.push(cell);

      cell = "";

      continue;

    }


    if (
      (char === "\n" ||
       char === "\r") &&
      !insideQuotes
    ) {

      if (
        char === "\r" &&
        next === "\n"
      ) {

        i++;

      }


      row.push(cell);

      rows.push(row);

      row = [];

      cell = "";

      continue;

    }


    cell += char;

  }


  if (
    cell.length ||
    row.length
  ) {

    row.push(cell);

    rows.push(row);

  }


  return rows;

}


/* =========================================================
   CSV RENDERER
   ========================================================= */

function renderCSV(text, filename) {

  const rows =
    parseCSV(text);


  const wrapper =
    document.createElement("div");


  wrapper.className =
    "archive-resource-table";


  const table =
    document.createElement("table");


  rows.forEach((row, index) => {

    const tr =
      document.createElement("tr");


    row.forEach(value => {

      const cell =
        document.createElement(
          index === 0
            ? "th"
            : "td"
        );


      cell.textContent =
        value;


      tr.appendChild(
        cell
      );

    });


    table.appendChild(
      tr
    );

  });


  wrapper.appendChild(
    table
  );


  documentElement.replaceChildren(
    wrapper
  );


  titleElement.textContent =
    humanTitle(filename);

}


  /* =========================================================
   TEXT RESOURCE
   ========================================================= */

function renderText(
  text,
  filename
) {

  const resource =
    document.createElement("div");


  resource.className =
    "archive-resource";


  const pre =
    document.createElement("pre");


  pre.textContent =
    text;


  resource.appendChild(
    pre
  );


  documentElement.replaceChildren(
    resource
  );


  titleElement.textContent =
    humanTitle(filename);

}


/* =========================================================
   MEDIA RESOURCE
   ========================================================= */

function renderMedia(
  path,
  filename
) {

  const ext =
    getExtension(path);


  const resource =
    document.createElement("div");


  resource.className =
    "archive-resource";


  let element;


  const audioExtensions = [

    ".mp3",
    ".wav",
    ".ogg",
    ".oga",
    ".m4a",
    ".aac",
    ".flac"

  ];


  const videoExtensions = [

    ".mp4",
    ".webm",
    ".ogv",
    ".mov"

  ];


  if (
    audioExtensions.includes(ext)
  ) {

    element =
      document.createElement(
        "audio"
      );

    element.controls = true;

  }


  if (
    videoExtensions.includes(ext)
  ) {

    element =
      document.createElement(
        "video"
      );

    element.controls = true;

    element.playsInline = true;

  }


  if (!element) {

    return;

  }


  element.src =
    path;


  element.preload =
    "metadata";


  resource.appendChild(
    element
  );


  documentElement.replaceChildren(
    resource
  );


  titleElement.textContent =
    humanTitle(filename);

}


/* =========================================================
   IMAGE / SVG RESOURCE
   ========================================================= */

function renderImage(
  path,
  filename
) {

  const resource =
    document.createElement("div");


  resource.className =
    "archive-resource";


  const image =
    document.createElement("img");


  image.src =
    path;


  image.alt =
    filename;


  resource.appendChild(
    image
  );


  documentElement.replaceChildren(
    resource
  );


  titleElement.textContent =
    humanTitle(filename);

}


/* =========================================================
   PDF RESOURCE
   ========================================================= */

function renderPDF(
  path,
  filename
) {

  const resource =
    document.createElement("div");


  resource.className =
    "archive-resource";


  const object =
    document.createElement("object");


  object.data =
    path;


  object.type =
    "application/pdf";


  const fallback =
    document.createElement("p");


  fallback.textContent =
    "Your browser cannot display this PDF directly.";


  const link =
    document.createElement("a");


  link.href =
    path;


  link.target =
    "_blank";


  link.rel =
    "noopener noreferrer";


  link.textContent =
    "Open PDF";


  fallback.appendChild(
    document.createTextNode(" ")
  );


  fallback.appendChild(
    link
  );


  object.appendChild(
    fallback
  );


  resource.appendChild(
    object
  );


  documentElement.replaceChildren(
    resource
  );


  titleElement.textContent =
    humanTitle(filename);

}


/* =========================================================
   EXTERNAL VIDEO EMBEDS
   ========================================================= */

function renderEmbed(
  url,
  title
) {

  const resource =
    document.createElement("div");


  resource.className =
    "archive-resource";


  const iframe =
    document.createElement("iframe");


  iframe.src =
    url;


  iframe.title =
    title;


  iframe.loading =
    "lazy";


  iframe.allow =
    "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";


  iframe.allowFullscreen =
    true;


  resource.appendChild(
    iframe
  );


  documentElement.replaceChildren(
    resource
  );


  titleElement.textContent =
    title;

}


/* =========================================================
   HTML PAGE
   ========================================================= */

function renderHTMLPage(
  path,
  filename
) {

  const resource =
    document.createElement("div");


  resource.className =
    "archive-page-viewer";


  const frame =
    document.createElement("iframe");


  frame.className =
    "archive-page-frame";


  frame.src =
    path;


  frame.title =
    humanTitle(filename);


  /*
   * The page is loaded as a real document inside the iframe.
   *
   * Therefore:
   *
   * - its own CSS works
   * - its own JavaScript works
   * - canvas works
   * - SVG works
   * - animations work
   * - audio works
   * - video works
   * - YouTube embeds work
   * - Vimeo embeds work
   * - WebGL / Three.js pages can work
   *
   * without having to inject foreign HTML into archive.html.
   */


  frame.loading =
    "eager";


  frame.allow =
    "accelerometer; autoplay; camera; encrypted-media; fullscreen; gyroscope; microphone; picture-in-picture; web-share";


  frame.allowFullscreen =
    true;


  resource.appendChild(
    frame
  );


  documentElement.replaceChildren(
    resource
  );


  titleElement.textContent =
    humanTitle(filename);

}


/* =========================================================
   RESOURCE ROUTER
   ========================================================= */

async function loadResource(
  path,
  filename
) {

  const ext =
    getExtension(path);


  sourceElement.textContent =
    path;


  if (
    ext === ".html" ||
    ext === ".htm"
  ) {

    renderHTMLPage(
      path,
      filename
    );

    return;

  }


  if (
    ext === ".pdf"
  ) {

    renderPDF(
      path,
      filename
    );

    return;

  }


  if (
    ext === ".svg" ||
    ext === ".png" ||
    ext === ".jpg" ||
    ext === ".jpeg" ||
    ext === ".gif" ||
    ext === ".webp" ||
    ext === ".avif" ||
    ext === ".bmp" ||
    ext === ".ico"
  ) {

    renderImage(
      path,
      filename
    );

    return;

  }


  if (
    [
      ".mp3",
      ".wav",
      ".ogg",
      ".oga",
      ".m4a",
      ".aac",
      ".flac",
      ".mp4",
      ".webm",
      ".ogv",
      ".mov"
    ].includes(ext)
  ) {

    renderMedia(
      path,
      filename
    );

    return;

  }


  if (
    ext === ".csv"
  ) {

    try {

      const response =
        await fetch(
          path,
          {
            cache: "no-cache"
          }
        );


      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      const text =
        await response.text();


      renderCSV(
        text,
        filename
      );


    } catch (error) {

      renderError(
        error
      );

    }


    return;

  }


  if (
    [
      ".txt",
      ".json",
      ".xml",
      ".yaml",
      ".yml",
      ".log"
    ].includes(ext)
  ) {

    try {

      const response =
        await fetch(
          path,
          {
            cache: "no-cache"
          }
        );


      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      const text =
        await response.text();


      renderText(
        text,
        filename
      );


    } catch (error) {

      renderError(
        error
      );

    }


    return;

  }


  /*
   * Unknown but local resource:
   * let the browser handle it.
   */

  const resource =
    document.createElement("div");


  resource.className =
    "archive-resource";


  const note =
    document.createElement("div");


  note.className =
    "archive-resource-note";


  note.innerHTML =
    "<strong>Resource:</strong> " +
    filename;


  const link =
    document.createElement("a");


  link.className =
    "archive-resource-download";


  link.href =
    path;


  link.target =
    "_blank";


  link.rel =
    "noopener noreferrer";


  link.textContent =
    "Open resource";


  resource.appendChild(
    note
  );


  resource.appendChild(
    link
  );


  documentElement.replaceChildren(
    resource
  );


  titleElement.textContent =
    humanTitle(filename);

}


/* =========================================================
   ERROR
   ========================================================= */

function renderError(error) {

  documentElement.innerHTML = `

    <div class="archive-error">

      <strong>
        Unable to load resource.
      </strong>

      <p>
        ${error.message}
      </p>

    </div>

  `;

}


/* =========================================================
   LOAD MARKDOWN DOCUMENT
   ========================================================= */

async function loadMarkdownDocument() {

  /*
   * Discover the current contents of /docs/ first.
   *
   * No manual whitelist is required.
   */

  await discoverMarkdownDocuments();


  if (
    !requestedDocument
  ) {

    renderError(
      new Error(
        "Document not specified."
      )
    );

    return;

  }


  if (
    !allowedDocuments.includes(
      requestedDocument
    )
  ) {

    renderError(
      new Error(
        "Document not found in /docs/."
      )
    );

    return;

  }


  const sourcePath =
    "docs/" +
    requestedDocument;


  titleElement.textContent =
    humanTitle(
      requestedDocument
    );


  sourceElement.textContent =
    sourcePath;


  try {

    const response =
      await fetch(
        sourcePath,
        {
          cache: "no-cache"
        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const markdown =
      await response.text();


    marked.setOptions({

      gfm: true,

      breaks: true

    });


    documentElement.innerHTML =
      marked.parse(
        markdown
      );


    normalizeMarkdownLinks();

    improveTables();


    document.title =
      "AUF2026 — " +
      humanTitle(
        requestedDocument
      );


  } catch (error) {

    console.error(
      "AUF2026 Archive:",
      error
    );


    renderError(
      error
    );

  }

}


/* =========================================================
   LOAD /pages/*.html
   ========================================================= */

function loadPage() {

  if (
    !requestedPage
  ) {

    return;

  }


  if (
    !isSafeLocalPath(
      requestedPage
    )
  ) {

    renderError(
      new Error(
        "Invalid page path."
      )
    );

    return;

  }


  const filename =
    requestedPage
      .split("/")
      .filter(Boolean)
      .pop();


  if (
    !filename
  ) {

    renderError(
      new Error(
        "Invalid page."
      )
    );

    return;

  }


  const ext =
    getExtension(
      filename
    );


  if (
    !allowedPageExtensions.includes(
      ext
    )
  ) {

    renderError(
      new Error(
        "Only HTML pages are allowed in /pages/."
      )
    );

    return;

  }


  const path =
    "pages/" +
    requestedPage;


  loadResource(
    path,
    filename
  );


  document.title =
    "AUF2026 — " +
    humanTitle(
      filename
    );

}


/* =========================================================
   LOAD GENERIC RESOURCE
   ========================================================= */

function loadGenericResource() {

  if (
    !requestedResource
  ) {

    return;

  }


  if (
    !isSafeLocalPath(
      requestedResource
    )
  ) {

    renderError(
      new Error(
        "Invalid resource path."
      )
    );

    return;

  }


  const filename =
    requestedResource
      .split("/")
      .filter(Boolean)
      .pop();


  if (
    !filename
  ) {

    renderError(
      new Error(
        "Invalid resource."
      )
    );

    return;

  }


  const ext =
    getExtension(
      filename
    );


  if (
    !allowedResourceExtensions.includes(
      ext
    )
  ) {

    renderError(
      new Error(
        "Resource type not allowed."
      )
    );

    return;

  }


  loadResource(
    requestedResource,
    filename
  );


  document.title =
    "AUF2026 — " +
    humanTitle(
      filename
    );

}

/* =========================================================
   YOUTUBE / VIMEO URL SUPPORT
   ========================================================= */

function loadExternalEmbed() {

  const url =
    params.get("embed");


  if (
    !url
  ) {

    return false;

  }


  try {

    const parsed =
      new URL(
        url
      );


    const allowedHosts = [

      "www.youtube.com",
      "youtube.com",
      "youtu.be",
      "www.youtube-nocookie.com",
      "player.vimeo.com",
      "vimeo.com"

    ];


    if (
      !allowedHosts.includes(
        parsed.hostname
      )
    ) {

      renderError(
        new Error(
          "External embed host not allowed."
        )
      );

      return true;

    }


    renderEmbed(
      parsed.href,
      "External media"
    );


    sourceElement.textContent =
      parsed.href;


    document.title =
      "AUF2026 — External Media";


    return true;

  } catch {

    renderError(
      new Error(
        "Invalid external media URL."
      )
    );


    return true;

  }

}


/* =========================================================
   START
   ========================================================= */

if (
  loadExternalEmbed()
) {

  /* External embed loaded. */

} else if (
  requestedPage
) {

  loadPage();

} else if (
  requestedResource
) {

  loadGenericResource();

} else if (
  requestedDocument
) {

  loadMarkdownDocument();

} else {

  documentElement.innerHTML = `

    <div class="archive-error">

      <strong>
        Resource not specified.
      </strong>

      <p>
        Select a document, page or resource
        from the AUF2026 research archive.
      </p>

    </div>

  `;


  sourceElement.textContent =
    "not specified";


  document.title =
    "AUF2026 — Research Archive";

}
