<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    AUF2026 — Validation
  </title>


  <style>

    :root {

      --bg:
        #0b0f14;

      --panel:
        #111821;

      --panel-2:
        #151e28;

      --border:
        #263241;

      --text:
        #e8edf3;

      --muted:
        #8d9aaa;

      --accent:
        #7dd3fc;

      --accent-strong:
        #38bdf8;

      --danger:
        #f87171;

    }


    * {
      box-sizing:
        border-box;
    }


    html,
    body {

      margin:
        0;

      padding:
        0;

      min-height:
        100%;

      background:
        var(--bg);

      color:
        var(--text);

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    }


    body {

      padding:
        32px 20px 60px;

    }


    main {

      width:
        min(1100px, 100%);

      margin:
        0 auto;

    }


    .archive-header {

      margin-bottom:
        28px;

    }


    .archive-kicker {

      color:
        var(--accent);

      font-size:
        12px;

      font-weight:
        700;

      letter-spacing:
        .14em;

      text-transform:
        uppercase;

      margin-bottom:
        8px;

    }


    h1 {

      margin:
        0;

      font-size:
        clamp(28px, 5vw, 44px);

      line-height:
        1.05;

    }


    .archive-description {

      margin-top:
        12px;

      color:
        var(--muted);

      line-height:
        1.6;

      max-width:
        780px;

    }


    .archive-status {

      margin:
        20px 0;

      padding:
        12px 14px;

      border:
        1px solid var(--border);

      border-radius:
        8px;

      background:
        var(--panel);

      color:
        var(--muted);

      font-size:
        14px;

    }


    .archive-status[data-state="ok"] {

      color:
        var(--accent);

    }


    .archive-status[data-state="error"] {

      color:
        var(--danger);

    }


    .pages-directory {

      margin:
        28px 0 10px;

      padding:
        8px 0;

      color:
        var(--accent);

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Consolas,
        monospace;

      font-size:
        13px;

      font-weight:
        700;

    }


    .pages-file {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        20px;

      padding:
        18px;

      margin:
        8px 0;

      background:
        var(--panel);

      border:
        1px solid var(--border);

      border-radius:
        10px;

    }


    .pages-file-info {

      min-width:
        0;

    }


    .pages-file-name {

      margin:
        0;

      font-size:
        17px;

      line-height:
        1.4;

      word-break:
        break-word;

    }


    .pages-file-type {

      display:
        inline-block;

      margin-right:
        8px;

      color:
        var(--accent);

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Consolas,
        monospace;

      font-size:
        11px;

      font-weight:
        700;

      letter-spacing:
        .06em;

    }


    .pages-file-path {

      margin-top:
        6px;

      color:
        var(--muted);

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Consolas,
        monospace;

      font-size:
        12px;

      word-break:
        break-all;

    }


    .pages-file-actions {

      display:
        flex;

      align-items:
        center;

      gap:
        8px;

      flex-shrink:
        0;

    }


    .pages-file-button,
    .pages-file-github {

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      min-height:
        36px;

      padding:
        0 13px;

      border:
        1px solid var(--border);

      border-radius:
        7px;

      background:
        var(--panel-2);

      color:
        var(--text);

      font-size:
        12px;

      font-weight:
        700;

      text-decoration:
        none;

      cursor:
        pointer;

    }


    .pages-file-button:hover,
    .pages-file-github:hover {

      border-color:
        var(--accent-strong);

      color:
        var(--accent);

    }


    .pages-empty {

      padding:
        30px;

      border:
        1px dashed var(--border);

      border-radius:
        10px;

      color:
        var(--muted);

      text-align:
        center;

    }


    code {

      color:
        var(--accent);

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Consolas,
        monospace;

    }


    @media (
      max-width: 700px
    ) {

      .pages-file {

        align-items:
          flex-start;

        flex-direction:
          column;

      }


      .pages-file-actions {

        width:
          100%;

      }


      .pages-file-button,
      .pages-file-github {

        flex:
          1;

      }

    }

  </style>

</head>


<body>

<main>

  <header class="archive-header">

    <div class="archive-kicker">
      AUF2026 RESEARCH ARCHIVE
    </div>

    <h1>
      Documentation
    </h1>

    <div class="archive-description">
      Repository resources discovered automatically
      under <code>/docs/</code>.
      Markdown documents are opened through the
      central <code>archive.html</code> viewer.
    </div>

  </header>


  <div
    id="pagesStatus"
    class="archive-status"
  >
    Scanning repository tree…
  </div>


  <section
    id="pagesFiles"
    aria-live="polite"
  ></section>

</main>


<script>

/* =========================================================
   AUF2026 SECTION REPOSITORY PARSER
   ========================================================= */

const GITHUB_OWNER =
  "AUF2026";


const GITHUB_REPOSITORY =
  "AUF2026.github.io";


const GITHUB_BRANCH =
  "main";


/*
 * THIS IS THE ONLY SECTION-SPECIFIC VALUE.
 *
 * For this file:
 *
 *   /docs/index.html
 *
 * therefore:
 *
 *   docs
 */

const GITHUB_SECTION =
  "validation";


const GITHUB_TREE_URL =
  "https://api.github.com/repos/" +
  GITHUB_OWNER +
  "/" +
  GITHUB_REPOSITORY +
  "/git/trees/" +
  GITHUB_BRANCH +
  "?recursive=1";


const GITHUB_BLOB_BASE =
  "https://github.com/" +
  GITHUB_OWNER +
  "/" +
  GITHUB_REPOSITORY +
  "/blob/" +
  GITHUB_BRANCH +
  "/";


/* =========================================================
   DOM
   ========================================================= */

const repositoryStatus =
  document.getElementById(
    "pagesStatus"
  ) ||
  document.getElementById(
    "repositoryStatus"
  );


const repositoryFiles =
  document.getElementById(
    "pagesFiles"
  ) ||
  document.getElementById(
    "repositoryFiles"
  );


/* =========================================================
   INITIALIZE
   ========================================================= */

loadRepository();


/* =========================================================
   LOAD REPOSITORY TREE
   ========================================================= */

async function loadRepository() {

  try {

    setStatus(
      "Scanning repository tree…"
    );


    const response =
      await fetch(
        GITHUB_TREE_URL,
        {
          cache:
            "no-store",

          headers: {
            "Accept":
              "application/vnd.github+json"
          }
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "GitHub API HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if (
      !data ||
      !Array.isArray(
        data.tree
      )
    ) {

      throw new Error(
        "Invalid GitHub repository tree."
      );

    }


    const discovered =
      discoverSectionFiles(
        data.tree
      );


    renderFiles(
      discovered
    );


    setStatus(
      discovered.length +
      " resource" +
      (
        discovered.length === 1
          ? ""
          : "s"
      ) +
      " found under /" +
      GITHUB_SECTION +
      "/",
      "ok"
    );


  } catch (
    error
  ) {

    console.error(
      "AUF2026 repository parser:",
      error
    );


    setStatus(
      "Repository scan failed: " +
      error.message,
      "error"
    );


    if (
      repositoryFiles
    ) {

      repositoryFiles.innerHTML =
        `
          <div class="pages-empty">

            Unable to read
            <code>/${escapeHTML(
              GITHUB_SECTION
            )}/</code>
            from the AUF2026 repository.

          </div>
        `;

    }

  }

}


/* =========================================================
   DISCOVER FILES
   ========================================================= */

function discoverSectionFiles(
  tree
) {

  const prefix =
    GITHUB_SECTION +
    "/";


  return tree

    .filter(
      item => {

        return (
          item &&
          item.type === "blob" &&
          typeof item.path === "string" &&
          item.path.startsWith(
            prefix
          )
        );

      }
    )

    /*
     * IMPORTANT:
     *
     * The section parser must not display
     * its own index.html.
     */

    .filter(
      item => {

        return (
          item.path !==
          GITHUB_SECTION +
          "/index.html"
        );

      }
    )

    .sort(
      (a, b) => {

        return a.path.localeCompare(
          b.path,
          undefined,
          {
            numeric:
              true,

            sensitivity:
              "base"
          }
        );

      }
    );

}


/* =========================================================
   RENDER FILE LIST
   ========================================================= */

function renderFiles(
  items
) {

  if (
    !repositoryFiles
  ) {

    return;

  }


  repositoryFiles.innerHTML =
    "";


  if (
    items.length === 0
  ) {

    repositoryFiles.innerHTML =
      `
        <div class="pages-empty">

          No resources were found
          under
          <code>/${escapeHTML(
            GITHUB_SECTION
          )}/</code>.

        </div>
      `;

    return;

  }


  let currentDirectory =
    null;


  for (
    const item of items
  ) {

    const relativePath =
      item.path.slice(
        GITHUB_SECTION.length + 1
      );


    const parts =
      relativePath.split("/");


    const directory =
      parts.length > 1
        ? parts
            .slice(0, -1)
            .join("/")
        : "";


    if (
      directory !==
      currentDirectory
    ) {

      currentDirectory =
        directory;


      const directoryElement =
        document.createElement(
          "div"
        );


      directoryElement.className =
        "pages-directory";


      directoryElement.textContent =
        directory
          ? "/" +
            GITHUB_SECTION +
            "/" +
            directory +
            "/"
          : "/" +
            GITHUB_SECTION +
            "/";


      repositoryFiles.appendChild(
        directoryElement
      );

    }


    repositoryFiles.appendChild(
      createFileElement(
        item
      )
    );

  }

}


/* =========================================================
   CREATE FILE
   ========================================================= */

function createFileElement(
  item
) {

  const article =
    document.createElement(
      "article"
    );


  article.className =
    "pages-file";


  const filename =
    item.path
      .split("/")
      .pop();


  const extension =
    getExtension(
      filename
    );


  const type =
    getFileType(
      extension
    );


  article.innerHTML =
    `
      <div class="pages-file-info">

        <h2 class="pages-file-name">

          <span class="pages-file-type">
            ${escapeHTML(type)}
          </span>

          ${escapeHTML(filename)}

        </h2>

        <div class="pages-file-path">
          ${escapeHTML(item.path)}
        </div>

      </div>

      <div class="pages-file-actions">

        <button
          class="pages-file-button"
          type="button"
          data-open
        >
          VIEW
        </button>

        <a
          class="pages-file-github"
          href="${githubURL(
            item.path
          )}"
          target="_blank"
          rel="noopener noreferrer"
        >
          GITHUB
        </a>

      </div>
    `;


  article
    .querySelector(
      "[data-open]"
    )
    .addEventListener(
      "click",
      function () {

        /*
         * IMPORTANT:
         *
         * Do NOT create another viewer here.
         *
         * Everything is delegated to the
         * central /archive.html parser.
         */

        openInArchive(
          item.path
        );

      }
    );


  return article;

}


/* =========================================================
   OPEN RESOURCE THROUGH CENTRAL ARCHIVE
   ========================================================= */

function openInArchive(
  path
) {

  const url =
    "../archive.html?";


  const extension =
    getExtension(
      path
    );


  /*
   * Markdown files are opened through:
   *
   * archive.html?doc=docs/file.md
   */

  if (
    extension === ".md"
  ) {

    window.location.href =
      url +
      "doc=" +
      encodeURIComponent(
        path
      );

    return;

  }


  /*
   * HTML pages are opened through:
   *
   * archive.html?page=docs/file.html
   */

  if (
    extension === ".html" ||
    extension === ".htm"
  ) {

    window.location.href =
      url +
      "page=" +
      encodeURIComponent(
        path
      );

    return;

  }


  /*
   * Everything else uses the generic
   * archive resource router.
   */

  window.location.href =
    url +
    "file=" +
    encodeURIComponent(
      path
    );

}


/* =========================================================
   GITHUB URL
   ========================================================= */

function githubURL(
  path
) {

  return (
    GITHUB_BLOB_BASE +
    path
      .split("/")
      .map(
        encodeURIComponent
      )
      .join("/")
  );

}


/* =========================================================
   EXTENSION
   ========================================================= */

function getExtension(
  filename
) {

  const index =
    filename.lastIndexOf(".");


  if (
    index < 0
  ) {

    return "";

  }


  return filename
    .slice(
      index
    )
    .toLowerCase();

}


/* =========================================================
   FILE TYPE
   ========================================================= */

function getFileType(
  extension
) {

  if (
    [
      ".md",
      ".markdown"
    ].includes(extension)
  ) {

    return "MARKDOWN";

  }


  if (
    [
      ".html",
      ".htm"
    ].includes(extension)
  ) {

    return "HTML";

  }


  if (
    extension ===
    ".pdf"
  ) {

    return "PDF";

  }


  if (
    [
      ".png",
      ".jpg",
      ".jpeg",
      ".gif",
      ".webp",
      ".svg",
      ".avif",
      ".bmp",
      ".ico"
    ].includes(extension)
  ) {

    return "IMAGE";

  }


  if (
    [
      ".mp3",
      ".wav",
      ".ogg",
      ".oga",
      ".m4a",
      ".aac",
      ".flac"
    ].includes(extension)
  ) {

    return "AUDIO";

  }


  if (
    [
      ".mp4",
      ".webm",
      ".ogv",
      ".mov",
      ".m4v"
    ].includes(extension)
  ) {

    return "VIDEO";

  }


  if (
    extension ===
    ".csv"
  ) {

    return "CSV";

  }


  if (
    [
      ".txt",
      ".json",
      ".xml",
      ".yaml",
      ".yml",
      ".log"
    ].includes(extension)
  ) {

    return "TEXT";

  }


  return "SOURCE";

}


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(
  message,
  state
) {

  if (
    !repositoryStatus
  ) {

    return;

  }


  repositoryStatus.textContent =
    message;


  if (
    state
  ) {

    repositoryStatus.dataset.state =
      state;

  } else {

    delete repositoryStatus.dataset.state;

  }

}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHTML(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>
</html>
